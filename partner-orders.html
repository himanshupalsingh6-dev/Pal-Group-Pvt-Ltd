<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partner Orders</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
padding-bottom:100px;
}

/* HEADER */

.header{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:20px;

border-bottom-left-radius:30px;
border-bottom-right-radius:30px;

}

.header h1{

font-size:28px;
font-weight:900;

}

.header p{

margin-top:6px;

font-size:13px;
font-weight:700;

color:#374151;

}

/* FILTERS */

.filterWrap{

padding:16px;

display:flex;
gap:10px;

overflow-x:auto;

}

.filterBtn{

height:42px;

padding:0 16px;

border:none;

border-radius:999px;

background:#fff;

font-weight:800;

cursor:pointer;

white-space:nowrap;

}

.activeFilter{

background:#16A34A;
color:#fff;

}

/* ORDERS */

.ordersContainer{

padding:0 16px;

}

.orderCard{

background:#fff;

padding:18px;

border-radius:24px;

margin-bottom:14px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.orderTop{

display:flex;
justify-content:space-between;
align-items:center;

}

.orderId{

font-size:16px;
font-weight:900;

}

.orderStatus{

padding:6px 12px;

border-radius:999px;

font-size:11px;
font-weight:900;

background:#FEF3C7;

}

.orderInfo{

margin-top:12px;

line-height:1.9;

font-size:13px;

color:#4B5563;

}

.badges{

margin-top:12px;

display:flex;
gap:8px;
flex-wrap:wrap;

}

.badge{

padding:6px 10px;

border-radius:999px;

font-size:11px;
font-weight:800;

}

.premium{

background:#F3E8FF;
color:#6B21A8;

}

.urgent{

background:#DBEAFE;
color:#1E40AF;

}

.actions{

margin-top:14px;

display:flex;
gap:10px;
flex-wrap:wrap;

}

.actionBtn{

height:42px;

padding:0 14px;

border:none;

border-radius:14px;

font-size:12px;
font-weight:900;

cursor:pointer;

}

.acceptBtn{
background:#16A34A;
color:#fff;
}

.rejectBtn{
background:#DC2626;
color:#fff;
}

.processBtn{
background:#2563EB;
color:#fff;
}

.readyBtn{
background:#7C3AED;
color:#fff;
}

.completeBtn{
background:#111827;
color:#fff;
}

.assignBtn{
background:#F59E0B;
color:#fff;
}

</style>
</head>

<body>

<div class="header">

<h1>
Partner Orders
</h1>

<p>
Manage all city orders
</p>

</div>

<div class="filterWrap">

<button class="filterBtn activeFilter">
New
</button>

<button class="filterBtn">
Accepted
</button>

<button class="filterBtn">
Processing
</button>

<button class="filterBtn">
Ready
</button>

<button class="filterBtn">
Completed
</button>

<button class="filterBtn">
Cancelled
</button>

</div>

<div
class="ordersContainer"
id="ordersContainer">

<!-- Firebase Orders -->

</div>
<script type="module">

import { db }
from "./firebase.js";

import {
collection,
query,
where,
onSnapshot,
updateDoc,
doc,
addDoc,
serverTimestamp,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* =========================================
GLOBAL
========================================= */

const ordersContainer =
document.getElementById(
"ordersContainer"
);

let activeTab = "New";

const partnerCity =
localStorage.getItem(
"partnerCity"
)
||
"Kasganj";

/* =========================================
FILTER BUTTONS
========================================= */

document
.querySelectorAll(
".filterBtn"
)

.forEach(btn=>{

btn.addEventListener(

"click",

()=>{

document
.querySelectorAll(
".filterBtn"
)

.forEach(b=>
b.classList.remove(
"activeFilter"
)
);

btn.classList.add(
"activeFilter"
);

activeTab =
btn.innerText.trim();

loadOrders();

}

);

});

/* =========================================
LOAD ORDERS
========================================= */

function loadOrders(){

const q = query(

collection(
db,
"orders"
),

where(
"partnerCity",
"==",
partnerCity
)

);

onSnapshot(

q,

(snapshot)=>{

ordersContainer.innerHTML = "";

/* ========================================= */

snapshot.forEach(docSnap=>{

const order =
docSnap.data();

order.id =
docSnap.id;

/* =========================================
TAB FILTER
========================================= */

if(
activeTab==="New" &&
order.status!=="Pending"
)
return;

if(
activeTab==="Accepted" &&
order.status!=="Accepted"
)
return;

if(
activeTab==="Processing" &&
order.status!=="Processing"
)
return;

if(
activeTab==="Ready" &&
order.status!=="Ready"
)
return;

if(
activeTab==="Completed" &&
order.status!=="Completed"
)
return;

if(
activeTab==="Cancelled" &&
order.status!=="Cancelled"
)
return;

/* =========================================
BADGES
========================================= */

let badges = "";

/* ========================================= */

if(
order.premiumPackaging
){

badges +=

`
<div class="badge premium">

👑 Premium Packaging

</div>
`;

}

/* ========================================= */

if(
order.urgentDelivery
){

badges +=

`
<div class="badge urgent">

⚡ Urgent Delivery

</div>
`;

}

/* =========================================
ITEMS
========================================= */

let itemsHtml = "";

(order.items || [])
.forEach(item=>{

itemsHtml +=

`
${item.category || ''}
 -
${item.serviceName || ''}
 × ${item.qty || 1}
<br>
`;

});

/* =========================================
ACTIONS
========================================= */

let actions = "";

/* ========================================= */

if(
order.status==="Pending"
){

actions =

`
<button
class="actionBtn acceptBtn"
onclick="acceptOrder('${order.id}')">

Accept

</button>

<button
class="actionBtn rejectBtn"
onclick="rejectOrder('${order.id}')">

Reject

</button>

<button
class="actionBtn assignBtn"
onclick="assignRider('${order.id}')">

Assign Rider

</button>
`;

}

/* ========================================= */

if(
order.status==="Accepted"
){

actions =

`
<button
class="actionBtn processBtn"
onclick="startProcessing('${order.id}')">

Start Processing

</button>
`;

}

/* ========================================= */

if(
order.status==="Processing"
){

actions =

`
<button
class="actionBtn readyBtn"
onclick="readyOrder('${order.id}')">

Ready For Delivery

</button>
`;

}

/* ========================================= */

if(
order.status==="Ready"
){

actions =

`
<button
class="actionBtn completeBtn"
onclick="completeOrder('${order.id}')">

Complete

</button>
`;

}

/* =========================================
CARD
========================================= */

ordersContainer.innerHTML +=

`

<div class="orderCard">

<div class="orderTop">

<div class="orderId">

#${order.orderId}

</div>

<div class="orderStatus">

${order.status}

</div>

</div>

<div class="orderInfo">

👤
${order.customerName || 'Customer'}

<br>

📍
${order.city}

<br>

💰
₹${order.grandTotal}

<br><br>

${itemsHtml}

</div>

<div class="badges">

${badges}

</div>

<div class="actions">

${actions}

</div>

</div>

`;

});

}

);

}

/* =========================================
ACCEPT
========================================= */

window.acceptOrder =
async(id)=>{

await updateDoc(

doc(
db,
"orders",
id
),

{
status:"Accepted",
partnerAssigned:true
}

);

createNotification(
"Order Accepted",
id
);

};

/* =========================================
REJECT
========================================= */

window.rejectOrder =
async(id)=>{

await updateDoc(

doc(
db,
"orders",
id
),

{
status:"Cancelled"
}

);

createNotification(
"Order Rejected",
id
);

};

/* =========================================
PROCESSING
========================================= */

window.startProcessing =
async(id)=>{

await updateDoc(

doc(
db,
"orders",
id
),

{
status:"Processing",
processing:true
}

);

};

/* =========================================
READY
========================================= */

window.readyOrder =
async(id)=>{

await updateDoc(

doc(
db,
"orders",
id
),

{
status:"Ready",
readyForDelivery:true
}

);

};

/* =========================================
COMPLETE
========================================= */

window.completeOrder =
async(id)=>{

await updateDoc(

doc(
db,
"orders",
id
),

{
status:"Completed",
completed:true
}

);

};

/* =========================================
ASSIGN RIDER
========================================= */

window.assignRider =
async(orderId)=>{

const riderQuery =
query(

collection(
db,
"riders"
),

where(
"city",
"==",
partnerCity
),

where(
"status",
"==",
"available"
)

);

const riders =
await getDocs(
riderQuery
);

if(
riders.empty
){

alert(
"No Rider Available"
);

return;

}

const rider =
riders.docs[0];

/* ========================================= */

await updateDoc(

doc(
db,
"orders",
orderId
),

{
riderAssigned:true,
riderId:rider.id,
riderName:
rider.data().name,
riderPhone:
rider.data().phone
}

);

alert(
"Rider Assigned ✅"
);

};

/* =========================================
NOTIFICATIONS
========================================= */

async function createNotification(

title,
orderId

){

await addDoc(

collection(
db,
"notifications"
),

{

city:
partnerCity,

title,

orderId,

read:false,

createdAt:
serverTimestamp()

}

);

}

/* =========================================
START
========================================= */

loadOrders();

</script>

</body>
</html>
