<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partner Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
color:#111827;
padding-bottom:100px;
}

/* HEADER */

.dashboardHero{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:20px;

border-bottom-left-radius:34px;
border-bottom-right-radius:34px;

}

.topBar{

display:flex;
justify-content:space-between;
align-items:center;

}

.partnerInfo h1{

font-size:28px;
font-weight:900;

}

.partnerInfo p{

margin-top:6px;

font-size:13px;
font-weight:700;

color:#374151;

}

.notificationBtn{

width:52px;
height:52px;

border:none;

border-radius:18px;

background:#fff;

font-size:20px;

position:relative;

cursor:pointer;

}

.notificationBadge{

position:absolute;

top:8px;
right:8px;

width:10px;
height:10px;

background:red;

border-radius:50%;

}

/* STATS */

.statsGrid{

padding:20px 16px;

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:14px;

}

.statCard{

background:#fff;

padding:20px;

border-radius:26px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.statLabel{

font-size:12px;

font-weight:700;

color:#6B7280;

}

.statValue{

margin-top:10px;

font-size:30px;

font-weight:900;

}

/* QUICK ACTIONS */

.section{

padding:0 16px 20px;

}

.sectionTitle{

font-size:22px;

font-weight:900;

margin-bottom:16px;

}

.actionGrid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:14px;

}

.actionCard{

background:#fff;

padding:22px;

border-radius:26px;

text-align:center;

cursor:pointer;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.actionCard i{

font-size:34px;

color:#16A34A;

}

.actionCard h4{

margin-top:12px;

font-size:16px;

font-weight:900;

}

/* RECENT ORDERS */

.ordersSection{

padding:0 16px;

}

.orderCard{

background:#fff;

padding:18px;

border-radius:24px;

margin-bottom:14px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.orderTop{

display:flex;

justify-content:space-between;

align-items:center;

}

.orderId{

font-size:15px;

font-weight:900;

}

.orderStatus{

padding:6px 12px;

border-radius:999px;

background:#FEF3C7;

font-size:11px;

font-weight:900;

}

.orderInfo{

margin-top:12px;

font-size:13px;

line-height:1.9;

color:#4B5563;

}

.badges{

margin-top:10px;

display:flex;

gap:8px;

flex-wrap:wrap;

}

.badge{

padding:6px 10px;

border-radius:999px;

font-size:11px;

font-weight:800;

}

.premium{
background:#F3E8FF;
color:#6B21A8;
}

.urgent{
background:#DBEAFE;
color:#1E40AF;
}

/* NAVIGATION */

.bottomNav{

position:fixed;

left:0;
right:0;
bottom:0;

height:76px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -8px 20px rgba(0,0,0,.08);

}

.navItem{

flex:1;

height:100%;

border:none;

background:none;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:4px;

font-size:11px;

font-weight:700;

color:#6B7280;

cursor:pointer;

}

.activeNav{

color:#16A34A;

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="dashboardHero">

<div class="topBar">

<div class="partnerInfo">

<h1>
QuickPress Kasganj
</h1>

<p>
📍 Kasganj, Uttar Pradesh
</p>

</div>

<button class="notificationBtn">

🔔

<div
id="notificationBadge"
class="notificationBadge">

</div>

</button>

</div>

</div>

<!-- STATS -->

<div class="statsGrid">

<div class="statCard">

<div class="statLabel">
Today's Orders
</div>

<div
class="statValue"
id="todayOrders">

0

</div>

</div>

<div class="statCard">

<div class="statLabel">
Today's Revenue
</div>

<div
class="statValue"
id="todayRevenue">

₹0

</div>

</div>

<div class="statCard">

<div class="statLabel">
Pending Orders
</div>

<div
class="statValue"
id="pendingOrders">

0

</div>

</div>

<div class="statCard">

<div class="statLabel">
Active Riders
</div>

<div
class="statValue"
id="activeRiders">

0

</div>

</div>

</div>

<!-- QUICK ACTIONS -->

<div class="section">

<div class="sectionTitle">

Quick Actions

</div>

<div class="actionGrid">

<div
class="actionCard"
onclick="location.href='partner-orders.html'">

<i class="fa-solid fa-box"></i>

<h4>
Orders
</h4>

</div>

<div
class="actionCard"
onclick="location.href='partner-riders.html'">

<i class="fa-solid fa-motorcycle"></i>

<h4>
Riders
</h4>

</div>

<div
class="actionCard">

<i class="fa-solid fa-chart-line"></i>

<h4>
Analytics
</h4>

</div>

<div
class="actionCard">

<i class="fa-solid fa-indian-rupee-sign"></i>

<h4>
Earnings
</h4>

</div>

</div>

</div>

<!-- RECENT ORDERS -->

<div class="ordersSection">

<div class="sectionTitle">

Recent Orders

</div>

<div id="recentOrders">

<!-- Firebase Orders -->

</div>

</div>
<!-- =========================================
BOTTOM NAVIGATION
========================================= -->

<div class="bottomNav">

<button class="navItem activeNav">
<i class="fa-solid fa-house"></i>
<span>Dashboard</span>
</button>

<button
class="navItem"
onclick="location.href='partner-orders.html'">

<i class="fa-solid fa-box"></i>
<span>Orders</span>

</button>

<button
class="navItem"
onclick="location.href='partner-riders.html'">

<i class="fa-solid fa-motorcycle"></i>
<span>Riders</span>

</button>

<button class="navItem">

<i class="fa-solid fa-chart-line"></i>
<span>Analytics</span>

</button>

<button class="navItem">

<i class="fa-solid fa-user"></i>
<span>Profile</span>

</button>

</div>

<!-- =========================================
FIREBASE
========================================= -->

<script type="module">

import { db, auth }
from "./firebase.js";

import {
collection,
query,
where,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* =========================================
GLOBAL
========================================= */

let currentPartner = null;

let todayRevenue = 0;
let todayOrders = 0;
let pendingOrders = 0;

/* =========================================
PARTNER LOGIN
========================================= */

onAuthStateChanged(

auth,

(user)=>{

if(!user){

window.location.href =
"partner-login.html";

return;

}

loadDashboard(user);

}

);

/* =========================================
LOAD DASHBOARD
========================================= */

function loadDashboard(user){

const partnerCity =

localStorage.getItem(
"partnerCity"
)

||

"Kasganj";

/* =========================================
ORDERS
========================================= */

const ordersQuery =

query(

collection(
db,
"orders"
),

where(
"partnerCity",
"==",
partnerCity
)

);

onSnapshot(

ordersQuery,

(snapshot)=>{

todayRevenue = 0;
todayOrders = 0;
pendingOrders = 0;

document
.getElementById(
"recentOrders"
)

.innerHTML = "";

/* ========================================= */

snapshot.forEach(doc=>{

const order =
doc.data();

/* ========================================= */

todayOrders++;

todayRevenue +=
Number(
order.grandTotal || 0
);

/* ========================================= */

if(
order.status !==
"Completed"
){

pendingOrders++;

}

/* =========================================
BADGES
========================================= */

let badges = "";

/* ========================================= */

if(
order.premiumPackaging
){

badges +=

`
<div class="badge premium">

👑 Premium Packaging

</div>
`;

}

/* ========================================= */

if(
order.urgentDelivery
){

badges +=

`
<div class="badge urgent">

⚡ Urgent Delivery

</div>
`;

}

/* =========================================
ORDER CARD
========================================= */

document
.getElementById(
"recentOrders"
)

.innerHTML +=

`

<div class="orderCard">

<div class="orderTop">

<div class="orderId">

#${order.orderId}

</div>

<div class="orderStatus">

${order.status}

</div>

</div>

<div class="orderInfo">

👤 ${order.customerName || "Customer"}

<br>

📍 ${order.city}

<br>

💰 ₹${order.grandTotal}

<br>

📦 ${order.items?.length || 0}
 Items

</div>

<div class="badges">

${badges}

</div>

</div>

`;

});

/* =========================================
UPDATE STATS
========================================= */

document.getElementById(
"todayOrders"
)

.innerHTML =
todayOrders;

document.getElementById(
"todayRevenue"
)

.innerHTML =
`₹${todayRevenue}`;

document.getElementById(
"pendingOrders"
)

.innerHTML =
pendingOrders;

}

);

/* =========================================
RIDERS
========================================= */

const riderQuery =

query(

collection(
db,
"riders"
),

where(
"city",
"==",
partnerCity
)

);

onSnapshot(

riderQuery,

(snapshot)=>{

document.getElementById(
"activeRiders"
)

.innerHTML =

snapshot.size;

}

);

/* =========================================
NOTIFICATIONS
========================================= */

const notificationQuery =

query(

collection(
db,
"notifications"
),

where(
"city",
"==",
partnerCity
)

);

onSnapshot(

notificationQuery,

(snapshot)=>{

if(
snapshot.size > 0
){

document
.getElementById(
"notificationBadge"
)

.style.display =
"block";

}else{

document
.getElementById(
"notificationBadge"
)

.style.display =
"none";

}

}

);

}

/* =========================================
OPEN NOTIFICATIONS
========================================= */

document
.querySelector(
".notificationBtn"
)

.addEventListener(

"click",

()=>{

window.location.href =
"partner-notifications.html";

}

);

</script>

</body>
</html>
