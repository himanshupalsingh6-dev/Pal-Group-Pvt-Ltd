<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Partner Orders
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
GLOBAL
===================================================== */

body{

background:#F4F7FB;

overflow-x:hidden;

}

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

padding:24px;

min-height:100vh;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:28px;

flex-wrap:wrap;

}

.pageTitle{

font-size:58px;

font-weight:900;

color:#111827;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:flex;

gap:14px;

flex-wrap:wrap;

margin-bottom:24px;

}

.filterBtn{

height:54px;

padding:0 24px;

border:none;

border-radius:18px;

background:#fff;

font-size:14px;

font-weight:900;

cursor:pointer;

border:1px solid #E5E7EB;

}

.filterBtn.active{

background:#111827;

color:#fff;

}

/* =====================================================
ORDERS GRID
===================================================== */

.ordersGrid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(420px,1fr));

gap:24px;

}

/* =====================================================
ORDER CARD
===================================================== */

.orderCard{

background:#fff;

border-radius:32px;

padding:24px;

border:1px solid #E5E7EB;

}

/* =====================================================
TOP
===================================================== */

.orderTop{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

gap:20px;

}

.orderId{

font-size:24px;

font-weight:900;

color:#111827;

}

.orderStatus{

padding:10px 18px;

border-radius:999px;

font-size:12px;

font-weight:900;

}

/* =====================================================
STATUS COLORS
===================================================== */

.pending{

background:#DBEAFE;

color:#2563EB;

}

.pickup{

background:#FEF3C7;

color:#D97706;

}

.processing{

background:#E9D5FF;

color:#7C3AED;

}

.delivery{

background:#FECACA;

color:#DC2626;

}

.completed{

background:#DCFCE7;

color:#15803D;

}

/* =====================================================
CUSTOMER
===================================================== */

.customerBox{

background:#F9FAFB;

padding:18px;

border-radius:24px;

margin-bottom:18px;

}

.customerBox h3{

font-size:18px;

font-weight:900;

margin-bottom:8px;

}

.customerBox p{

font-size:13px;

font-weight:700;

color:#6B7280;

margin-bottom:6px;

}

/* =====================================================
PRODUCTS
===================================================== */

.products{

margin-bottom:20px;

}

.productItem{

display:flex;

justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #F3F4F6;

}

.productName{

font-size:14px;

font-weight:800;

}

.productQty{

font-size:13px;

font-weight:700;

color:#6B7280;

}

/* =====================================================
BOTTOM
===================================================== */

.orderBottom{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

flex-wrap:wrap;

margin-top:20px;

}

.amount{

font-size:30px;

font-weight:900;

color:#111827;

}

/* =====================================================
ACTIONS
===================================================== */

.actions{

display:flex;

gap:10px;

flex-wrap:wrap;

}

.actionBtn{

height:48px;

padding:0 18px;

border:none;

border-radius:16px;

background:#111827;

color:#fff;

font-size:13px;

font-weight:900;

cursor:pointer;

}

/* =====================================================
TIMELINE
===================================================== */

.timeline{

margin-top:24px;

padding-top:20px;

border-top:1px solid #F3F4F6;

display:flex;

justify-content:space-between;

gap:10px;

}

.step{

flex:1;

text-align:center;

}

.stepCircle{

width:34px;

height:34px;

border-radius:50%;

background:#E5E7EB;

margin:auto;

margin-bottom:8px;

display:flex;

align-items:center;

justify-content:center;

font-size:13px;

font-weight:900;

color:#fff;

}

.step.active .stepCircle{

background:#111827;

}

.step p{

font-size:11px;

font-weight:800;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:900px){

.main{

margin-left:0;

padding:16px;

}

.pageTitle{

font-size:38px;

}

.ordersGrid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<!-- =====================================================
LAYOUT
===================================================== -->

<div id="layoutContainer"></div>

<!-- =====================================================
MAIN
===================================================== -->

<div class="main">

<div class="pageHeader">

<div class="pageTitle">
Partner Orders
</div>

</div>

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filters">

<button class="filterBtn active">
All
</button>

<button class="filterBtn">
Pending
</button>

<button class="filterBtn">
Pickup
</button>

<button class="filterBtn">
Processing
</button>

<button class="filterBtn">
Out For Delivery
</button>

<button class="filterBtn">
Completed
</button>

</div>

<!-- =====================================================
ORDERS
===================================================== -->

<div
class="ordersGrid"
id="ordersGrid">

</div>

</div>

<!-- =====================================================
LAYOUT JS
===================================================== -->

<script type="module"
src="./js/layout.js">
</script>

<!-- =====================================================
ORDERS JS
===================================================== -->

<script type="module"
src="./js/orders.js">
</script>

</body>
</html>
