<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Partner Dashboard
</title>

<link
rel="stylesheet"
href="../admin/layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

width:calc(100% - 290px);

min-height:100vh;

background:#F4F7FB;

padding:24px;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:28px;

flex-wrap:wrap;

}

.pageTitle{

font-size:58px;

font-weight:900;

letter-spacing:-2px;

}

.liveBadge{

padding:14px 22px;

border-radius:999px;

background:#DCFCE7;

color:#15803D;

font-size:14px;

font-weight:900;

display:flex;

align-items:center;

gap:10px;

}

.liveDot{

width:12px;

height:12px;

background:#16A34A;

border-radius:50%;

animation:pulse 1s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.4);
opacity:.5;
}

100%{
transform:scale(1);
opacity:1;
}

}

/* =====================================================
STATS
===================================================== */

.statsGrid{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

margin-bottom:28px;

}

.statCard{

background:#fff;

border-radius:30px;

padding:24px;

border:1px solid #E5E7EB;

}

.statCard h5{

font-size:13px;

font-weight:900;

color:#6B7280;

margin-bottom:10px;

}

.statCard h2{

font-size:42px;

font-weight:900;

margin-bottom:10px;

}

.statCard p{

font-size:13px;

font-weight:700;

color:#6B7280;

}

/* =====================================================
GRID
===================================================== */

.dashboardGrid{

display:grid;

grid-template-columns:2fr 1fr;

gap:24px;

}

/* =====================================================
ORDERS
===================================================== */

.ordersCard{

background:#fff;

border-radius:32px;

padding:24px;

border:1px solid #E5E7EB;

}

.cardHeader{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:22px;

}

.cardTitle{

font-size:28px;

font-weight:900;

}

.orderItem{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

padding:18px;

border-radius:22px;

background:#F9FAFB;

margin-bottom:16px;

flex-wrap:wrap;

}

.orderLeft h3{

font-size:18px;

font-weight:900;

margin-bottom:6px;

}

.orderLeft p{

font-size:13px;

font-weight:700;

color:#6B7280;

}

.orderStatus{

padding:10px 18px;

border-radius:999px;

font-size:12px;

font-weight:900;

}

.processing{

background:#FEF3C7;

color:#D97706;

}

.ready{

background:#DCFCE7;

color:#15803D;

}

/* =====================================================
RIGHT PANEL
===================================================== */

.rightPanel{

display:flex;

flex-direction:column;

gap:24px;

}

/* =====================================================
PROFILE
===================================================== */

.profileCard{

background:#fff;

border-radius:32px;

padding:24px;

border:1px solid #E5E7EB;

text-align:center;

}

.profileImage{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

margin-bottom:18px;

}

.profileCard h2{

font-size:30px;

font-weight:900;

margin-bottom:8px;

}

.profileCard p{

font-size:14px;

font-weight:700;

color:#6B7280;

margin-bottom:24px;

}

/* =====================================================
ACTION BUTTONS
===================================================== */

.actionGrid{

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

}

.actionBtn{

height:60px;

border:none;

border-radius:20px;

background:#111827;

color:#fff;

font-size:14px;

font-weight:900;

cursor:pointer;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1200px){

.statsGrid{

grid-template-columns:
repeat(2,1fr);

}

.dashboardGrid{

grid-template-columns:1fr;

}

}

@media(max-width:900px){

.main{

margin-left:0;

width:100%;

padding:16px;

}

.pageTitle{

font-size:38px;

}

.statsGrid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="adminLayout">

<div id="layoutContainer"></div>

<div class="main">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Partner Dashboard
</div>

<div class="liveBadge">

<div class="liveDot"></div>

Partner Active

</div>

</div>

<!-- =====================================================
STATS
===================================================== -->

<div class="statsGrid">

<div class="statCard">

<h5>
Today Orders
</h5>

<h2 id="todayOrders">
0
</h2>

<p>
Realtime orders today
</p>

</div>

<div class="statCard">

<h5>
Revenue
</h5>

<h2 id="todayRevenue">
₹0
</h2>

<p>
Today's earnings
</p>

</div>

<div class="statCard">

<h5>
Processing
</h5>

<h2 id="processingOrders">
0
</h2>

<p>
Laundry in process
</p>

</div>

<div class="statCard">

<h5>
Wallet Balance
</h5>

<h2 id="walletBalance">
₹0
</h2>

<p>
Available balance
</p>

</div>

</div>

<!-- =====================================================
GRID
===================================================== -->

<div class="dashboardGrid">

<!-- =====================================================
ORDERS
===================================================== -->

<div class="ordersCard">

<div class="cardHeader">

<div class="cardTitle">
Recent Orders
</div>

</div>

<div id="ordersContainer"></div>

</div>

<!-- =====================================================
RIGHT PANEL
===================================================== -->

<div class="rightPanel">

<div class="profileCard">

<img
src="https://i.ibb.co/3SWQHfY/user.png"
class="profileImage">

<h2 id="partnerName">
Laundry Partner
</h2>

<p id="partnerCity">
Kasganj
</p>

<div class="actionGrid">

<button class="actionBtn">

Orders

</button>

<button class="actionBtn">

Wallet

</button>

<button class="actionBtn">

Services

</button>

<button class="actionBtn">

Analytics

</button>

</div>

</div>

</div>

</div>

</div>

</div>

<script type="module"
src="../admin/js/layout.js">
</script>

<script type="module"
src="js/index.js">
</script>

</body>
</html>
