<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Partner Login
</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
GLOBAL
===================================================== */

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:#0F172A;

min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

overflow:hidden;

}

/* =====================================================
BG
===================================================== */

.bgBlur{

position:fixed;

width:400px;
height:400px;

background:#2563EB;

filter:blur(120px);

opacity:.25;

border-radius:50%;

top:-100px;
right:-100px;

}

/* =====================================================
CARD
===================================================== */

.loginContainer{

width:100%;
max-width:460px;

background:#fff;

border-radius:40px;

padding:34px;

position:relative;

z-index:2;

box-shadow:
0 20px 80px rgba(0,0,0,.25);

}

/* =====================================================
TOP
===================================================== */

.logo{

font-size:42px;
font-weight:900;
color:#111827;

margin-bottom:8px;

}

.subTitle{

font-size:14px;
font-weight:700;
color:#6B7280;

margin-bottom:34px;

line-height:1.7;

}

/* =====================================================
INPUT
===================================================== */

.inputGroup{

margin-bottom:22px;

}

.inputLabel{

font-size:13px;
font-weight:900;

margin-bottom:10px;

display:block;

color:#111827;

}

.inputBox{

width:100%;
height:64px;

background:#F9FAFB;

border:2px solid #E5E7EB;

border-radius:22px;

padding:0 20px;

font-size:15px;
font-weight:800;

outline:none;

transition:.3s;

}

.inputBox:focus{

border-color:#111827;

background:#fff;

}

/* =====================================================
PASSWORD
===================================================== */

.passwordWrap{

position:relative;

}

.togglePassword{

position:absolute;

right:18px;
top:50%;

transform:translateY(-50%);

cursor:pointer;

font-size:18px;

color:#6B7280;

}

/* =====================================================
BUTTON
===================================================== */

.loginBtn{

width:100%;
height:66px;

border:none;

border-radius:24px;

background:#111827;

color:#fff;

font-size:15px;
font-weight:900;

cursor:pointer;

transition:.3s;

margin-top:10px;

}

.loginBtn:hover{

transform:translateY(-2px);

}

/* =====================================================
BOTTOM
===================================================== */

.bottomText{

margin-top:28px;

text-align:center;

font-size:13px;
font-weight:700;
color:#6B7280;

line-height:1.7;

}

/* =====================================================
STATUS
===================================================== */

.secureBox{

margin-top:24px;

background:#F9FAFB;

padding:18px;

border-radius:22px;

display:flex;
align-items:center;
gap:14px;

}

.secureIcon{

width:50px;
height:50px;

border-radius:16px;

background:#111827;

display:flex;
align-items:center;
justify-content:center;

color:#fff;

font-size:20px;

}

.secureText h4{

font-size:15px;
font-weight:900;

margin-bottom:4px;

}

.secureText p{

font-size:12px;
font-weight:700;
color:#6B7280;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:600px){

.loginContainer{

padding:28px;
border-radius:30px;

}

.logo{

font-size:34px;

}

}

</style>

</head>

<body>

<div class="bgBlur"></div>

<!-- =====================================================
LOGIN CARD
===================================================== -->

<div class="loginContainer">

<div class="logo">
QuickPress
</div>

<div class="subTitle">

Partner Dashboard Secure Login

</div>

<!-- =====================================================
EMAIL
===================================================== -->

<div class="inputGroup">

<label class="inputLabel">
Partner Email
</label>

<input
type="email"
id="email"
class="inputBox"
placeholder="Enter email">

</div>

<!-- =====================================================
PASSWORD
===================================================== -->

<div class="inputGroup">

<label class="inputLabel">
Password
</label>

<div class="passwordWrap">

<input
type="password"
id="password"
class="inputBox"
placeholder="Enter password">

<i
class="fa-solid fa-eye togglePassword"
id="togglePassword">
</i>

</div>

</div>

<!-- =====================================================
BUTTON
===================================================== -->

<button
class="loginBtn"
id="loginBtn">

Login Partner Account

</button>

<!-- =====================================================
SECURITY
===================================================== -->

<div class="secureBox">

<div class="secureIcon">

<i class="fa-solid fa-shield-halved"></i>

</div>

<div class="secureText">

<h4>
Secure Authentication
</h4>

<p>
Firebase encrypted login security enabled
</p>

</div>

</div>

<div class="bottomText">

QuickPress Multi City Delivery System

</div>

</div>

<!-- =====================================================
SCRIPT
===================================================== -->

<script type="module"
src="./js/login.js">
</script>

</body>
</html>
