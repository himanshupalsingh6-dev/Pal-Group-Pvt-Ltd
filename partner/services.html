<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Partner Services
</title>

<!-- =====================================================
CSS
===================================================== -->

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
GLOBAL
===================================================== */

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:#F4F7FB;

overflow-x:hidden;

}

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

padding:24px;

min-height:100vh;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:30px;

flex-wrap:wrap;

}

.pageTitle{

font-size:58px;

font-weight:900;

color:#111827;

}

/* =====================================================
TOP CARDS
===================================================== */

.topCards{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

margin-bottom:30px;

}

.topCard{

background:#fff;

padding:24px;

border-radius:30px;

border:1px solid #E5E7EB;

}

.topCard h5{

font-size:13px;

font-weight:900;

color:#6B7280;

margin-bottom:10px;

}

.topCard h2{

font-size:42px;

font-weight:900;

color:#111827;

margin-bottom:8px;

}

.topCard p{

font-size:13px;

font-weight:700;

color:#6B7280;

}

/* =====================================================
TOP BAR
===================================================== */

.topBar{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:30px;

flex-wrap:wrap;

}

/* =====================================================
SEARCH
===================================================== */

.searchBox{

flex:1;

min-width:250px;

position:relative;

}

.searchInput{

width:100%;

height:62px;

border:none;

outline:none;

background:#fff;

border-radius:22px;

padding:0 20px 0 60px;

font-size:15px;

font-weight:800;

border:1px solid #E5E7EB;

}

.searchIcon{

position:absolute;

left:22px;

top:50%;

transform:translateY(-50%);

font-size:18px;

color:#6B7280;

}

/* =====================================================
ADD BUTTON
===================================================== */

.addBtn{

height:62px;

padding:0 28px;

border:none;

border-radius:22px;

background:#111827;

color:#fff;

font-size:14px;

font-weight:900;

cursor:pointer;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:flex;

gap:12px;

flex-wrap:wrap;

margin-bottom:24px;

}

.filterBtn{

height:52px;

padding:0 20px;

border:none;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.filterBtn.active{

background:#111827;

color:#fff;

}

/* =====================================================
GRID
===================================================== */

.servicesGrid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(360px,1fr));

gap:24px;

}

/* =====================================================
CARD
===================================================== */

.serviceCard{

background:#fff;

border-radius:32px;

padding:24px;

border:1px solid #E5E7EB;

transition:.3s;

}

.serviceCard:hover{

transform:translateY(-4px);

}

/* =====================================================
TOP
===================================================== */

.serviceTop{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:16px;

margin-bottom:20px;

}

.serviceIcon{

width:72px;

height:72px;

border-radius:24px;

background:#111827;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

color:#fff;

}

.serviceStatus{

padding:10px 16px;

border-radius:999px;

font-size:12px;

font-weight:900;

background:#DCFCE7;

color:#15803D;

}

/* =====================================================
CONTENT
===================================================== */

.serviceName{

font-size:28px;

font-weight:900;

color:#111827;

margin-bottom:10px;

}

.serviceDesc{

font-size:14px;

font-weight:700;

line-height:1.7;

color:#6B7280;

margin-bottom:20px;

}

/* =====================================================
PRICE
===================================================== */

.priceBox{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

padding:16px;

border-radius:20px;

background:#F9FAFB;

}

.priceTitle{

font-size:13px;

font-weight:900;

color:#6B7280;

}

.priceValue{

font-size:28px;

font-weight:900;

color:#111827;

}

/* =====================================================
STATS
===================================================== */

.statsRow{

display:grid;

grid-template-columns:1fr 1fr 1fr;

gap:14px;

margin-bottom:22px;

}

.statItem{

background:#F9FAFB;

padding:16px;

border-radius:18px;

text-align:center;

}

.statItem h4{

font-size:20px;

font-weight:900;

margin-bottom:6px;

}

.statItem p{

font-size:11px;

font-weight:800;

color:#6B7280;

}

/* =====================================================
BUTTONS
===================================================== */

.actionButtons{

display:grid;

grid-template-columns:1fr 1fr;

gap:14px;

}

.actionBtn{

height:56px;

border:none;

border-radius:18px;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.editBtn{

background:#111827;

color:#fff;

}

.disableBtn{

background:#F3F4F6;

color:#111827;

}

/* =====================================================
MODAL
===================================================== */

.modal{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.5);

display:none;

align-items:center;

justify-content:center;

padding:20px;

z-index:99999;

}

.modalContent{

width:100%;

max-width:700px;

background:#fff;

border-radius:32px;

padding:30px;

max-height:95vh;

overflow-y:auto;

}

.modalTitle{

font-size:38px;

font-weight:900;

margin-bottom:24px;

}

/* =====================================================
FORM
===================================================== */

.formGrid{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

.inputGroup{

margin-bottom:18px;

}

.inputLabel{

font-size:13px;

font-weight:900;

margin-bottom:10px;

display:block;

}

.input{

width:100%;

height:60px;

border:none;

outline:none;

background:#F9FAFB;

border:1px solid #E5E7EB;

border-radius:18px;

padding:0 18px;

font-size:14px;

font-weight:800;

}

.textarea{

width:100%;

height:120px;

padding:18px;

resize:none;

}

.saveBtn{

width:100%;

height:62px;

border:none;

border-radius:20px;

background:#111827;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

margin-top:10px;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1200px){

.topCards{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:900px){

.main{

margin-left:0;

padding:16px;

}

.pageTitle{

font-size:38px;

}

.topCards{

grid-template-columns:1fr;

}

.servicesGrid{

grid-template-columns:1fr;

}

.formGrid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<!-- =====================================================
LAYOUT
===================================================== -->

<div id="layoutContainer"></div>

<!-- =====================================================
MAIN
===================================================== -->

<div class="main">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Partner Services
</div>

</div>

<!-- =====================================================
TOP CARDS
===================================================== -->

<div class="topCards">

<div class="topCard">

<h5>
Total Services
</h5>

<h2 id="totalServices">
0
</h2>

<p>
Active laundry services
</p>

</div>

<div class="topCard">

<h5>
Total Orders
</h5>

<h2 id="totalOrders">
0
</h2>

<p>
Services ordered
</p>

</div>

<div class="topCard">

<h5>
Revenue
</h5>

<h2 id="totalRevenue">
₹0
</h2>

<p>
Service earnings
</p>

</div>

<div class="topCard">

<h5>
Top Service
</h5>

<h2 id="topService">
0
</h2>

<p>
Most ordered service
</p>

</div>

</div>

<!-- =====================================================
TOP BAR
===================================================== -->

<div class="topBar">

<div class="searchBox">

<i class="fa-solid fa-search searchIcon"></i>

<input
type="text"
class="searchInput"
placeholder="Search services..."
id="searchInput">

</div>

<button
class="addBtn"
id="openModalBtn">

+ Add New Service

</button>

</div>

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filters">

<button class="filterBtn active">
All
</button>

<button class="filterBtn">
Wash
</button>

<button class="filterBtn">
Dry Clean
</button>

<button class="filterBtn">
Iron
</button>

<button class="filterBtn">
Premium
</button>

</div>

<!-- =====================================================
SERVICES GRID
===================================================== -->

<div
class="servicesGrid"
id="servicesGrid">

</div>

</div>

<!-- =====================================================
MODAL
===================================================== -->

<div
class="modal"
id="serviceModal">

<div class="modalContent">

<div class="modalTitle">
Add Service
</div>

<div class="formGrid">

<div class="inputGroup">

<label class="inputLabel">
Service Name
</label>

<input
type="text"
class="input"
id="serviceName">

</div>

<div class="inputGroup">

<label class="inputLabel">
Category
</label>

<select
class="input"
id="serviceCategory">

<option>
Wash
</option>

<option>
Dry Clean
</option>

<option>
Iron
</option>

<option>
Premium
</option>

</select>

</div>

<div class="inputGroup">

<label class="inputLabel">
Price
</label>

<input
type="number"
class="input"
id="servicePrice">

</div>

<div class="inputGroup">

<label class="inputLabel">
Icon
</label>

<input
type="text"
class="input"
id="serviceIcon"
placeholder="fa-shirt">

</div>

</div>

<div class="inputGroup">

<label class="inputLabel">
Description
</label>

<textarea
class="input textarea"
id="serviceDescription"></textarea>

</div>

<button
class="saveBtn"
id="saveServiceBtn">

Save Service

</button>

</div>

</div>

<!-- =====================================================
SCRIPTS
===================================================== -->

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/services.js">
</script>

</body>
</html>
