<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Complete Profile

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#0F172A;
--gray:#64748B;

}

body{

background:#F7F8FA;

}

.hero{

height:28vh;

background:
linear-gradient(
135deg,
#16A34A,
#0EA84B
);

display:flex;

justify-content:center;

align-items:center;

text-align:center;

color:white;

padding:20px;

}

.hero h1{

font-size:34px;

font-weight:900;

}

.hero p{

margin-top:10px;

opacity:.9;

}

</style>

</head>

<body>

<div class="hero">

<div>

<h1>

Welcome

</h1>

<p>

Complete Your Profile

</p>

</div>

</div><div class="signupCard">

<h2>

Create Account

</h2>

<input
type="text"
id="fullName"
class="inputField"
placeholder="Full Name">

<input
type="email"
id="email"
class="inputField"
placeholder="Email Address">

<select
id="city"
class="inputField">

<option value="">

Select City

</option>

<option>

Kasganj

</option>

<option>

Noida

</option>

<option>

Delhi

</option>

<option>

Agra

</option>

<option>

Lucknow

</option>

</select>

<input
type="text"
id="referral"
class="inputField"
placeholder="Referral Code (Optional)"><style>

.signupCard{

background:#fff;

margin-top:-25px;

border-radius:30px 30px 0 0;

padding:28px 24px;

min-height:72vh;

}

.signupCard h2{

text-align:center;

font-size:24px;

font-weight:800;

margin-bottom:25px;

}

.inputField{

width:100%;

height:58px;

border:2px solid #E5E7EB;

border-radius:18px;

padding:0 18px;

font-size:15px;

margin-bottom:16px;

outline:none;

background:white;

}

.inputField:focus{

border-color:#16A34A;

}

</style><button
class="createBtn"
onclick="createAccount()">

Create Account

</button>

<style>

.createBtn{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:#16A34A;

color:white;

font-size:18px;

font-weight:800;

cursor:pointer;

margin-top:10px;

}

</style><script type="module">

import { auth, db }
from "./firebase.js";

import {

doc,
setDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

</script><script type="module">

window.createAccount =
async function(){

const user =
auth.currentUser;

if(!user){

window.location.href =
"login.html";

return;

}

const fullName =

document.getElementById(
"fullName"
).value.trim();

const email =

document.getElementById(
"email"
).value.trim();

const city =

document.getElementById(
"city"
).value;

if(
!fullName ||
!city
){

alert(
"Please Complete Profile"
);

return;

}

try{

await setDoc(

doc(
db,
"users",
user.uid
),

{

uid:user.uid,

name:fullName,

email:email,

phone:user.phoneNumber,

city:city,

walletBalance:0,

role:"user",

createdAt:
serverTimestamp()

}

);

localStorage.setItem(
"userCity",
city
);

window.location.href =
"index.html";

}

catch(error){

console.error(error);

alert(
error.message
);

}

};

</script><script type="module">

import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {

getDoc,
doc

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

const userDoc =

await getDoc(

doc(
db,
"users",
user.uid
)

);

if(userDoc.exists()){

window.location.href =
"index.html";

}

}

);

</script></div>

</body>

</html>
