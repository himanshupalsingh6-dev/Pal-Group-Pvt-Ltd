<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Signup

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F7F8FA;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.signupCard{

width:100%;

max-width:450px;

background:#fff;

padding:30px;

border-radius:28px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

h2{

font-size:28px;

font-weight:900;

margin-bottom:8px;

}

p{

font-size:13px;

color:#6B7280;

margin-bottom:24px;

}

.input{

width:100%;

height:56px;

border:1px solid #E5E7EB;

border-radius:16px;

padding:0 16px;

margin-bottom:14px;

outline:none;

}

.createBtn{

width:100%;

height:56px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-weight:900;

cursor:pointer;

}

</style>

</head>

<body>

<div class="signupCard">

<h2>

Welcome to QuickPress

</h2>

<p>

Complete your profile

</p>

<input
id="fullName"
class="input"
placeholder="Full Name">

<input
id="email"
class="input"
placeholder="Email Address">

<input
id="city"
class="input"
placeholder="City">

<input
id="referral"
class="input"
placeholder="Referral Code (Optional)">

<button
class="createBtn"
onclick="createAccount()">

Create Account

</button>

</div><script type="module">

import { auth }
from "./firebase.js";

import {

getFirestore,
doc,
setDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const db =
getFirestore();

window.createAccount =
async function(){

const user =
auth.currentUser;

if(!user){

alert(
"Please Login Again"
);

window.location.href =
"login.html";

return;

}

try{

await setDoc(

doc(
db,
"users",
user.uid
),

{

uid:user.uid,

name:

document.getElementById(
"fullName"
).value,

email:

document.getElementById(
"email"
).value,

phone:
user.phoneNumber,

city:

document.getElementById(
"city"
).value,

referralCode:

document.getElementById(
"referral"
).value,

createdAt:
serverTimestamp()

}

);

localStorage.setItem(

"userCity",

document.getElementById(
"city"
).value

);

window.location.href =
"index.html";

}

catch(error){

console.error(error);

alert(
error.message
);

}

};

</script>

</body>

</html>
