<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Signup

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#fff;

min-height:100vh;

overflow-x:hidden;

}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#111827;
--gray:#6B7280;

}.slider{

height:42vh;

position:relative;

overflow:hidden;

}

.slide{

position:absolute;

width:100%;
height:100%;

}

.slide img{

width:100%;
height:100%;

object-fit:cover;

}

.overlay{

position:absolute;

inset:0;

background:
linear-gradient(
transparent,
rgba(0,0,0,.55)
);

display:flex;

flex-direction:column;

justify-content:flex-end;

padding:25px;

color:white;

}

.overlay h2{

font-size:34px;

font-weight:900;

}

.overlay p{

margin-top:8px;

font-size:15px;

}.signupCard{

background:white;

margin-top:-25px;

border-radius:30px 30px 0 0;

padding:24px;

position:relative;

z-index:10;

}

.logo{

font-size:42px;

font-weight:900;

color:var(--dark);

}

.subTitle{

color:var(--gray);

margin-top:5px;

margin-bottom:24px;

}form{

display:flex;

flex-direction:column;

gap:14px;

}

.input{

height:58px;

border:1px solid #E5E7EB;

border-radius:16px;

padding:0 18px;

font-size:15px;

outline:none;

}

.input:focus{

border-color:var(--secondary);

}

.continueBtn{

height:60px;

border:none;

border-radius:16px;

background:var(--secondary);

color:white;

font-size:18px;

font-weight:800;

cursor:pointer;

}.divider{

margin:22px 0;

text-align:center;

color:var(--gray);

font-weight:600;

}

.googleBtn{

height:58px;

width:100%;

border:2px solid #E5E7EB;

background:white;

border-radius:16px;

font-size:16px;

font-weight:700;

cursor:pointer;

}

.terms{

font-size:12px;

line-height:1.6;

text-align:center;

margin-top:18px;

color:var(--gray);

}

</style>

</head>

<body><div class="slider">

<div class="slide">

<img
src="https://images.unsplash.com/photo-1521656693074-0ef32e80a5d5?q=80&w=1200">

<div class="overlay">

<h2>

Premium Laundry Service

</h2>

<p>

Pickup & Delivery In 30 Minutes

</p>

</div>

</div>

</div><div class="signupCard">

<div class="logo">

QuickPress

</div>

<p class="subTitle">

Create your account

</p>

<form id="signupForm">

<input
class="input"
id="name"
type="text"
placeholder="Full Name"
required>

<input
class="input"
id="email"
type="email"
placeholder="Email Address"><input
class="input"
id="phone"
type="tel"
placeholder="+91 Mobile Number"
required>

<input
class="input"
id="referral"
type="text"
placeholder="Referral Code (Optional)">

<button
class="continueBtn"
type="submit">

Continue

</button>

</form><div class="divider">

OR

</div>

<button
class="googleBtn">

Continue With Google

</button>

<p class="terms">

By continuing you agree to
QuickPress Terms of Service,
Privacy Policy and Content Policy.

</p>

</div><script>

document

.getElementById(
"signupForm"
)

.addEventListener(

"submit",

function(e){

e.preventDefault();

const user = {

name:

document
.getElementById(
"name"
).value,

email:

document
.getElementById(
"email"
).value,

phone:

document
.getElementById(
"phone"
).value,

referral:

document
.getElementById(
"referral"
).value

};

localStorage.setItem(

"qp_signup",

JSON.stringify(user)

);

window.location.href =
"otp.html";

}

);

</script>

</body>
</html>
