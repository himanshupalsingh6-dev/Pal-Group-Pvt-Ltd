<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Signup

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#fff;

overflow-x:hidden;

min-height:100vh;

}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#111827;
--light:#6B7280;

}.slider{

height:45vh;

position:relative;

overflow:hidden;

}

.slide{

position:absolute;

inset:0;

opacity:0;

transition:1s;

}

.activeSlide{

opacity:1;

}

.slide img{

width:100%;

height:100%;

object-fit:cover;

}

.overlay{

position:absolute;

inset:0;

background:

linear-gradient(

transparent,

rgba(0,0,0,.65)

);

display:flex;

flex-direction:column;

justify-content:flex-end;

padding:24px;

color:#fff;

}

.overlay h2{

font-size:36px;

font-weight:900;

}

.overlay p{

margin-top:8px;

font-size:15px;

}.signupCard{

background:

rgba(255,255,255,.96);

backdrop-filter:

blur(20px);

margin-top:-35px;

border-radius:34px 34px 0 0;

padding:24px;

position:relative;

z-index:10;

min-height:60vh;

}

.logo{

font-size:42px;

font-weight:900;

color:#111827;

}

.subTitle{

margin-top:4px;

color:#6B7280;

font-size:14px;

}.formGroup{

margin-top:18px;

}

.input{

width:100%;

height:60px;

border:1px solid #E5E7EB;

border-radius:18px;

padding:0 18px;.continueBtn{

width:100%;

height:60px;

margin-top:18px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:18px;

font-weight:800;

cursor:pointer;

}

.googleBtn{

width:100%;

height:58px;

margin-top:14px;

border:2px solid #E5E7EB;

background:#fff;

border-radius:18px;

font-weight:800;

cursor:pointer;

}</style>

</head>

<body>

<div class="slider">

<div class="slide activeSlide">

<img
src="https://images.unsplash.com/photo-1521656693074-0ef32e80a5d5?q=80&w=1200">

<div class="overlay">

<h2>

Laundry Made Easy

</h2>

<p>

Pickup & Delivery In 30 Minutes

</p>

</div>

</div>

</div><div class="signupCard">

<div class="logo">

QuickPress

</div>

<div class="subTitle">

Create your account

</div>

<form id="signupForm">

<div class="formGroup">

<input
id="name"
class="input"
type="text"
placeholder="Full Name"
required>

</div>

<div class="formGroup">

<input
id="email"
class="input"
type="email"
placeholder="Email Address">

</div><div class="formGroup">

<input
id="phone"
class="input"
type="tel"
placeholder="+91 Mobile Number"
required>

</div>

<div class="formGroup">

<input
id="referral"
class="input"
type="text"
placeholder="Referral Code (Optional)">

</div>

<button
class="continueBtn"
type="submit">

Continue

</button>

</form>

<button
class="googleBtn">

<i class="fa-brands fa-google"></i>

Continue With Google

</button><p
style="

font-size:12px;

line-height:1.7;

color:#6B7280;

margin-top:18px;

text-align:center;

">

By continuing you agree to

QuickPress Terms,

Privacy Policy

and Content Policy.

</p>

</div><script>

document

.getElementById(
"signupForm"
)

.addEventListener(

"submit",

function(e){

e.preventDefault();

const userData = {

name:

document
.getElementById("name")
.value,

email:

document
.getElementById("email")
.value,

phone:

document
.getElementById("phone")
.value,

referral:

document
.getElementById("referral")
.value

};

localStorage.setItem(

"qp_signup",

JSON.stringify(userData)

);

window.location.href =
"otp.html";

}

);

</script>

</body>
</html>

font-size:15px;

outline:none;

font-weight:600;

}

.input:focus{

border-color:#16A34A;

}
