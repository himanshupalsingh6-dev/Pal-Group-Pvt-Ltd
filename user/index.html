<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress | Premium Laundry Marketplace
</title>

<meta
name="theme-color"
content="#16A34A">

<meta
name="description"
content="Premium Laundry Marketplace">

<!-- Fonts -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<!-- Icons -->

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- Leaflet -->

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;

--dark:#111827;
--light:#6B7280;

--bg:#F6F7FB;
--white:#FFFFFF;

--radius:20px;

--shadow:
0 8px 24px rgba(0,0,0,.06);

}

body{

background:var(--bg);

color:var(--dark);

overflow-x:hidden;

padding-bottom:100px;

}

/* Scrollbar */

::-webkit-scrollbar{
width:8px;
}

::-webkit-scrollbar-thumb{
background:#E5E7EB;
border-radius:999px;
}

/* Sections */

.sectionHeading{

font-size:22px;

font-weight:900;

color:#111827;

margin-bottom:18px;

}

/* Buttons */

.primaryBtn{

height:52px;

padding:0 22px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-size:14px;

font-weight:900;

cursor:pointer;

}

/* Card */

.card{

background:#fff;

border-radius:24px;

box-shadow:var(--shadow);

}/* ===================================
HEADER
=================================== */

.hero{

position:sticky;

top:0;

z-index:9999;

background:#fff;

padding:16px;

box-shadow:
0 4px 20px rgba(0,0,0,.05);

}

.topBar{

display:flex;

justify-content:space-between;

align-items:center;

}

.brandName{

font-size:30px;

font-weight:900;

line-height:1;

letter-spacing:-1px;

color:#111827;

}

.deliveryTitle{

margin-top:4px;

font-size:14px;

font-weight:800;

color:#6B7280;

}

.address{

margin-top:8px;

display:flex;

align-items:center;

gap:6px;

cursor:pointer;

font-size:13px;

font-weight:800;

color:#16A34A;

}

.rightActions{

display:flex;

align-items:center;

gap:10px;

}

.loginBtn{

display:none;

height:48px;

padding:0 20px;

border:none;

border-radius:14px;

background:#16A34A;

color:#fff;

font-weight:900;

cursor:pointer;

}

.profileBtn{

width:48px;

height:48px;

border:none;

border-radius:14px;

background:#F3F4F6;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

cursor:pointer;

}

.searchWrap{

margin-top:14px;

}

.searchBar{

height:58px;

background:#F6F7FB;

border:1px solid #ECEFF3;

border-radius:18px;

display:flex;

align-items:center;

padding:0 16px;

}

.searchBar input{

flex:1;

border:none;

outline:none;

background:none;

padding-left:12px;

font-size:14px;

font-weight:600;

}

.searchIcon{

color:#16A34A;

font-size:18px;

}

@media(min-width:992px){

.loginBtn{
display:block;
}

.brandName{
font-size:34px;
}

}</style>

</head>

<body>

<!-- ===================================
HEADER
=================================== -->

<div class="hero">

<div class="topBar">

<div>

<div class="brandName">

QuickPress

</div>

<div class="deliveryTitle">

Express Delivery in 30 Minutes

</div>

<div
class="address"
onclick="openLocationModal()">

<span id="locationText">

Kasganj, Uttar Pradesh

</span>

<i class="fa-solid fa-angle-down"></i>

</div>

</div>

<div class="rightActions">

<button
id="desktopLoginBtn"
class="loginBtn">

Login

</button>

<button
class="profileBtn"
onclick="openProfile()">

<i class="fa-regular fa-user"></i>

</button>

</div>

</div>

<div class="searchWrap">

<div class="searchBar">

<i class="fa-solid fa-magnifying-glass searchIcon"></i>

<input
id="globalSearch"
type="text"
placeholder="Search Dry Cleaning, Steam Iron, Shoe Care">

</div>

</div>

</div><!-- ===================================
LOCATION MODAL
=================================== -->

<div
class="locationModal"
id="locationModal">

<div class="locationBox">

<div class="locationHeader">

<h3>

Select Location

</h3>

<button
class="closeLocation"
onclick="closeLocationModal()">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<button
class="detectBtn"
onclick="startLocationDetection()">

<i class="fa-solid fa-location-crosshairs"></i>

Detect My Location

</button>

<input
type="text"
class="locationSearch"
id="locationSearch"
placeholder="Search City">

<div
class="locationList"
id="locationList">

<div
class="locationItem"
onclick="selectCity('Kasganj')">

Kasganj

</div>

<div
class="locationItem"
onclick="selectCity('Etah')">

Etah

</div>

<div
class="locationItem"
onclick="selectCity('Aligarh')">

Aligarh

</div>

<div
class="locationItem"
onclick="selectCity('Noida')">

Noida

</div>

<div
class="locationItem"
onclick="selectCity('Delhi')">

Delhi

</div>

</div>

</div>

</div><!-- ===================================
PREMIUM CATEGORIES
=================================== -->

<section class="categorySection">

<div class="sectionTop">

<h2 class="sectionHeading">

Categories

</h2>

<button
class="viewAllBtn"
onclick="window.location.href='services.html'">

View All

</button>

</div>

<div
class="categorySlider"
id="categorySlider">

<div
class="categoryCard"
data-category="Dry Cleaning">

<div
class="categoryIcon dryBg">

<i class="fa-solid fa-shirt"></i>

</div>

<h4>Dry Cleaning</h4>

</div>

<div
class="categoryCard"
data-category="Wash & Fold">

<div
class="categoryIcon washBg">

<i class="fa-solid fa-soap"></i>

</div>

<h4>Wash & Fold</h4>

</div>

<div
class="categoryCard"
data-category="Steam Iron">

<div
class="categoryIcon ironBg">

<i class="fa-solid fa-fire-flame-curved"></i>

</div>

<h4>Steam Iron</h4>

</div>

<div
class="categoryCard"
data-category="Shoe Care">

<div
class="categoryIcon shoeBg">

<i class="fa-solid fa-shoe-prints"></i>

</div>

<h4>Shoe Care</h4>

</div>

<div
class="categoryCard"
data-category="Blanket Care">

<div
class="categoryIcon blanketBg">

<i class="fa-solid fa-bed"></i>

</div>

<h4>Blanket Care</h4>

</div>

<div
class="categoryCard"
data-category="Premium Care">

<div
class="categoryIcon premiumBg">

<i class="fa-solid fa-gem"></i>

</div>

<h4>Premium Care</h4>

</div>

</div>

</section>
