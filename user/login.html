<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPress Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#FFD633,
#FFF4B8
);

min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

}

.loginCard{

width:100%;
max-width:420px;

background:#fff;

padding:30px;

border-radius:34px;

box-shadow:
0 20px 40px rgba(0,0,0,.08);

}

.logo{

text-align:center;

font-size:34px;

font-weight:900;

}

.subText{

margin-top:10px;

text-align:center;

font-size:14px;

color:#6B7280;

line-height:1.8;

}

.inputGroup{

margin-top:25px;

}

.label{

font-size:13px;

font-weight:800;

margin-bottom:8px;

display:block;

}

.phoneBox{

height:58px;

display:flex;

align-items:center;

border:2px solid #E5E7EB;

border-radius:18px;

overflow:hidden;

}

.countryCode{

width:80px;

height:100%;

display:flex;

align-items:center;

justify-content:center;

font-weight:900;

background:#F9FAFB;

}

.phoneInput{

flex:1;

height:100%;

border:none;

outline:none;

padding:0 14px;

font-size:16px;

font-weight:700;

}

.sendOtpBtn{

width:100%;

height:58px;

margin-top:20px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

}

#recaptcha-container{

margin-top:18px;

}

.terms{

margin-top:18px;

text-align:center;

font-size:12px;

color:#6B7280;

line-height:1.8;

}

.watermark{

margin-top:20px;

text-align:center;

font-size:12px;

opacity:.7;

}

</style>

</head>

<body>

<div class="loginCard">

<div class="logo">

QuickPress

</div>

<div class="subText">

Laundry & Dry Cleaning Service

</div>

<div class="inputGroup">

<label class="label">

Mobile Number

</label>

<div class="phoneBox">

<div class="countryCode">

+91

</div>

<input
type="tel"
id="phoneNumber"
class="phoneInput"
placeholder="99999 99999">

</div>

</div>

<div id="recaptcha-container"></div>

<button
id="sendOtpBtn"
class="sendOtpBtn">

Send OTP

</button>

<div class="terms">

By continuing you agree to
Terms & Privacy Policy

</div>

<div class="watermark">

Made in Uttar Pradesh<br>
Crafted by Himanshu Baghel 💗

</div>

</div>

</body>
</html>
