<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPress Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#FFD633,
#FFF4B8
);

min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

padding:20px;

}

.loginCard{

width:100%;
max-width:420px;

background:#fff;

padding:30px;

border-radius:34px;

box-shadow:
0 20px 40px rgba(0,0,0,.08);

}

.logo{

text-align:center;

font-size:34px;

font-weight:900;

}

.subText{

margin-top:10px;

text-align:center;

font-size:14px;

color:#6B7280;

line-height:1.8;

}

.inputGroup{

margin-top:25px;

}

.label{

font-size:13px;

font-weight:800;

margin-bottom:8px;

display:block;

}

.phoneBox{

height:58px;

display:flex;

align-items:center;

border:2px solid #E5E7EB;

border-radius:18px;

overflow:hidden;

}

.countryCode{

width:80px;

height:100%;

display:flex;

align-items:center;

justify-content:center;

font-weight:900;

background:#F9FAFB;

}

.phoneInput{

flex:1;

height:100%;

border:none;

outline:none;

padding:0 14px;

font-size:16px;

font-weight:700;

}

.sendOtpBtn{

width:100%;

height:58px;

margin-top:20px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

}

#recaptcha-container{

margin-top:18px;

}

.terms{

margin-top:18px;

text-align:center;

font-size:12px;

color:#6B7280;

line-height:1.8;

}

.watermark{

margin-top:20px;

text-align:center;

font-size:12px;

opacity:.7;

}

</style>

</head>

<body>

<div class="loginCard">

<div class="logo">

QuickPress

</div>

<div class="subText">

Laundry & Dry Cleaning Service

</div>

<div class="inputGroup">

<label class="label">

Mobile Number

</label>

<div class="phoneBox">

<div class="countryCode">

+91

</div>

<input
type="tel"
id="phoneNumber"
class="phoneInput"
placeholder="99999 99999">

</div>

</div>

<div id="recaptcha-container"></div>

<button
id="sendOtpBtn"
class="sendOtpBtn">

Send OTP

</button>

<div class="terms">

By continuing you agree to
Terms & Privacy Policy

</div>

<div class="watermark">

Made in Uttar Pradesh<br>
Crafted by Himanshu Baghel 💗

</div>

</div>
  <!-- OTP SECTION -->

<div
id="otpSection"
style="
display:none;
margin-top:20px;
">

<label class="label">

Enter OTP

</label>

<input
type="text"
id="otpInput"
class="phoneInput"
style="
border:2px solid #E5E7EB;
border-radius:18px;
width:100%;
height:58px;
"
placeholder="Enter 6 Digit OTP">

<button
id="verifyOtpBtn"
class="sendOtpBtn">

Verify OTP

</button>

</div>

<script type="module">

import { auth, db }
from "./firebase.js";

import {

RecaptchaVerifier,
signInWithPhoneNumber,
onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {

doc,
getDoc,
setDoc,
serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* =========================================
AUTO LOGIN CHECK
========================================= */

onAuthStateChanged(

auth,

(user)=>{

if(user){

window.location.href =
"index.html";

}

});

/* =========================================
RECAPTCHA
========================================= */

window.recaptchaVerifier =

new RecaptchaVerifier(

auth,

"recaptcha-container",

{
size:"normal"
}

);

/* =========================================
SEND OTP
========================================= */

let confirmationResultGlobal;

document
.getElementById(
"sendOtpBtn"
)

.addEventListener(

"click",

async()=>{

const phone =

document
.getElementById(
"phoneNumber"
)

.value
.trim();

/* ========================================= */

if(phone.length !== 10){

alert(
"Enter Valid Mobile Number"
);

return;

}

/* ========================================= */

const fullPhone =
"+91" + phone;

/* ========================================= */

try{

const appVerifier =
window.recaptchaVerifier;

const confirmationResult =

await signInWithPhoneNumber(

auth,
fullPhone,
appVerifier

);

confirmationResultGlobal =
confirmationResult;

/* ========================================= */

document
.getElementById(
"otpSection"
)

.style.display =
"block";

alert(
"OTP Sent Successfully"
);

}catch(error){

console.error(error);

alert(
error.message
);

}

}

);

/* =========================================
VERIFY OTP
========================================= */

document
.getElementById(
"verifyOtpBtn"
)

.addEventListener(

"click",

async()=>{

const otp =

document
.getElementById(
"otpInput"
)

.value
.trim();

/* ========================================= */

if(!otp){

alert(
"Enter OTP"
);

return;

}

try{

const result =

await
confirmationResultGlobal.confirm(
otp
);

const user =
result.user;

/* =========================================
CHECK USER
========================================= */

const userRef =

doc(
db,
"users",
user.uid
);

const userSnap =

await getDoc(
userRef
);

/* =========================================
NEW USER
========================================= */

if(!userSnap.exists()){

await setDoc(

userRef,

{

uid:user.uid,

name:"",

phone:
user.phoneNumber,

email:"",

photo:"",

city:"",

walletBalance:0,

createdAt:
serverTimestamp()

}

);

}

/* ========================================= */

alert(
"Login Successful"
);

window.location.href =
"index.html";

}catch(error){

console.error(error);

alert(
"Invalid OTP"
);

}

}

);

</script>

</body>
</html>
