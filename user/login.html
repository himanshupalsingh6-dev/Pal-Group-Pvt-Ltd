<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Login

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{
--primary:#F4B400;
--secondary:#16A34A;
--dark:#111827;
--gray:#6B7280;
--bg:#F7F8FA;
}

body{

background:var(--bg);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.loginCard{

width:100%;

max-width:420px;

background:#fff;

padding:30px;

border-radius:28px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

.logo{

font-size:34px;

font-weight:900;

text-align:center;

margin-bottom:10px;

}

.logo span{

color:var(--primary);

}

.subtitle{

text-align:center;

font-size:13px;

color:#6B7280;

margin-bottom:30px;

}

.inputGroup{

margin-bottom:18px;

}

.inputGroup label{

display:block;

font-size:13px;

font-weight:700;

margin-bottom:8px;

}

.phoneInput{

display:flex;

align-items:center;

height:58px;

border:1px solid #E5E7EB;

border-radius:16px;

overflow:hidden;

}

.countryCode{

width:80px;

display:flex;

justify-content:center;

font-weight:800;

background:#F9FAFB;

height:100%;

align-items:center;

}

.phoneInput input{

flex:1;

border:none;

outline:none;

padding:0 16px;

font-size:16px;

}

.loginBtn{

width:100%;

height:56px;

border:none;

border-radius:16px;

background:var(--secondary);

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

}

#recaptcha-container{

margin-top:16px;

}

</style>

</head>

<body>

<div class="loginCard">

<div class="logo">

Quick<span>Press</span>

</div>

<div class="subtitle">

Premium Laundry Marketplace

</div>

<div class="inputGroup">

<label>

Mobile Number

</label>

<div class="phoneInput">

<div class="countryCode">

+91

</div>

<input
type="tel"
id="phoneNumber"
placeholder="9876543210">

</div>

</div>

<button
class="loginBtn"
onclick="sendOTP()">

Continue

</button>

<div id="recaptcha-container"></div>

</div><script type="module">

import { auth }
from "./firebase.js";

import {

RecaptchaVerifier,
signInWithPhoneNumber

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

window.recaptchaVerifier =

new RecaptchaVerifier(

auth,

"recaptcha-container",

{
size:"normal"
}

);

window.sendOTP =
async function(){

const phone =

document.getElementById(
"phoneNumber"
).value.trim();

if(phone.length !== 10){

alert(
"Enter valid mobile number"
);

return;

}

try{

const appVerifier =
window.recaptchaVerifier;

const confirmationResult =

await signInWithPhoneNumber(

auth,

"+91"+phone,

appVerifier

);

window.confirmationResult =
confirmationResult;

sessionStorage.setItem(
"loginPhone",
phone
);

window.location.href =
"otp.html";

}

catch(error){

console.error(error);

alert(
error.message
);

}

};

</script><!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Verify OTP

</title>

<style>

body{

font-family:Inter,sans-serif;

background:#F7F8FA;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

padding:20px;

}

.otpCard{

width:100%;

max-width:420px;

background:#fff;

padding:30px;

border-radius:28px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

h2{

font-size:28px;

font-weight:900;

}

p{

font-size:13px;

color:#6B7280;

margin-top:8px;

margin-bottom:20px;

}

#otpInput{

width:100%;

height:60px;

font-size:24px;

text-align:center;

letter-spacing:10px;

border:1px solid #E5E7EB;

border-radius:16px;

outline:none;

}

.verifyBtn{

width:100%;

height:56px;

margin-top:20px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-weight:900;

cursor:pointer;

}

</style>

</head>

<body>

<div class="otpCard">

<h2>

Verify OTP

</h2>

<p>

Enter 6 digit code

</p>

<input
id="otpInput"
maxlength="6">

<button
class="verifyBtn"
onclick="verifyOTP()">

Verify OTP

</button>

</div><script type="module">

import { auth }
from "./firebase.js";

import {

getFirestore,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const db =
getFirestore();

window.verifyOTP =
async function(){

const code =

document.getElementById(
"otpInput"
).value.trim();

if(code.length !== 6){

alert(
"Enter valid OTP"
);

return;

}

try{

const result =

await window.opener
?.confirmationResult
?.confirm(code)

||

await window.parent
?.confirmationResult
?.confirm(code);

const user =

result.user;

const userDoc =

await getDoc(

doc(
db,
"users",
user.uid
)

);

if(userDoc.exists()){

window.location.href =
"index.html";

}else{

window.location.href =
"signup.html";

}

}

catch(error){

console.error(error);

alert(
"Invalid OTP"
);

}

};

</script>
<script type="module">

import { auth }
from "./firebase.js";

import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

onAuthStateChanged(

auth,

(user)=>{

if(user){

window.location.href =
"index.html";

}

}

);

</script>

</body>
</html>
