<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress | Login

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;

--dark:#111827;
--light:#6B7280;

--bg:#F6F7FB;

}

body{

background:#F6F7FB;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.loginContainer{

width:100%;

max-width:420px;

}

.loginCard{

background:#fff;

border-radius:30px;

padding:30px 24px;

box-shadow:
0 12px 40px rgba(0,0,0,.08);

}

.logo{

font-size:34px;

font-weight:900;

color:#111827;

text-align:center;

}

.tagline{

margin-top:8px;

text-align:center;

font-size:14px;

line-height:1.7;

color:#6B7280;

}

.heroIcon{

width:90px;

height:90px;

margin:20px auto;

border-radius:50%;

background:#DCFCE7;

display:flex;

align-items:center;

justify-content:center;

font-size:42px;

color:#16A34A;

}

.sectionTitle{

text-align:center;

font-size:22px;

font-weight:900;

margin-bottom:6px;

}

.sectionText{

text-align:center;

font-size:13px;

line-height:1.7;

color:#6B7280;

margin-bottom:24px;

}

</style>

</head>

<body>

<div class="loginContainer">

<div class="loginCard">

<div class="logo">

QuickPress

</div>

<div class="tagline">

Premium Laundry & Dry Cleaning

</div>

<div class="heroIcon">

<i class="fa-solid fa-mobile-screen"></i>

</div>

<h2 class="sectionTitle">

Welcome Back

</h2>

<p class="sectionText">

Login with your mobile number to continue

</p><!-- ===================================
PHONE FORM
=================================== -->

<div
id="phoneLoginSection">

<div class="formGroup">

<label>

Mobile Number

</label>

<div class="phoneInput">

<span>

+91

</span>

<input
type="tel"
id="phoneNumber"
placeholder="9876543210"
maxlength="10">

</div>

</div>

<button
id="sendOtpBtn"
class="primaryBtn">

Send OTP

</button>

</div>

<style>

.formGroup{

margin-bottom:18px;

}

.formGroup label{

display:block;

margin-bottom:8px;

font-size:13px;

font-weight:800;

color:#111827;

}

.phoneInput{

height:56px;

border:1px solid #E5E7EB;

border-radius:16px;

display:flex;

align-items:center;

padding:0 16px;

gap:10px;

}

.phoneInput span{

font-weight:900;

}

.phoneInput input{

flex:1;

border:none;

outline:none;

font-size:15px;

}

.primaryBtn{

width:100%;

height:56px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

}

.primaryBtn:disabled{

opacity:.6;

cursor:not-allowed;

}

</style><!-- ===================================
OTP FORM
=================================== -->

<div
id="otpSection"
style="display:none;">

<div class="formGroup">

<label>

Enter OTP

</label>

<input
type="text"
id="otpCode"
class="otpInput"
placeholder="6 Digit OTP"
maxlength="6">

</div>

<button
id="verifyOtpBtn"
class="primaryBtn">

Verify OTP

</button>

<button
id="changeNumberBtn"
class="secondaryBtn">

Change Number

</button>

</div>

<!-- ===================================
RECAPTCHA
=================================== -->

<div id="recaptcha-container"></div>

<style>

.otpInput{

width:100%;

height:56px;

border:1px solid #E5E7EB;

border-radius:16px;

padding:0 16px;

font-size:18px;

font-weight:900;

text-align:center;

letter-spacing:4px;

outline:none;

}

.secondaryBtn{

width:100%;

height:52px;

margin-top:12px;

border:none;

border-radius:16px;

background:#F3F4F6;

color:#111827;

font-size:14px;

font-weight:900;

cursor:pointer;

}

</style><script type="module">

import { auth }
from "./firebase.js";

import {

RecaptchaVerifier,
signInWithPhoneNumber,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
GLOBALS
=================================== */

window.confirmationResult = null;

/* ===================================
RECAPTCHA
=================================== */

window.setupRecaptcha =
function(){

if(window.recaptchaVerifier){

return;

}

window.recaptchaVerifier =

new RecaptchaVerifier(

auth,

"recaptcha-container",

{

size:"invisible",

callback:()=>{}

}

);

};

setupRecaptcha();

</script><script type="module">

const sendOtpBtn =

document.getElementById(
"sendOtpBtn"
);

sendOtpBtn.addEventListener(

"click",

async()=>{

const phone =

document.getElementById(
"phoneNumber"
)

.value
.trim();

if(phone.length !== 10){

showToast(
"Enter Valid Mobile Number"
);

return;

}

sendOtpBtn.disabled = true;

sendOtpBtn.innerHTML =
"Sending OTP...";

try{

const fullPhone =

"+91" + phone;

const result =

await signInWithPhoneNumber(

auth,
fullPhone,
window.recaptchaVerifier

);

window.confirmationResult =
result;

document.getElementById(
"phoneLoginSection"
).style.display =
"none";

document.getElementById(
"otpSection"
).style.display =
"block";

showToast(
"OTP Sent Successfully"
);

}

catch(error){

console.log(error);

showToast(
error.message
);

sendOtpBtn.disabled = false;

sendOtpBtn.innerHTML =
"Send OTP";

}

}

);

/* ===================================
CHANGE NUMBER
=================================== */

document.getElementById(
"changeNumberBtn"
)

.addEventListener(

"click",

()=>{

document.getElementById(
"otpSection"
).style.display =
"none";

document.getElementById(
"phoneLoginSection"
).style.display =
"block";

}

);

</script><script type="module">

const verifyOtpBtn =

document.getElementById(
"verifyOtpBtn"
);

verifyOtpBtn.addEventListener(

"click",

async()=>{

const otp =

document.getElementById(
"otpCode"
)

.value
.trim();

if(otp.length !== 6){

showToast(
"Enter 6 Digit OTP"
);

return;

}

verifyOtpBtn.disabled = true;

verifyOtpBtn.innerHTML =
"Verifying...";

try{

await window
.confirmationResult
.confirm(otp);

showToast(
"Login Successful"
);

setTimeout(()=>{

window.location.href =
"index.html";

},1000);

}

catch(error){

console.log(error);

showToast(
"Invalid OTP"
);

verifyOtpBtn.disabled = false;

verifyOtpBtn.innerHTML =
"Verify OTP";

}

}

);

</script><script type="module">

onAuthStateChanged(

auth,

(user)=>{

if(user){

window.location.href =
"index.html";

}

}

);

</script><div
id="loginToast"
class="loginToast">

Success

</div>

<style>

.loginToast{

position:fixed;

left:50%;

bottom:30px;

transform:
translateX(-50%);

background:#111827;

color:#fff;

padding:14px 20px;

border-radius:14px;

font-size:13px;

font-weight:700;

opacity:0;

visibility:hidden;

transition:.3s;

z-index:99999;

}

.loginToast.show{

opacity:1;

visibility:visible;

}

</style>

<script>

window.showToast =
function(message){

const toast =

document.getElementById(
"loginToast"
);

toast.innerHTML =
message;

toast.classList.add(
"show"
);

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2500);

};

console.log(
"QuickPress Login Ready"
);

</script>

</div>

</div>

</body>

</html>
