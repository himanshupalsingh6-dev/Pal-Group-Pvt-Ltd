<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Success - QuickPress</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{
--green:#16A34A;
--yellow:#F4B400;
--dark:#111827;
--gray:#6B7280;
--bg:#F8FAFC;
}

body{

background:var(--bg);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.successCard{

background:white;

width:100%;

max-width:500px;

padding:35px 25px;

border-radius:30px;

text-align:center;

box-shadow:
0 15px 40px rgba(0,0,0,.08);

}

/* Success Circle */

.successCircle{

width:120px;
height:120px;

margin:auto;

border-radius:50%;

background:#ECFDF5;

display:flex;

align-items:center;

justify-content:center;

font-size:55px;

animation:pop .6s ease;

}

@keyframes pop{

0%{
transform:scale(.5);
opacity:0;
}

100%{
transform:scale(1);
opacity:1;
}

}

.title{

font-size:32px;

font-weight:900;

margin-top:24px;

color:var(--dark);

}

.subtitle{

margin-top:10px;

font-size:15px;

line-height:1.7;

color:var(--gray);

}

/* Order Box */

.orderBox{

margin-top:25px;

padding:18px;

border-radius:18px;

background:#F8FAFC;

}

.orderLabel{

font-size:12px;

color:var(--gray);

font-weight:700;

}

.orderId{

font-size:22px;

font-weight:900;

margin-top:8px;

color:var(--dark);

}

.status{

margin-top:12px;

display:inline-block;

padding:8px 14px;

border-radius:999px;

background:#ECFDF5;

color:#16A34A;

font-size:12px;

font-weight:900;

}

/* Buttons */

.btn{

width:100%;

height:58px;

border:none;

border-radius:18px;

font-size:16px;

font-weight:900;

cursor:pointer;

margin-top:14px;

}

.primaryBtn{

background:#16A34A;

color:white;

}

.secondaryBtn{

background:#F3F4F6;

color:#111827;

}

.continueBtn{

background:#F4B400;

color:#111827;

}

.note{

margin-top:20px;

font-size:13px;

color:var(--gray);

line-height:1.6;

}

</style>

</head>

<body>

<div class="successCard">

<div class="successCircle">

✅

</div>

<div class="title">

Order Confirmed

</div>

<div class="subtitle">

Your laundry order has been placed successfully.

We will contact you soon for pickup.

</div>

<div class="orderBox">

<div class="orderLabel">

ORDER ID

</div>

<div
id="orderId"
class="orderId">

QP000000

</div>

<div
id="paymentStatus"
class="status">

Order Received

</div>

</div>

<button
class="btn primaryBtn"
onclick="trackOrder()">

Track Order

</button>

<button
class="btn secondaryBtn"
onclick="viewOrders()">

View My Orders

</button>

<button
class="btn continueBtn"
onclick="continueShopping()">

Continue Shopping

</button>

<div class="note">

Pickup partner will be assigned shortly.

You can track your order status anytime.

</div>

</div>

<script>

/* GET ORDER ID */

const params =

new URLSearchParams(
window.location.search
);

const orderId =

params.get(
"orderId"
)

||

"QP000000";

document.getElementById(
"orderId"
).innerText =
orderId;

/* ACTIONS */

function trackOrder(){

window.location.href =

"orders.html?orderId="

+ orderId;

}

function viewOrders(){

window.location.href =

"orders.html";

}

function continueShopping(){

window.location.href =

"index.html";

}

</script>

</body>
</html>
