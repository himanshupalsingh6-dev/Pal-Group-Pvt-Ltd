<style>

body{

.hero{

padding:16px;

}

.brandName{

}

.pageTitle{

margin-top:4px;
}

.section{
padding:16px;
}

.addressCard{

padding:18px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.addressType{

font-size:15px;

.addressText{

}

.addressActions{

margin-top:14px;

}

.actionBtn{

border-radius:12px;

font-size:12px;

}

.editBtn{

background:#16A34A;

}

.deleteBtn{

}

.defaultBadge{

display:inline-block;

padding:4px 10px;

}

.addAddressBtn{

position:fixed;

right:20px;

bottom:95px;

width:60px;

height:60px;

border:none;

border-radius:50%;

background:#16A34A;

color:#fff;

font-size:24px;

cursor:pointer;

box-shadow:
0 10px 25px rgba(22,163,74,.3);

}

</style>

</head>

<body>

<div class="hero">

<div class="brandName">

QuickPress

</div>

<div class="pageTitle">

Saved Addresses

</div>

</div>

<section class="section">

<div id="addressesContainer">

</div>

</section>

<button
class="addAddressBtn"
onclick="openAddressModal()">

+

</button><!-- ===================================
ADDRESS MODAL
=================================== -->

<div
class="addressModal"
id="addressModal">

<div class="modalBox">

<h2>

Add Address

</h2>

<div class="formGroup">

<input
type="text"
id="addressType"
placeholder="Home / Office">

</div>

<div class="formGroup">

<input
type="text"
id="addressName"
placeholder="Address Title">

</div>

<div class="formGroup">

<textarea
id="addressText"
placeholder="Complete Address">

</textarea>

</div>

<div class="formGroup">

<input
type="text"
id="addressPincode"
placeholder="Pincode">

</div>

<div class="modalActions">

<button
class="cancelBtn"
onclick="closeAddressModal()">

Cancel

</button>

<button
class="saveBtn"
onclick="saveAddress()">

Save

</button>

</div>

</div>

</div>

<style>

.addressModal{

display:none;

position:fixed;

inset:0;

background:
rgba(0,0,0,.5);

z-index:99999;

justify-content:center;

align-items:center;

}

.modalBox{

width:92%;

max-width:500px;

background:#fff;

padding:24px;

border-radius:24px;

}

.modalBox h2{

margin-bottom:18px;

font-size:22px;

font-weight:900;

}

.formGroup{

margin-bottom:14px;

}

.formGroup input,
.formGroup textarea{

width:100%;

border:1px solid #E5E7EB;

border-radius:14px;

padding:14px;

outline:none;

}

.formGroup textarea{

height:100px;

resize:none;

}

.modalActions{

display:flex;

gap:10px;

margin-top:10px;

}

.cancelBtn,
.saveBtn{

flex:1;

height:50px;

border:none;

border-radius:14px;

font-weight:900;

cursor:pointer;

}

.cancelBtn{

background:#F3F4F6;

}

.saveBtn{

background:#16A34A;

color:#fff;

}

</style><script>

let editIndex = -1;

/* ===================================
OPEN MODAL
=================================== */

window.openAddressModal =
function(){

editIndex = -1;

document.getElementById(
"addressModal"
).style.display =
"flex";

};

/* ===================================
CLOSE MODAL
=================================== */

window.closeAddressModal =
function(){

document.getElementById(
"addressModal"
).style.display =
"none";

};

/* ===================================
GET ADDRESSES
=================================== */

function getAddresses(){

return JSON.parse(

localStorage.getItem(
"addresses"
)

|| "[]"

);

}

/* ===================================
SAVE ADDRESS
=================================== */

window.saveAddress =
function(){

const address = {

type:

document.getElementById(
"addressType"
).value,

title:

document.getElementById(
"addressName"
).value,

address:

document.getElementById(
"addressText"
).value,

pincode:

document.getElementById(
"addressPincode"
).value,

isDefault:false

};

let addresses =
getAddresses();

if(editIndex > -1){

addresses[editIndex] =
address;

}else{

addresses.push(
address
);

}

localStorage.setItem(

"addresses",

JSON.stringify(
addresses
)

);

closeAddressModal();

renderAddresses();

};

/* ===================================
DELETE
=================================== */

window.deleteAddress =
function(index){

let addresses =
getAddresses();

addresses.splice(index,1);

localStorage.setItem(

"addresses",

JSON.stringify(
addresses
)

);

renderAddresses();

};

</script><script>

/* ===================================
DEFAULT ADDRESS
=================================== */

window.setDefaultAddress =
function(index){

let addresses =
getAddresses();

addresses.forEach(item=>{

item.isDefault = false;

});

addresses[index].isDefault = true;

localStorage.setItem(

"addresses",

JSON.stringify(
addresses
)

);

renderAddresses();

};

/* ===================================
EDIT ADDRESS
=================================== */

window.editAddress =
function(index){

const addresses =
getAddresses();

const address =
addresses[index];

editIndex = index;

document.getElementById(
"addressType"
).value =
address.type;

document.getElementById(
"addressName"
).value =
address.title;

document.getElementById(
"addressText"
).value =
address.address;

document.getElementById(
"addressPincode"
).value =
address.pincode;

document.getElementById(
"addressModal"
).style.display =
"flex";

};

/* ===================================
RENDER
=================================== */

window.renderAddresses =
function(){

const container =

document.getElementById(
"addressesContainer"
);

const addresses =
getAddresses();

if(addresses.length===0){

container.innerHTML =

`

<div class="addressCard">

No Address Found

</div>

`;

return;

}

let html = "";

addresses.forEach(

(address,index)=>{

html += `

<div class="addressCard">

<div class="addressType">

${address.type}

</div>

<div class="addressText">

${address.address}

</div>

${
address.isDefault

?

'<div class="defaultBadge">Default</div>'

:

''

}

<div class="addressActions">

<button
class="actionBtn editBtn"
onclick="editAddress(${index})">

Edit

</button>

<button
class="actionBtn deleteBtn"
onclick="deleteAddress(${index})">

Delete

</button>

</div>

<button
style="
width:100%;
margin-top:10px;
height:40px;
border:none;
border-radius:12px;
font-weight:800;
cursor:pointer;
background:#F4B400;
"

onclick="setDefaultAddress(${index})">

Set Default

</button>

</div>

`;

}

);

container.innerHTML = html;

};

/* ===================================
INIT
=================================== */

renderAddresses();

</script><!-- ===================================
TOAST
=================================== -->

<div
id="addressToast"
class="addressToast">

Success

</div>

<!-- ===================================
BOTTOM NAVBAR
=================================== -->

<nav class="bottomNav">

<button
class="navItem"
onclick="window.location.href='index.html'">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</button>

<button

id="navCartBadge">

0

</div>

</button>

<button

<button

<style>

/* ===================================
TOAST
=================================== */

.addressToast{

position:fixed;

left:50%;

bottom:100px;

transform:
translateX(-50%);

background:#111827;

color:#fff;

padding:14px 20px;

border-radius:14px;

font-size:13px;

font-weight:700;

opacity:0;

visibility:hidden;

transition:.3s;

z-index:99999;

}

.addressToast.show{

opacity:1;

visibility:visible;

}

/* ===================================
BOTTOM NAVBAR
=================================== */

.bottomNav{

position:fixed;

left:0;
right:0;
bottom:0;

height:74px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -8px 24px rgba(0,0,0,.08);

z-index:9999;

}

.navItem{

position:relative;

flex:1;

height:100%;

border:none;

background:none;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:4px;

font-size:11px;

font-weight:700;

color:#6B7280;

cursor:pointer;

}

.navItem i{

font-size:18px;

}

.activeNav{

color:#16A34A;

}

.navCartBadge{

position:absolute;

top:10px;

right:22px;

min-width:18px;

height:18px;

padding:0 4px;

border-radius:999px;

background:#EF4444;

color:#fff;

display:flex;

align-items:center;

justify-content:center;

font-size:10px;

font-weight:900;

}

@media(min-width:1200px){

.bottomNav{

max-width:650px;

left:50%;

transform:
translateX(-50%);

border-radius:24px 24px 0 0;

}

}

</style>

<script>

/* ===================================
TOAST
=================================== */

window.showAddressToast =
function(message){

const toast =

document.getElementById(
"addressToast"
);

toast.innerHTML =
message;

toast.classList.add(
"show"
);

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2000);

};

/* ===================================
CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

let total = 0;

cart.forEach(item=>{

total +=

item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

/* ===================================
APP READY
=================================== */

document.addEventListener(

"DOMContentLoaded",

()=>{

updateNavbarCartCount();

console.log(
"QuickPress Addresses Ready"
);

}

);

</script>

</body>
