<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saved Addresses</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
padding-bottom:120px;
}

.header{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:24px;

border-bottom-left-radius:34px;
border-bottom-right-radius:34px;

}

.header h1{

font-size:30px;
font-weight:900;

}

.header p{

margin-top:6px;

font-size:13px;
font-weight:700;

color:#374151;

}

.addressesWrap{

padding:16px;

}

.addressCard{

background:#fff;

padding:20px;

border-radius:24px;

margin-bottom:14px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.addressTop{

display:flex;

justify-content:space-between;
align-items:center;

}

.addressTag{

padding:6px 12px;

border-radius:999px;

background:#DCFCE7;

color:#166534;

font-size:11px;

font-weight:900;

}

.defaultBadge{

padding:6px 12px;

border-radius:999px;

background:#FEF3C7;

color:#92400E;

font-size:11px;

font-weight:900;

}

.addressName{

margin-top:12px;

font-size:17px;

font-weight:900;

}

.addressText{

margin-top:8px;

font-size:13px;

line-height:1.8;

color:#6B7280;

}

.addressActions{

margin-top:16px;

display:flex;

gap:10px;

}

.actionBtn{

flex:1;

height:44px;

border:none;

border-radius:14px;

font-size:13px;

font-weight:900;

cursor:pointer;

}

.editBtn{

background:#2563EB;
color:#fff;

}

.deleteBtn{

background:#DC2626;
color:#fff;

}

.addAddressBtn{

position:fixed;

left:16px;
right:16px;
bottom:20px;

height:58px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

}

</style>
</head>

<body>

<div class="header">

<h1>
Saved Addresses
</h1>

<p>
Manage pickup & delivery locations
</p>

</div>

<div
class="addressesWrap"
id="addressesContainer">

<!-- Firebase Addresses -->

<div class="addressCard">

<div class="addressTop">

<div class="addressTag">

🏠 Home

</div>

<div class="defaultBadge">

Default

</div>

</div>

<div class="addressName">

Home Address

</div>

<div class="addressText">

Near Bus Stand,
Kasganj,
Uttar Pradesh

</div>

<div class="addressActions">

<button class="actionBtn editBtn">

Edit

</button>

<button class="actionBtn deleteBtn">

Delete

</button>

</div>

</div>

</div>

<button
class="addAddressBtn"
id="addAddressBtn">

+ Add New Address

</button>
<!-- =========================================
BOTTOM NAVIGATION
========================================= -->

<div class="bottomNav">

<button
class="navItem"
onclick="location.href='index.html'">

🏠
<span>Home</span>

</button>

<button
class="navItem"
onclick="location.href='orders.html'">

📦
<span>Orders</span>

</button>

<button
class="navItem"
onclick="location.href='wallet.html'">

💰
<span>Wallet</span>

</button>

<button
class="navItem"
onclick="location.href='profile.html'">

👤
<span>Profile</span>

</button>

</div>

<style>

.bottomNav{

position:fixed;

left:0;
right:0;
bottom:0;

height:76px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -8px 20px rgba(0,0,0,.08);

z-index:999;

}

.navItem{

flex:1;

height:100%;

border:none;

background:none;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:4px;

font-size:11px;

font-weight:700;

cursor:pointer;

color:#6B7280;

}

</style>

<script type="module">

import { db, auth }
from "./firebase.js";

import {
collection,
addDoc,
deleteDoc,
doc,
query,
where,
onSnapshot,
updateDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* =========================================
GLOBAL
========================================= */

let currentUser = null;

/* =========================================
LOGIN CHECK
========================================= */

onAuthStateChanged(

auth,

(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

currentUser = user;

loadAddresses();

}

);

/* =========================================
LOAD ADDRESSES
========================================= */

function loadAddresses(){

const q = query(

collection(
db,
"addresses"
),

where(
"userId",
"==",
currentUser.uid
)

);

onSnapshot(

q,

(snapshot)=>{

const container =

document.getElementById(
"addressesContainer"
);

container.innerHTML = "";

/* ========================================= */

snapshot.forEach(docSnap=>{

const address =
docSnap.data();

const addressId =
docSnap.id;

/* ========================================= */

container.innerHTML +=

`

<div class="addressCard">

<div class="addressTop">

<div class="addressTag">

${address.tag}

</div>

${address.isDefault ?

`
<div class="defaultBadge">

Default

</div>
`

: ""}

</div>

<div class="addressName">

${address.name}

</div>

<div class="addressText">

${address.address}

<br>

${address.city}

</div>

<div class="addressActions">

<button
class="actionBtn editBtn"
onclick="setDefaultAddress('${addressId}')">

Default

</button>

<button
class="actionBtn deleteBtn"
onclick="deleteAddress('${addressId}')">

Delete

</button>

</div>

</div>

`;

});

/* ========================================= */

if(
container.innerHTML === ""
){

container.innerHTML =

`

<div
style="
text-align:center;
padding:50px;
color:#6B7280;
">

📍

<h3 style="margin-top:15px;">

No Saved Address

</h3>

</div>

`;

}

}

);

}

/* =========================================
ADD ADDRESS
========================================= */

document
.getElementById(
"addAddressBtn"
)

.addEventListener(

"click",

async()=>{

const name =
prompt(
"Address Name"
);

if(!name)
return;

const address =
prompt(
"Full Address"
);

if(!address)
return;

const tag =
prompt(
"Tag: Home / Office"
)
||
"Home";

/* =========================================
GPS
========================================= */

navigator.geolocation.getCurrentPosition(

async(position)=>{

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

/* ========================================= */

await addDoc(

collection(
db,
"addresses"
),

{

userId:
currentUser.uid,

name,

address,

tag,

city:
localStorage.getItem(
"userCity"
)
||
"Kasganj",

lat,

lng,

isDefault:false,

createdAt:
serverTimestamp()

}

);

alert(
"Address Added"
);

}

);

}

);

/* =========================================
DELETE
========================================= */

window.deleteAddress =
async(id)=>{

const confirmDelete =
confirm(
"Delete Address?"
);

if(!confirmDelete)
return;

await deleteDoc(

doc(
db,
"addresses",
id
)

);

};

/* =========================================
SET DEFAULT
========================================= */

window.setDefaultAddress =
async(id)=>{

const q = query(

collection(
db,
"addresses"
),

where(
"userId",
"==",
currentUser.uid
)

);

onSnapshot(

q,

async(snapshot)=>{

for(const d of snapshot.docs){

await updateDoc(

doc(
db,
"addresses",
d.id
),

{
isDefault:false
}

);

}

await updateDoc(

doc(
db,
"addresses",
id
),

{
isDefault:true
}

);

}

);

};

</script>

</body>
</html>
