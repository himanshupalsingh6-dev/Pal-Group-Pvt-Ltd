<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Saved Addresses - QuickPress

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--yellow:#F4B400;
--green:#16A34A;
--dark:#111827;
--gray:#6B7280;
--bg:#F8FAFC;

}

body{

background:var(--bg);

padding-bottom:120px;

}

/* HEADER */

.header{

position:sticky;

top:0;

background:white;

padding:16px;

display:flex;

align-items:center;

justify-content:space-between;

box-shadow:
0 4px 15px rgba(0,0,0,.05);

z-index:999;

}

.headerLeft{

display:flex;

align-items:center;

gap:14px;

}

.backBtn{

width:46px;
height:46px;

border:none;

border-radius:14px;

background:#F3F4F6;

font-size:18px;

cursor:pointer;

}

.pageTitle{

font-size:24px;

font-weight:900;

color:#111827;

}

/* ADDRESS LIST */

.addressContainer{

padding:16px;

}

/* ADDRESS CARD */

.addressCard{

background:white;

border-radius:24px;

padding:18px;

margin-bottom:16px;

box-shadow:
0 6px 20px rgba(0,0,0,.05);

}

.addressTop{

display:flex;

justify-content:space-between;

align-items:center;

}

.addressType{

font-size:18px;

font-weight:900;

color:#111827;

}

.defaultBadge{

padding:6px 12px;

border-radius:999px;

background:#DCFCE7;

color:#16A34A;

font-size:11px;

font-weight:900;

}

.addressText{

margin-top:12px;

font-size:14px;

line-height:1.7;

color:#6B7280;

}

/* ACTIONS */

.addressActions{

display:flex;

gap:10px;

margin-top:16px;

}

.editBtn{

flex:1;

height:48px;

border:none;

border-radius:14px;

background:#F3F4F6;

font-weight:800;

cursor:pointer;

}

.deleteBtn{

width:100px;

height:48px;

border:none;

border-radius:14px;

background:#FEE2E2;

color:#DC2626;

font-weight:800;

cursor:pointer;

}

/* ADD BUTTON */

.addAddressBtn{

position:fixed;

left:16px;
right:16px;
bottom:20px;

height:60px;

border:none;

border-radius:18px;

background:#16A34A;

color:white;

font-size:16px;

font-weight:900;

box-shadow:
0 10px 25px rgba(22,163,74,.25);

cursor:pointer;

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

<div class="headerLeft">

<button
class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="pageTitle">

Saved Addresses

</div>

</div>

</header>

<!-- ADDRESS LIST -->

<div
id="addressContainer"
class="addressContainer">

<!-- HOME -->

<div class="addressCard">

<div class="addressTop">

<div class="addressType">

🏠 Home

</div>

<div class="defaultBadge">

DEFAULT

</div>

</div>

<div class="addressText">

Kasganj, Uttar Pradesh<br>
Near Main Market Road

</div>

<div class="addressActions">

<button class="editBtn">

Edit

</button>

<button class="deleteBtn">

Delete

</button>

</div>

</div>

<!-- WORK -->

<div class="addressCard">

<div class="addressTop">

<div class="addressType">

🏢 Work

</div>

</div>

<div class="addressText">

Office Area, Kasganj<br>
Uttar Pradesh

</div>

<div class="addressActions">

<button class="editBtn">

Edit

</button>

<button class="deleteBtn">

Delete

</button>

</div>

</div>

</div>

<!-- ADD ADDRESS -->

<button
class="addAddressBtn"
onclick="openAddressModal()">

+ Add New Address

</button><!-- ==========================================
ADD / EDIT ADDRESS MODAL
========================================== -->

<div
id="addressModal"
class="addressModal">

<div class="modalContent">

<div class="modalHeader">

<h2 id="modalTitle">

Add Address

</h2>

<button
class="closeModalBtn"
onclick="closeAddressModal()">

✕

</button>

</div>

<div class="formGroup">

<label>

Address Type

</label>

<select
id="addressType"
class="inputField">

<option value="Home">

🏠 Home

</option>

<option value="Work">

🏢 Work

</option>

<option value="Other">

📍 Other

</option>

</select>

</div>

<div class="formGroup">

<label>

Full Address

</label>

<textarea
id="fullAddress"
class="textareaField"
placeholder="Enter complete address"></textarea>

</div>

<div class="formGroup">

<label>

Landmark

</label>

<input
type="text"
id="landmark"
class="inputField"
placeholder="Near Main Market">

</div>

<div class="formGroup">

<label>

City

</label>

<input
type="text"
id="city"
class="inputField"
placeholder="Kasganj">

</div>

<div class="formGroup">

<label>

State

</label>

<input
type="text"
id="state"
class="inputField"
placeholder="Uttar Pradesh">

</div>

<button
class="locationBtn"
onclick="getCurrentLocation()">

📍 Use Current Location

</button>

<div class="checkboxRow">

<input
type="checkbox"
id="defaultAddress">

<label>

Set as Default Address

</label>

</div>

<button
class="saveAddressBtn"
onclick="saveAddress()">

Save Address

</button>

</div>

</div>

<style>

/* ==========================================
MODAL
========================================== */

.addressModal{

position:fixed;

inset:0;

background:
rgba(0,0,0,.55);

display:none;

align-items:flex-end;

justify-content:center;

z-index:999999;

}

.modalContent{

width:100%;

max-width:650px;

background:white;

border-radius:30px 30px 0 0;

padding:24px;

max-height:90vh;

overflow:auto;

animation:slideUp .25s ease;

}

@keyframes slideUp{

from{

transform:
translateY(100%);

}

to{

transform:
translateY(0);

}

}

.modalHeader{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.modalHeader h2{

font-size:24px;

font-weight:900;

}

.closeModalBtn{

width:42px;
height:42px;

border:none;

border-radius:12px;

background:#F3F4F6;

cursor:pointer;

font-size:18px;

}

/* ==========================================
FORM
========================================== */

.formGroup{

margin-bottom:16px;

}

.formGroup label{

display:block;

margin-bottom:8px;

font-size:13px;

font-weight:800;

color:#111827;

}

.inputField{

width:100%;

height:54px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:0 14px;

font-size:14px;

outline:none;

}

.textareaField{

width:100%;

height:100px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:14px;

font-size:14px;

outline:none;

resize:none;

}

.locationBtn{

width:100%;

height:52px;

border:none;

border-radius:14px;

background:#F4B400;

font-weight:900;

margin-top:6px;

cursor:pointer;

}

.checkboxRow{

display:flex;

align-items:center;

gap:10px;

margin-top:16px;

font-size:14px;

font-weight:700;

}

.saveAddressBtn{

width:100%;

height:56px;

border:none;

border-radius:16px;

background:#16A34A;

color:white;

font-size:16px;

font-weight:900;

margin-top:20px;

cursor:pointer;

}

</style>

<script>

/* ==========================================
OPEN MODAL
========================================== */

window.openAddressModal =
function(){

document.getElementById(
"addressModal"
).style.display =
"flex";

};

/* ==========================================
CLOSE MODAL
========================================== */

window.closeAddressModal =
function(){

document.getElementById(
"addressModal"
).style.display =
"none";

};

/* ==========================================
CURRENT LOCATION
========================================== */

window.getCurrentLocation =
function(){

if(!navigator.geolocation){

alert(
"Location Not Supported"
);

return;

}

navigator.geolocation.getCurrentPosition(

(position)=>{

alert(
"Location Captured Successfully"
);

console.log(

position.coords.latitude,

position.coords.longitude

);

},

()=>{

alert(
"Unable To Get Location"
);

}

);

};

</script><script type="module">

import { auth, db }
from "../js/firebase.js";

import {

collection,
doc,
setDoc,
getDocs,
deleteDoc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ==========================================
GLOBAL
========================================== */

let currentUser = null;
let editingAddressId = null;

/* ==========================================
LOGIN PROTECTION
========================================== */

auth.onAuthStateChanged(

(user)=>{

if(!user){

window.location.href =
"auth.html";

return;

}

currentUser = user;

loadAddresses();

}

);

/* ==========================================
LOAD ADDRESSES
========================================== */

window.loadAddresses =
async function(){

if(!currentUser) return;

const container =

document.getElementById(
"addressContainer"
);

container.innerHTML = "";

try{

const snapshot =
await getDocs(

collection(
db,
"users",
currentUser.uid,
"addresses"
)

);

if(snapshot.empty){

container.innerHTML = `

<div class="addressCard">

<div class="addressType">

📍 No Address Found

</div>

<div class="addressText">

Add your first address to continue

</div>

</div>

`;

return;

}

snapshot.forEach(docSnap=>{

const data =
docSnap.data();

container.innerHTML += `

<div class="addressCard">

<div class="addressTop">

<div class="addressType">

${getAddressIcon(
data.type
)} ${data.type}

</div>

${data.default ? `

<div class="defaultBadge">

DEFAULT

</div>

` : ""}

</div>

<div class="addressText">

${data.address}<br>

${data.landmark}<br>

${data.city},
${data.state}

</div>

<div class="addressActions">

<button
class="editBtn"
onclick="editAddress('${docSnap.id}')">

Edit

</button>

<button
class="deleteBtn"
onclick="deleteAddress('${docSnap.id}')">

Delete

</button>

</div>

</div>

`;

});

}catch(error){

console.error(error);

alert(
"Failed To Load Addresses"
);

}

};

/* ==========================================
ICON
========================================== */

window.getAddressIcon =
function(type){

if(type==="Home")
return "🏠";

if(type==="Work")
return "🏢";

return "📍";

};

/* ==========================================
SAVE ADDRESS
========================================== */

window.saveAddress =
async function(){

if(!currentUser) return;

const type =

document.getElementById(
"addressType"
).value;

const address =

document.getElementById(
"fullAddress"
).value.trim();

const landmark =

document.getElementById(
"landmark"
).value.trim();

const city =

document.getElementById(
"city"
).value.trim();

const state =

document.getElementById(
"state"
).value.trim();

const isDefault =

document.getElementById(
"defaultAddress"
).checked;

if(!address){

alert(
"Please Enter Address"
);

return;

}

try{

const addressId =

editingAddressId

||

"ADDR_" +
Date.now();

if(isDefault){

const all =
await getDocs(

collection(
db,
"users",
currentUser.uid,
"addresses"
)

);

for(const item of all.docs){

await updateDoc(

item.ref,

{

default:false

}

);

}

}

await setDoc(

doc(
db,
"users",
currentUser.uid,
"addresses",
addressId
),

{

type,
address,
landmark,
city,
state,

default:isDefault,

createdAt:
Date.now()

},

{merge:true}

);

closeAddressModal();

editingAddressId =
null;

loadAddresses();

alert(
"Address Saved"
);

}catch(error){

console.error(error);

alert(
"Failed To Save"
);

}

};

/* ==========================================
EDIT ADDRESS
========================================== */

window.editAddress =
async function(addressId){

editingAddressId =
addressId;

try{

const snapshot =
await getDocs(

collection(
db,
"users",
currentUser.uid,
"addresses"
)

);

snapshot.forEach(docSnap=>{

if(docSnap.id===addressId){

const data =
docSnap.data();

document.getElementById(
"addressType"
).value =
data.type;

document.getElementById(
"fullAddress"
).value =
data.address;

document.getElementById(
"landmark"
).value =
data.landmark;

document.getElementById(
"city"
).value =
data.city;

document.getElementById(
"state"
).value =
data.state;

document.getElementById(
"defaultAddress"
).checked =
data.default || false;

openAddressModal();

}

});

}catch(error){

console.error(error);

}

};

/* ==========================================
DELETE
========================================== */

window.deleteAddress =
async function(addressId){

const confirmDelete =
confirm(
"Delete Address?"
);

if(!confirmDelete)
return;

try{

await deleteDoc(

doc(
db,
"users",
currentUser.uid,
"addresses",
addressId
)

);

loadAddresses();

}catch(error){

console.error(error);

}

};

/* ==========================================
SELECT FOR CHECKOUT
========================================== */

window.selectAddress =
function(address){

localStorage.setItem(

"qp_selected_address",

JSON.stringify(
address
)

);

window.location.href =
"checkout.html";

};

</script>
