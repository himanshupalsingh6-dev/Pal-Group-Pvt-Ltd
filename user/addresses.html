<script type="module">

import { auth, db }
from "./firebase.js";

import {
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
query,
where
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
SAVE ADDRESS
=================================== */

window.saveAddress =
async function(){

try{

const user = auth.currentUser;

if(!user){

alert(
"Please login first"
);

return;

}

const fullName =

document.getElementById(
"addressName"
).value.trim();

const phone =

document.getElementById(
"addressPhone"
).value.trim();

const houseNo =

document.getElementById(
"houseNumber"
).value.trim();

const address =

document.getElementById(
"fullAddress"
).value.trim();

const city =

document.getElementById(
"city"
).value;

if(
!fullName ||
!phone ||
!houseNo ||
!address
){

alert(
"Please fill all fields"
);

return;

}

await addDoc(

collection(
db,
"addresses"
),

{

userId:user.uid,

fullName,

phone,

houseNo,

address,

city,

type:selectedType,

isDefault:false,

createdAt:
Date.now()

}

);

closeAddressModal();

loadAddresses();

alert(
"Address Saved ✅"
);

}
catch(error){

console.error(error);

alert(
"Failed to save address"
);

}

};

/* ===================================
LOAD ADDRESSES
=================================== */

window.loadAddresses =
async function(){

try{

const user = auth.currentUser;

if(!user) return;

const q = query(

collection(
db,
"addresses"
),

where(
"userId",
"==",
user.uid
)

);

const snapshot =
await getDocs(q);

const container =

document.getElementById(
"addressContainer"
);

container.innerHTML = "";

snapshot.forEach(docSnap=>{

const data =
docSnap.data();

container.innerHTML +=

`

<div class="addressCard">

<div class="addressTop">

<div>

<div class="addressType">

${data.type}

${data.isDefault
? '<span class="defaultBadge">Default</span>'
: ''
}

</div>

<div class="addressName">

${data.fullName}

</div>

</div>

<div class="addressActions">

<button
onclick="setDefaultAddress('${docSnap.id}')">

<i class="fa-solid fa-star"></i>

</button>

<button
onclick="deleteAddress('${docSnap.id}')">

<i class="fa-solid fa-trash"></i>

</button>

</div>

</div>

<div class="addressLine">

${data.houseNo}

</div>

<div class="addressLine">

${data.address}

</div>

<div class="addressLine">

${data.city}

</div>

<div class="addressPhone">

${data.phone}

</div>

</div>

`;

});

}
catch(error){

console.error(error);

}

};

/* ===================================
DELETE
=================================== */

window.deleteAddress =
async function(id){

const ok = confirm(
"Delete this address?"
);

if(!ok) return;

await deleteDoc(

doc(
db,
"addresses",
id
)

);

loadAddresses();

};

/* ===================================
DEFAULT ADDRESS
=================================== */

window.setDefaultAddress =
async function(id){

const user = auth.currentUser;

if(!user) return;

const q = query(

collection(
db,
"addresses"
),

where(
"userId",
"==",
user.uid
)

);

const snapshot =
await getDocs(q);

/* RESET ALL */

for(const item of snapshot.docs){

await updateDoc(

doc(
db,
"addresses",
item.id
),

{
isDefault:false
}

);

}

/* SET NEW */

await updateDoc(

doc(
db,
"addresses",
id
),

{
isDefault:true
}

);

loadAddresses();

};

setTimeout(()=>{

loadAddresses();

},500);

</script>

/* ===================================
EDIT ADDRESS
=================================== */

window.editAddress =
async function(id){

try{

const snap =

await getDoc(
doc(
db,
"addresses",
id
)
);

if(!snap.exists()) return;

const data =
snap.data();

/* FILL FORM */

document.getElementById(
"addressName"
).value =

data.fullName || "";

document.getElementById(
"addressPhone"
).value =

data.phone || "";

document.getElementById(
"houseNumber"
).value =

data.houseNo || "";

document.getElementById(
"fullAddress"
).value =

data.address || "";

document.getElementById(
"city"
).value =

data.city || "";

selectedType =
data.type || "Home";

/* STORE EDIT ID */

window.editingAddressId =
id;

openAddressModal();

}
catch(error){

console.error(error);

}

};

<script>

/* ===================================
CART BADGE
=================================== */

function updateNavbarCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

}

updateNavbarCartCount();

window.addEventListener(

"storage",

()=>{

updateNavbarCartCount();

}

);
