<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Login & Signup

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#111827;
--gray:#6B7280;
--border:#E5E7EB;

}

body{

background:#ffffff;

overflow-x:hidden;

min-height:100vh;

}.hero{

height:45vh;

position:relative;

overflow:hidden;

background:
linear-gradient(
135deg,
#F4B400,
#FFD54F
);

}

.heroContent{

position:absolute;

left:24px;

bottom:40px;

color:white;

z-index:2;

}

.heroTitle{

font-size:42px;

font-weight:900;

line-height:1.1;

}

.heroSub{

margin-top:10px;

font-size:15px;

opacity:.95;

}

.heroGrid{

position:absolute;

inset:0;

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:10px;

padding:15px;

opacity:.25;

}

.heroItem{

background:white;

border-radius:20px;

}.authCard{

background:white;

margin-top:-28px;

border-radius:32px 32px 0 0;

padding:24px;

position:relative;

z-index:5;

min-height:60vh;

}

.logo{

font-size:42px;

font-weight:900;

color:var(--dark);

}

.subTitle{

font-size:14px;

color:var(--gray);

margin-top:4px;

}.phoneBox{

height:62px;

display:flex;

align-items:center;

border:1px solid var(--border);

border-radius:18px;

padding:0 16px;

margin-top:22px;

}

.countryCode{

font-weight:800;

margin-right:12px;

}

.phoneInput{

flex:1;

border:none;

outline:none;

font-size:16px;

font-weight:600;

}.continueBtn{

width:100%;

height:60px;

margin-top:18px;

border:none;

border-radius:18px;

background:var(--secondary);

color:white;

font-size:18px;

font-weight:800;

cursor:pointer;

}

.googleBtn{

width:100%;

height:58px;

margin-top:14px;

border:2px solid var(--border);

border-radius:18px;

background:white;

font-size:16px;

font-weight:800;

cursor:pointer;

}.divider{

display:flex;

align-items:center;

gap:12px;

margin:20px 0;

color:var(--gray);

font-size:13px;

font-weight:700;

}

.divider::before,
.divider::after{

content:"";

flex:1;

height:1px;

background:#E5E7EB;

}

.terms{

margin-top:20px;

font-size:12px;

line-height:1.7;

text-align:center;

color:var(--gray);

}.signupSheet{

position:fixed;

left:0;
right:0;
bottom:-100%;

background:white;

border-radius:30px 30px 0 0;

padding:24px;

box-shadow:
0 -10px 40px rgba(0,0,0,.15);

transition:.4s;

z-index:9999;

}

.signupSheet.show{

bottom:0;

}

.sheetInput{

width:100%;

height:58px;

border:1px solid var(--border);

border-radius:16px;

padding:0 16px;

margin-top:14px;

}

.sheetBtn{

width:100%;

height:58px;

margin-top:18px;

background:var(--secondary);

border:none;

border-radius:16px;

color:white;

font-weight:800;

}@media(max-width:480px){

.heroTitle{

font-size:34px;

}

.logo{

font-size:36px;

}

}

</style>
</head>
<body><div class="hero">

<div class="heroGrid">

<div class="heroItem"></div>
<div class="heroItem"></div>
<div class="heroItem"></div>
<div class="heroItem"></div>

<div class="heroItem"></div>
<div class="heroItem"></div>
<div class="heroItem"></div>
<div class="heroItem"></div>

</div>

<div class="heroContent">

<div class="heroTitle">

Laundry<br>
Made Easy

</div>

<div class="heroSub">

Pickup & Delivery In Minutes

</div>

</div>

</div><div class="authCard">

<div class="logo">

QuickPress

</div>

<div class="subTitle">

Login or create account

</div>

<form id="authForm">

<div class="phoneBox">

<div class="countryCode">

+91

</div>

<input

id="phone"

class="phoneInput"

type="tel"

placeholder="Enter mobile number"

maxlength="10"

required>

</div>

<button
class="continueBtn"
type="submit">

Continue

</button>

</form>

<div class="divider">

OR

</div>

<button
id="googleLoginBtn"
class="googleBtn">

<i class="fa-brands fa-google"></i>

Continue With Google

</button>

<div class="terms">

By continuing you agree to
QuickPress Terms,
Privacy Policy and Content Policy.

</div>

</div><script type="module">

import {
auth,
db
} from "./js/firebase.js";

import {

GoogleAuthProvider,

signInWithPopup

} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {

doc,
getDoc,
setDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";const googleBtn =

document.getElementById(
"googleLoginBtn"
);

googleBtn.addEventListener(

"click",

async()=>{

try{

const provider =
new GoogleAuthProvider();

const result =

await signInWithPopup(
auth,
provider
);

const user =
result.user;

const ref =

doc(
db,
"users",
user.uid
);

const snap =

await getDoc(ref);

if(!snap.exists()){

await setDoc(
ref,
{
uid:user.uid,
name:user.displayName,
email:user.email,
photo:user.photoURL,
provider:"google",
createdAt:
serverTimestamp()
}
);

}

localStorage.setItem(

"qp_uid",

user.uid

);

window.location.href =
"notification-permission.html";

}catch(error){

console.log(error);

alert(
"Google Login Failed"
);

}

});document

.getElementById(
"authForm"
)

.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

const phone =

document
.getElementById(
"phone"
)
.value;

if(phone.length < 10){

alert(
"Enter valid mobile number"
);

return;

}

localStorage.setItem(
"qp_phone",
phone
);

/* Firebase Phone Auth Later */

window.location.href =
"otp.html";

});window.createAccount =
async function(){

const name =

document.getElementById(
"signupName"
).value;

const email =

document.getElementById(
"signupEmail"
).value;

const referral =

document.getElementById(
"signupReferral"
).value;

localStorage.setItem(

"qp_signup_data",

JSON.stringify({

name,
email,
referral

})

);

window.location.href =
"otp.html";

};

</script>
<div
id="signupSheet"
class="signupSheet">

<h2>

Create Account

</h2>

<input
id="signupName"
class="sheetInput"
placeholder="Full Name">

<input
id="signupEmail"
class="sheetInput"
placeholder="Email Address">

<input
id="signupReferral"
class="sheetInput"
placeholder="Referral Code (Optional)">

<button
class="sheetBtn"
onclick="createAccount()">

Continue

</button>

</div>
</body>
</html>
