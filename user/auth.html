<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Authentication

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#fff;

min-height:100vh;

overflow:hidden;

}

:root{

--yellow:#F4B400;
--green:#16A34A;
--dark:#111827;
--gray:#6B7280;

}.backgroundGrid{

height:45vh;

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:12px;

padding:14px;

overflow:hidden;

}

.gridItem{

background:#F0FDFA;

border-radius:20px;

display:flex;

align-items:center;

justify-content:center;

font-size:42px;

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

}.authCard{

background:white;

margin-top:-20px;

border-radius:30px 30px 0 0;

padding:24px;

min-height:55vh;

position:relative;

z-index:10;

}

.logoBox{

width:90px;
height:90px;

background:var(--yellow);

border-radius:24px;

display:flex;

align-items:center;

justify-content:center;

margin:auto;

}

.logoText{

font-size:34px;

font-weight:900;

color:var(--green);

}.authTitle{

text-align:center;

font-size:34px;

font-weight:900;

margin-top:20px;

color:var(--dark);

}

.authSubtitle{

text-align:center;

font-size:15px;

color:var(--gray);

margin-top:6px;

}.phoneBox{

margin-top:28px;

display:flex;

align-items:center;

border:1px solid #E5E7EB;

border-radius:18px;

height:60px;

padding:0 16px;

}

.countryCode{

font-weight:800;

margin-right:12px;

}

.phoneInput{

flex:1;

border:none;

outline:none;

font-size:16px;

}

.continueBtn{

width:100%;

height:58px;

margin-top:18px;

border:none;

border-radius:18px;

background:var(--green);

color:white;

font-size:18px;

font-weight:800;

cursor:pointer;

}

.googleBtn{

width:100%;

height:58px;

margin-top:18px;

border:2px solid #E5E7EB;

border-radius:18px;

background:white;

font-weight:800;

}</style>

</head>

<body>

<div class="backgroundGrid">

<div class="gridItem">👕</div>
<div class="gridItem">🧺</div>
<div class="gridItem">👔</div>
<div class="gridItem">🧥</div>

<div class="gridItem">🧦</div>
<div class="gridItem">🛏️</div>
<div class="gridItem">👖</div>
<div class="gridItem">🧴</div>

</div><div class="authCard">

<div class="logoBox">

<div class="logoText">

Q

</div>

</div>

<h1 class="authTitle">

QuickPress

</h1>

<p class="authSubtitle">

India's Premium Laundry App

</p><form id="authForm">

<div class="phoneBox">

<div class="countryCode">

+91

</div>

<input

id="phone"

class="phoneInput"

type="tel"

placeholder="Enter mobile number"

required>

</div>

<button
class="continueBtn"
type="submit">

Continue

</button>

</form><button
class="googleBtn">

<i class="fa-brands fa-google"></i>

Continue With Google

</button>

<p
style="

font-size:12px;

text-align:center;

color:#6B7280;

margin-top:20px;

line-height:1.6;

">

By continuing you agree to

Terms of Service,

Privacy Policy

and Content Policy.

</p>

</div><script>

document

.getElementById(
"authForm"
)

.addEventListener(

"submit",

function(e){

e.preventDefault();

const phone =

document
.getElementById(
"phone"
).value;

localStorage.setItem(

"qp_phone",

phone

);

/*

Firebase Check

User Exists?

YES -> OTP

NO -> Signup Sheet

*/

window.location.href =
"otp.html";

}

);

</script>

</body>
</html>
