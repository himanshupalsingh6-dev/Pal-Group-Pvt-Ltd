<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPress Wallet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
padding-bottom:100px;
}

/* HEADER */

.walletHero{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:22px;

border-bottom-left-radius:32px;
border-bottom-right-radius:32px;

}

.walletHero h1{

font-size:30px;
font-weight:900;

}

.walletHero p{

margin-top:6px;

font-size:13px;
font-weight:700;

color:#374151;

}

/* BALANCE CARD */

.balanceWrap{

padding:16px;

}

.balanceCard{

background:
linear-gradient(
135deg,
#111827,
#1F2937
);

padding:24px;

border-radius:30px;

color:#fff;

}

.balanceLabel{

font-size:13px;

opacity:.8;

}

.balanceAmount{

margin-top:10px;

font-size:42px;

font-weight:900;

}

.balanceActions{

margin-top:20px;

display:flex;

gap:12px;

}

.balanceBtn{

flex:1;

height:50px;

border:none;

border-radius:16px;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.addMoneyBtn{

background:#16A34A;
color:#fff;

}

.withdrawBtn{

background:#fff;
color:#111827;

}

/* MINI CARDS */

.miniGrid{

padding:0 16px;

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

}

.miniCard{

background:#fff;

padding:20px;

border-radius:24px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.miniLabel{

font-size:12px;

font-weight:700;

color:#6B7280;

}

.miniValue{

margin-top:10px;

font-size:26px;

font-weight:900;

}

/* TRANSACTIONS */

.section{

padding:20px 16px;

}

.sectionTitle{

font-size:22px;

font-weight:900;

margin-bottom:16px;

}

.transactionCard{

background:#fff;

padding:18px;

border-radius:22px;

margin-bottom:12px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

display:flex;

justify-content:space-between;

align-items:center;

}

.transactionTitle{

font-size:14px;

font-weight:800;

}

.transactionDate{

margin-top:4px;

font-size:12px;

color:#6B7280;

}

.credit{

color:#16A34A;

font-weight:900;

}

.debit{

color:#DC2626;

font-weight:900;

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="walletHero">

<h1>
My Wallet
</h1>

<p>
Manage balance, cashback and rewards
</p>

</div>

<!-- BALANCE -->

<div class="balanceWrap">

<div class="balanceCard">

<div class="balanceLabel">

Available Balance

</div>

<div
class="balanceAmount"
id="walletBalance">

₹0

</div>

<div class="balanceActions">

<button
class="balanceBtn addMoneyBtn">

Add Money

</button>

<button
class="balanceBtn withdrawBtn">

Withdraw

</button>

</div>

</div>

</div>

<!-- MINI CARDS -->

<div class="miniGrid">

<div class="miniCard">

<div class="miniLabel">

Cashback

</div>

<div
class="miniValue"
id="cashbackBalance">

₹0

</div>

</div>

<div class="miniCard">

<div class="miniLabel">

Referral Earnings

</div>

<div
class="miniValue"
id="referralBalance">

₹0

</div>

</div>

</div>

<!-- TRANSACTIONS -->

<div class="section">

<div class="sectionTitle">

Transactions

</div>

<div
id="transactionsContainer">

<div class="transactionCard">

<div>

<div class="transactionTitle">

Welcome Bonus

</div>

<div class="transactionDate">

01 Jun 2026

</div>

</div>

<div class="credit">

+ ₹50

</div>

</div>

</div>

</div>
<!-- =========================================
BOTTOM NAVIGATION
========================================= -->

<div class="bottomNav">

<button
class="navItem"
onclick="location.href='index.html'">

🏠
<span>Home</span>

</button>

<button
class="navItem"
onclick="location.href='orders.html'">

📦
<span>Orders</span>

</button>

<button
class="navItem activeNav">

💰
<span>Wallet</span>

</button>

<button
class="navItem"
onclick="location.href='profile.html'">

👤
<span>Profile</span>

</button>

</div>

<style>

.bottomNav{

position:fixed;

left:0;
right:0;
bottom:0;

height:76px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -8px 20px rgba(0,0,0,.08);

z-index:999;

}

.navItem{

flex:1;

height:100%;

border:none;

background:none;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:4px;

font-size:11px;

font-weight:700;

cursor:pointer;

color:#6B7280;

}

.activeNav{

color:#16A34A;

}

</style>

<script type="module">

import { db, auth }
from "./firebase.js";

import {
doc,
getDoc,
setDoc,
collection,
query,
where,
onSnapshot,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* =========================================
LOGIN CHECK
========================================= */

let currentUser = null;

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

currentUser = user;

loadWallet();

loadTransactions();

}

);

/* =========================================
LOAD WALLET
========================================= */

async function loadWallet(){

const walletRef =

doc(
db,
"wallets",
currentUser.uid
);

const walletSnap =

await getDoc(
walletRef
);

/* ========================================= */

if(!walletSnap.exists()){

await setDoc(

walletRef,

{

balance:0,

cashback:0,

referral:0,

createdAt:
new Date()

}

);

}

/* ========================================= */

onSnapshot(

walletRef,

(snapshot)=>{

if(!snapshot.exists())
return;

const wallet =
snapshot.data();

document.getElementById(
"walletBalance"
)

.innerHTML =
`₹${wallet.balance || 0}`;

document.getElementById(
"cashbackBalance"
)

.innerHTML =
`₹${wallet.cashback || 0}`;

document.getElementById(
"referralBalance"
)

.innerHTML =
`₹${wallet.referral || 0}`;

}

);

}

/* =========================================
TRANSACTIONS
========================================= */

function loadTransactions(){

const q = query(

collection(
db,
"walletTransactions"
),

where(
"userId",
"==",
currentUser.uid
)

);

onSnapshot(

q,

(snapshot)=>{

const container =

document.getElementById(
"transactionsContainer"
);

container.innerHTML = "";

/* ========================================= */

snapshot.forEach(doc=>{

const txn =
doc.data();

const amountClass =

txn.type === "credit"

? "credit"

: "debit";

const sign =

txn.type === "credit"

? "+"

: "-";

/* ========================================= */

container.innerHTML +=

`

<div class="transactionCard">

<div>

<div class="transactionTitle">

${txn.title}

</div>

<div class="transactionDate">

${txn.date || ''}

</div>

</div>

<div class="${amountClass}">

${sign} ₹${txn.amount}

</div>

</div>

`;

});

/* ========================================= */

if(
container.innerHTML === ""
){

container.innerHTML =

`

<div
style="
text-align:center;
padding:40px;
color:#6B7280;
">

No Transactions

</div>

`;

}

}

);

}

/* =========================================
ADD MONEY
========================================= */

document
.querySelector(
".addMoneyBtn"
)

.addEventListener(

"click",

async()=>{

const amount =

prompt(
"Enter Amount"
);

if(
!amount ||
isNaN(amount)
)
return;

/* ========================================= */

await addDoc(

collection(
db,
"walletTransactions"
),

{

userId:
currentUser.uid,

title:
"Money Added",

amount:
Number(amount),

type:
"credit",

date:
new Date()
.toLocaleDateString(),

createdAt:
serverTimestamp()

}

);

alert(
"Payment Gateway Connect Later"
);

}

);

/* =========================================
WITHDRAW
========================================= */

document
.querySelector(
".withdrawBtn"
)

.addEventListener(

"click",

async()=>{

const amount =

prompt(
"Withdraw Amount"
);

if(
!amount ||
isNaN(amount)
)
return;

/* ========================================= */

await addDoc(

collection(
db,
"withdrawRequests"
),

{

userId:
currentUser.uid,

amount:
Number(amount),

status:
"Pending",

createdAt:
serverTimestamp()

}

);

alert(
"Withdraw Request Submitted"
);

}

);

/* =========================================
REFERRAL CODE
========================================= */

const referralCode =

"QP"

+

currentUser?.uid
?.slice(0,6)
?.toUpperCase();

/* ========================================= */

console.log(
"Referral Code:",
referralCode
);

</script>

</body>
</html>
