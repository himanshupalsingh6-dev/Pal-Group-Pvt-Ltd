linear-gradient(

class="addMoneyBtn"
onclick="addMoney()">

Add Money

</button>

<style>

.addMoneyBtn{

width:100%;

height:58px;

border:none;

border-radius:16px;

}

</style><script type="module">

import { db, auth }
from "./firebase.js";

import {

doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.loadWallet =
async function(){

if(!auth.currentUser){

return;

}

const userRef =

doc(
db,
"users",
auth.currentUser.uid
);

const userDoc =

await getDoc(
userRef
);

if(userDoc.exists()){

const data =
userDoc.data();

document.getElementById(
"walletBalance"
).innerHTML =

"₹" +

(data.walletBalance || 0);

}

};

</script><script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script type="module">

import { db, auth }
from "./firebase.js";

import {

doc,
updateDoc,
increment,
collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.addMoney =
function(){

const amount =

Number(

document.getElementById(
"walletAmount"
).value

);

if(amount < 100){

alert(
"Minimum ₹100 Required"
);

return;

}

const options = {

key:
"YOUR_RAZORPAY_KEY",

amount:
amount * 100,

currency:
"INR",

name:
"QuickPress",

description:
"Wallet Recharge",

handler:

async function(response){

try{

await updateDoc(

doc(
db,
"users",
auth.currentUser.uid
),

{

walletBalance:

increment(amount)

}

);

await addDoc(

collection(
db,
"walletTransactions"
),

{

userId:
auth.currentUser.uid,

type:"credit",

amount,

paymentId:

response.razorpay_payment_id,

status:"success",

createdAt:
serverTimestamp()

}

);

alert(
"Wallet Updated"
);

loadWallet();

}

catch(error){

console.error(error);

}

}

};

const rzp =

new Razorpay(
options
);

rzp.open();

};

</script><section style="padding:16px;">

<h3 class="sectionHeading">

Transaction History

</h3>

<div
id="transactionContainer">

</div>

</section>

<style>

.transactionCard{

background:#fff;

border-radius:18px;

padding:16px;

margin-bottom:12px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 4px 12px rgba(0,0,0,.05);

}

.transactionLeft{

display:flex;

flex-direction:column;

}

.transactionTitle{

font-size:14px;

font-weight:800;

}

.transactionDate{

font-size:11px;

color:#6B7280;

margin-top:4px;

}

.transactionAmount{

font-size:16px;

font-weight:900;

}

.credit{

color:#16A34A;

}

.debit{

color:#EF4444;

}

.emptyTransactions{

background:#fff;

padding:30px;

border-radius:20px;

text-align:center;

color:#6B7280;

}

</style><script type="module">

import { db, auth }
from "./firebase.js";

import {

collection,
query,
where,
orderBy,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.loadTransactions =
function(){

if(!auth.currentUser){

return;

}

const q = query(

collection(
db,
"walletTransactions"
),

where(
"userId",
"==",
auth.currentUser.uid
),

orderBy(
"createdAt",
"desc"
)

);

onSnapshot(

q,

(snapshot)=>{

const container =

document.getElementById(
"transactionContainer"
);

if(snapshot.empty){

container.innerHTML =

`

<div class="emptyTransactions">

No Transactions Found

</div>

`;

return;

}

let html = "";

snapshot.forEach(doc=>{

const txn =
doc.data();

const amountClass =

txn.type === "credit"

?

"credit"

:

"debit";

const sign =

txn.type === "credit"

?

"+"

:

"-";

const date =

txn.createdAt

?

new Date(

txn.createdAt.seconds * 1000

).toLocaleDateString()

:

"Today";

html += `

<div class="transactionCard">

<div class="transactionLeft">

<div class="transactionTitle">

${txn.type === "credit"

? "Wallet Recharge"

: "Order Payment"}

</div>

<div class="transactionDate">

${date}

</div>

</div>

<div class="transactionAmount ${amountClass}">

${sign} ₹${txn.amount}

</div>

</div>

`;

});

container.innerHTML =
html;

}

);

};

<script type="module">

import { auth }
from "./firebase.js";

import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

onAuthStateChanged(

auth,

(user)=>{

if(user){

loadWallet();

loadTransactions();

"login.html";
