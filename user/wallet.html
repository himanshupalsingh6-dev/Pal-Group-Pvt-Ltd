<script>

<style>

/* ==========================

========================== */

1px solid #F3F4F6;

}

}

}

.transactionIcon{

height:42px;

justify-content:center;

}

.creditIcon{

}

.debitIcon{

background:#FEE2E2;

}

.transactionTitle{

}

.transactionDate{

color:#6B7280;

}

.transactionAmount{

font-size:15px;

font-weight:900;

}

.credit{

}

.debit{

}

.emptyHistory{

padding:40px 20px;

font-size:14px;

}

</style>

<script type="module">

import { auth, db }
from "./firebase.js";

import {
collection,
getDocs,
query,
where,
orderBy
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ==========================
LOAD TRANSACTIONS
========================== */

window.loadTransactions =
async function(){

try{

const user = auth.currentUser;

if(!user) return;

const q = query(

collection(
db,
"wallet_transactions"
),

where(
"userId",
"==",
user.uid
),

orderBy(
"createdAt",
"desc"
)

);

const snapshot =
await getDocs(q);

const container =

document.getElementById(
"transactionContainer"
);

container.innerHTML = "";

/* EMPTY */

if(snapshot.empty){

container.innerHTML =

`

<div class="emptyHistory">

No transactions found

</div>

`;

return;

}

snapshot.forEach(doc=>{

const data =
doc.data();

const credit =

data.type === "credit";

container.innerHTML +=

`

<div class="transactionItem">

<div class="transactionLeft">

<div class="transactionIcon

${credit
? "creditIcon"
: "debitIcon"}

">

${credit ? "💰" : "📱"}

</div>

<div>

<div class="transactionTitle">

${data.title}

</div>

<div class="transactionDate">

${new Date(
data.createdAt
).toLocaleDateString()}

</div>

</div>

</div>

<div
class="transactionAmount

${credit
? "credit"
: "debit"}

">

${credit ? "+" : "-"}

₹${data.amount}

</div>

</div>

`;

});

}
catch(error){

console.error(error);

}

};

setTimeout(()=>{

loadTransactions();

},500);

</script>

<script type="module">

import { auth, db }
from "./firebase.js";

import {
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ==========================
LOAD WALLET BALANCE
========================== */

async function loadWalletBalance(){

try{

const user = auth.currentUser;

if(!user) return;

const walletRef =

doc(
db,
"wallets",
user.uid
);

const snap =

await getDoc(
walletRef
);

if(snap.exists()){

const data =
snap.data();

const balance =

data.balance || 0;

document.getElementById(
"walletBalance"
).innerHTML =

"₹" + balance;

}

}
catch(error){

console.error(error);

}

}

/* ==========================
CART BADGE
========================== */

function updateNavbarCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

}

updateNavbarCartCount();

/* ==========================
AUTO REFRESH
========================== */

setInterval(()=>{

loadWalletBalance();

},30000);

/* ==========================
STORAGE SYNC
========================== */

window.addEventListener(

"storage",

()=>{

updateNavbarCartCount();

}

);

/* ==========================
INIT
========================== */

setTimeout(()=>{

loadWalletBalance();

},500);

</script>
