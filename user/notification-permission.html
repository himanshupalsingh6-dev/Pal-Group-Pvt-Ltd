<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPress Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F8FAFC;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-y:auto;
}

.container{
width:100%;
max-width:420px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
padding:20px 0;
}

.iconBox{
width:140px;
height:140px;
background:#FFF7E0;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:70px;
margin-bottom:30px;
}

h1{
font-size:32px;
font-weight:800;
color:#111827;
line-height:1.3;
}

p{
margin-top:15px;
font-size:16px;
line-height:1.7;
color:#6B7280;
}

.btn{
width:100%;
height:58px;
border:none;
border-radius:16px;
font-size:18px;
font-weight:800;
cursor:pointer;
}

.enableBtn{
margin-top:35px;
background:#16A34A;
color:white;
}

.skipBtn{
margin-top:14px;
background:white;
border:2px solid #16A34A;
color:#16A34A;
}

@media(max-height:700px){

.iconBox{
width:110px;
height:110px;
font-size:55px;
}

h1{
font-size:26px;
}

p{
font-size:14px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="iconBox">
🔔
</div>

<h1>
Enable Notifications
</h1>

<p>
Get order updates, pickup alerts, delivery status,
special offers and important service notifications.
</p>

<button
class="btn enableBtn"
onclick="enableNotifications()">
Enable Notifications
</button>

<button
class="btn skipBtn"
onclick="skipNotifications()">
Not Now
</button>

</div>

<script>

async function enableNotifications(){

try{

if("Notification" in window){

const permission =
await Notification.requestPermission();

localStorage.setItem(
"notificationPermission",
permission
);

}

window.location.href =
"location.html";

}catch(error){

console.log(error);

window.location.href =
"location.html";

}

}

function skipNotifications(){

localStorage.setItem(
"notificationPermission",
"skipped"
);

window.location.href =
"location.html";

}

</script>

</body>
</html>
