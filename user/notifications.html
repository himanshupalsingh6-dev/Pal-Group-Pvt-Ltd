<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
padding-bottom:100px;
}

.header{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:24px;

border-bottom-left-radius:34px;
border-bottom-right-radius:34px;

}

.header h1{

font-size:30px;
font-weight:900;

}

.header p{

margin-top:6px;

font-size:13px;

font-weight:700;

color:#374151;

}

.notificationsWrap{

padding:16px;

}

.notificationCard{

background:#fff;

padding:18px;

border-radius:22px;

margin-bottom:14px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

display:flex;

gap:14px;

}

.iconBox{

width:50px;
height:50px;

border-radius:16px;

display:flex;

align-items:center;
justify-content:center;

font-size:22px;

background:#F3F4F6;

}

.notificationContent{

flex:1;

}

.notificationTitle{

font-size:15px;

font-weight:900;

}

.notificationMessage{

margin-top:6px;

font-size:13px;

line-height:1.7;

color:#6B7280;

}

.notificationDate{

margin-top:8px;

font-size:11px;

font-weight:700;

color:#9CA3AF;

}

.unread{

border-left:5px solid #16A34A;

}

.actions{

margin-top:12px;

display:flex;

gap:8px;

}

.actionBtn{

height:36px;

padding:0 12px;

border:none;

border-radius:12px;

font-size:12px;

font-weight:800;

cursor:pointer;

}

.readBtn{

background:#16A34A;

color:#fff;

}

.deleteBtn{

background:#DC2626;

color:#fff;

}

</style>
</head>

<body>

<div class="header">

<h1>
Notifications
</h1>

<p>
Order updates, offers & alerts
</p>

</div>

<div
class="notificationsWrap"
id="notificationsContainer">

<!-- Firebase Notifications -->

<div class="notificationCard unread">

<div class="iconBox">

📦

</div>

<div class="notificationContent">

<div class="notificationTitle">

Order Accepted

</div>

<div class="notificationMessage">

Your order QP12345 has been accepted.

</div>

<div class="notificationDate">

1 June 2026 • 10:45 AM

</div>

<div class="actions">

<button class="actionBtn readBtn">

Mark Read

</button>

<button class="actionBtn deleteBtn">

Delete

</button>

</div>

</div>

</div>

</div>
