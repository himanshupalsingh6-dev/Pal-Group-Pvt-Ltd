<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Select Location

</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#fff;

height:100vh;

overflow:hidden;

}

#map{

height:100vh;

width:100%;

}

</style>

</head>

<body>

<div id="map"></div><div
style="
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-100%);
z-index:9999;
font-size:45px;
pointer-events:none;
">

📍

</div><div class="bottomCard">

<div id="selectedAddress">

Move map to select address

</div>

<button
onclick="saveLocation()">

Confirm Location

</button>

</div>

<style>

.bottomCard{

position:fixed;

bottom:0;

left:0;

width:100%;

background:#fff;

padding:20px;

border-radius:24px 24px 0 0;

box-shadow:
0 -8px 30px rgba(0,0,0,.15);

z-index:9999;

}

#selectedAddress{

font-size:14px;

line-height:1.6;

font-weight:600;

margin-bottom:15px;

}

button{

width:100%;

height:56px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-size:17px;

font-weight:800;

}

</style><script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script
src="js/map-picker.js">
</script>
</body>
</html>
