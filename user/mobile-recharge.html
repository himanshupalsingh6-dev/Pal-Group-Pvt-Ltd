<script type="module">

import { auth, db }
from "./firebase.js";

import {
collection,
addDoc
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ==========================
START RECHARGE
========================== */

window.startRecharge =
async function(){

try{

const mobile =

document.getElementById(
"mobileNumber"
).value.trim();

const operator =

document.getElementById(
"operator"
).value;

const amount =

Number(

document.getElementById(
"rechargeAmount"
).value

);

const btn =

document.getElementById(
"rechargeBtn"
);

/* VALIDATION */

if(mobile.length !== 10){

alert(
"Enter valid mobile number"
);

return;

}

if(amount < 10){

alert(
"Enter valid amount"
);

return;

}

/* WALLET CHECK */

let wallet =

Number(

localStorage.getItem(
"walletBalance"
)

|| 0

);

if(wallet < amount){

alert(
"Insufficient Wallet Balance"
);

return;

}

/* LOADING */

btn.disabled = true;

btn.innerHTML =
"Processing Recharge...";

/* DUMMY PROVIDER DELAY */

await new Promise(

resolve =>

setTimeout(
resolve,
2500
)

);

/* SUCCESS */

wallet = wallet - amount;

localStorage.setItem(

"walletBalance",

wallet

);

/* SAVE RECHARGE */

const rechargeId =

"RCH" +

Date.now();

await addDoc(

collection(
db,
"recharges"
),

{

userId:

auth.currentUser
?.uid ||

"guest",

rechargeId,

mobile,

operator,

amount,

status:

"Success",

provider:

"Dummy Recharge API",

createdAt:

Date.now()

}

);

/* SAVE WALLET TXN */

await addDoc(

collection(
db,
"wallet_transactions"
),

{

userId:

auth.currentUser
?.uid ||

"guest",

title:

`Mobile Recharge (${operator})`,

amount,

type:

"debit",

createdAt:

Date.now()

}

);

/* SAVE LAST */

localStorage.setItem(

"lastRechargeId",

rechargeId

);

alert(

`Recharge Successful ✅

Recharge ID:
${rechargeId}`

);

window.location.href =

"recharge-success.html";

}
catch(error){

console.error(error);

alert(
"Recharge Failed"
);

}
finally{

const btn =

document.getElementById(
"rechargeBtn"
);

btn.disabled = false;

btn.innerHTML =
"Recharge Now";

}

};

</script>

<script type="module">

import { auth, db }
from "./firebase.js";

import {
collection,
query,
where,
orderBy,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ==========================
LOAD HISTORY
========================== */

async function loadRechargeHistory(){

try{

const user = auth.currentUser;

if(!user) return;

const q = query(

collection(
db,
"recharges"
),

where(
"userId",
"==",
user.uid
),

orderBy(
"createdAt",
"desc"
)

);

const snapshot =

await getDocs(q);

const container =

document.getElementById(
"rechargeHistory"
);

container.innerHTML = "";

if(snapshot.empty){

container.innerHTML =

`<div class="emptyState">
No Recharge History
</div>`;

return;

}

snapshot.forEach(doc=>{

const data =
doc.data();

container.innerHTML +=

`

<div class="historyItem">

<div class="historyLeft">

<div class="historyMobile">

${data.mobile}

</div>

<div class="historyOperator">

${data.operator}

</div>

</div>

<div class="historyAmount">

₹${data.amount}

</div>

</div>

`;

});

}
catch(error){

console.error(error);

}

}

/* ==========================
CART BADGE
========================== */

function updateNavbarCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

}

updateNavbarCartCount();

/* ==========================
AUTO REFRESH
========================== */

setTimeout(()=>{

loadRechargeHistory();

},500);

</script>
