<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPress Payment</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{
--yellow:#F4B400;
--green:#16A34A;
--dark:#111827;
--gray:#6B7280;
--bg:#F8FAFC;
}

body{
background:var(--bg);
padding-bottom:120px;
}

.header{

position:sticky;
top:0;

background:white;

padding:16px;

display:flex;
align-items:center;
gap:14px;

box-shadow:0 4px 15px rgba(0,0,0,.05);

z-index:100;

}

.backBtn{

width:44px;
height:44px;

border:none;

border-radius:14px;

background:#F3F4F6;

font-size:18px;

}

.title{

font-size:22px;
font-weight:900;

}

.section{

background:white;

margin:16px;

padding:20px;

border-radius:22px;

box-shadow:0 5px 20px rgba(0,0,0,.04);

}

.paymentAmount{

text-align:center;

}

.paymentAmount h1{

font-size:42px;

font-weight:900;

color:#16A34A;

margin-top:10px;

}

.paymentAmount p{

color:#6B7280;

margin-top:8px;

}

.methodCard{

display:flex;

align-items:center;

gap:15px;

padding:18px;

border:2px solid #E5E7EB;

border-radius:18px;

margin-top:14px;

cursor:pointer;

transition:.3s;

}

.methodCard.active{

border-color:#16A34A;

background:#F0FDF4;

}

.methodIcon{

width:55px;
height:55px;

border-radius:14px;

background:#F3F4F6;

display:flex;
align-items:center;
justify-content:center;

font-size:24px;

}

.methodTitle{

font-size:16px;

font-weight:800;

}

.methodDesc{

font-size:13px;

color:#6B7280;

margin-top:4px;

}

.payBtn{

position:fixed;

left:16px;
right:16px;
bottom:20px;

height:60px;

border:none;

border-radius:18px;

background:#16A34A;

color:white;

font-size:18px;

font-weight:900;

box-shadow:0 12px 25px rgba(22,163,74,.25);

}

.secureBox{

display:flex;

align-items:center;

justify-content:center;

gap:8px;

margin-top:16px;

font-size:13px;

color:#6B7280;

}

</style>

</head>

<body>

<div class="header">

<button
class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="title">

Payment

</div>

</div>

<!-- Amount -->

<div class="section paymentAmount">

<div>

💳

</div>

<h1 id="paymentAmount">

₹0

</h1>

<p>

Secure Payment for QuickPress Order

</p>

</div>

<!-- Payment Methods -->

<div class="section">

<h3>

Choose Payment Method

</h3>

<div
class="methodCard active"
onclick="selectMethod('UPI',this)">

<div class="methodIcon">

📱

</div>

<div>

<div class="methodTitle">

Online Payment

</div>

<div class="methodDesc">

UPI / Cards / Net Banking

</div>

</div>

</div>

<div
class="methodCard"
onclick="selectMethod('COD',this)">

<div class="methodIcon">

💵

</div>

<div>

<div class="methodTitle">

Cash On Delivery

</div>

<div class="methodDesc">

Pay after delivery

</div>

</div>

</div>

<div class="secureBox">

<i class="fa-solid fa-lock"></i>

100% Secure Payment

</div>

</div>

<button
class="payBtn"
onclick="payNow()">

Pay Now

</button>

<script type="module">

import { db }
from "../js/firebase.js";

import {

doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

let paymentMethod = "UPI";

const params =

new URLSearchParams(
window.location.search
);

const orderId =
params.get("orderId");

const order =

JSON.parse(

localStorage.getItem(
"qp_last_order"
)

|| "{}"

);

document.getElementById(
"paymentAmount"
).innerText =

"₹" +

(order.grandTotal || 0);

window.selectMethod =
function(method,card){

paymentMethod = method;

document
.querySelectorAll(
".methodCard"
)

.forEach(item=>{

item.classList.remove(
"active"
);

});

card.classList.add(
"active"
);

};

window.payNow =
async function(){

try{

if(paymentMethod==="COD"){

await updateDoc(

doc(
db,
"orders",
orderId
),

{

paymentMethod:"COD",

paymentStatus:"Pending"

}

);

window.location.href =

"order-success.html?orderId="

+ orderId;

return;

}

/* DEMO ONLINE PAYMENT */

await updateDoc(

doc(
db,
"orders",
orderId
),

{

paymentMethod:"ONLINE",

paymentStatus:"Paid"

}

);

alert(
"Payment Successful"
);

window.location.href =

"order-success.html?orderId="

+ orderId;

}

catch(error){

console.log(error);

alert(
"Payment Failed"
);

}

};

</script>

</body>
</html>
