<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Edit Profile

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F6F7FB;

padding-bottom:120px;

}

/* ===================================
HEADER
=================================== */

.editHeader{

background:
linear-gradient(
135deg,
#16A34A,
#22C55E
);

padding:20px;

padding-bottom:90px;

border-radius:
0 0 32px 32px;

color:#fff;

}

.headerRow{

display:flex;

align-items:center;

gap:12px;

}

.backBtn{

width:42px;
height:42px;

border:none;

border-radius:12px;

background:
rgba(255,255,255,.2);

color:#fff;

cursor:pointer;

}

.pageTitle{

font-size:22px;

font-weight:900;

}

/* ===================================
FORM CARD
=================================== */

.formCard{

background:#fff;

margin:
-60px 16px 0;

border-radius:24px;

padding:24px;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

}

/* ===================================
AVATAR
=================================== */

.avatarSection{

text-align:center;

margin-bottom:24px;

}

.avatarWrapper{

position:relative;

width:120px;

margin:auto;

}

.avatar{

width:120px;
height:120px;

border-radius:50%;

background:#E5E7EB;

overflow:hidden;

border:5px solid #fff;

display:flex;

align-items:center;
justify-content:center;

font-size:40px;

font-weight:900;

color:#16A34A;

}

.avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.uploadBtn{

position:absolute;

bottom:4px;
right:4px;

width:36px;
height:36px;

border:none;

border-radius:50%;

background:#16A34A;

color:#fff;

cursor:pointer;

}

#profileImageInput{

display:none;

}

</style>

</head>

<body>

<div class="editHeader">

<div class="headerRow">

<button
class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="pageTitle">

Edit Profile

</div>

</div>

</div>

<div class="formCard">

<div class="avatarSection">

<div class="avatarWrapper">

<div
class="avatar"
id="avatarPreview">

H

</div>

<button
class="uploadBtn"
onclick="document.getElementById('profileImageInput').click()">

<i class="fa-solid fa-camera"></i>

</button>

<input
type="file"
id="profileImageInput"
accept="image/*">

</div>

</div>

<!-- ===================================
PROFILE FORM
=================================== -->

<div class="formGroup">

<label>

Full Name

</label>

<input
type="text"
id="fullName"
placeholder="Enter your full name">

</div>

<div class="formGroup">

<label>

Email Address

</label>

<input
type="email"
id="email"
readonly>

</div>

<div class="formGroup">

<label>

Phone Number

</label>

<input
type="text"
id="phone"
readonly>

</div>

<div class="formGroup">

<label>

Gender

</label>

<select id="gender">

<option value="">

Select Gender

</option>

<option value="Male">

Male

</option>

<option value="Female">

Female

</option>

<option value="Other">

Other

</option>

</select>

</div>

<div class="formGroup">

<label>

Date of Birth

</label>

<input
type="date"
id="dob">

</div>

<style>

/* ===================================
FORM
=================================== */

.formGroup{

margin-bottom:18px;

}

.formGroup label{

display:block;

margin-bottom:8px;

font-size:13px;

font-weight:800;

color:#374151;

}

.formGroup input,
.formGroup select{

width:100%;

height:54px;

border:none;

outline:none;

background:#F3F4F6;

border-radius:14px;

padding:0 16px;

font-size:14px;

font-weight:600;

}

.formGroup select{

cursor:pointer;

}

.formGroup input[readonly]{

background:#E5E7EB;

color:#6B7280;

}

/* ===================================
FOCUS
=================================== */

.formGroup input:focus,
.formGroup select:focus{

outline:2px solid #16A34A;

background:#fff;

}

</style>

<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
LOAD USER
=================================== */

onAuthStateChanged(

auth,

(user)=>{

if(!user) return;

/* NAME */

document.getElementById(
"fullName"
).value =

user.displayName ||

"";

/* EMAIL */

document.getElementById(
"email"
).value =

user.email ||

"";

/* PHONE */

document.getElementById(
"phone"
).value =

user.phoneNumber ||

"";

/* LOCAL DATA */

const profileData =

JSON.parse(
localStorage.getItem(
"profileData"
)
)

|| {};

if(profileData.gender){

document.getElementById(
"gender"
).value =

profileData.gender;

}

if(profileData.dob){

document.getElementById(
"dob"
).value =

profileData.dob;

}

});

/* ===================================
IMAGE PREVIEW
=================================== */

document
.getElementById(
"profileImageInput"
)

.addEventListener(

"change",

function(e){

const file =

e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(event){

document.getElementById(
"avatarPreview"
).innerHTML =

`<img src="${event.target.result}">`;

};

reader.readAsDataURL(
file
);

}

);

</script>

<!-- ===================================
SAVE BUTTON
=================================== -->

<button
class="saveProfileBtn"
onclick="saveProfile()">

Save Changes

</button>

<style>

/* ===================================
SAVE BUTTON
=================================== */

.saveProfileBtn{

width:100%;

height:58px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-size:16px;

font-weight:900;

cursor:pointer;

margin-top:10px;

}

.saveProfileBtn:disabled{

opacity:.6;

cursor:not-allowed;

}

</style>

<script type="module">

import {
auth,
db,
storage
}
from "./firebase.js";

import {
updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
doc,
setDoc
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

import {
ref,
uploadBytes,
getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-storage.js";

/* ===================================
SAVE PROFILE
=================================== */

window.saveProfile =
async function(){

try{

const btn =

document.querySelector(
".saveProfileBtn"
);

btn.disabled = true;

btn.innerHTML =
"Saving...";

const user =
auth.currentUser;

if(!user){

alert(
"Login required"
);

return;

}

const fullName =

document.getElementById(
"fullName"
).value.trim();

const gender =

document.getElementById(
"gender"
).value;

const dob =

document.getElementById(
"dob"
).value;

let photoURL =

user.photoURL || "";

/* ===================================
UPLOAD PROFILE IMAGE
=================================== */

const imageFile =

document.getElementById(
"profileImageInput"
).files[0];

if(imageFile){

const storageRef =

ref(

storage,

`users/${user.uid}/profile.jpg`

);

await uploadBytes(

storageRef,

imageFile

);

photoURL =

await getDownloadURL(
storageRef
);

}

/* ===================================
AUTH PROFILE UPDATE
=================================== */

await updateProfile(

user,

{
displayName:fullName,
photoURL:photoURL
}

);

/* ===================================
FIRESTORE SAVE
=================================== */

await setDoc(

doc(
db,
"users",
user.uid
),

{

uid:user.uid,

name:fullName,

email:user.email || "",

phone:user.phoneNumber || "",

gender:gender,

dob:dob,

photoURL:photoURL,

updatedAt:

Date.now()

},

{merge:true}

);

/* ===================================
LOCAL CACHE
=================================== */

localStorage.setItem(

"profileData",

JSON.stringify({

gender,
dob

})

);

/* ===================================
SUCCESS
=================================== */

alert(
"Profile Updated Successfully ✅"
);

window.location.href =
"profile.html";

}
catch(error){

console.error(error);

alert(
"Profile Update Failed ❌"
);

}
finally{

const btn =

document.querySelector(
".saveProfileBtn"
);

btn.disabled = false;

btn.innerHTML =
"Save Changes";

}

};

</script>

</div>

</body>
</html>
