<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Recharge Success

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F6F7FB;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

}

.successCard{

width:100%;

max-width:500px;

background:#fff;

border-radius:30px;

padding:30px;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

.successCircle{

width:120px;
height:120px;

border-radius:50%;

background:#16A34A;

margin:auto;

display:flex;

align-items:center;
justify-content:center;

font-size:56px;

color:#fff;

animation:
pop .5s ease;

}

@keyframes pop{

0%{
transform:scale(.5);
}

100%{
transform:scale(1);
}

}

.successTitle{

margin-top:20px;

font-size:30px;

font-weight:900;

color:#111827;

}

.successText{

margin-top:8px;

font-size:14px;

color:#6B7280;

}

.detailsCard{

margin-top:24px;

background:#F9FAFB;

border-radius:20px;

padding:18px;

text-align:left;

}

.detailRow{

display:flex;

justify-content:space-between;

margin-bottom:12px;

font-size:14px;

font-weight:700;

}

.detailRow:last-child{

margin-bottom:0;

}

.detailValue{

font-weight:900;

color:#111827;

}

</style>

</head>

<body>

<div class="successCard">

<div class="successCircle">

✓

</div>

<div class="successTitle">

Recharge Successful

</div>

<div class="successText">

Your mobile recharge has been completed successfully.

</div>

<div class="detailsCard">

<div class="detailRow">

<span>

Recharge ID

</span>

<span
class="detailValue"
id="rechargeId">

RCH000001

</span>

</div>

<div class="detailRow">

<span>

Mobile

</span>

<span
class="detailValue"
id="mobileNumber">

9999999999

</span>

</div>

<div class="detailRow">

<span>

Operator

</span>

<span
class="detailValue"
id="operator">

Jio

</span>

</div>

<div class="detailRow">

<span>

Amount

</span>

<span
class="detailValue"
id="amount">

₹199

</span>

</div>

</div>

<div class="detailsCard" style="margin-top:12px;">

<div class="detailRow">

<span>

Transaction ID

</span>

<span
class="detailValue"
id="transactionId">

TXN000001

</span>

</div>

<div class="detailRow">

<span>

Status

</span>

<span
class="detailValue"
style="color:#16A34A;">

Success

</span>

</div>

<div class="detailRow">

<span>

Date

</span>

<span
class="detailValue"
id="rechargeDate">

Today

</span>

</div>

</div>

<!-- ==========================
ACTION BUTTONS
========================== -->

<div
style="
margin-top:24px;
display:flex;
flex-direction:column;
gap:12px;
">

<button
id="walletBtn"
style="
height:56px;
border:none;
border-radius:16px;
background:#16A34A;
color:#fff;
font-size:15px;
font-weight:900;
cursor:pointer;
">

Back To Wallet

</button>

<button
id="againBtn"
style="
height:56px;
border:none;
border-radius:16px;
background:#F3F4F6;
color:#111827;
font-size:15px;
font-weight:900;
cursor:pointer;
">

Recharge Again

</button>

</div>

<!-- ==========================
FOOTER
========================== -->

<div
style="
margin-top:24px;
font-size:12px;
color:#9CA3AF;
">

Powered by QuickPress Wallet

</div>

</div>

<script>

/* ==========================
LOAD DATA
========================== */

const rechargeId =

localStorage.getItem(
"lastRechargeId"
)

|| ("RCH" + Date.now());

const mobile =

localStorage.getItem(
"lastRechargeMobile"
)

|| "9999999999";

const operator =

localStorage.getItem(
"lastRechargeOperator"
)

|| "Jio";

const amount =

localStorage.getItem(
"lastRechargeAmount"
)

|| "199";

/* ==========================
RENDER
========================== */

document.getElementById(
"rechargeId"
).innerHTML = rechargeId;

document.getElementById(
"mobileNumber"
).innerHTML = mobile;

document.getElementById(
"operator"
).innerHTML = operator;

document.getElementById(
"amount"
).innerHTML =

"₹" + amount;

document.getElementById(
"transactionId"
).innerHTML =

"TXN" +

Date.now();

document.getElementById(
"rechargeDate"
).innerHTML =

new Date()
.toLocaleString();

/* ==========================
BUTTONS
========================== */

document.getElementById(
"walletBtn"
)

.addEventListener(

"click",

()=>{

window.location.href =
"wallet.html";

}

);

document.getElementById(
"againBtn"
)

.addEventListener(

"click",

()=>{

window.location.href =
"mobile-recharge.html";

}

);

</script>

</body>
</html>
