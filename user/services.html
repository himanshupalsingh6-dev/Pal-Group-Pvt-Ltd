<script>

/* ===================================
HELPERS
=================================== */

window.showLoading =
function(){

document.getElementById(
"skeletonGrid"
).style.display="grid";

document.getElementById(
"servicesGrid"
).style.display="none";

};

window.hideLoading =
function(){

document.getElementById(
"skeletonGrid"
).style.display="none";

document.getElementById(
"servicesGrid"
).style.display="grid";

};

window.updateResultCount =
function(count){

document.getElementById(
"resultCount"
).innerHTML =

count + " Services";

};

window.showEmptyState =
function(){

document.getElementById(
"emptyState"
).style.display="block";

};

window.hideEmptyState =
function(){

document.getElementById(
"emptyState"
).style.display="none";

};

showLoading();

</script><script type="module">

/* ===================================
IMPORTS
=================================== */

import { db }
from "./firebase.js";

import {

collection,
query,
where,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
GLOBAL DATA
=================================== */

let allServices = [];

let currentCategory = "All";

let currentSearch = "";

let currentSort = "popular";

/* ===================================
ELEMENTS
=================================== */

const servicesGrid =

document.getElementById(
"servicesGrid"
);

const globalSearch =

document.getElementById(
"globalSearch"
);

const sortServices =

document.getElementById(
"sortServices"
);

/* ===================================
SERVICE CARD
=================================== */

function createServiceCard(service){

const price =

service.price || 0;

return `

<div class="serviceCard">

<div class="serviceTop">

<img

src="${
service.image ||

'https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?w=500'
}"

loading="lazy"

alt="${service.name}"

>

</div>

<div class="serviceBody">

<div class="serviceCategory">

${service.category || ""}

${
service.subCategory

?

" > " + service.subCategory

:

""
}

</div>

<h3>

${service.name}

</h3>

<p>

${service.description || "Premium Laundry Service"}

</p>

<div class="serviceBottom">

<div>

<div class="servicePrice">

₹${price}

</div>

</div>

<button

class="addBtn"

onclick="addToCart(
 '${service.id}',
 '${service.name}',
 ${price},
 '${service.category}',
 '${service.subCategory || ""}'
)">

Add

</button>

</div>

</div>

</div>

`;

}

/* ===================================
RENDER
=================================== */

function renderServices(data){

hideLoading();

servicesGrid.innerHTML = "";

if(data.length===0){

showEmptyState();

updateResultCount(0);

return;

}

hideEmptyState();

updateResultCount(
data.length
);

data.forEach(service=>{

servicesGrid.innerHTML +=

createServiceCard(
service
);

});

}

/* ===================================
FILTERS
=================================== */

function applyFilters(){

let filtered =

[...allServices];

/* Category */

if(
currentCategory !== "All"
){

filtered =

filtered.filter(

service=>

service.category ===
currentCategory

);

}

/* Search */

if(currentSearch){

filtered =

filtered.filter(

service=>

(service.name || "")
.toLowerCase()
.includes(
currentSearch
)

||

(service.category || "")
.toLowerCase()
.includes(
currentSearch
)

);

}

/* Sort */

if(
currentSort==="lowToHigh"
){

filtered.sort(

(a,b)=>

(a.price||0)-
(b.price||0)

);

}

if(
currentSort==="highToLow"
){

filtered.sort(

(a,b)=>

(b.price||0)-
(a.price||0)

);

}

if(
currentSort==="newest"
){

filtered.sort(

(a,b)=>

(b.createdAt||0)-
(a.createdAt||0)

);

}

renderServices(
filtered
);

}

/* ===================================
FIREBASE LOAD
=================================== */

showLoading();

const serviceQuery =

query(

collection(
db,
"services"
),

where(
"active",
"==",
true
)

);

onSnapshot(

serviceQuery,

(snapshot)=>{

allServices = [];

snapshot.forEach(doc=>{

allServices.push({

id:doc.id,

...doc.data()

});

});
const categories = new Set();

allServices.forEach(service=>{

if(service.category){

categories.add(
service.category
);

}

});

let categoryHtml = `

<button
class="categoryChip activeChip"
data-category="All">

All

</button>

`;

categories.forEach(category=>{

categoryHtml += `

<button
class="categoryChip"
data-category="${category}">

${category}

</button>

`;

});

document.getElementById(
"categoryScroller"
).innerHTML =
categoryHtml;

document
.querySelectorAll(
".categoryChip"
)

.forEach(chip=>{

chip.addEventListener(

"click",

()=>{

document
.querySelectorAll(
".categoryChip"
)

.forEach(item=>{

item.classList.remove(
"activeChip"
);

});

chip.classList.add(
"activeChip"
);

filterCategory(
chip.dataset.category
);

}

);

});

applyFilters();

}

);

/* ===================================
SEARCH
=================================== */

if(globalSearch){

globalSearch.addEventListener(

"keyup",

e=>{

currentSearch =

e.target.value
.toLowerCase()
.trim();

applyFilters();

}

);

}

/* ===================================
SORT
=================================== */

if(sortServices){

sortServices.addEventListener(

"change",

e=>{

currentSort =
e.target.value;

applyFilters();

}

);

}

/* ===================================
CATEGORY
=================================== */

window.filterCategory =
function(category){

currentCategory =
category;

applyFilters();

};

</script>

<script>

/* ===================================
GET CART
=================================== */

window.getCart =
function(){

return JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

};

/* ===================================
SAVE CART
=================================== */

window.saveCart =
function(cart){

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

if(
window.updateNavbarCartCount
){

updateNavbarCartCount();

}

};

/* ===================================
ADD TO CART
=================================== */

window.addToCart =
function(

id,
name,
price,
category,
subCategory

){

let cart =

getCart();

const existing =

cart.find(

item=>

item.serviceId===id

);

if(existing){

existing.qty++;

}else{

cart.push({

 serviceId:id,

 serviceName:name,

 category,

 subCategory,

 price,

 qty:1

});

}

saveCart(cart);

showToast(

name +
" added successfully"

);

};

/* ===================================
SHOW TOAST
=================================== */

window.showToast =
function(message){

const toast =

document.getElementById(
"cartToast"
);

const text =

document.getElementById(
"toastText"
);

if(!toast || !text) return;

text.innerHTML =
message;

toast.classList.add(
"showToast"
);

setTimeout(()=>{

toast.classList.remove(
"showToast"
);

},2000);

};

/* ===================================
TOTAL ITEMS
=================================== */

window.getCartItemsCount =
function(){

const cart =
getCart();

let total = 0;

cart.forEach(item=>{

total +=
item.qty || 1;

});

return total;

};

/* ===================================
TOTAL PRICE
=================================== */

window.getCartTotal =
function(){

const cart =
getCart();

let total = 0;

cart.forEach(item=>{

total +=

(item.price || 0)

*

(item.qty || 1);

});

return total;

};

/* ===================================
OPEN SERVICE
=================================== */

window.openService =
function(serviceId){

window.location.href =

`service-details.html?id=${serviceId}`;

};

/* ===================================
OPEN CART
=================================== */

window.goCart =
function(){

window.location.href =
"cart.html";

};

console.log(
"QuickPress Cart Ready"
);

</script><!-- ===================================

<script>

/* ===================================
NAVIGATION
=================================== */

document
.querySelectorAll(".navItem")
.forEach(item=>{

item.addEventListener(

"click",

()=>{

const page =
item.dataset.page;

if(page==="home"){

window.location.href =
"index.html";

}

if(page==="services"){

window.location.href =
"services.html";

}

if(page==="cart"){

window.location.href =
"cart.html";

}

if(page==="orders"){

window.location.href =
"orders.html";

}

if(page==="profile"){

window.location.href =
"profile.html";

}

}

);

});

/* ===================================
ACTIVE PAGE
=================================== */

const currentPage =

window.location.pathname
.split("/")
.pop();

document
.querySelectorAll(".navItem")
.forEach(item=>{

item.classList.remove(
"activeNav"
);

const page =
item.dataset.page;

if(

(currentPage==="services.html" && page==="services")

||

(currentPage==="index.html" && page==="home")

||

(currentPage==="cart.html" && page==="cart")

||

(currentPage==="orders.html" && page==="orders")

||

(currentPage==="profile.html" && page==="profile")

){

item.classList.add(
"activeNav"
);

}

});

/* ===================================
CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(

/* ===================================
FIREBASE AUTH

from

LOGIN CHECK

ORDERS PAGE

function(){

function(){

||

currentUser.phoneNumber

||

currentUser.email

/* ===================================
FILTER ENGINE
=================================== */

let currentSearchText = "";

let currentCategoryFilter = "All";

let currentSortFilter = "popular";

/* ===================================
SEARCH SYSTEM
=================================== */

const searchInput =

document.getElementById(
"globalSearch"
);

if(searchInput){

searchInput.addEventListener(

"input",

function(){

currentSearchText =

this.value
.toLowerCase()
.trim();

applyAdvancedFilters();

}

);

}

/* ===================================
CATEGORY FILTER
=================================== */

window.filterCategory =
function(category){

currentCategoryFilter =
category;

applyAdvancedFilters();

};

/* ===================================
SORT FILTER
=================================== */

const sortSelect =

document.getElementById(
"sortServices"
);

if(sortSelect){

sortSelect.addEventListener(

"change",

function(){

currentSortFilter =
this.value;

applyAdvancedFilters();

}

);

}

/* ===================================
MAIN FILTER ENGINE
=================================== */

window.applyAdvancedFilters =
function(){

if(!window.allServices){

return;

}

let filtered =

[...window.allServices];

/* Search */

if(currentSearchText){

filtered =

filtered.filter(

service=>{

const name =

(service.name || "")
.toLowerCase();

const category =

(service.category || "")
.toLowerCase();

const description =

(service.description || "")
.toLowerCase();

return (

name.includes(
currentSearchText
)

||

category.includes(
currentSearchText
)

||

description.includes(
currentSearchText
)

);

}

);

}

/* Category */

if(

currentCategoryFilter !==
"All"

){

filtered =

filtered.filter(

service=>

service.category ===

currentCategoryFilter

);

}

/* Sorting */

switch(

currentSortFilter

){

case "lowToHigh":

filtered.sort(

(a,b)=>

(a.price||0)

-

(b.price||0)

);

break;

case "highToLow":

filtered.sort(

(a,b)=>

(b.price||0)

-

(a.price||0)

);

break;

case "newest":

filtered.sort(

(a,b)=>

(b.createdAt||0)

-

(a.createdAt||0)

);

break;

default:

break;

}

/* Update Counter */

if(
window.updateResultCount
){

updateResultCount(

filtered.length

);

}

/* Render */

if(
window.renderServices
){

renderServices(
filtered
);

}

};

/* ===================================
SERVICE CACHE
=================================== */

window.saveServicesCache =
function(data){

try{

localStorage.setItem(

"servicesCache",

JSON.stringify(
data
)

);

}catch(error){

console.log(error);

}

};

window.loadServicesCache =
function(){

try{

return JSON.parse(

localStorage.getItem(
"servicesCache"
)

|| "[]"

);

}catch(error){

return [];

}

};

/* ===================================
AUTO CACHE
=================================== */

window.cacheServices =
function(){

if(
window.allServices
){

saveServicesCache(
window.allServices
);

}

};

/* ===================================
SEARCH CLEAR
=================================== */

window.clearSearch =
function(){

if(searchInput){

searchInput.value = "";

}

currentSearchText = "";

applyAdvancedFilters();

};

/* ===================================
FILTER RESET
=================================== */

window.resetFilters =
function(){

currentSearchText = "";

currentCategoryFilter =

"All";

currentSortFilter =

"popular";

if(searchInput){

searchInput.value = "";

}

if(sortSelect){

sortSelect.value =

"popular";

}

document
.querySelectorAll(
".categoryChip"
)

.forEach(chip=>{

chip.classList.remove(
"activeChip"
);

if(

chip.dataset.category
=== "All"

){

chip.classList.add(
"activeChip"
);

}

});

applyAdvancedFilters();

};

/* ===================================
PERFORMANCE
=================================== */

window.debounce =
function(callback,delay){

let timer;

return function(){

clearTimeout(timer);

timer = setTimeout(

()=>{

callback.apply(
this,
arguments
);

},

delay

);

};

};

/* ===================================
READY
=================================== */

console.log(
"QuickPress Filter Engine Loaded"
);

</script><script>

/* ===================================
GET CART
=================================== */

window.getCart =
function(){

try{

return JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

}catch(error){

return [];

}

};

/* ===================================
SAVE CART
=================================== */

window.saveCart =
function(cart){

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

if(
window.updateNavbarCartCount
){

updateNavbarCartCount();

}

};

/* ===================================
ADD TO CART
=================================== */

window.addToCart =
function(

id,
name,
price,
category

){

let cart =
getCart();

const existing =

cart.find(

item=>

item.serviceId === id

);

if(existing){

existing.qty++;

}else{

cart.push({

serviceId:id,

serviceName:name,

price,

category,

qty:1,

addedAt:Date.now()

});

}

saveCart(cart);

if(window.showToast){

showToast(

name +
" added to cart"

);

}

};

/* ===================================
INCREASE QTY
=================================== */

window.increaseQty =
function(serviceId){

let cart =
getCart();

const item =

cart.find(

item=>

item.serviceId === serviceId

);

if(item){

item.qty++;

}

saveCart(cart);

if(window.renderCart){

renderCart();

}

};

/* ===================================
DECREASE QTY
=================================== */

window.decreaseQty =
function(serviceId){

let cart =
getCart();

const item =

cart.find(

item=>

item.serviceId === serviceId

);

if(!item) return;

item.qty--;

if(item.qty <= 0){

cart = cart.filter(

x=>

x.serviceId !== serviceId

);

}

saveCart(cart);

if(window.renderCart){

renderCart();

}

};

/* ===================================
REMOVE ITEM
=================================== */

window.removeCartItem =
function(serviceId){

let cart =
getCart();

cart =

cart.filter(

item=>

item.serviceId !== serviceId

);

saveCart(cart);

if(window.renderCart){

renderCart();

}

if(window.showToast){

showToast(
"Item Removed"
);

}

};

/* ===================================
CLEAR CART
=================================== */

window.clearCart =
function(){

localStorage.removeItem(
"cart"
);

if(
window.updateNavbarCartCount
){

updateNavbarCartCount();

}

if(window.renderCart){

renderCart();

}

};

/* ===================================
ITEM COUNT
=================================== */

window.getCartItemsCount =
function(){

const cart =
getCart();

let total = 0;

cart.forEach(item=>{

total +=
item.qty || 1;

});

return total;

};

/* ===================================
TOTAL PRICE
=================================== */

window.getCartTotal =
function(){

const cart =
getCart();

let total = 0;

cart.forEach(item=>{

total +=

(item.price || 0)

*

(item.qty || 1);

});

return total;

};

/* ===================================
ORDER SUMMARY
=================================== */

window.getOrderSummary =
function(){

const subtotal =

getCartTotal();

const deliveryFee =

subtotal >= 299

? 0

: 49;

Math.round(
subtotal * 0.05
);

const grandTotal =

subtotal +
deliveryFee +
tax;

subtotal,

deliveryFee,

tax,

grandTotal,

items:

getCartItemsCount()

};

};

CHECKOUT
=================================== */

window.goCheckout =
function(){

getCart();

if(cart.length===0){

"Your Cart Is Empty"
);

return;

}

"checkout.html";

};

/* ===================================
COUPON SUPPORT
=================================== */

window.applyCoupon =
function(code){

getOrderSummary();

if(code==="WELCOME50"){

Math.round(

summary.subtotal * 0.50

);

}

if(code==="QUICK20"){

discount =

Math.round(

summary.subtotal * 0.20

);

}

/* ===================================
CHECKOUT DATA
=================================== */

window.createCheckoutData =
function(){

return{

items:getCart(),

summary:getOrderSummary(),

createdAt:
Date.now()

};

};

"QuickPress Cart Engine Loaded"
);
