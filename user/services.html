<script type="module">

import { db }
from "./firebase.js";

import {
collection,
query,
where,
orderBy,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
GLOBAL
=================================== */

window.selectedCategoryId = null;

/* ===================================
LOAD CATEGORIES
=================================== */

const categorySlider =

document.getElementById(
"categorySlider"
);

onSnapshot(

query(

collection(
db,
"categories"
),

where(
"active",
"!=",
false
),

orderBy(
"position",
"asc"
)

),

(snapshot)=>{

categorySlider.innerHTML = "";

let firstCategory = null;

snapshot.forEach(doc=>{

const category = {

id:doc.id,

...doc.data()

};

if(!firstCategory){

firstCategory =
category.id;

}

/* ===================================
CATEGORY CARD
=================================== */

categorySlider.innerHTML +=

`

<div

class="categoryCard"

data-id="${category.id}"

onclick="selectCategory(

'${category.id}'

)">

<div
class="categoryIcon">

${category.icon || "🧺"}

</div>

<h4>

${category.name}

</h4>

</div>

`;

});

/* ===================================
AUTO SELECT FIRST
=================================== */

if(

!window.selectedCategoryId &&
firstCategory

){

selectCategory(
firstCategory
);

}

}

/* ===================================
ERROR SAFE
=================================== */

,console.error

);

/* ===================================
SELECT CATEGORY
=================================== */

window.selectCategory =
function(categoryId){

window.selectedCategoryId =
categoryId;

/* ACTIVE STATE */

document
.querySelectorAll(
".categoryCard"
)

.forEach(card=>{

card.classList.remove(
"active"
);

if(

card.dataset.id ===
categoryId

){

card.classList.add(
"active"
);

}

});

/* LOAD SUB CATEGORY */

if(window.loadSubCategories){

window.loadSubCategories(
categoryId
);

}

};

</script>

<script type="module">

import { db }
from "./firebase.js";

import {
collection,
query,
where,
orderBy,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
GLOBAL
=================================== */

window.selectedSubCategoryId =
null;

/* ===================================
LOAD SUB CATEGORIES
=================================== */

window.loadSubCategories =
function(categoryId){

const subCategoryTabs =

document.getElementById(
"subCategoryTabs"
);

onSnapshot(

query(

collection(
db,
"subcategories"
),

where(
"categoryId",
"==",
categoryId
),

orderBy(
"position",
"asc"
)

),

(snapshot)=>{

subCategoryTabs.innerHTML =
"";

let firstSubCategory =
null;

snapshot.forEach(doc=>{

const subCategory = {

id:doc.id,

...doc.data()

};

if(
subCategory.active === false
)
return;

if(!firstSubCategory){

firstSubCategory =
subCategory.id;

}

/* ===================================
TAB
=================================== */

subCategoryTabs.innerHTML +=

`

<button

class="subCategoryBtn"

data-id="${subCategory.id}"

onclick="selectSubCategory(

'${subCategory.id}'

)">

${subCategory.icon || "👕"}

&nbsp;

${subCategory.name}

</button>

`;

});

/* ===================================
AUTO SELECT FIRST
=================================== */

if(firstSubCategory){

selectSubCategory(
firstSubCategory
);

}

}

);

};

/* ===================================
SELECT SUB CATEGORY
=================================== */

window.selectSubCategory =
function(subCategoryId){

window.selectedSubCategoryId =
subCategoryId;

/* ACTIVE STATE */

document
.querySelectorAll(
".subCategoryBtn"
)

.forEach(btn=>{

btn.classList.remove(
"active"
);

if(

btn.dataset.id ===
subCategoryId

){

btn.classList.add(
"active"
);

}

});

/* ===================================
LOAD SERVICES
=================================== */

if(window.loadServices){

window.loadServices(
subCategoryId
);

}

};

</script>

<script type="module">

import { db }
from "./firebase.js";

import {
collection,
query,
where,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
LOAD SERVICES
=================================== */

window.loadServices =
function(subCategoryId){

const serviceGrid =

document.getElementById(
"serviceGrid"
);

const city =

localStorage.getItem(
"userCity"
)

|| "Kasganj";

onSnapshot(

query(

collection(
db,
"services"
),

where(
"subcategoryId",
"==",
subCategoryId
)

),

(snapshot)=>{

serviceGrid.innerHTML = "";

if(snapshot.empty){

serviceGrid.innerHTML =

`

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
font-weight:700;
">

No Services Found

</div>

`;

return;

}

snapshot.forEach(doc=>{

const service = {

id:doc.id,

...doc.data()

};

/* ACTIVE CHECK */

if(
service.active === false
)
return;

/* CITY PRICE */

let price =

service.basePrice ||
service.price ||
0;

if(

service.cityPricing &&
service.cityPricing[city]

){

price =

service.cityPricing[
city
];

}

/* CARD */

serviceGrid.innerHTML +=

`

<div
class="serviceCard"

onclick="openService(

'${service.id}'

)">

<div
class="serviceIcon">

${service.icon || "👕"}

</div>

<div
class="serviceName">

${service.name}

</div>

<div
class="servicePrice">

₹${price}

</div>

<button
class="addBtn"

onclick="event.stopPropagation();

addToCart(

'${service.id}',

'${service.name}',

${price},

'${service.categoryId}',

'${service.subcategoryId}'

)">

Add

</button>

</div>

`;

});

}

);

};

/* ===================================
SERVICE DETAILS
=================================== */

window.openService =
function(serviceId){

window.location.href =

`service-details.html?id=${serviceId}`;

};

/* ===================================
TOAST
=================================== */

window.showToast =
function(name){

const toast =

document.getElementById(
"cartToast"
);

document.getElementById(
"toastText"
)

.innerHTML =

name + " added";

toast.style.display =
"flex";

toast.classList.add(
"showToast"
);

setTimeout(()=>{

toast.classList.remove(
"showToast"
);

setTimeout(()=>{

toast.style.display =
"none";

},300);

},2000);

};

</script>

  <script>

/* ===================================
ADD TO CART
=================================== */

window.addToCart =
function(

serviceId,
serviceName,
price,
categoryId,
subcategoryId

){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

/* ===================================
CHECK EXISTING
=================================== */

const existing =

cart.find(

item=>

item.serviceId ===
serviceId

);

if(existing){

existing.qty++;

}else{

cart.push({

serviceId,

serviceName,

price,

categoryId,

subcategoryId,

qty:1,

city:

localStorage.getItem(
"userCity"
)

|| "Kasganj",

addedAt:
Date.now()

});

}

/* ===================================
SAVE
=================================== */

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

/* ===================================
UPDATE BADGE
=================================== */

updateCartBadge();

/* ===================================
TOAST
=================================== */

showToast(
serviceName
);

};

/* ===================================
UPDATE CART BADGE
=================================== */

window.updateCartBadge =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total +=
item.qty || 1;

});

const badge =

document.getElementById(
"cartBadge"
);

if(!badge)
return;

badge.innerHTML =
total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateCartBadge();

/* ===================================
SEARCH SERVICES
=================================== */

const searchInput =

document.getElementById(
"serviceSearch"
);

if(searchInput){

searchInput.addEventListener(

"input",

function(){

const keyword =

this.value
.toLowerCase()
.trim();

document
.querySelectorAll(
".serviceCard"
)

.forEach(card=>{

const name =

card.innerText
.toLowerCase();

if(

name.includes(
keyword
)

){

card.style.display =
"block";

}else{

card.style.display =
"none";

}

});

}

);

}

/* ===================================
GO CART
=================================== */

window.goCart =
function(){

window.location.href =
"cart.html";

};

/* ===================================
CART TOTAL
=================================== */

window.getCartTotal =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total +=

(item.price || 0)

*

(item.qty || 1);

});

return total;

};

/* ===================================
CLEAR CART
=================================== */

window.clearCart =
function(){

localStorage.removeItem(
"cart"
);

updateCartBadge();

};

<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
AUTH
=================================== */

let currentUser = null;

onAuthStateChanged(

auth,

(user)=>{

currentUser = user;

}

/* error callback */
,console.error

);

/* ===================================
LIVE CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge)
return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateNavbarCartCount();

/* ===================================
SYNC TOP CART
=================================== */

function syncTopCart(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"cartBadge"
);

if(!badge)
return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

}

syncTopCart();

/* ===================================
NAVIGATION
=================================== */

document
.querySelectorAll(
".navItem"
)

.forEach(item=>{

item.addEventListener(

"click",

()=>{

const page =
item.dataset.page;

if(page==="home"){

window.location.href =
"index.html";

}

if(page==="services"){

window.location.href =
"services.html";

}

if(page==="cart"){

window.location.href =
"cart.html";

}

if(page==="orders"){

if(!currentUser){

window.location.href =
"login.html";

return;

}

window.location.href =
"orders.html";

}

if(page==="profile"){

if(!currentUser){

window.location.href =
"login.html";

return;

}

window.location.href =
"profile.html";

}

}

);

});

/* ===================================
PROFILE BUTTON
=================================== */

window.openProfile =
function(){

if(currentUser){

window.location.href =
"profile.html";

}else{

window.location.href =
"login.html";

}

};

/* ===================================
AUTO REFRESH BADGE
=================================== */

window.addEventListener(

"storage",

()=>{

updateNavbarCartCount();

syncTopCart();

}

);

/* ===================================
PAGE READY
=================================== */

console.log(

"QuickPress Services V2 Ready"

);

</script>
