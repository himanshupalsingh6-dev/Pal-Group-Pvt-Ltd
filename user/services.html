<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPress Services</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =========================================
RESET
========================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:#F6F7FB;
overflow-x:hidden;
padding-bottom:120px;
color:#111827;
}

/* =========================================
HEADER
========================================= */

.serviceHero{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:18px;
border-bottom-left-radius:34px;
border-bottom-right-radius:34px;

position:sticky;
top:0;
z-index:999;

}

.topBar{

display:flex;
justify-content:space-between;
align-items:center;

}

.pageTitle{

font-size:32px;
font-weight:900;

}

.pageSub{

margin-top:6px;

font-size:13px;
font-weight:700;

color:#374151;

}

.topActions{

display:flex;
gap:10px;

}

.iconBtn{

width:48px;
height:48px;

border:none;

border-radius:18px;

background:#fff;

display:flex;
align-items:center;
justify-content:center;

font-size:18px;

cursor:pointer;

box-shadow:
0 8px 20px rgba(0,0,0,.06);

}

/* =========================================
SEARCH
========================================= */

.searchWrap{

margin-top:18px;

}

.searchBar{

height:58px;

background:#fff;

border-radius:20px;

display:flex;
align-items:center;

padding:0 16px;

box-shadow:
0 10px 24px rgba(0,0,0,.06);

}

.searchBar input{

flex:1;

border:none;
outline:none;

padding:0 12px;

font-size:15px;
font-weight:600;

background:none;

}

.searchIcon{

font-size:18px;
color:#16A34A;

}

/* =========================================
LOCATION BAR
========================================= */

.locationBar{

margin-top:14px;

display:flex;
align-items:center;
gap:8px;

font-size:13px;
font-weight:800;

color:#374151;

}

/* =========================================
FILTERS
========================================= */

.filterSection{

padding:20px 16px;

}

.filterWrap{

display:flex;
gap:12px;

overflow-x:auto;

scrollbar-width:none;

}

.filterWrap::-webkit-scrollbar{
display:none;
}

.filterBtn{

height:44px;

padding:0 18px;

border:none;

border-radius:999px;

background:#fff;

font-size:13px;
font-weight:800;

white-space:nowrap;

cursor:pointer;

box-shadow:
0 6px 18px rgba(0,0,0,.05);

}

.activeFilter{

background:#16A34A;
color:#fff;

}

/* =========================================
SERVICE GRID
========================================= */

.serviceSection{

padding:0 16px;

}

.serviceGrid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:14px;

}

.serviceCard{

background:#fff;

border-radius:26px;

overflow:hidden;

position:relative;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

cursor:pointer;

transition:.3s;

}

.serviceCard:hover{

transform:translateY(-4px);

}

/* =========================================
BADGES
========================================= */

.badgeWrap{

position:absolute;

left:10px;
top:10px;

display:flex;
flex-wrap:wrap;
gap:6px;

z-index:5;

}

.badge{

height:24px;

padding:0 10px;

border-radius:999px;

display:flex;
align-items:center;

font-size:10px;
font-weight:900;

}

.trendingBadge{

background:#FEF3C7;
color:#92400E;

}

.bestBadge{

background:#DCFCE7;
color:#166534;

}

.sameDayBadge{

background:#DBEAFE;
color:#1E40AF;

}

.premiumBadge{

background:#F3E8FF;
color:#6B21A8;

}

/* =========================================
IMAGE
========================================= */

.serviceImage{

height:150px;

background:#F3F4F6;

display:flex;
align-items:center;
justify-content:center;

font-size:58px;

}

/* =========================================
INFO
========================================= */

.serviceInfo{

padding:14px;

}

.serviceName{

font-size:15px;
font-weight:900;

}

.serviceDesc{

margin-top:6px;

font-size:12px;

line-height:1.6;

color:#6B7280;

}

.ratingRow{

margin-top:10px;

display:flex;
align-items:center;
gap:8px;

font-size:12px;
font-weight:800;

}

.rating{

color:#16A34A;

}

.reviewCount{

color:#6B7280;

}

.deliveryTime{

margin-top:8px;

font-size:12px;
font-weight:700;

color:#2563EB;

}

.cityPrice{

margin-top:12px;

font-size:24px;
font-weight:900;

}

.cityName{

font-size:12px;
font-weight:700;

color:#6B7280;

}

.serviceBottom{

margin-top:14px;

display:flex;
justify-content:space-between;
align-items:center;

}

.viewBtn{

height:40px;

padding:0 16px;

border:none;

border-radius:12px;

background:#111827;

color:#fff;

font-size:12px;
font-weight:900;

cursor:pointer;

}

.addBtn{

height:40px;

padding:0 16px;

border:none;

border-radius:12px;

background:#16A34A;

color:#fff;

font-size:12px;
font-weight:900;

cursor:pointer;

}

@media(min-width:900px){

.serviceGrid{

grid-template-columns:
repeat(4,1fr);

}

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="serviceHero">

<div class="topBar">

<div>

<div class="pageTitle">
Services
</div>

<div class="pageSub">
Premium Laundry & Cleaning
</div>

</div>

<div class="topActions">

<button class="iconBtn">
<i class="fa-solid fa-wallet"></i>
</button>

<button class="iconBtn">
<i class="fa-regular fa-user"></i>
</button>

</div>

</div>

<div class="searchWrap">

<div class="searchBar">

<i class="fa-solid fa-magnifying-glass searchIcon"></i>

<input
id="searchInput"
type="text"
placeholder="Search Services">

</div>

</div>

<div
class="locationBar"
id="locationBar">

📍 Kasganj, Uttar Pradesh

</div>

</div>

<!-- FILTERS -->

<div class="filterSection">

<div class="filterWrap">

<button class="filterBtn activeFilter">
All
</button>

<button class="filterBtn">
Dry Cleaning
</button>

<button class="filterBtn">
Wash & Fold
</button>

<button class="filterBtn">
Steam Iron
</button>

<button class="filterBtn">
Shoe Care
</button>

<button class="filterBtn">
Blanket Care
</button>

<button class="filterBtn">
Premium Care
</button>

</div>

</div>

<!-- SERVICES -->

<div class="serviceSection">

<div
class="serviceGrid"
id="serviceGrid">

<!-- Firebase Services Here -->

</div>

</div>
