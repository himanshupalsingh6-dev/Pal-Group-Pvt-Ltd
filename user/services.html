<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Services

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;

body{

/* HEADER */

.servicesHeader{

position:sticky;

top:0;

z-index:999;

padding:16px;

0 4px 20px rgba(0,0,0,.05);

.headerTop{

}

.brand{

.cartBtn{

}

.cartBadge{

top:-4px;

right:-4px;

color:#fff;

border-radius:999px;

align-items:center;

}

/* SEARCH */

.searchWrap{

margin-top:16px;

}

.searchBox{

height:54px;

background:#F3F4F6;

border-radius:16px;

display:flex;

align-items:center;

}

.searchBox input{

</style>

</head>

<body>

<div class="servicesHeader">

<div class="headerTop">

<div>

<div class="brand">

QuickPress

</div>

<div class="headerSub">

Laundry Services

</div>

</div>

<button
class="cartBtn"
onclick="location.href='cart.html'">

<i class="fa-solid fa-cart-shopping"></i>

<div
id="cartBadge"
class="cartBadge">

0

</div>

</button>

</div>

<div class="searchWrap">

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="serviceSearch"
type="text"
placeholder="Search Services">

</div>

</div>

</div><section>

<div
class="categorySlider"
id="categorySlider">

<!-- Dynamic -->

</div>

</section>

<style>

.categorySlider{

display:flex;

gap:12px;

overflow-x:auto;

padding:16px;

scrollbar-width:none;

}

.categorySlider::-webkit-scrollbar{

display:none;

}

.categoryChip{

flex-shrink:0;

height:44px;

padding:0 20px;

border:none;

border-radius:999px;

background:#fff;

font-size:13px;

font-weight:800;

cursor:pointer;

box-shadow:
0 4px 12px rgba(0,0,0,.05);

}

.categoryChip.active{

background:#16A34A;

color:#fff;

}

</style><section>

<div
class="subCategorySlider"
id="subCategorySlider">

<!-- Dynamic -->

</div>

</section>

<style>

.subCategorySlider{

display:flex;

gap:10px;

overflow-x:auto;

padding:0 16px 16px;

scrollbar-width:none;

}

.subCategorySlider::-webkit-scrollbar{

display:none;

}

.subChip{

flex-shrink:0;

height:38px;

padding:0 16px;

border:none;

border-radius:999px;

background:#F3F4F6;

font-size:12px;

font-weight:700;

cursor:pointer;

}

.subChip.active{

background:#F4B400;

color:#111827;

}

</style><script type="module">

import { db }
from "./firebase.js";

import {

collection,
query,
where,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.servicesCollection =

collection(
db,
"services"
);

</script><script type="module">

window.selectedCategory = "";
window.selectedSubCategory = "";

window.loadCategories =
function(){

onSnapshot(

servicesCollection,

(snapshot)=>{

const categories =
new Set();

snapshot.forEach(doc=>{

const data =
doc.data();

if(data.active){

categories.add(
data.category
);

}

});

let html="";

Array.from(categories)

.forEach((category,index)=>{

html += `

<button

class="categoryChip
${index===0?'active':''}"

onclick="selectCategory('${category}')">

${category}

</button>

`;

});

document.getElementById(
"categorySlider"
).innerHTML =
html;

if(categories.size>0){

selectedCategory =

Array.from(categories)[0];

loadSubCategories();

}

}

);

};

</script><script type="module">

window.loadSubCategories =
function(){

onSnapshot(

servicesCollection,

(snapshot)=>{

const subs =
new Set();

snapshot.forEach(doc=>{

const data =
doc.data();

if(

data.category ===
selectedCategory

){

subs.add(
data.subCategory
);

}

});

let html="";

Array.from(subs)

.forEach((sub,index)=>{

html += `

<button

class="subChip
${index===0?'active':''}"

onclick="selectSubCategory('${sub}')">

${sub}

</button>

`;

});

document.getElementById(
"subCategorySlider"
).innerHTML =
html;

if(subs.size>0){

selectedSubCategory =

Array.from(subs)[0];

loadServices();

}

}

);

};

window.selectCategory =
function(category){

selectedCategory =
category;

document
.querySelectorAll(
".categoryChip"
)

.forEach(btn=>{

btn.classList.remove(
"active"
);

if(btn.innerText===category){

btn.classList.add(
"active"
);

}

});

loadSubCategories();

};

</script><section style="padding:0 16px;">

<div
id="servicesContainer">

</div>

</section>

<script type="module">

window.allServices = [];

window.loadServices =
function(){

onSnapshot(

servicesCollection,

(snapshot)=>{

allServices = [];

snapshot.forEach(doc=>{

const data =
doc.data();

if(

data.active === true

&&

data.category ===
selectedCategory

&&

data.subCategory ===
selectedSubCategory

){

allServices.push({

id:doc.id,

...data

});

}

});

renderServices(
allServices
);

}

);

};

window.selectSubCategory =
function(sub){

selectedSubCategory = sub;

document
.querySelectorAll(
".subChip"
)

.forEach(btn=>{

btn.classList.remove(
"active"
);

if(btn.innerText===sub){

btn.classList.add(
"active"
);

}

});

loadServices();

};

loadCategories();

</script><style>

.serviceCard{

background:#fff;

border-radius:22px;

padding:16px;

margin-bottom:14px;

display:flex;

gap:14px;

align-items:center;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.serviceImage{

width:80px;

height:80px;

border-radius:16px;

object-fit:cover;

background:#F3F4F6;

}

.serviceContent{

flex:1;

}

.serviceName{

font-size:15px;

font-weight:900;

color:#111827;

}

.serviceMeta{

font-size:12px;

color:#6B7280;

margin-top:5px;

}

.serviceDescription{

font-size:12px;

color:#9CA3AF;

margin-top:4px;

}

.servicePrice{

margin-top:10px;

font-size:18px;

font-weight:900;

color:#16A34A;

}

</style>

<script>

window.renderServices =
function(services){

const container =

document.getElementById(
"servicesContainer"
);

if(services.length===0){

container.innerHTML =

`

<div style="
background:#fff;
padding:30px;
border-radius:20px;
text-align:center;
">

No Services Found

</div>

`;

return;

}

let html = "";

services.forEach(service=>{

html += `

<div class="serviceCard">

<img

src="${
service.image ||
'https://via.placeholder.com/80'
}"

class="serviceImage">

<div class="serviceContent">

<div class="serviceName">

${service.serviceName}

</div>

<div class="serviceMeta">

${service.category}
>

${service.subCategory}

</div>

<div class="serviceDescription">

${service.description || ''}

</div>

<div class="servicePrice">

₹${service.price}

</div>

</div>

<div>

<button

class="addServiceBtn"

onclick="addServiceToCart(
'${service.id}'
)">

Add

</button>

</div>

</div>

`;

});

container.innerHTML = html;

};

</script><style>

.addServiceBtn{

width:80px;

height:42px;

border:none;

border-radius:12px;

background:#16A34A;

color:#fff;

font-weight:900;

cursor:pointer;

}

.qtyBox{

display:flex;

align-items:center;

gap:8px;

}

.qtyBtn{

width:32px;

height:32px;

border:none;

border-radius:10px;

background:#16A34A;

color:#fff;

font-weight:900;

cursor:pointer;

}

.qtyCount{

font-size:14px;

font-weight:900;

}

</style><script>

window.addServiceToCart =
function(serviceId){

const service =

allServices.find(

s=>s.id===serviceId

);

if(!service) return;

let cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

const existing =

cart.find(

item=>

item.serviceId===serviceId

);

if(existing){

existing.qty++;

}else{

cart.push({

serviceId:service.id,

serviceName:
service.serviceName,

category:
service.category,

subCategory:
service.subCategory,

price:
service.price,

qty:1

});

}

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

updateCartBadge();

showToast(
"Added To Cart"
);

};

</script><script>

document.getElementById(
"serviceSearch"
)

.addEventListener(

"input",

function(){

const query =

this.value
.toLowerCase();

const filtered =

allServices.filter(

service=>

service.serviceName

.toLowerCase()

.includes(query)

||

service.subCategory

.toLowerCase()

.includes(query)

||

service.category

.toLowerCase()

.includes(query)

);

renderServices(
filtered
);

}

);

</script><section
style="padding:16px;">

<h3
style="
font-size:20px;
font-weight:900;
margin-bottom:12px;
">

Popular Services

</h3>

<div
id="popularServices">

</div>

</section>

<script>

window.loadPopularServices =
function(){

onSnapshot(

servicesCollection,

(snapshot)=>{

let html="";

snapshot.forEach(doc=>{

const data =
doc.data();

if(
data.popular === true
){

html += `

<div
class="serviceCard">

<img

src="${
data.image ||
'https://via.placeholder.com/80'
}"

class="serviceImage">

<div
class="serviceContent">

<div
class="serviceName">

${data.serviceName}

</div>

<div
class="serviceMeta">

${data.category}
>

${data.subCategory}

</div>

<div
class="servicePrice">

₹${data.price}

</div>

</div>

</div>

`;

}

});

document.getElementById(
"popularServices"
).innerHTML = html;

}

);

};

loadPopularServices();

</script><script>

window.updateCartBadge =
function(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

let total = 0;

cart.forEach(item=>{

total +=

item.qty || 1;

});

document.getElementById(
"cartBadge"
).innerHTML =
total;

};

document.addEventListener(

"DOMContentLoaded",

()=>{

updateCartBadge();

}

);

</script><!-- ===================================
TOAST
=================================== -->

<div
id="serviceToast"
class="serviceToast">

Added To Cart

</div>

<style>

position:fixed;

translateX(-50%);

0 8px 24px rgba(0,0,0,.05);

}

.emptyServices h3{

}

font-size:13px;

color:#6B7280;

}

</style>

<script>

/* ===================================
TOAST
=================================== */

window.showToast =
function(message){

const toast =

document.getElementById(
"serviceToast"
);

toast.innerHTML =
message;

toast.classList.add(
"show"
);

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2000);

};

</script><!-- ===================================
