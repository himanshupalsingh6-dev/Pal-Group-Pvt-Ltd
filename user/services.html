<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Services

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

body{

background:#F6F7FB;

color:#111827;

overflow-x:hidden;

padding-bottom:100px;

}

.appContainer{

max-width:1400px;

margin:auto;

}

/* ===================================
SERVICES HEADER V2
=================================== */

.serviceHeader{

position:sticky;

top:0;

z-index:999;

background:#fff;

padding:12px 16px;

box-shadow:
0 2px 16px rgba(0,0,0,.05);

}

.headerRow{

display:flex;

align-items:center;

justify-content:space-between;

}

/* ===================================
BACK BUTTON
=================================== */

.backBtn{

width:46px;
height:46px;

border:none;

background:#F3F4F6;

border-radius:14px;

cursor:pointer;

font-size:16px;

color:#111827;

}

/* ===================================
CENTER
=================================== */

.headerCenter{

flex:1;

text-align:center;

}

.brandText{

font-size:12px;

font-weight:700;

color:#16A34A;

}

.pageTitle{

font-size:22px;

font-weight:900;

margin-top:2px;

}

/* ===================================
CART
=================================== */

.cartBtn{

position:relative;

width:48px;
height:48px;

border:none;

border-radius:14px;

background:#16A34A;

color:#fff;

font-size:18px;

cursor:pointer;

}

/* CART BADGE */

.cartBadge{

position:absolute;

top:-4px;
right:-4px;

min-width:20px;
height:20px;

padding:0 4px;

border-radius:999px;

background:#EF4444;

display:flex;

align-items:center;
justify-content:center;

font-size:10px;

font-weight:900;

color:#fff;

}

/* ===================================
CART ANIMATION
=================================== */

@keyframes cartBounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-4px);
}

}

.cartBtn{

animation:
cartBounce 2s infinite;

}

/* ===================================
SEARCH
=================================== */

.searchSection{

padding:14px 16px;

}

.searchBar{

height:56px;

background:#fff;

border-radius:18px;

display:flex;

align-items:center;

padding:0 16px;

box-shadow:
0 4px 16px rgba(0,0,0,.04);

}

.searchBar i{

font-size:18px;

color:#16A34A;

}

.searchBar input{

flex:1;

border:none;

outline:none;

background:none;

padding-left:12px;

font-size:15px;

font-weight:600;

}

/* ===================================
SECTION TITLE
=================================== */

.sectionHeading{

font-size:24px;

font-weight:900;

padding:0 16px;

margin-top:10px;

}

/* ===================================
DESKTOP
=================================== */

@media(min-width:1200px){

.serviceHeader{

padding:14px 24px;

}

.pageTitle{

font-size:26px;

}

.searchSection{

padding:16px 24px;

}

}

</style>

</head>

<body>

<div class="appContainer">

<!-- ===================================
HEADER
=================================== -->

<div class="serviceHeader">

<div class="headerRow">

<button
class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="headerCenter">

<div class="brandText">

QuickPress

</div>

<div class="pageTitle">

Services

</div>

</div>

<button
class="cartBtn"
onclick="window.location.href='cart.html'">

<i class="fa-solid fa-cart-shopping"></i>

<div
class="cartBadge"
id="cartBadge">

0

</div>

</button>

</div>

</div>

<!-- ===================================
SEARCH
=================================== -->

<div class="searchSection">

<div class="searchBar">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="serviceSearch"
type="text"
placeholder="Search services...">

</div>

</div>

<!-- ===================================
TITLE
=================================== -->

<h2 class="sectionHeading">

Explore Services

</h2>

<script>

/* ===================================
CART BADGE
=================================== */

function updateCartBadge(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"cartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

}

updateCartBadge();

</script>
