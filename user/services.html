/* ===================================
CART BADGE
=================================== */

function updateCartBadge(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"cartBadge"
);

if(badge){

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

}

}

updateCartBadge();

</script>

<script type="module">

import { db }
from "./firebase.js";

import {
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
DUMMY CATEGORIES
=================================== */

const dummyCategories = [

{
id:"ironing",
name:"Ironing",
icon:"👔"
},

{
id:"dryclean",
name:"Dry Cleaning",
icon:"🧺"
},

{
id:"washfold",
name:"Wash & Fold",
icon:"🫧"
},

{
id:"shoecare",
name:"Shoe Care",
icon:"👟"
},

{
id:"blanket",
name:"Blanket",
icon:"🛏️"
},

{
id:"premium",
name:"Premium",
icon:"✨"
}

];

/* ===================================
LOAD CATEGORIES
=================================== */

const categorySlider =

document.getElementById(
"categorySlider"
);

window.selectedCategoryId =
null;

async function loadCategories(){

try{

const snapshot =

await getDocs(
collection(
db,
"categories"
)
);

let categories = [];

/* FIREBASE DATA */

snapshot.forEach(doc=>{

categories.push({

id:doc.id,

...doc.data()

});

});

/* FALLBACK */

if(categories.length===0){

categories =
dummyCategories;

}

renderCategories(
categories
);

}catch(error){

console.log(
"Using Dummy Categories"
);

/* DUMMY SHOW */

renderCategories(
dummyCategories
);

}

}

loadCategories();

/* ===================================
RENDER
=================================== */

function renderCategories(
categories
){

categorySlider.innerHTML =
"";

categories.forEach(
(category,index)=>{

categorySlider.innerHTML +=

`

<div

class="categoryCard

${index===0 ? 'active' : ''}"

data-id="${category.id}"

onclick="selectCategory(

'${category.id}'

)">

<div
class="categoryIcon">

${category.icon || "🧺"}

</div>

<h4>

${category.name}

</h4>

</div>

`;

});

/* AUTO SELECT */

if(categories.length){

window.selectedCategoryId =

categories[0].id;

if(window.loadSubCategories){

window.loadSubCategories(

categories[0].id

);

}

}

}

/* ===================================
CATEGORY SELECT
=================================== */

window.selectCategory =
function(categoryId){

window.selectedCategoryId =
categoryId;

document
.querySelectorAll(
".categoryCard"
)

.forEach(card=>{

card.classList.remove(
"active"
);

if(

card.dataset.id ===
categoryId

){

card.classList.add(
"active"
);

}

});

if(window.loadSubCategories){

window.loadSubCategories(
categoryId
);

}

};

</script>

<script type="module">

import { db }

collection,
getDocs
}

/* ===================================
DUMMY SUB CATEGORIES
=================================== */

const dummySubCategories = {

ironing:[

{
id:"shirt",
name:"Shirt",
icon:"👕"
},

{
id:"pant",
name:"Pant",
icon:"👖"
},

{
id:"blazer",
name:"Blazer",
icon:"🤵"
},

{
id:"suit",
name:"Suit",
icon:"🧥"
}

],

dryclean:[

{
id:"dcshirt",
name:"Shirt",
icon:"👕"
},

{
id:"dcsaree",
name:"Saree",
icon:"🥻"
},

{
id:"dcjacket",
name:"Jacket",
icon:"🧥"
}

],

washfold:[

{
id:"wfcloth",
name:"Clothes",
icon:"🫧"
}

],

shoecare:[

{
id:"shoe",
name:"Shoes",
icon:"👟"
}

]

};

/* ===================================
LOAD SUB CATEGORIES
=================================== */

window.selectedSubCategoryId =
null;

window.loadSubCategories =
async function(categoryId){

const container =

document.getElementById(
"subCategoryTabs"
);

try{

const snapshot =

await getDocs(
collection(
db,
"subcategories"
)
);

let subCategories = [];

snapshot.forEach(doc=>{

const item = {

id:doc.id,

...doc.data()

};

if(

item.categoryId ===
categoryId

){

subCategories.push(
item
);

}

});

/* FALLBACK */

if(

subCategories.length===0 &&
dummySubCategories[
categoryId
]

){

subCategories =

dummySubCategories[
categoryId
];

}

renderSubCategories(
subCategories
);

}catch(error){

console.log(
"Using Dummy Sub Categories"
);

renderSubCategories(

dummySubCategories[
categoryId
] || []

);

}

};

/* ===================================
RENDER
=================================== */

function renderSubCategories(
subCategories
){

const container =

document.getElementById(
"subCategoryTabs"
);

container.innerHTML = "";

subCategories.forEach(
(sub,index)=>{

container.innerHTML +=

`

<button

class="subCategoryBtn

${index===0 ? 'active' : ''}"

data-id="${sub.id}"

onclick="selectSubCategory(

'${sub.id}'

)">

${sub.icon || "👕"}

&nbsp;

${sub.name}

</button>

`;

});

/* AUTO LOAD */

if(subCategories.length){

window.selectedSubCategoryId =

subCategories[0].id;

if(window.loadServices){

window.loadServices(

subCategories[0].id

);

}

}

}

/* ===================================
SELECT SUB CATEGORY
=================================== */

window.selectSubCategory =
function(subCategoryId){

window.selectedSubCategoryId =
subCategoryId;

document
.querySelectorAll(
".subCategoryBtn"
)

.forEach(btn=>{

btn.classList.remove(
"active"
);

if(

btn.dataset.id ===
subCategoryId

){

btn.classList.add(
"active"
);

}

});

if(window.loadServices){

window.loadServices(
subCategoryId
);

}

};

</script>

<script type="module">

import { db }
from "./firebase.js";

import {
collection,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
DUMMY SERVICES
=================================== */

const dummyServices = {

shirt:[

{
id:"1",
name:"Formal Shirt",
price:12,
icon:"👔"
},

{
id:"2",
name:"Denim Shirt",
price:15,
icon:"👕"
},

{
id:"3",
name:"Cotton Shirt",
price:10,
icon:"👔"
}

],

pant:[

{
id:"4",
name:"Formal Pant",
price:18,
icon:"👖"
},

{
id:"5",
name:"Casual Pant",
price:14,
icon:"👖"
},

{
id:"6",
name:"Jeans",
price:20,
icon:"👖"
}

],

blazer:[

{
id:"7",
name:"Premium Blazer",
price:40,
icon:"🤵"
}

],

suit:[

{
id:"8",
name:"2 Piece Suit",
price:50,
icon:"🧥"
}

]

};

/* ===================================
LOAD SERVICES
=================================== */

window.loadServices =
async function(subCategoryId){

try{

const snapshot =

await getDocs(
collection(
db,
"services"
)
);

let services = [];

snapshot.forEach(doc=>{

const service = {

id:doc.id,

...doc.data()

};

if(

service.subcategoryId ===
subCategoryId

){

services.push(
service
);

}

});

/* FALLBACK */

if(

services.length===0 &&
dummyServices[
subCategoryId
]

){

services =

dummyServices[
subCategoryId
];

}

renderServices(
services
);

}catch(error){

console.log(
"Using Dummy Services"
);

renderServices(

dummyServices[
subCategoryId
] || []

);

}

};

/* ===================================
RENDER
=================================== */

function renderServices(
services
){

const grid =

document.getElementById(
"serviceGrid"
);

grid.innerHTML = "";

if(services.length===0){

grid.innerHTML =

`

<div style="
grid-column:1/-1;
text-align:center;
padding:40px;
font-weight:700;
">

No Services Found

</div>

`;

return;

}

const city =

localStorage.getItem(
"userCity"
)

|| "Kasganj";

services.forEach(service=>{

let price =

service.price ||
service.basePrice ||
0;

/* CITY PRICE */

if(

service.cityPricing &&
service.cityPricing[city]

){

price =

service.cityPricing[
city
];

}

grid.innerHTML +=

`

<div

class="serviceCard"

data-name="${service.name}"

onclick="openService(

'${service.id}'

)">

<div
class="serviceIcon">

${service.icon || "👕"}

</div>

<div
class="serviceName">

${service.name}

</div>

<div
class="servicePrice">

₹${price}

</div>

<button

class="addBtn"

onclick="event.stopPropagation();

addToCart(

'${service.id}',

'${service.name}',

${price}

)">

Add

</button>

</div>

`;

});

}

/* ===================================
SERVICE DETAILS
=================================== */

window.openService =
function(serviceId){

window.location.href =

`service-details.html?id=${serviceId}`;

};

</script>

<script>

/* ===================================
ADD TO CART
=================================== */

window.addToCart =
function(

serviceId,
serviceName,
price

){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

/* ===================================
CHECK EXISTING
=================================== */

const existing =

cart.find(

item=>

item.serviceId ===
serviceId

);

if(existing){

existing.qty++;

}else{

cart.push({

serviceId,

serviceName,

price,

qty:1,

city:

localStorage.getItem(
"userCity"
)

|| "Kasganj",

addedAt:
Date.now()

});

}

/* ===================================
SAVE CART
=================================== */

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

/* ===================================
UPDATE BADGE
=================================== */

if(window.updateCartBadge){

window.updateCartBadge();

}

if(window.updateNavbarCartCount){

window.updateNavbarCartCount();

}

/* ===================================
TOAST
=================================== */

showToast(
serviceName
);

};

/* ===================================
TOAST
=================================== */

window.showToast =
function(name){

const toast =

document.getElementById(
"cartToast"
);

const text =

document.getElementById(
"toastText"
);

text.innerHTML =

name + " added to cart";

toast.style.display =
"flex";

toast.classList.add(
"showToast"
);

setTimeout(()=>{

toast.classList.remove(
"showToast"
);

setTimeout(()=>{

toast.style.display =
"none";

},300);

},2000);

};

/* ===================================
WORKING SEARCH
=================================== */

const searchInput =

document.getElementById(
"serviceSearch"
);

if(searchInput){

searchInput.addEventListener(

"input",

function(){

const keyword =

this.value
.toLowerCase()
.trim();

document
.querySelectorAll(
".serviceCard"
)

.forEach(card=>{

const serviceName =

card.dataset.name
.toLowerCase();

if(

serviceName.includes(
keyword
)

){

card.style.display =
"block";

}else{

card.style.display =
"none";

}

});

}

);

}

/* ===================================
CART TOTAL
=================================== */

window.getCartTotal =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total +=

(item.price || 0)

*

(item.qty || 1);

});

return total;

};

/* ===================================
CART COUNT
=================================== */

window.getCartCount =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let count = 0;

cart.forEach(item=>{

count +=

item.qty || 1;

});

return count;

};

/* ===================================
CLEAR CART
=================================== */

window.clearCart =
function(){

localStorage.removeItem(
"cart"
);

if(window.updateCartBadge){

window.updateCartBadge();

}

};

<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
AUTH
=================================== */

let currentUser = null;

onAuthStateChanged(

auth,

(user)=>{

currentUser = user;

}

);

/* ===================================
PROFILE
=================================== */

window.openProfile =
function(){

if(currentUser){

window.location.href =
"profile.html";

}else{

window.location.href =
"login.html";

}

};

/* ===================================
ORDERS
=================================== */

window.openOrders =
function(){

if(currentUser){

window.location.href =
"orders.html";

}else{

window.location.href =
"login.html";

}

};

/* ===================================
NAVBAR CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateNavbarCartCount();

/* ===================================
SYNC TOP CART
=================================== */

window.addEventListener(

"storage",

()=>{

updateNavbarCartCount();

if(window.updateCartBadge){

updateCartBadge();

}

}

);

/* ===================================
READY
=================================== */

console.log(
"QuickPress Services V3 Loaded"
);

</script>
