<script type="module">

import { db }
from "./firebase.js";

import {
collection,
query,
where,
orderBy,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
GLOBAL
=================================== */

window.selectedCategoryId = null;

window.selectedSubCategoryId = null;

/* ===================================
LOAD CATEGORIES
=================================== */

const categorySlider =

document.getElementById(
"categorySlider"
);

const subCategoryTabs =

document.getElementById(
"subCategoryTabs"
);

onSnapshot(

query(
collection(db,"categories"),
orderBy("position","asc")
),

(snapshot)=>{

categorySlider.innerHTML = "";

let firstCategory = null;

snapshot.forEach(doc=>{

const category = {

id:doc.id,

...doc.data()

};

if(!firstCategory){

firstCategory = category.id;

}

/* =================================== */

categorySlider.innerHTML +=

`

<div
class="categoryCard"
data-id="${category.id}"

onclick="selectCategory('${category.id}')">

<div class="categoryIcon">

${category.icon || "🧺"}

</div>

<h4>

${category.name}

</h4>

</div>

`;

});

/* ===================================
AUTO SELECT FIRST CATEGORY
=================================== */

if(

!window.selectedCategoryId &&
firstCategory

){

window.selectCategory(
firstCategory
);

}

}

);

/* ===================================
CATEGORY SELECT
=================================== */

window.selectCategory =
function(categoryId){

window.selectedCategoryId =
categoryId;

/* ACTIVE UI */

document
.querySelectorAll(
".categoryCard"
)

.forEach(card=>{

card.classList.remove(
"active"
);

if(

card.dataset.id ===
categoryId

){

card.classList.add(
"active"
);

}

});

/* ===================================
LOAD SUB CATEGORY
=================================== */

loadSubCategories(
categoryId
);

};

/* ===================================
LOAD SUB CATEGORIES
=================================== */

function loadSubCategories(

categoryId

){

onSnapshot(

query(

collection(
db,
"subcategories"
),

where(
"categoryId",
"==",
categoryId
),

orderBy(
"position",
"asc"
)

),

(snapshot)=>{

subCategoryTabs.innerHTML =
"";

let firstSub = null;

snapshot.forEach(doc=>{

const sub = {

id:doc.id,

...doc.data()

};

if(!firstSub){

firstSub = sub.id;

}

/* =================================== */

subCategoryTabs.innerHTML +=

`

<button

class="subCategoryBtn"

data-id="${sub.id}"

onclick="selectSubCategory(

'${sub.id}'

)">

${sub.icon || "👕"}

${sub.name}

</button>

`;

});

/* ===================================
AUTO FIRST SUB
=================================== */

if(

firstSub

){

selectSubCategory(
firstSub
);

}

}

);

}

/* ===================================
SUB CATEGORY SELECT
=================================== */

window.selectSubCategory =
function(subCategoryId){

window.selectedSubCategoryId =
subCategoryId;

/* ACTIVE */

document
.querySelectorAll(
".subCategoryBtn"
)

.forEach(btn=>{

btn.classList.remove(
"active"
);

if(

btn.dataset.id ===
subCategoryId

){

btn.classList.add(
"active"
);

}

});

/* ===================================
LOAD SERVICES
=================================== */

if(window.loadServices){

window.loadServices(
subCategoryId
);

}

};

</script>

<script type="module">

import { db }

}

/* ===================================
LOAD SERVICES
=================================== */

window.loadServices =
function(subCategoryId){

const serviceGrid =

document.getElementById(
"serviceGrid"
);

onSnapshot(

query(

collection(
db,
"services"
),

where(
"subcategoryId",
"==",
subCategoryId
)

),

(snapshot)=>{

serviceGrid.innerHTML = "";

/* ===================================
NO DATA
=================================== */

if(snapshot.empty){

serviceGrid.innerHTML =

`

<div style="
grid-column:1/-1;
text-align:center;
padding:30px;
">

No Services Found

</div>

`;

return;

}

/* ===================================
SERVICES
=================================== */

snapshot.forEach(doc=>{

const service = {

id:doc.id,

...doc.data()

};

const price =

getServicePrice(
service
);

serviceGrid.innerHTML +=

`

<div class="serviceCard">

<div
class="serviceIcon">

${service.icon || "👕"}

</div>

<div
class="serviceName">

${service.name}

</div>

class="servicePrice">

₹${price}

class="addBtn"

'${service.id}',

'${service.name}',

${price},

'${service.categoryId}',

'${service.subcategoryId}'

)">

Add

</button>

</div>

`;

});

}

);

};

/* ===================================
CITY WISE PRICE
=================================== */

window.getServicePrice =
function(service){

const city =

localStorage.getItem(
"userCity"
)

|| "Kasganj";

/* =================================== */

if(

service.cityPricing &&
service.cityPricing[city]

){

return service.cityPricing[
city
];

}

/* =================================== */

return service.basePrice ||
service.price ||
0;

};

Ironing
 └ Pant

=================================== */

</script>
<script>

/* ===================================
CART SYSTEM
=================================== */

window.addToCart =
function(

serviceId,
serviceName,
price,
categoryId,
subcategoryId

){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

/* ===================================
CHECK EXISTING
=================================== */

const existing =

cart.find(

item=>

item.serviceId ===
serviceId

);

/* =================================== */

if(existing){

existing.qty++;

}else{

cart.push({

serviceId,

serviceName,

price,

categoryId,

subcategoryId,

qty:1,

city:

localStorage.getItem(
"userCity"
)

|| "Kasganj",

addedAt:
Date.now()

});

}

/* ===================================
SAVE CART
=================================== */

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

/* ===================================
UPDATE NAVBAR
=================================== */

if(window.updateNavbarCartCount){

window.updateNavbarCartCount();

}

/* ===================================
SHOW TOAST
=================================== */

showToast(
serviceName
);

};

/* ===================================
TOAST
=================================== */

function showToast(name){

const toast =

document.getElementById(
"cartToast"
);

const toastText =

document.getElementById(
"toastText"
);

toastText.innerHTML =

name + " added";

toast.style.display =
"flex";

toast.classList.add(
"showToast"
);

/* AUTO HIDE */

setTimeout(()=>{

toast.classList.remove(
"showToast"
);

setTimeout(()=>{

toast.style.display =
"none";

},300);

},2000);

}

/* ===================================
SERVICE DETAILS
=================================== */

window.openService =
function(serviceId){

window.location.href =

`service-details.html?id=${serviceId}`;

};

/* ===================================
CART TOTAL
=================================== */

window.getCartTotal =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total +=

(item.price || 0)
*
(item.qty || 1);

});

return total;

};

/* ===================================
CART COUNT
=================================== */

window.getCartCount =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let count = 0;

cart.forEach(item=>{

count += item.qty || 1;

});

return count;

};

/* ===================================
CLEAR CART
=================================== */

window.clearCart =
function(){

localStorage.removeItem(
"cart"
);

if(window.updateNavbarCartCount){

window.updateNavbarCartCount();

}

};

 categoryId:"IRONING",

 price:12,
 qty:1,
 city:"Kasganj"
}

=================================== */

  <script type="module">

import { db }
from "./firebase.js";

import {
collection,
query,
where,
orderBy,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
GLOBAL CACHE
=================================== */

window.allServices = [];

window.filteredServices = [];

/* ===================================
SEARCH
=================================== */

const searchInput =

document.getElementById(
"serviceSearch"
);

if(searchInput){

searchInput.addEventListener(

"input",

(e)=>{

searchServices(
e.target.value
);

}

);

}

/* ===================================
SEARCH FUNCTION
=================================== */

window.searchServices =
function(keyword){

keyword =
keyword.toLowerCase();

const services =

window.allServices.filter(

service=>{

const name =

(service.name || "")
.toLowerCase();

return name.includes(
keyword
);

}

);

renderServices(
services
);

};

/* ===================================
RENDER SERVICES
=================================== */

window.renderServices =
function(services){

const serviceGrid =

document.getElementById(
"serviceGrid"
);

if(!serviceGrid)
return;

serviceGrid.innerHTML = "";

/* EMPTY */

if(services.length===0){

serviceGrid.innerHTML =

`

<div style="
grid-column:1/-1;
text-align:center;
padding:30px;
">

No Services Found

</div>

`;

return;

}

/* ===================================
RENDER
=================================== */

services.forEach(service=>{

const price =

getServicePrice(
service
);

serviceGrid.innerHTML +=

`

<div
class="serviceCard"
onclick="openService('${service.id}')">

<div
class="serviceIcon">

${service.icon || "👕"}

</div>

<div
class="serviceName">

${service.name}

</div>

<div
class="servicePrice">

₹${price}

</div>

<button
class="addBtn"

onclick="event.stopPropagation();

addToCart(

'${service.id}',

'${service.name}',

${price},

'${service.categoryId}',

'${service.subcategoryId}'

)">

Add

</button>

</div>

`;

});

};

/* ===================================
LOAD SERVICES
OVERRIDE PART-3 FUNCTION
=================================== */

window.loadServices =
function(subCategoryId){

const city =

localStorage.getItem(
"userCity"
)

|| "Kasganj";

onSnapshot(

query(

collection(
db,
"services"
),

where(
"subcategoryId",
"==",
subCategoryId
)

),

(snapshot)=>{

window.allServices = [];

/* ===================================
ACTIVE SERVICES ONLY
=================================== */

snapshot.forEach(doc=>{

const service = {

id:doc.id,

...doc.data()

};

/* INACTIVE */

if(
service.active === false
)
return;

/* CITY FILTER */

if(

service.city &&
service.city !== city

){

return;

}

window.allServices.push(
service
);

});

/* ===================================
RENDER
=================================== */

window.filteredServices =
window.allServices;

renderServices(
window.filteredServices
);

}

);

};

/* ===================================
REALTIME CATEGORY UPDATE
=================================== */

window.reloadCategories =
function(){

const categorySlider =

document.getElementById(
"categorySlider"
);

if(!categorySlider)
return;

onSnapshot(

query(

collection(
db,
"categories"
),

where(
"active",
"!=",
false
),

orderBy(
"position",
"asc"
)

),

(snapshot)=>{

categorySlider.innerHTML = "";

let firstCategory = null;

snapshot.forEach(doc=>{

const category = {

id:doc.id,

...doc.data()

};

if(!firstCategory){

firstCategory = category.id;

}

categorySlider.innerHTML +=

`

<div
class="categoryCard"

data-id="${category.id}"

onclick="selectCategory(

'${category.id}'

)">

<div
class="categoryIcon">

${category.icon || "🧺"}

</div>

<h4>

${category.name}

</h4>

</div>

`;

});

/* AUTO */

if(

!window.selectedCategoryId &&
firstCategory

){

selectCategory(
firstCategory
);

}

}

);

};

/* ===================================
CITY CHANGE REFRESH
=================================== */

window.refreshServicesByCity =
function(){

if(

window.selectedSubCategoryId

){

loadServices(

window.selectedSubCategoryId

);

}

};

/* ===================================
AUTO RELOAD ON CITY CHANGE
=================================== */

window.addEventListener(

"storage",

(e)=>{

if(

e.key ===
"userCity"

){

refreshServicesByCity();

}

}

);

<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
AUTH
=================================== */

let currentUser = null;

onAuthStateChanged(

auth,

(user)=>{

currentUser = user;

}

);

/* ===================================
PROFILE
=================================== */

window.openProfile =
function(){

if(currentUser){

window.location.href =
"profile.html";

}else{

window.location.href =
"login.html";

}

};

/* ===================================
CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateNavbarCartCount();

/* ===================================
NAVIGATION
=================================== */

document
.querySelectorAll(
".navItem"
)

.forEach(item=>{

item.addEventListener(

"click",

()=>{

const page =
item.dataset.page;

/* HOME */

if(page==="home"){

window.location.href =
"index.html";

}

/* SERVICES */

if(page==="services"){

window.location.href =
"services.html";

}

/* CART */

if(page==="cart"){

window.location.href =
"cart.html";

}

/* ORDERS */

if(page==="orders"){

if(!currentUser){

window.location.href =
"login.html";

return;

}

window.location.href =
"orders.html";

}

/* PROFILE */

if(page==="profile"){

if(!currentUser){

window.location.href =
"login.html";

return;

}

window.location.href =
"profile.html";

}

}

);

});

/* ===================================
RESTORE CITY
=================================== */

const savedLocation =

localStorage.getItem(
"userLocation"
);

if(savedLocation){

const data =

JSON.parse(
savedLocation
);

const cityTitle =

document.getElementById(
"currentCity"
);

const locationText =

document.getElementById(
"locationText"
);

if(cityTitle){

cityTitle.innerHTML =
data.city;

}

if(locationText){

locationText.innerHTML =

`${data.city},
Uttar Pradesh
<i class="fa-solid fa-angle-down"></i>`;

}

}

/* ===================================
LOAD CATEGORIES
=================================== */

if(window.reloadCategories){

window.reloadCategories();

}

/* ===================================
PROFILE BUTTON
=================================== */

const profileBtn =

document.querySelector(
".profileBtn"
);

if(profileBtn){

profileBtn.addEventListener(

"click",

()=>{

if(currentUser){

window.location.href =
"profile.html";

}else{

window.location.href =
"login.html";

}

}

);

}

</script>
