<style>

.summaryLine{

.checkoutItem{

justify-content:space-between;

}

}

.checkoutItemQty{

color:#6B7280;

}

</style>

<script>

/* ===================================
LOAD SUMMARY
=================================== */

function loadCheckoutSummary(){

const order =

JSON.parse(

localStorage.getItem(
"checkoutData"
)

|| "{}"

);

if(!order.items){

return;

}

const itemsBox =

document.getElementById(
"checkoutItems"
);

let html = "";

order.items.forEach(item=>{

html += `

<div class="checkoutItem">

<div>

<div class="checkoutItemName">

${item.serviceName}

</div>

<div class="checkoutItemQty">

Qty : ${item.qty}

</div>

</div>

<div>

₹${item.price * item.qty}

</div>

</div>

`;

});

itemsBox.innerHTML = html;

document.getElementById(
"checkoutSubtotal"
).innerHTML =
"₹"+order.subtotal;

document.getElementById(
"checkoutDelivery"
).innerHTML =
"₹"+order.deliveryFee;

document.getElementById(
"checkoutTax"
).innerHTML =
"₹"+order.tax;

document.getElementById(
"checkoutDiscount"
).innerHTML =
"₹"+(order.discount||0);

document.getElementById(
"checkoutGrandTotal"
).innerHTML =
"₹"+order.total;

}

loadCheckoutSummary();

</script><script type="module">

import { db, auth }
from "./firebase.js";

import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
SAVE ORDER
=================================== */

window.saveOrderToFirebase =
async function(orderData){

try{

const docRef =

await addDoc(

collection(
db,
"orders"
),

{

...orderData,

userId:

auth.currentUser

?

auth.currentUser.uid

:

null,

status:"Pending",

paymentStatus:"Pending",

createdAt:
serverTimestamp()

}

);

return{

success:true,

orderId:docRef.id

};

}

catch(error){

console.log(error);

return{

success:false,

error:error.message

};

}

};

console.log(
"QuickPress Checkout Firebase Ready"
);

</script><!-- ===================================
PLACE ORDER
=================================== -->

<section class="section">

<button
id="placeOrderBtn"
class="placeOrderBtn"
onclick="placeOrder()">

Place Order

</button>

</section>

<style>

.placeOrderBtn{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:16px;

font-weight:900;

cursor:pointer;

box-shadow:
0 10px 24px rgba(22,163,74,.25);

}

.placeOrderBtn:disabled{

opacity:.6;

cursor:not-allowed;

}

</style>

<script>

window.placeOrder =
async function(){

const btn =

document.getElementById(
"placeOrderBtn"
);

btn.disabled = true;

btn.innerHTML =
"Processing...";

const order =

JSON.parse(

localStorage.getItem(
"checkoutData"
)

|| "{}"

);

const paymentMethod =

document.querySelector(
'input[name="paymentMethod"]:checked'
).value;

const finalOrder = {

...order,

customer:{

name:

document.getElementById(
"customerName"
).value,

phone:

document.getElementById(
"customerPhone"
).value,

email:

document.getElementById(
"customerEmail"
).value

},

address:{

house:

document.getElementById(
"houseNumber"
).value,

street:

document.getElementById(
"streetAddress"
).value,

city:

document.getElementById(
"cityName"
).value,

pincode:

document.getElementById(
"pincode"
).value,

note:

document.getElementById(
"addressNote"
).value

},

pickupDate:

document.getElementById(
"pickupDate"
).value,

pickupTime:

document.getElementById(
"pickupTime"
).value,

deliveryDate:

document.getElementById(
"deliveryDate"
).value,

paymentMethod

};

window.finalCheckoutOrder =
finalOrder;

validateCheckout();

};

</script><!-- ===================================
TOAST
=================================== -->

<div
id="checkoutToast"
class="checkoutToast">

<span id="checkoutToastText">

Success

</span>

</div>

<style>

.checkoutToast{

position:fixed;

left:50%;

bottom:100px;

transform:
translateX(-50%);

background:#111827;

color:#fff;

padding:14px 18px;

border-radius:14px;

font-size:13px;

font-weight:700;

opacity:0;

visibility:hidden;

transition:.3s;

z-index:99999;

}

.checkoutToast.show{

opacity:1;

visibility:visible;

}

</style>

<script>

window.showCheckoutToast =
function(message){

const toast =

document.getElementById(
"checkoutToast"
);

document.getElementById(
"checkoutToastText"
)

.innerHTML =
message;

toast.classList.add(
"show"
);

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2500);

};

/* ===================================
VALIDATION
=================================== */

window.validateCheckout =
async function(){

const order =
window.finalCheckoutOrder;

if(!order.customer.name){

showCheckoutToast(
"Enter Name"
);

resetOrderBtn();

return;

}

if(!order.customer.phone){

showCheckoutToast(
"Enter Phone Number"
);

resetOrderBtn();

return;

}

if(!order.address.house){

showCheckoutToast(
"Enter House Number"
);

resetOrderBtn();

return;

}

if(!order.address.street){

showCheckoutToast(
"Enter Street Address"
);

resetOrderBtn();

return;

}

if(!order.address.city){

showCheckoutToast(
"Enter City"
);

resetOrderBtn();

return;

}

if(!order.pickupDate){

showCheckoutToast(
"Select Pickup Date"
);

resetOrderBtn();

return;

}

const result =

await saveOrderToFirebase(
order
);

if(result.success){

localStorage.removeItem(
"cart"
);

localStorage.removeItem(
"checkoutData"
);

localStorage.setItem(

"lastOrderId",

result.orderId

);

window.location.href =

"order-success.html?id=" +

result.orderId;

}

else{

showCheckoutToast(
"Order Failed"
);

resetOrderBtn();

}

};

function resetOrderBtn(){

const btn =

document.getElementById(
"placeOrderBtn"
);

btn.disabled = false;

btn.innerHTML =
"Place Order";

}
