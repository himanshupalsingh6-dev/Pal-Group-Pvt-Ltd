<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta

content="width=device-width, initial-scale=1.0">

<title>

QuickPress Checkout

<link

<link

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;

--dark:#111827;
--gray:#6B7280;

--bg:#F7F8FA;
--white:#FFFFFF;

}

body{

background:var(--bg);

padding-bottom:140px;

}

/* HEADER */

.checkoutHeader{

background:#fff;

padding:18px;

display:flex;

align-items:center;

gap:14px;

box-shadow:
0 4px 20px rgba(0,0,0,.05);

}

.backBtn{

width:44px;

height:44px;

border:none;

border-radius:12px;

background:#F3F4F6;

cursor:pointer;

}

.backBtn i{

font-size:18px;

}

.headerTitle h2{

font-size:22px;

font-weight:900;

}

.headerTitle p{

font-size:12px;

color:#6B7280;

margin-top:3px;

}

/* PROGRESS */

.progressCard{

background:#fff;

margin:16px;

padding:20px;

border-radius:22px;

}

.progressLine{

display:flex;

align-items:center;

justify-content:space-between;

}

.step{

display:flex;

flex-direction:column;

align-items:center;

}

.stepCircle{

width:36px;

height:36px;

border-radius:50%;

background:#16A34A;

color:#fff;

display:flex;

align-items:center;

justify-content:center;

font-weight:900;

}

.stepLabel{

font-size:11px;

margin-top:8px;

font-weight:700;

}

.progressBar{

flex:1;

height:4px;

background:#DCFCE7;

margin:0 8px;

margin-bottom:24px;

}

</style>

</head>

<body>

<div class="checkoutHeader">

<button
class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="headerTitle">

<h2>

Checkout

</h2>

<p>

Review & Place Order

</p>

</div>

</div>

<div class="progressCard">

<div class="progressLine">

<div class="step">

<div class="stepCircle">

1

</div>

<div class="stepLabel">

Address

</div>

</div>

<div class="progressBar"></div>

<div class="step">

<div class="stepCircle">

2

</div>

<div class="stepLabel">

Schedule

</div>

</div>

<div class="progressBar"></div>

<div class="step">

<div class="stepCircle">

3

</div>

<div class="stepLabel">

Payment

</div>

</div>

<div class="progressBar"></div>

<div class="step">

<div class="stepCircle">

4

</div>

<div class="stepLabel">

Done

</div>

</div>

</div>

</div><section style="padding:0 16px;">

<div class="card">

<div class="sectionHead">

<h3>

Pickup Address

</h3>

<button
onclick="location.href='addresses.html'">

Change

</button>

</div>

<div
id="defaultAddressCard">

Loading Address...

</div>

</div>

</section>

<style>

.card{

background:#fff;

padding:20px;

border-radius:22px;

margin-bottom:16px;

}

.sectionHead{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:16px;

}

.sectionHead h3{

font-size:18px;

font-weight:900;

}

.sectionHead button{

border:none;

background:#F4B400;

padding:10px 16px;

border-radius:10px;

font-weight:800;

cursor:pointer;

}

.addressCard{

background:#F9FAFB;

padding:14px;

border-radius:14px;

}

.defaultTag{

display:inline-block;

padding:5px 10px;

background:#DCFCE7;

color:#16A34A;

border-radius:999px;

font-size:11px;

font-weight:800;

margin-bottom:10px;

}

</style><section style="padding:0 16px;">

<div class="card">

<h3>

Customer Details

</h3>

<div class="customerGrid">

<input
id="customerName"
placeholder="Full Name">

<input
id="customerPhone"
placeholder="Phone Number">

<input
id="customerEmail"
placeholder="Email Address">

</div>

</div>

</section>

<style>

.customerGrid{

display:grid;

gap:12px;

margin-top:16px;

}

.customerGrid input{

height:54px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:0 16px;

outline:none;

}

</style><section style="padding:0 16px;">

<div class="card">

<h3>

Pickup Schedule

</h3>

<div class="customerGrid">

<input
type="date"
id="pickupDate">

<select id="pickupTime">

<option>
09 AM - 11 AM
</option>

<option>
11 AM - 01 PM
</option>

<option>
01 PM - 03 PM
</option>

<option>
03 PM - 05 PM
</option>

<option>
05 PM - 07 PM
</option>

</select>

</div>

<textarea
id="orderNote"
placeholder="Special Instructions (Optional)">

</textarea>

</div>

</section>

<style>

select,
textarea{

width:100%;

border:1px solid #E5E7EB;

border-radius:14px;

padding:14px;

margin-top:12px;

outline:none;

}

textarea{

height:100px;

resize:none;

}

</style><section style="padding:0 16px;">

<div class="card">

<h3>

Payment Method

</h3>

<div class="paymentList">

<label class="paymentCard">

<input
type="radio"
name="payment"
value="COD"
checked>

<div>

<h4>

Cash On Delivery

</h4>

<p>

Pay after service completion

</p>

</div>

</label>

<label class="paymentCard">

<input
type="radio"
name="payment"
value="ONLINE">

<div>

<h4>

Online Payment

</h4>

<p>

UPI • Card • Net Banking

</p>

</div>

</label>

</div>

</div>

</section>

<style>

.paymentList{

margin-top:16px;

display:flex;

flex-direction:column;

gap:12px;

}

.paymentCard{

display:flex;

gap:12px;

padding:14px;

border:1px solid #E5E7EB;

border-radius:14px;

cursor:pointer;

}

.paymentCard h4{

font-size:14px;

font-weight:800;

}

.paymentCard p{

font-size:12px;

color:#6B7280;

margin-top:4px;

}

</style><section style="padding:0 16px;">

<div class="card">

<h3>

Order Items

</h3>

<div
id="checkoutItems">

</div>

</div>

</section>

<style>

.checkoutItem{

background:#F9FAFB;

padding:14px;

border-radius:14px;

display:flex;

justify-content:space-between;

align-items:center;

margin-top:12px;

}

.itemLeft h4{

font-size:14px;

font-weight:800;

}

.itemMeta{

font-size:12px;

color:#6B7280;

margin-top:4px;

}

.itemPrice{

font-size:16px;

font-weight:900;

}

</style>

<script>

/* ===================================
LOAD ITEMS
=================================== */

window.renderCheckoutItems =
function(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

const container =

document.getElementById(
"checkoutItems"
);

let html = "";

cart.forEach(item=>{

html += `

<div class="checkoutItem">

<div class="itemLeft">

<h4>

${item.serviceName}

</h4>

<div class="itemMeta">

${item.category}
• Qty ${item.qty}

</div>

</div>

<div class="itemPrice">

₹${item.price * item.qty}

</div>

</div>

`;

});

container.innerHTML = html;

};

</script><section style="padding:0 16px;">

<div class="card">

<h3>

Bill Summary

</h3>

<div class="billRow">

<span>

Subtotal

</span>

<span id="subtotal">

₹0

</span>

</div>

<div class="billRow">

<span>

Delivery Fee

</span>

<span id="deliveryFee">

₹0

</span>

</div>

<div class="billRow">

<span>

Tax

</span>

<span id="taxAmount">

₹0

</span>

</div>

<div class="billRow">

<span>

Discount

</span>

<span id="discountAmount">

₹0

</span>

</div>

<hr>

<div class="billTotal">

<span>

Total

</span>

<span id="grandTotal">

₹0

</span>

</div>

</div>

</section>

<style>

.billRow{

display:flex;

justify-content:space-between;

margin-top:14px;

font-size:14px;

}

.billTotal{

display:flex;

justify-content:space-between;

margin-top:18px;

font-size:20px;

font-weight:900;

}

</style>

<script>

window.calculateBill =
function(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

let subtotal = 0;

cart.forEach(item=>{

subtotal +=

item.price *
item.qty;

});

const delivery =

subtotal > 299

? 0

: 49;

const tax =

Math.round(
subtotal * 0.05
);

const discount =

Number(

localStorage.getItem(
"couponDiscount"
)

|| 0

);

const total =

subtotal +
delivery +
tax -
discount;

document.getElementById(
"subtotal"
).innerHTML =
"₹"+subtotal;

document.getElementById(
"deliveryFee"
).innerHTML =
"₹"+delivery;

document.getElementById(
"taxAmount"
).innerHTML =
"₹"+tax;

document.getElementById(
"discountAmount"
).innerHTML =
"- ₹"+discount;

document.getElementById(
"grandTotal"
).innerHTML =
"₹"+total;

window.finalTotal =
total;

};

</script><script type="module">

import { db, auth }
from "./firebase.js";

import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.saveOrder =
async function(orderData){

const docRef =

await addDoc(

collection(
db,
"orders"
),

{

...orderData,

userId:

auth.currentUser
? auth.currentUser.uid
: null,

createdAt:
serverTimestamp(),

status:"Pending",

paymentStatus:"Pending"

}

);

return docRef.id;

};

</script><div
id="checkoutToast"
class="checkoutToast">

Success

</div>

<style>

.checkoutToast{

position:fixed;

left:50%;

bottom:110px;

transform:
translateX(-50%);

background:#111827;

color:#fff;

padding:14px 20px;

border-radius:14px;

font-size:13px;

font-weight:700;

opacity:0;

visibility:hidden;

transition:.3s;

z-index:99999;

}

.checkoutToast.show{

opacity:1;

visibility:visible;

}

</style>

<script>

window.showToast =
function(message){

const toast =

document.getElementById(
"checkoutToast"
);

toast.innerHTML =
message;

toast.classList.add(
"show"
);

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2500);

};

/* ===================================
LOAD DEFAULT ADDRESS
=================================== */

window.loadDefaultAddress =
function(){

const addresses =

JSON.parse(

localStorage.getItem(
"addresses"
)

|| "[]"

);

const defaultAddress =

addresses.find(

item=>item.isDefault

);

if(!defaultAddress){

document.getElementById(
"defaultAddressCard"
).innerHTML =

"No Default Address Found";

return;

}

document.getElementById(
"defaultAddressCard"
).innerHTML =

`

<div class="addressCard">

<div class="defaultTag">

Default Address

</div>

<h4>

${defaultAddress.type}

</h4>

<p>

${defaultAddress.address}

</p>

</div>

`;

};

/* ===================================
INIT
=================================== */

document.addEventListener(

"DOMContentLoaded",

()=>{

loadDefaultAddress();

renderCheckoutItems();

calculateBill();

}

);

</script><!-- ===================================
STICKY CHECKOUT BAR
=================================== -->

<div class="stickyCheckout">

<div>

<div class="totalLabel">

Grand Total

</div>

<div
id="stickyTotal"
class="stickyTotal">

₹0

</div>

</div>

<button
class="placeOrderBtn"
onclick="placeOrder()">

Place Order

</button>

</div>

<style>

.stickyCheckout{

position:fixed;

left:0;
right:0;
bottom:0;

height:90px;

background:#fff;

padding:0 16px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 -8px 24px rgba(0,0,0,.08);

z-index:9999;

}

.totalLabel{

font-size:12px;

color:#6B7280;

font-weight:700;

}

.stickyTotal{

font-size:24px;

font-weight:900;

color:#111827;

margin-top:2px;

}

.placeOrderBtn{

height:54px;

padding:0 26px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

}

.placeOrderBtn:disabled{

opacity:.6;

cursor:not-allowed;

}

</style>

<script>

/* ===================================
UPDATE STICKY TOTAL
=================================== */

const oldCalculateBill =
window.calculateBill;

window.calculateBill =
function(){

oldCalculateBill();

document.getElementById(
"stickyTotal"
).innerHTML =

document.getElementById(
"grandTotal"
).innerHTML;

};

/* ===================================
PLACE ORDER
=================================== */

window.placeOrder =
async function(){

const btn =

document.querySelector(
".placeOrderBtn"
);

const name =

document.getElementById(
"customerName"
).value.trim();

const phone =

document.getElementById(
"customerPhone"
).value.trim();

const pickupDate =

document.getElementById(
"pickupDate"
).value;

if(!name){

showToast(
"Enter Customer Name"
);

return;

}

if(phone.length < 10){

showToast(
"Enter Valid Phone Number"
);

return;

}

if(!pickupDate){

showToast(
"Select Pickup Date"
);

return;

}

btn.disabled = true;

btn.innerHTML =
"Processing...";

try{

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

const paymentMethod =

document.querySelector(
'input[name="payment"]:checked'
).value;

const addresses =

JSON.parse(

localStorage.getItem(
"addresses"
)

|| "[]"

);

const defaultAddress =

addresses.find(
a=>a.isDefault
);

const orderData = {

orderNumber:

"QP" +

Date.now(),

customerName:name,

customerPhone:phone,

customerEmail:

document.getElementById(
"customerEmail"
).value,

pickupDate,

pickupTime:

document.getElementById(
"pickupTime"
).value,

orderNote:

document.getElementById(
"orderNote"
).value,

paymentMethod,

items:cart,

address:

defaultAddress || null,

total:

window.finalTotal,

status:"Pending"

};

const orderId =

await saveOrder(
orderData
);

localStorage.setItem(
"lastOrderId",
orderId
);

localStorage.removeItem(
"cart"
);

window.location.href =

"order-success.html?id=" +
orderId;

}

catch(error){

console.log(error);

showToast(
"Order Failed"
);

btn.disabled = false;

btn.innerHTML =
"Place Order";

}

};

</script>

</body>

</html>
