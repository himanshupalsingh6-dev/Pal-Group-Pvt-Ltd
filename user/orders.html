<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
padding-bottom:100px;
}

/* HEADER */

.ordersHero{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:20px;

border-bottom-left-radius:32px;
border-bottom-right-radius:32px;

}

.ordersHero h1{

font-size:30px;
font-weight:900;

}

.ordersHero p{

margin-top:6px;

font-size:13px;
font-weight:700;

color:#374151;

}

/* SEARCH */

.searchWrap{

padding:16px;

}

.searchBox{

height:56px;

background:#fff;

border-radius:18px;

display:flex;
align-items:center;

padding:0 16px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.searchBox input{

flex:1;

border:none;
outline:none;

font-size:14px;

padding-left:10px;

}

/* FILTERS */

.filterWrap{

padding:0 16px 16px;

display:flex;
gap:10px;

overflow-x:auto;

}

.filterBtn{

height:42px;

padding:0 16px;

border:none;

border-radius:999px;

background:#fff;

font-weight:800;

cursor:pointer;

white-space:nowrap;

}

.activeFilter{

background:#16A34A;
color:#fff;

}

/* ORDER CARD */

.ordersContainer{

padding:0 16px;

}

.orderCard{

background:#fff;

padding:18px;

border-radius:24px;

margin-bottom:14px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.orderTop{

display:flex;

justify-content:space-between;
align-items:center;

}

.orderId{

font-size:15px;

font-weight:900;

}

.orderStatus{

padding:6px 12px;

border-radius:999px;

font-size:11px;

font-weight:900;

background:#DCFCE7;

color:#166534;

}

.orderInfo{

margin-top:12px;

line-height:1.9;

font-size:13px;

color:#4B5563;

}

.badges{

margin-top:10px;

display:flex;
gap:8px;
flex-wrap:wrap;

}

.badge{

padding:6px 10px;

border-radius:999px;

font-size:11px;
font-weight:800;

}

.premium{

background:#F3E8FF;
color:#6B21A8;

}

.urgent{

background:#DBEAFE;
color:#1E40AF;

}

/* ACTIONS */

.actions{

margin-top:14px;

display:flex;
gap:10px;
flex-wrap:wrap;

}

.actionBtn{

height:42px;

padding:0 14px;

border:none;

border-radius:14px;

font-size:12px;
font-weight:900;

cursor:pointer;

}

.trackBtn{

background:#16A34A;
color:#fff;

}

.detailsBtn{

background:#111827;
color:#fff;

}

.reorderBtn{

background:#F59E0B;
color:#fff;

}

</style>

</head>

<body>

<!-- HEADER -->

<div class="ordersHero">

<h1>
My Orders
</h1>

<p>
Track all your laundry orders
</p>

</div>

<!-- SEARCH -->

<div class="searchWrap">

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchInput"
placeholder="Search Order ID">

</div>

</div>

<!-- FILTERS -->

<div class="filterWrap">

<button class="filterBtn activeFilter">
Active
</button>

<button class="filterBtn">
Completed
</button>

<button class="filterBtn">
Cancelled
</button>

</div>

<!-- ORDERS -->

<div
class="ordersContainer"
id="ordersContainer">

<!-- Firebase Orders Here -->

</div>
<!-- =========================================
BOTTOM NAVIGATION
========================================= -->

<div class="bottomNav">

<button
class="navItem"
onclick="location.href='index.html'">

🏠
<span>Home</span>

</button>

<button
class="navItem activeNav">

📦
<span>Orders</span>

</button>

<button
class="navItem"
onclick="location.href='wallet.html'">

💰
<span>Wallet</span>

</button>

<button
class="navItem"
onclick="location.href='profile.html'">

👤
<span>Profile</span>

</button>

</div>

<style>

.bottomNav{

position:fixed;

left:0;
right:0;
bottom:0;

height:75px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -8px 20px rgba(0,0,0,.08);

z-index:999;

}

.navItem{

flex:1;

height:100%;

border:none;

background:none;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:4px;

font-size:11px;

font-weight:700;

cursor:pointer;

color:#6B7280;

}

.activeNav{

color:#16A34A;

}

</style>

<script type="module">

import { db, auth }
from "./firebase.js";

import {
collection,
query,
where,
onSnapshot
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* =========================================
GLOBAL
========================================= */

let allOrders = [];

let currentFilter =
"Active";

/* =========================================
LOGIN CHECK
========================================= */

onAuthStateChanged(

auth,

(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

loadOrders(user.uid);

}

);

/* =========================================
FILTER BUTTONS
========================================= */

document
.querySelectorAll(
".filterBtn"
)

.forEach(btn=>{

btn.addEventListener(

"click",

()=>{

document
.querySelectorAll(
".filterBtn"
)

.forEach(b=>
b.classList.remove(
"activeFilter"
)
);

btn.classList.add(
"activeFilter"
);

currentFilter =
btn.innerText.trim();

renderOrders();

}

);

});

/* =========================================
SEARCH
========================================= */

document
.getElementById(
"searchInput"
)

.addEventListener(

"keyup",

renderOrders

);

/* =========================================
LOAD ORDERS
========================================= */

function loadOrders(uid){

const q = query(

collection(
db,
"orders"
),

where(
"userId",
"==",
uid
)

);

onSnapshot(

q,

(snapshot)=>{

allOrders = [];

snapshot.forEach(doc=>{

const order =
doc.data();

order.docId =
doc.id;

allOrders.push(order);

});

renderOrders();

}

);

}

/* =========================================
RENDER
========================================= */

function renderOrders(){

const container =
document.getElementById(
"ordersContainer"
);

container.innerHTML = "";

/* ========================================= */

const searchText =

document
.getElementById(
"searchInput"
)

.value
.toLowerCase();

/* ========================================= */

allOrders.forEach(order=>{

/* =========================================
SEARCH
========================================= */

if(

searchText &&
!order.orderId
.toLowerCase()
.includes(
searchText
)

){

return;

}

/* =========================================
FILTER
========================================= */

if(

currentFilter==="Active"

&&

(
order.status==="Completed"
||
order.status==="Cancelled"
)

){

return;

}

if(

currentFilter==="Completed"

&&

order.status!=="Completed"

){

return;

}

if(

currentFilter==="Cancelled"

&&

order.status!=="Cancelled"

){

return;

}

/* =========================================
BADGES
========================================= */

let badges = "";

/* ========================================= */

if(
order.premiumPackaging
){

badges +=

`
<div class="badge premium">

👑 Premium Packaging

</div>
`;

}

/* ========================================= */

if(
order.urgentDelivery
){

badges +=

`
<div class="badge urgent">

⚡ Urgent Delivery

</div>
`;

}

/* =========================================
ITEMS
========================================= */

let itemsHtml = "";

(order.items || [])
.forEach(item=>{

itemsHtml +=

`
${item.category || ""}
 -
${item.serviceName || ""}

 × ${item.qty || 1}

<br>
`;

});

/* =========================================
STATUS COLOR
========================================= */

let statusColor =
"#166534";

let statusBg =
"#DCFCE7";

if(
order.status==="Cancelled"
){

statusColor =
"#991B1B";

statusBg =
"#FEE2E2";

}

if(
order.status==="Processing"
){

statusColor =
"#1E40AF";

statusBg =
"#DBEAFE";

}

/* =========================================
CARD
========================================= */

container.innerHTML +=

`

<div class="orderCard">

<div class="orderTop">

<div class="orderId">

#${order.orderId}

</div>

<div
class="orderStatus"

style="
background:${statusBg};
color:${statusColor};
">

${order.status}

</div>

</div>

<div class="orderInfo">

📍 ${order.city}

<br>

💰 ₹${order.grandTotal}

<br><br>

${itemsHtml}

</div>

<div class="badges">

${badges}

</div>

<div class="actions">

<button
class="actionBtn trackBtn"
onclick="trackOrder('${order.orderId}')">

Track Order

</button>

<button
class="actionBtn detailsBtn"
onclick="viewDetails('${order.orderId}')">

Details

</button>

<button
class="actionBtn reorderBtn"
onclick="reorder('${order.docId}')">

Reorder

</button>

</div>

</div>

`;

});

/* ========================================= */

if(
container.innerHTML === ""
){

container.innerHTML =

`

<div
style="
text-align:center;
padding:50px 20px;
color:#6B7280;
">

📦

<h3 style="
margin-top:15px;
">

No Orders Found

</h3>

</div>

`;

}

}

/* =========================================
TRACK
========================================= */

window.trackOrder =
(orderId)=>{

window.location.href =

`track-order.html?id=${orderId}`;

};

/* =========================================
DETAILS
========================================= */

window.viewDetails =
(orderId)=>{

window.location.href =

`order-details.html?id=${orderId}`;

};

/* =========================================
REORDER
========================================= */

window.reorder =
(docId)=>{

const order =

allOrders.find(
o=>o.docId===docId
);

if(!order) return;

/* ========================================= */

localStorage.setItem(

"cart",

JSON.stringify(
order.items
)

);

/* ========================================= */

window.location.href =
"checkout.html";

};

</script>

</body>
</html>
