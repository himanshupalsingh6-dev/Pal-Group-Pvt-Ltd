<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

My Orders

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--bg:#F7F8FA;
--dark:#111827;
--gray:#6B7280;

}

body{

background:var(--bg);

padding-bottom:120px;

}

.ordersHeader{

background:#fff;

padding:20px 16px;

position:sticky;

top:0;

z-index:999;

box-shadow:
0 4px 20px rgba(0,0,0,.05);

}

.ordersTitle{

font-size:30px;

font-weight:900;

color:#111827;

}

.ordersSub{

font-size:13px;

color:#6B7280;

margin-top:4px;

}

</style>

</head>

<body>

<div class="ordersHeader">

<div class="ordersTitle">

My Orders

</div>

<div class="ordersSub">

Track all your laundry orders

</div>

</div><section
style="padding:16px;">

<div class="orderTabs">

<button
class="tabBtn activeTab"
onclick="filterOrders('all')">

All

</button>

<button
class="tabBtn"
onclick="filterOrders('active')">

Active

</button>

<button
class="tabBtn"
onclick="filterOrders('completed')">

Completed

</button>

<button
class="tabBtn"
onclick="filterOrders('cancelled')">

Cancelled

</button>

</div>

</section>

<style>

.orderTabs{

display:flex;

gap:10px;

overflow-x:auto;

scrollbar-width:none;

}

.orderTabs::-webkit-scrollbar{

display:none;

}

.tabBtn{

border:none;

height:42px;

padding:0 18px;

border-radius:999px;

background:#fff;

font-weight:800;

cursor:pointer;

flex-shrink:0;

}

.activeTab{

background:#16A34A;

color:#fff;

}

</style><script type="module">

import { db, auth }
from "./firebase.js";

import {

collection,
query,
where,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.allOrders = [];

window.loadOrders =
function(){

if(!auth.currentUser){

return;

}

const orderQuery =

query(

collection(
db,
"orders"
),

where(
"userId",
"==",
auth.currentUser.uid
)

);

onSnapshot(

orderQuery,

(snapshot)=>{

allOrders = [];

snapshot.forEach(doc=>{

allOrders.push({

id:doc.id,

...doc.data()

});

});

renderOrders(
allOrders
);

}

);

};

</script><section
style="padding:0 16px;">

<div
id="ordersContainer">

</div>

</section>

<style>

.orderCard{

background:#fff;

border-radius:22px;

padding:18px;

margin-bottom:16px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.orderHeaderRow{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:10px;

}

.orderNumber{

font-size:15px;

font-weight:900;

}

.orderCity{

font-size:12px;

color:#6B7280;

margin-bottom:12px;

}

.statusBadge{

padding:7px 12px;

border-radius:999px;

font-size:11px;

font-weight:900;

}

.pending{

background:#FEF3C7;

color:#D97706;

}

.cleaning{

background:#DBEAFE;

color:#2563EB;

}

.delivered{

background:#DCFCE7;

color:#16A34A;

}

.cancelled{

background:#FEE2E2;

color:#DC2626;

}

</style><script>

window.renderOrders =
function(orders){

const container =

document.getElementById(
"ordersContainer"
);

if(!orders.length){

container.innerHTML =

`

<div style="
background:#fff;
padding:40px;
border-radius:24px;
text-align:center;
">

<h3>

No Orders Found

</h3>

<p style="
margin-top:8px;
color:#6B7280;
">

Place your first order

</p>

</div>

`;

return;

}

let html = "";

orders.forEach(order=>{

html +=

getTimelineHTML(

order.status ||

"Pending"

);

if(order.items){

order.items.forEach(item=>{

html += `

<div style="
padding:10px 0;
border-top:1px solid #F3F4F6;
">

<div style="
font-weight:800;
">

${item.serviceName}

</div>

<div style="
font-size:12px;
color:#6B7280;
margin-top:4px;
">

${item.category}

>

${item.subCategory}

</div>

<div style="
font-size:12px;
margin-top:4px;
">

Qty ${item.qty}

</div>

</div>

`;

});

}

html += `

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-top:14px;
padding-top:14px;
border-top:1px solid #F3F4F6;
">

<div style="
font-size:20px;
font-weight:900;
">

₹${order.total || 0}

</div>

<button
onclick="location.href='order-details.html?id=${order.id}'"
style="
height:42px;
padding:0 16px;
border:none;
border-radius:12px;
background:#16A34A;
color:#fff;
font-weight:800;
cursor:pointer;
">

Track Order

</button>

</div>

</div>

`;

});

container.innerHTML = html;

};

</script><style>

.timeline{

margin-top:14px;

padding-top:14px;

border-top:1px solid #F3F4F6;

}

.timelineStep{

display:flex;

align-items:center;

gap:10px;

margin-bottom:10px;

font-size:12px;

font-weight:700;

}

.timelineDot{

width:12px;

height:12px;

border-radius:50%;

background:#D1D5DB;

}

.timelineDone{

background:#16A34A;

}

.timelineActive{

background:#F4B400;

}

</style>

<script>

window.getTimelineHTML =
function(status){

const steps = [

"Pending",
"Pickup Assigned",
"Picked Up",
"Cleaning",
"Out For Delivery",
"Delivered"

];

let currentIndex =

steps.indexOf(status);

if(currentIndex < 0){

currentIndex = 0;

}

let html =
'<div class="timeline">';

steps.forEach((step,index)=>{

let dotClass =
"timelineDot";

if(index < currentIndex){

dotClass +=
" timelineDone";

}else if(index === currentIndex){

dotClass +=
" timelineActive";

}

html += `

<div class="timelineStep">

<div class="${dotClass}"></div>

<div>${step}</div>

</div>

`;

});

html += "</div>";

return html;

};

</script><section
style="padding:0 16px 16px;">

<input

id="orderSearch"

placeholder="Search Order Number"

style="
width:100%;
height:54px;
border:none;
border-radius:16px;
padding:0 16px;
outline:none;
background:#fff;
">

</section>

<script>

document
.getElementById(
"orderSearch"
)

.addEventListener(

"input",

function(){

const keyword =

this.value
.toLowerCase();

const filtered =

allOrders.filter(order=>{

return (

order.orderNumber ||

""

)

.toLowerCase()

.includes(keyword);

});

renderOrders(
filtered
);

}

);

</script><script>

window.filterOrders =
function(type){

document
.querySelectorAll(
".tabBtn"
)

.forEach(btn=>{

btn.classList.remove(
"activeTab"
);

});

event.target.classList.add(
"activeTab"
);

if(type==="all"){

renderOrders(
allOrders
);

return;

}

if(type==="active"){

const activeOrders =

allOrders.filter(order=>

order.status !==
"Delivered"

&&

order.status !==
"Cancelled"

);

renderOrders(
activeOrders
);

return;

}

if(type==="completed"){

renderOrders(

allOrders.filter(order=>

order.status ===
"Delivered"

)

);

return;

}

if(type==="cancelled"){

renderOrders(

allOrders.filter(order=>

order.status ===
"Cancelled"

)

);

}

};

</script><nav class="bottomNav">

<button
onclick="location.href='index.html'">

<i class="fa-solid fa-house"></i>

<span>

Home

</span>

</button>

<button
onclick="location.href='services.html'">

<i class="fa-solid fa-table-cells-large"></i>

<span>

Services

</span>

</button>

<button
onclick="location.href='cart.html'">

<i class="fa-solid fa-cart-shopping"></i>

<span>

Cart

</span>

</button>

<button
class="activeNav">

<i class="fa-solid fa-box"></i>

<span>

Orders

</span>

</button>

<button
onclick="location.href='profile.html'">

<i class="fa-solid fa-user"></i>

<span>

Profile

</span>

</button>

</nav>

<style>

.bottomNav{

position:fixed;

left:0;
right:0;
bottom:0;

height:74px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -8px 24px rgba(0,0,0,.08);

z-index:9999;

}

.bottomNav button{

flex:1;

height:100%;

border:none;

background:none;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:4px;

font-size:11px;

font-weight:700;

color:#6B7280;

cursor:pointer;

}

.bottomNav i{

font-size:18px;

}

.activeNav{

color:#16A34A !important;

}

</style>

<script type="module">

import { auth }
from "./firebase.js";

import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

onAuthStateChanged(

auth,

(user)=>{

if(user){

loadOrders();

}else{

window.location.href =
"login.html";

}

}

);

</script>

</body>

</html>
