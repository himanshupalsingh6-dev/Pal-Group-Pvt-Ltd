<script>

</script><script type="module">

import { db, auth }
from "./firebase.js";

import {

collection,
query,
where,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

let allOrders = [];

/* ===================================
LOAD ORDERS
=================================== */

function loadOrders(){

if(!auth.currentUser){

return;

}

const ordersQuery =

query(

collection(db,"orders"),

where(
"userId",
"==",
auth.currentUser.uid
)

);

onSnapshot(

ordersQuery,

(snapshot)=>{

allOrders = [];

snapshot.forEach(doc=>{

allOrders.push({

id:doc.id,

...doc.data()

});

});

renderOrders(
allOrders
);

updateStats();

}

);

}

/* ===================================
STATS
=================================== */

function updateStats(){

const pending =

allOrders.filter(

o=>o.status==="Pending"

).length;

const processing =

allOrders.filter(

o=>o.status==="Processing"

).length;

const delivered =

allOrders.filter(

o=>o.status==="Delivered"

).length;

document.getElementById(
"pendingCount"
).innerHTML = pending;

document.getElementById(
"processingCount"
).innerHTML = processing;

document.getElementById(
"deliveredCount"
).innerHTML = delivered;

}

window.loadOrders = loadOrders;

</script><div

<script>

window.openOrderModal =
function(orderId){

const order =

allOrders.find(

o=>o.id===orderId

);

if(!order) return;

let itemsHtml = "";

(order.items || [])
.forEach(item=>{

itemsHtml += `

<div
style="display:flex;
justify-content:space-between;
margin-bottom:10px;">

<span>

${item.serviceName}

</span>

<span>

${item.qty} x ₹${item.price}

</span>

</div>

`;

});

document.getElementById(
"orderModalContent"
).innerHTML =

`

<p><b>Order ID:</b> ${order.id}</p>
<p><b>Status:</b> ${order.status}</p>
<p><b>Total:</b> ₹${order.total}</p>

<hr style="margin:15px 0;">

${itemsHtml}

`;

document.getElementById(
"orderModal"
).style.display =
"flex";

};

window.closeOrderModal =
function(){

document.getElementById(
"orderModal"
).style.display =
"none";

};

</script><script type="module">

import { db }
from "./firebase.js";

import {

doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===================================
CANCEL ORDER
=================================== */

window.cancelOrder =
async function(orderId){

const confirmCancel =

confirm(
"Cancel this order?"
);

if(!confirmCancel){

return;

}

await updateDoc(

doc(
db,
"orders",
orderId
),

{

status:"Cancelled"

}

);

showToast(
"Order Cancelled"
);

};

/* ===================================
REPEAT ORDER
=================================== */

window.repeatOrder =
function(orderId){

const order =

allOrders.find(

o=>o.id===orderId

);

if(!order) return;

localStorage.setItem(

"cart",

JSON.stringify(
order.items
)

);

showToast(
"Items Added To Cart"
);

setTimeout(()=>{

window.location.href =
"cart.html";

},1000);

};

</script><div

<script>

window.showToast =
function(message){

const toast =

document.getElementById(
"ordersToast"
);

toast.innerHTML = message;

toast.style.display =
"block";

setTimeout(()=>{

toast.style.display =
"none";

},2000);

};

/* ===================================
RENDER ORDERS
=================================== */

window.renderOrders =
function(orders){

const container =

document.getElementById(
"ordersContainer"
);

const emptyState =

document.getElementById(
"emptyOrders"
);

if(orders.length===0){

container.innerHTML = "";

emptyState.style.display =
"block";

return;

}

emptyState.style.display =
"none";

let html = "";

orders.forEach(order=>{

html += `

<div class="orderCard">

<div class="orderTop">

<div>

<div class="orderId">

#${order.id}

</div>

<div class="orderDate">

${new Date(
order.createdAt?.seconds
? order.createdAt.seconds*1000
: Date.now()
).toLocaleDateString()}

</div>

</div>

<div class="orderStatus status${order.status}">

${order.status}

</div>

</div>

<div class="orderAmount">

₹${order.total || 0}

</div>

${createTimeline(order.status)}

<div class="orderActions">

<button
class="actionBtn detailsBtn"
onclick="openOrderModal('${order.id}')">

Details

</button>

<button
class="actionBtn repeatBtn"
onclick="repeatOrder('${order.id}')">

Repeat

</button>

</div>

</div>

`;

});

container.innerHTML = html;

};

/* ===================================
START
=================================== */

document.addEventListener(

"DOMContentLoaded",

()=>{

if(window.loadOrders){

loadOrders();

}

}

);

</script><!-- ===================================

<script>

/* ===================================
PROFILE
=================================== */

window.openProfile =
function(){

window.location.href =
"profile.html";

};

/* ===================================
CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

let total = 0;

cart.forEach(item=>{

total +=

item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateNavbarCartCount();

/* ===================================
ORDER SEARCH
=================================== */

const searchInput =

document.getElementById(
"orderSearch"
);

if(searchInput){

searchInput.addEventListener(

"input",

function(){

const value =

this.value
.toLowerCase();

const filtered =

allOrders.filter(

order=>

order.id
.toLowerCase()
.includes(value)

);

renderOrders(
filtered
);

}

);

}

/* ===================================
ORDER FILTER
=================================== */

document
.querySelectorAll(
".filterBtn"
)

.forEach(btn=>{

btn.addEventListener(

"click",

()=>{

document
.querySelectorAll(
".filterBtn"
)

.forEach(item=>{

item.classList.remove(
"activeFilter"
);

});

btn.classList.add(
"activeFilter"
);

const status =

btn.dataset.status;

if(status==="All"){

renderOrders(
allOrders
);

return;

}

const filtered =

allOrders.filter(

order=>

order.status===status

);

renderOrders(
filtered
);

}

);

});

/* ===================================
APP READY
=================================== */

document.addEventListener(

"DOMContentLoaded",

()=>{

updateNavbarCartCount();

if(window.loadOrders){

loadOrders();

}

console.log(
"QuickPress Orders Ready"
);

}

);

</script>
