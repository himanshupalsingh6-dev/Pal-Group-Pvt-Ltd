<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

My Orders • QuickPress

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link
rel="stylesheet"
href="orders.css">

</head>

<body>

<!-- ==========================================
LOGIN LOADER
========================================== -->

<div
id="pageLoader"
class="pageLoader">

<div class="loader"></div>

<p>

Loading Orders...

</p>

</div>

<!-- ==========================================
HEADER
========================================== -->

<header class="header">

<button
class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div>

<h1>

My Orders

</h1>

<p>

Track all your laundry orders

</p>

</div>

</header>

<!-- ==========================================
SEARCH
========================================== -->

<section class="searchSection">

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchInput"
placeholder="Search Order ID...">

</div>

</section>

<!-- ==========================================
FILTERS
========================================== -->

<section class="filterSection">

<button
class="filterBtn active"
data-filter="all">

All

</button>

<button
class="filterBtn"
data-filter="active">

Active

</button>

<button
class="filterBtn"
data-filter="completed">

Completed

</button>

<button
class="filterBtn"
data-filter="cancelled">

Cancelled

</button>

</section>

<!-- ==========================================
ORDER STATS
========================================== -->

<section class="statsGrid">

<div class="statCard">

<h2 id="totalOrders">

0

</h2>

<p>

Total Orders

</p>

</div>

<div class="statCard">

<h2 id="activeOrders">

0

</h2>

<p>

Active

</p>

</div>

<div class="statCard">

<h2 id="completedOrders">

0

</h2>

<p>

Delivered

</p>

</div>

</section>

<!-- ==========================================
ORDERS CONTAINER
========================================== -->

<section
id="ordersContainer"
class="ordersContainer">

<!-- FIREBASE DATA -->

</section>

<!-- ==========================================
EMPTY STATE
========================================== -->

<section
id="emptyState"
class="emptyState">

<div class="emptyIcon">

📦

</div>

<h2>

No Orders Found

</h2>

<p>

You haven't placed any orders yet.

</p>

<button
class="browseBtn"
onclick="window.location.href='services.html'">

Browse Services

</button>

</section>
<!-- ==========================================
ORDER CARD TEMPLATE
========================================== -->

<template id="orderCardTemplate">

<div class="orderCard">

<div class="orderTop">

<div>

<h3 class="orderId">

#QP12345

</h3>

<p class="orderDate">

10 June 2026 • 10:45 AM

</p>

</div>

<div class="statusBadge activeStatus">

Cleaning

</div>

</div>

<div class="orderMiddle">

<div class="orderInfo">

<span>

🧺 5 Items

</span>

<span>

₹450

</span>

</div>

<div class="orderInfo">

<span>

📅 Pickup: 10 June

</span>

<span>

🚚 Delivery: 12 June

</span>

</div>

</div>

<!-- TIMELINE -->

<div class="miniTimeline">

<div class="timelineStep completed">

<span></span>

<p>

Received

</p>

</div>

<div class="timelineLine"></div>

<div class="timelineStep completed">

<span></span>

<p>

Picked Up

</p>

</div>

<div class="timelineLine"></div>

<div class="timelineStep active">

<span></span>

<p>

Cleaning

</p>

</div>

<div class="timelineLine"></div>

<div class="timelineStep">

<span></span>

<p>

Delivered

</p>

</div>

</div>

<div class="orderActions">

<button class="trackBtn">

Track Order

</button>

<button class="detailsBtn">

View Details

</button>

</div>

</div>

</template>

<!-- ==========================================
ORDER DETAILS MODAL
========================================== -->

<div
id="orderModal"
class="orderModal">

<div class="modalContent">

<div class="modalHeader">

<h2>

Order Details

</h2>

<button
class="closeModal">

<i class="fa-solid fa-xmark"></i>

</button>

</div>

<div
id="modalBody">

<!-- JS DATA -->

</div>

</div>

</div>

<style>

/* ==========================================
ORDER CARD
========================================== */

.orderCard{

background:#fff;

border-radius:24px;

padding:20px;

margin-bottom:18px;

box-shadow:
0 6px 20px rgba(0,0,0,.05);

}

.orderTop{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:18px;

}

.orderId{

font-size:18px;

font-weight:900;

color:#111827;

}

.orderDate{

margin-top:5px;

font-size:13px;

color:#6B7280;

}

/* ==========================================
STATUS
========================================== */

.statusBadge{

padding:8px 14px;

border-radius:999px;

font-size:12px;

font-weight:800;

}

.activeStatus{

background:#DBEAFE;

color:#2563EB;

}

.completedStatus{

background:#DCFCE7;

color:#16A34A;

}

.cancelledStatus{

background:#FEE2E2;

color:#DC2626;

}

/* ==========================================
INFO
========================================== */

.orderMiddle{

margin-bottom:18px;

}

.orderInfo{

display:flex;

justify-content:space-between;

margin-bottom:10px;

font-size:14px;

font-weight:600;

}

/* ==========================================
TIMELINE
========================================== */

.miniTimeline{

display:flex;

align-items:center;

margin:20px 0;

}

.timelineStep{

display:flex;

flex-direction:column;

align-items:center;

gap:6px;

}

.timelineStep span{

width:14px;
height:14px;

border-radius:50%;

background:#D1D5DB;

}

.timelineStep.completed span{

background:#16A34A;

}

.timelineStep.active span{

background:#F4B400;

}

.timelineStep p{

font-size:11px;

font-weight:700;

color:#6B7280;

}

.timelineLine{

flex:1;

height:3px;

background:#E5E7EB;

margin:0 8px;

}

/* ==========================================
ACTIONS
========================================== */

.orderActions{

display:flex;

gap:12px;

margin-top:18px;

}

.trackBtn{

flex:1;

height:48px;

border:none;

border-radius:14px;

background:#16A34A;

color:white;

font-weight:800;

cursor:pointer;

}

.detailsBtn{

flex:1;

height:48px;

border:none;

border-radius:14px;

background:#F3F4F6;

font-weight:800;

cursor:pointer;

}

/* ==========================================
MODAL
========================================== */

.orderModal{

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

display:none;

justify-content:center;

align-items:flex-end;

z-index:9999;

}

.modalContent{

width:100%;

max-width:650px;

background:white;

border-radius:30px 30px 0 0;

padding:24px;

max-height:85vh;

overflow:auto;

}

.modalHeader{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.closeModal{

width:42px;
height:42px;

border:none;

border-radius:12px;

background:#F3F4F6;

cursor:pointer;

}

</style>
<!-- ==========================================
ORDERS JS
========================================== -->

<script type="module" src="orders.js"></script>

</body>
</html>
