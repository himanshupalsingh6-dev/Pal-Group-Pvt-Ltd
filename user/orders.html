<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Orders - QuickPress</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{
--green:#16A34A;
--yellow:#F4B400;
--dark:#111827;
--gray:#6B7280;
--bg:#F8FAFC;
}

body{
background:var(--bg);
padding-bottom:100px;
}

/* HEADER */

.header{

position:sticky;
top:0;

background:white;

padding:16px;

display:flex;
align-items:center;
gap:14px;

box-shadow:0 4px 15px rgba(0,0,0,.05);

z-index:100;

}

.backBtn{

width:44px;
height:44px;

border:none;

border-radius:14px;

background:#F3F4F6;

font-size:18px;

cursor:pointer;

}

.title{

font-size:24px;

font-weight:900;

}

/* CARD */

.ordersContainer{

padding:16px;

}

.orderCard{

background:white;

border-radius:24px;

padding:18px;

margin-bottom:18px;

box-shadow:0 8px 25px rgba(0,0,0,.05);

}

.orderTop{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:14px;

}

.orderId{

font-size:16px;

font-weight:900;

}

.status{

padding:8px 12px;

border-radius:999px;

background:#ECFDF5;

color:#16A34A;

font-size:12px;

font-weight:900;

}

.orderAmount{

font-size:24px;

font-weight:900;

margin-top:10px;

}

/* TIMELINE */

.timeline{

margin-top:20px;

}

.step{

display:flex;

gap:12px;

margin-bottom:18px;

}

.stepDot{

width:18px;
height:18px;

border-radius:50%;

background:#D1D5DB;

margin-top:4px;

}

.step.active .stepDot{

background:#16A34A;

}

.stepContent h4{

font-size:14px;

font-weight:800;

}

.stepContent p{

font-size:12px;

color:#6B7280;

margin-top:4px;

}

/* EMPTY */

.empty{

text-align:center;

padding:80px 20px;

display:none;

}

.emptyIcon{

font-size:80px;

}

.empty h2{

margin-top:15px;

font-size:28px;

font-weight:900;

}

.empty p{

margin-top:10px;

color:#6B7280;

}

.shopBtn{

margin-top:20px;

height:54px;

padding:0 20px;

border:none;

border-radius:16px;

background:#16A34A;

color:white;

font-weight:900;

}

</style>

</head>

<body>

<div class="header">

<button
class="backBtn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="title">

My Orders

</div>

</div>

<div
id="ordersContainer"
class="ordersContainer">

</div>

<div
id="emptyState"
class="empty">

<div class="emptyIcon">

📦

</div>

<h2>

No Orders Yet

</h2>

<p>

Place your first order with QuickPress

</p>

<button
class="shopBtn"
onclick="goHome()">

Browse Services

</button>

</div>

<script type="module">

import { db, auth }
from "../js/firebase.js";

import {

collection,
query,
where,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* LOAD ORDERS */

async function loadOrders(){

const container =

document.getElementById(
"ordersContainer"
);

const empty =

document.getElementById(
"emptyState"
);

const user =

auth.currentUser;

if(!user){

empty.style.display =
"block";

return;

}

const q = query(

collection(db,"orders"),

where(
"uid",
"==",
user.uid
)

);

const snapshot =
await getDocs(q);

if(snapshot.empty){

empty.style.display =
"block";

return;

}

container.innerHTML = "";

snapshot.forEach(doc=>{

const order =
doc.data();

container.innerHTML += `

<div class="orderCard">

<div class="orderTop">

<div>

<div class="orderId">

${order.orderId}

</div>

<div>

${order.paymentMethod}

</div>

</div>

<div class="status">

${order.status}

</div>

</div>

<div class="orderAmount">

₹${order.grandTotal}

</div>

<div class="timeline">

<div class="step active">

<div class="stepDot"></div>

<div class="stepContent">

<h4>

Order Received

</h4>

<p>

Your order is confirmed

</p>

</div>

</div>

<div class="step active">

<div class="stepDot"></div>

<div class="stepContent">

<h4>

Pickup Assigned

</h4>

<p>

Pickup partner assigned

</p>

</div>

</div>

<div class="step">

<div class="stepDot"></div>

<div class="stepContent">

<h4>

Picked Up

</h4>

<p>

Laundry collected

</p>

</div>

</div>

<div class="step">

<div class="stepDot"></div>

<div class="stepContent">

<h4>

Cleaning In Progress

</h4>

<p>

Processing clothes

</p>

</div>

</div>

<div class="step">

<div class="stepDot"></div>

<div class="stepContent">

<h4>

Out For Delivery

</h4>

<p>

On the way

</p>

</div>

</div>

<div class="step">

<div class="stepDot"></div>

<div class="stepContent">

<h4>

Delivered

</h4>

<p>

Successfully delivered

</p>

</div>

</div>

</div>

</div>

`;

});

}

function goHome(){

window.location.href =
"services.html";

}

loadOrders();

</script>

</body>
</html>
