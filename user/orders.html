<script>

/* ===================================
FILTER ORDERS
=================================== */

window.filterOrders =
function(status){

/* ACTIVE TAB */

document
.querySelectorAll(
".filterBtn"
)

.forEach(btn=>{

btn.classList.remove(
"activeFilter"
);

});

event.target.classList.add(
"activeFilter"
);

/* ALL */

if(status==="all"){

renderOrders(
allOrders
);

return;

}

/* FILTER */

const filtered =

allOrders.filter(

order=>

(order.orderStatus || "")
.toLowerCase()

===

status.toLowerCase()

);

renderOrders(
filtered
);

};

/* ===================================
ORDER DETAILS
=================================== */

window.openOrderDetails =
function(orderId){

localStorage.setItem(

"selectedOrderId",

orderId

);

window.location.href =

"order-details.html";

};

/* ===================================
REORDER
=================================== */

window.reorder =
function(orderId){

const order =

allOrders.find(

o =>

o.orderId === orderId

);

if(!order){

alert(
"Order not found"
);

return;

}

/* ADD ITEMS TO CART */

let cart = [];

(order.items || []).forEach(item=>{

cart.push({

serviceId:

item.serviceId ||

Date.now(),

categoryName:

item.categoryName,

subcategoryName:

item.subcategoryName,

serviceName:

item.serviceName,

price:

item.price,

qty:

item.qty

});

});

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

alert(
"Items added to cart"
);

window.location.href =
"cart.html";

};

/* ===================================
STATUS TIMELINE
=================================== */

window.getTimelineHtml =
function(status){

const steps = [

"Pending",

"Confirmed",

"Picked Up",

"Processing",

"Out For Delivery",

"Delivered"

];

let html =
'<div class="timeline">';

const currentIndex =

steps.indexOf(status);

steps.forEach(

(step,index)=>{

html +=

`

<div class="timelineStep">

<div class="timelineDot

${index <= currentIndex
? 'activeDot'
: ''}">

</div>

<div class="timelineText">

${step}

</div>

</div>

`;

}

);

html += '</div>';

return html;

};

</script>

<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
AUTH
=================================== */

let currentUser = null;

onAuthStateChanged(

auth,

(user)=>{

currentUser = user;

/* Login Required */

if(!user){

window.location.href =
"login.html";

return;

}

}

);

/* ===================================
PROFILE
=================================== */

window.openProfile =
function(){

if(currentUser){

window.location.href =
"profile.html";

}else{

window.location.href =
"login.html";

}

};

/* ===================================
CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateNavbarCartCount();

/* ===================================
AUTO REFRESH ORDERS

Every 30 Seconds

=================================== */

setInterval(()=>{

if(window.loadOrders){

loadOrders();

}

},30000);

/* ===================================
REALTIME PAGE SYNC
=================================== */

window.addEventListener(

"storage",

()=>{

updateNavbarCartCount();

if(window.loadOrders){

loadOrders();

}

}

);

/* ===================================
PAGE READY
=================================== */

console.log(
"QuickPress Orders Ready"
);

</script>
