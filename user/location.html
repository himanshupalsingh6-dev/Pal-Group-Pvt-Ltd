<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Location</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F6F7FB;

min-height:100vh;

}

.header{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:30px 20px;

border-bottom-left-radius:35px;
border-bottom-right-radius:35px;

}

.header h1{

font-size:32px;
font-weight:900;

}

.header p{

margin-top:8px;

font-size:14px;

font-weight:600;

color:#374151;

}

.container{

padding:20px;

}

.locationCard{

background:#fff;

padding:22px;

border-radius:28px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.locationTitle{

font-size:18px;

font-weight:900;

margin-bottom:15px;

}

.currentLocation{

background:#F9FAFB;

padding:16px;

border-radius:18px;

margin-bottom:15px;

}

.locationText{

font-size:14px;

line-height:1.8;

color:#374151;

}

.detectBtn{

width:100%;

height:56px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

margin-top:10px;

}

.cityGrid{

margin-top:20px;

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

}

.cityCard{

background:#fff;

border:2px solid #E5E7EB;

padding:18px;

border-radius:20px;

text-align:center;

cursor:pointer;

font-weight:800;

}

.activeCity{

border-color:#16A34A;

background:#DCFCE7;

}

.saveBtn{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

margin-top:25px;

}

.watermark{

margin-top:30px;

text-align:center;

font-size:12px;

opacity:.7;

}

</style>

</head>

<body>

<div class="header">

<h1>
Select Location
</h1>

<p>
Location helps us show city-wise services & pricing
</p>

</div>

<div class="container">

<div class="locationCard">

<div class="locationTitle">

📍 Current Location

</div>

<div class="currentLocation">

<div
id="locationText"
class="locationText">

Location not detected

</div>

</div>

<button
id="detectBtn"
class="detectBtn">

Detect My Location

</button>

</div>

<div class="locationCard"
style="margin-top:20px;">

<div class="locationTitle">

🏙 Select City

</div>

<div class="cityGrid">

<div
class="cityCard"
data-city="Kasganj">

Kasganj

</div>

<div
class="cityCard"
data-city="Aligarh">

Aligarh

</div>

<div
class="cityCard"
data-city="Delhi">

Delhi

</div>

<div
class="cityCard"
data-city="Noida">

Noida

</div>

</div>

<button
id="saveBtn"
class="saveBtn">

Save Location

</button>

</div>

<div class="watermark">

Made in Uttar Pradesh 🇮🇳<br>
Crafted by Himanshu Baghel 💗

</div>

</div>
<script>

let selectedCity = "";
let latitude = "";
let longitude = "";

/* ==========================
CITY SELECT
========================== */

document
.querySelectorAll(
".cityCard"
)

.forEach(card=>{

card.addEventListener(

"click",

()=>{

document
.querySelectorAll(
".cityCard"
)

.forEach(c=>
c.classList.remove(
"activeCity"
)
);

card.classList.add(
"activeCity"
);

selectedCity =
card.dataset.city;

}

);

});

/* ==========================
GPS DETECT
========================== */

document
.getElementById(
"detectBtn"
)

.addEventListener(

"click",

()=>{

navigator.geolocation
.getCurrentPosition(

(position)=>{

latitude =
position.coords.latitude;

longitude =
position.coords.longitude;

document
.getElementById(
"locationText"
)

.innerHTML =

`
Latitude:
${latitude}

<br>

Longitude:
${longitude}
`;

},

(error)=>{

alert(
"Location Permission Denied"
);

}

);

}

);

/* ==========================
SAVE LOCATION
========================== */

document
.getElementById(
"saveBtn"
)

.addEventListener(

"click",

()=>{

if(!selectedCity){

alert(
"Select City"
);

return;

}

const locationData = {

city:
selectedCity,

latitude,

longitude,

savedAt:
Date.now()

};

/* ==========================
LOCAL STORAGE
========================== */

localStorage.setItem(

"userLocation",

JSON.stringify(
locationData
)

);

localStorage.setItem(
"userCity",
selectedCity
);

/* ==========================
REDIRECT
========================== */

window.location.href =
"index.html";

}

);

</script>

</body>
</html>
