<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Select Location | QuickPress

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#111827;
--gray:#6B7280;
--bg:#F8FAFC;

}

body{

background:var(--bg);

min-height:100vh;

}

/* Header */

.header{

padding:24px 20px;

background:#fff;

box-shadow:
0 4px 20px rgba(0,0,0,.05);

}

.logo{

font-size:32px;

font-weight:900;

color:#111827;

}

.subtitle{

margin-top:6px;

color:#64748B;

font-size:14px;

}

/* Hero */

.hero{

padding:40px 20px;

text-align:center;

}

.heroIcon{

width:120px;

height:120px;

margin:auto;

border-radius:50%;

background:
linear-gradient(
135deg,
#F4B400,
#16A34A
);

display:flex;

align-items:center;

justify-content:center;

font-size:55px;

color:#fff;

animation:
pulse 2s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.05);

}

}

.heroTitle{

margin-top:25px;

font-size:32px;

font-weight:900;

color:#111827;

}

.heroText{

margin-top:12px;

color:#64748B;

line-height:1.8;

font-size:15px;

}

/* Buttons */

.section{

padding:0 20px;

}

.detectBtn{

width:100%;

height:60px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:17px;

font-weight:800;

cursor:pointer;

}

.searchBox{

margin-top:20px;

position:relative;

}

.searchBox input{

width:100%;

height:58px;

border:2px solid #E5E7EB;

border-radius:18px;

padding:0 18px 0 50px;

font-size:15px;

outline:none;

background:#fff;

}

.searchBox i{

position:absolute;

left:18px;

top:20px;

color:#64748B;

}

/* Cities */

.citySection{

padding:30px 20px;

}

.cityTitle{

font-size:18px;

font-weight:800;

margin-bottom:16px;

}

.cityGrid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px;

}

.cityCard{

background:#fff;

padding:18px;

border-radius:18px;

text-align:center;

font-weight:700;

cursor:pointer;

box-shadow:
0 4px 14px rgba(0,0,0,.05);

transition:.3s;

}

.cityCard:hover{

transform:translateY(-3px);

}

/* Loader */

.loader{

display:none;

text-align:center;

padding:30px;

}

.loader i{

font-size:35px;

color:#16A34A;

animation:
spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

</style>

</head>

<body>

<div class="header">

<div class="logo">

QuickPress

</div>

<div class="subtitle">

Premium Laundry Marketplace

</div>

</div>

<div class="hero">

<div class="heroIcon">

📍

</div>

<div class="heroTitle">

Choose Your Location

</div>

<div class="heroText">

Enable location access or select your city to see available QuickPress services.

</div>

</div>

<div class="section">

<button
class="detectBtn"
onclick="detectLocation()">

Use Current Location

</button>

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchCity"
placeholder="Search City">

</div>

</div>

<div class="loader" id="loader">

<i class="fa-solid fa-spinner"></i>

<p style="margin-top:10px;">

Detecting Location...

</p>

</div>

<div class="citySection">

<div class="cityTitle">

Popular Cities

</div>

<div class="cityGrid">

<div
class="cityCard"
onclick="selectCity('Kasganj')">

Kasganj

</div>

<div
class="cityCard"
onclick="selectCity('Noida')">

Noida

</div>

<div
class="cityCard"
onclick="selectCity('Delhi')">

Delhi

</div>

<div
class="cityCard"
onclick="selectCity('Agra')">

Agra

</div>

<div
class="cityCard"
onclick="selectCity('Lucknow')">

Lucknow

</div>

<div
class="cityCard"
onclick="selectCity('Aligarh')">

Aligarh

</div>

</div>

</div>

<script>

function selectCity(city){

localStorage.setItem(
"userCity",
city
);

checkService(city);

}

function detectLocation(){

document.getElementById(
"loader"
).style.display =
"block";

if(!navigator.geolocation){

alert(
"Location Not Supported"
);

return;

}

navigator.geolocation.getCurrentPosition(

async(position)=>{

try{

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

const response =
await fetch(

`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`

);

const data =
await response.json();

const city =

data.address.city ||

data.address.town ||

data.address.county ||

"Unknown";

localStorage.setItem(
"userCity",
city
);

checkService(city);

}

catch(error){

alert(
"Location Detection Failed"
);

}

},

()=>{

alert(
"Location Permission Denied"
);

}

);

}

function checkService(city){

const activeCities = [

"Kasganj",
"Noida",
"Delhi"

];

if(
activeCities.includes(city)
){

window.location.href =
"index.html";

}else{

window.location.href =
"unserviceable.html";

}

}

document
.getElementById(
"searchCity"
)

.addEventListener(

"keyup",

function(){

const city =
this.value.trim();

if(city.length > 2){

selectCity(city);

}

}

);

</script>

</body>

</html>
