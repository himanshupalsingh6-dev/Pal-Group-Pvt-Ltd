<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Verify OTP

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#fff;

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

padding:24px;

}

:root{

--yellow:#F4B400;
--green:#16A34A;
--dark:#111827;
--gray:#6B7280;

}.otpCard{

max-width:450px;

width:100%;

margin:auto;

}

.logo{

font-size:42px;

font-weight:900;

color:var(--green);

}

.title{

font-size:32px;

font-weight:900;

margin-top:14px;

color:var(--dark);

}

.sub{

margin-top:8px;

color:var(--gray);

line-height:1.6;

}

.otpInput{

width:100%;

height:64px;

margin-top:24px;

border:1px solid #E5E7EB;

border-radius:18px;

font-size:22px;

text-align:center;

letter-spacing:8px;

font-weight:800;

}

.verifyBtn{

width:100%;

height:60px;

margin-top:18px;

border:none;

border-radius:18px;

background:var(--green);

color:white;

font-size:18px;

font-weight:800;

cursor:pointer;

}

.resend{

margin-top:18px;

text-align:center;

color:var(--green);

font-weight:700;

cursor:pointer;

}

</style>
</head>
<body><div class="otpCard">

<div class="logo">

QuickPress

</div>

<div class="title">

Verify OTP

</div>

<div class="sub">

Enter the verification code
sent to your mobile number

</div>

<input

id="otpCode"

class="otpInput"

maxlength="6"

placeholder="------">

<button
id="verifyBtn"
class="verifyBtn">

Verify OTP

</button>

<div
id="resendBtn"
class="resend">

Resend OTP

</div>

</div><script type="module">

import {

auth,
db

} from "./js/firebase.js";

import {

signInWithPhoneNumber,
RecaptchaVerifier

} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {

doc,
setDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";window.recaptchaVerifier =
new RecaptchaVerifier(

auth,

"verifyBtn",

{

size:"invisible"

}

);const phone =

localStorage.getItem(
"qp_phone"
);

async function sendOTP(){

try{

const result =

await signInWithPhoneNumber(

auth,

"+91" + phone,

window.recaptchaVerifier

);

window.confirmationResult =
result;

}catch(error){

console.log(error);

alert(
"OTP Send Failed"
);

}

}

sendOTP();document

.getElementById(
"verifyBtn"
)

.addEventListener(

"click",

async()=>{

const otp =

document
.getElementById(
"otpCode"
)
.value;

try{

const result =

await window.confirmationResult.confirm(
otp
);

const user =
result.user;

await setDoc(

doc(
db,
"users",
user.uid
),

{

uid:user.uid,

phone:user.phoneNumber,

createdAt:
serverTimestamp()

},

{merge:true}

);

localStorage.setItem(

"qp_uid",

user.uid

);

window.location.href =
"notification-permission.html";

}catch(error){

console.log(error);

alert(
"Invalid OTP"
);

}

});<script>

document

.getElementById(
"resendBtn"
)

.addEventListener(

"click",

()=>{

location.reload();

}

);

</script>

</body>
</html>
