<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickPress - Verify OTP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#ffffff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.otpCard{
width:100%;
max-width:450px;
}

.logo{
font-size:42px;
font-weight:900;
color:#16A34A;
margin-bottom:10px;
}

.title{
font-size:34px;
font-weight:900;
color:#111827;
margin-bottom:10px;
}

.sub{
color:#6B7280;
line-height:1.6;
margin-bottom:24px;
}

.otpInput{
width:100%;
height:65px;
border:1px solid #E5E7EB;
border-radius:18px;
font-size:24px;
font-weight:800;
text-align:center;
letter-spacing:8px;
outline:none;
}

.verifyBtn{
width:100%;
height:60px;
margin-top:18px;
border:none;
border-radius:18px;
background:#16A34A;
color:#fff;
font-size:18px;
font-weight:800;
cursor:pointer;
}

.verifyBtn:disabled{
opacity:.6;
cursor:not-allowed;
}

.resend{
margin-top:20px;
text-align:center;
font-weight:700;
color:#16A34A;
cursor:pointer;
}

.loader{
display:none;
margin-top:15px;
text-align:center;
font-weight:700;
color:#16A34A;
}

#recaptcha-container{
margin-top:10px;
}

</style>
</head>

<body>

<div class="otpCard">

<div class="logo">
QuickPress
</div>

<div class="title">
Verify OTP
</div>

<div class="sub">
Enter the OTP sent to your mobile number.
</div>

<input
type="text"
id="otpCode"
class="otpInput"
maxlength="6"
placeholder="------">

<div id="recaptcha-container"></div>

<button
id="verifyBtn"
class="verifyBtn">
Verify OTP
</button>

<div id="loader" class="loader">
Verifying...
</div>

<div
id="resendBtn"
class="resend">
Resend OTP
</div>

</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
RecaptchaVerifier,
signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
doc,
setDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const verifyBtn =
document.getElementById("verifyBtn");

const resendBtn =
document.getElementById("resendBtn");

const loader =
document.getElementById("loader");

const phone =
localStorage.getItem("qp_phone");

if(!phone){
alert("Phone number missing");
window.location.href="auth.html";
}

window.recaptchaVerifier =
new RecaptchaVerifier(
auth,
"recaptcha-container",
{
size:"invisible"
}
);

async function sendOTP(){

try{

const result =
await signInWithPhoneNumber(
auth,
"+91"+phone,
window.recaptchaVerifier
);

window.confirmationResult =
result;

console.log("OTP Sent");

}catch(error){

console.error(error);

alert("OTP Send Failed");

}

}

sendOTP();

verifyBtn.addEventListener(
"click",
async()=>{

const otp =
document.getElementById("otpCode").value;

if(otp.length !== 6){
alert("Enter valid OTP");
return;
}

if(!window.confirmationResult){
alert("OTP session not found");
return;
}

try{

loader.style.display="block";
verifyBtn.disabled=true;

const result =
await window.confirmationResult.confirm(otp);

const user =
result.user;

await setDoc(
doc(db,"users",user.uid),
{
uid:user.uid,
phone:user.phoneNumber,
createdAt:serverTimestamp()
},
{merge:true}
);

localStorage.setItem(
"qp_uid",
user.uid
);

window.location.href =
"notification-permission.html";

}catch(error){

console.error(error);

alert("Invalid OTP");

loader.style.display="none";
verifyBtn.disabled=false;

}

});

resendBtn.addEventListener(
"click",
()=>{
location.reload();
}
);

</script>

</body>
</html>
