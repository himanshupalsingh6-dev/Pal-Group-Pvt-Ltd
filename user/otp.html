<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Verify OTP

</title>

<style>

body{

font-family:Inter,sans-serif;

background:#F7F8FA;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

padding:20px;

}

.otpCard{

width:100%;

max-width:420px;

background:#fff;

padding:30px;

border-radius:28px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

h2{

font-size:28px;

font-weight:900;

}

p{

font-size:13px;

color:#6B7280;

margin-top:8px;

margin-bottom:20px;

}

#otpInput{

width:100%;

height:60px;

font-size:24px;

text-align:center;

letter-spacing:10px;

border:1px solid #E5E7EB;

border-radius:16px;

outline:none;

}

.verifyBtn{

width:100%;

height:56px;

margin-top:20px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-weight:900;

cursor:pointer;

}

</style>

</head>

<body>

<div class="otpCard">

<h2>

Verify OTP

</h2>

<p>

Enter 6 digit code

</p>

<input
id="otpInput"
maxlength="6">

<button
class="verifyBtn"
onclick="verifyOTP()">

Verify OTP

</button>

</div><script type="module">

import { auth }
from "./firebase.js";

import {

getFirestore,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const db =
getFirestore();

window.verifyOTP =
async function(){

const code =

document.getElementById(
"otpInput"
).value.trim();

if(code.length !== 6){

alert(
"Enter valid OTP"
);

return;

}

try{

const result =

await window.opener
?.confirmationResult
?.confirm(code)

||

await window.parent
?.confirmationResult
?.confirm(code);

const user =

result.user;

const userDoc =

await getDoc(

doc(
db,
"users",
user.uid
)

);

if(userDoc.exists()){

window.location.href =
"index.html";

}else{

window.location.href =
"signup.html";

}

}

catch(error){

console.error(error);

alert(
"Invalid OTP"
);

}

};

</script>
