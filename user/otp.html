<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Verify OTP

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#0F172A;
--gray:#64748B;

}

body{

background:#fff;

}

.hero{

height:32vh;

background:
linear-gradient(
135deg,
#16A34A,
#0EA84B
);

display:flex;

justify-content:center;

align-items:center;

color:white;

text-align:center;

padding:20px;

}

.hero h1{

font-size:34px;

font-weight:900;

}

.hero p{

margin-top:10px;

opacity:.9;

}

</style>

</head>

<body>

<div class="hero">

<div>

<h1>

Verify OTP

</h1>

<p>

Secure Login To QuickPress

</p>

</div>

</div><div class="otpCard">

<h2>

Enter Verification Code

</h2>

<p id="phoneText">

+91 XXXXX XXXXX

</p>

<style>

.otpCard{

margin-top:-25px;

background:#fff;

border-radius:30px 30px 0 0;

padding:28px 24px;

min-height:68vh;

}

.otpCard h2{

text-align:center;

font-size:24px;

font-weight:800;

}

.otpCard p{

text-align:center;

margin-top:10px;

color:#64748B;

}

</style><div class="otpWrapper">

<input class="otpBox" maxlength="1">
<input class="otpBox" maxlength="1">
<input class="otpBox" maxlength="1">
<input class="otpBox" maxlength="1">
<input class="otpBox" maxlength="1">
<input class="otpBox" maxlength="1">

</div>

<style>

.otpWrapper{

display:flex;

justify-content:center;

gap:10px;

margin-top:30px;

}

.otpBox{

width:50px;

height:58px;

border:2px solid #E5E7EB;

border-radius:14px;

text-align:center;

font-size:22px;

font-weight:800;

outline:none;

}

.otpBox:focus{

border-color:#16A34A;

}

</style><button
class="verifyBtn"
onclick="verifyOTP()">

Verify OTP

</button>

<style>

.verifyBtn{

width:100%;

height:58px;

margin-top:28px;

border:none;

border-radius:18px;

background:#16A34A;

color:white;

font-size:18px;

font-weight:800;

cursor:pointer;

}

</style><div class="resendRow">

<span>

Didn't receive code?

</span>

<button
onclick="resendOTP()">

Resend OTP

</button>

</div>

<style>

.resendRow{

display:flex;

justify-content:center;

align-items:center;

gap:8px;

margin-top:24px;

}

.resendRow span{

font-size:14px;

color:#64748B;

}

.resendRow button{

border:none;

background:none;

font-weight:800;

color:#16A34A;

cursor:pointer;

}

</style><script type="module">

import { auth }
from "./firebase.js";

import {

PhoneAuthProvider,
signInWithCredential

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

const phone =

sessionStorage.getItem(
"loginPhone"
);

document.getElementById(
"phoneText"
).innerHTML =
"+91 " + phone;

</script><script type="module">

import { auth }
from "./firebase.js";

import {

PhoneAuthProvider,
signInWithCredential

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

window.verifyOTP =
async function(){

const otpBoxes =

document.querySelectorAll(
".otpBox"
);

let code = "";

otpBoxes.forEach(box=>{

code += box.value;

});

if(code.length !== 6){

alert(
"Enter Valid OTP"
);

return;

}

try{

const verificationId =

sessionStorage.getItem(
"verificationId"
);

const credential =

PhoneAuthProvider.credential(

verificationId,
code

);

const result =

await signInWithCredential(
auth,
credential
);

sessionStorage.removeItem(
"verificationId"
);

window.location.href =
"signup.html";

}

catch(error){

console.error(error);

alert(
"Invalid OTP"
);

}

};

</script><script>

const otpInputs =

document.querySelectorAll(
".otpBox"
);

otpInputs.forEach((input,index)=>{

input.addEventListener(

"input",

()=>{

if(

input.value.length === 1

&&

index < otpInputs.length - 1

){

otpInputs[
index + 1
].focus();

}

}

);

});

window.resendOTP =
function(){

window.location.href =
"login.html";

};

</script>

</div>

</body>

</html>
