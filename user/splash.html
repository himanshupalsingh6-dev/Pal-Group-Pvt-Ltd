<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickPress</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#0F172A;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.splash{
text-align:center;
color:white;
}

.logo{
font-size:64px;
font-weight:900;
color:#F4B400;
animation:zoom 1.5s ease;
}

.logo span{
color:#16A34A;
}

.tagline{
margin-top:10px;
font-size:18px;
opacity:.9;
}

.loader{
width:220px;
height:6px;
background:rgba(255,255,255,.15);
border-radius:50px;
margin:30px auto 0;
overflow:hidden;
}

.loaderFill{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#F4B400,
#16A34A
);
animation:load 3s linear forwards;
}

@keyframes load{
from{width:0}
to{width:100%}
}

@keyframes zoom{
0%{
transform:scale(.5);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

.version{
margin-top:25px;
font-size:13px;
opacity:.6;
}

</style>
</head>

<body>

<div class="splash">

<div class="logo">
Quick<span>Press</span>
</div>

<div class="tagline">
Express Laundry in 30 Minutes
</div>

<div class="loader">
<div class="loaderFill"></div>
</div>

<div class="version">
Version 1.0
</div>

</div>

<script>

setTimeout(()=>{

const uid =
localStorage.getItem("qp_uid");

if(uid){

window.location.href =
"index.html";

}else{

window.location.href =
"auth.html";

}

},2000);

</script>

</body>
</html>
