<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:#FFFFFF;

overflow:hidden;

}

</style>

</head>

<body><div class="logoWrap">

<div class="logoCircle">

QP

</div>

<h1>

QuickPress

</h1>

<p>

Premium Laundry Marketplace

</p>

</div>

<style>

.logoWrap{

text-align:center;

}

.logoCircle{

width:110px;

height:110px;

border-radius:50%;

background:
linear-gradient(
135deg,
#F4B400,
#16A34A
);

display:flex;

justify-content:center;

align-items:center;

font-size:38px;

font-weight:900;

color:white;

margin:auto;

animation:
pulse 2s infinite;

}

.logoWrap h1{

margin-top:20px;

font-size:34px;

font-weight:900;

color:#0F172A;

}

.logoWrap p{

margin-top:8px;

font-size:14px;

color:#64748B;

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

100%{

transform:scale(1);

}

}

</style><div class="loader"></div>

<style>

.loader{

width:44px;

height:44px;

margin-top:40px;

border:4px solid #E5E7EB;

border-top:4px solid #16A34A;

border-radius:50%;

animation:
spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(
360deg
);

}

}

</style><script type="module">

import { auth }
from "./firebase.js";

import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

setTimeout(()=>{

onAuthStateChanged(

auth,

(user)=>{

if(user){

window.location.replace(
"index.html"
);

}else{

window.location.replace(
"login.html"
);

}

}

);

},2500);

</script>
</body>
</html>
