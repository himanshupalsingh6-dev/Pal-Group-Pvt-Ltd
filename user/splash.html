<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QuickPress</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;
align-items:center;

flex-direction:column;

background:

linear-gradient(
135deg,
#FFD633,
#FFF5C4
);

overflow:hidden;

}

/* LOGO */

.logoBox{

text-align:center;

animation:zoomIn 1.2s ease;

}

.logo{

width:120px;
height:120px;

border-radius:35px;

background:#fff;

display:flex;

align-items:center;
justify-content:center;

margin:auto;

font-size:52px;

box-shadow:
0 15px 40px rgba(0,0,0,.12);

}

.appName{

margin-top:20px;

font-size:42px;

font-weight:900;

color:#111827;

}

.tagline{

margin-top:8px;

font-size:14px;

font-weight:700;

color:#4B5563;

}

/* LOADER */

.loader{

margin-top:40px;

width:60px;
height:60px;

border:5px solid rgba(255,255,255,.5);

border-top:5px solid #111827;

border-radius:50%;

animation:spin 1s linear infinite;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

@keyframes zoomIn{

0%{
opacity:0;
transform:scale(.7);
}

100%{
opacity:1;
transform:scale(1);
}

}

/* WATERMARK */

.watermark{

position:absolute;

bottom:30px;

text-align:center;

font-size:12px;

font-weight:700;

color:#374151;

line-height:1.8;

}

</style>

</head>

<body>

<div class="logoBox">

<div class="logo">

🧺

</div>

<div class="appName">

QuickPress

</div>

<div class="tagline">

Laundry • Dry Cleaning • Ironing

</div>

</div>

<div class="loader"></div>

<div class="watermark">

Made in Uttar Pradesh 🇮🇳<br>
Crafted by Himanshu Baghel 💗

</div>

<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* =====================================
LOCATION CHECK
===================================== */

function checkLocation(){

const locationSaved =

localStorage.getItem(
"userLocation"
);

return !!locationSaved;

}

/* =====================================
REDIRECT
===================================== */

setTimeout(()=>{

onAuthStateChanged(

auth,

(user)=>{

/* LOGIN + LOCATION */

if(
user &&
checkLocation()
){

window.location.href =
"index.html";

return;

}

/* LOGIN BUT NO LOCATION */

if(
user &&
!checkLocation()
){

window.location.href =
"location.html";

return;

}

/* NOT LOGIN */

window.location.href =
"login.html";

}

);

},2500);

</script>

</body>
</html>
