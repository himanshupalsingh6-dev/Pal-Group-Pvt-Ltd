</style><script type="module">

import { auth }
from "./firebase.js";

import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
USER DATA
=================================== */

window.currentUser = null;

onAuthStateChanged(

auth,

(user)=>{

window.currentUser = user;

if(!user){

document.getElementById(
"userName"
).innerHTML =
"Guest User";

document.getElementById(
"userEmail"
).innerHTML =
"Not Logged In";

return;

}

document.getElementById(
"userName"
).innerHTML =

user.displayName ||

user.phoneNumber ||

"QuickPress User";

document.getElementById(
"userEmail"
).innerHTML =

user.email ||

user.phoneNumber ||

"Authenticated User";

}

);

</script><script type="module">

import { auth }
from "./firebase.js";

import {

signOut

}

from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
LOGOUT
=================================== */

window.logoutUser =
async function(){

const confirmLogout =

confirm(
"Are you sure you want to logout?"
);

if(!confirmLogout){

return;

}

try{

await signOut(
auth
);

localStorage.removeItem(
"checkoutData"
);

window.location.href =
"login.html";

}

catch(error){

console.log(error);

alert(
"Logout Failed"
);

}

};

</script><script>

</style><script>

/* ===================================
CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

let total = 0;

cart.forEach(item=>{

total +=

item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

/* ===================================
PROFILE READY
=================================== */

window.profileReady =
function(){

updateNavbarCartCount();

console.log(
"QuickPress Profile Ready"
);

};

/* ===================================
AUTO LOAD
=================================== */

document.addEventListener(

"DOMContentLoaded",

()=>{

profileReady();

}

);

/* ===================================
NETWORK STATUS
=================================== */

window.addEventListener(

"offline",

()=>{

console.log(
"Offline Mode"
);

}

);

window.addEventListener(

"online",

()=>{

console.log(
"Online Mode"
);

}

);

</script>
<script>

/* ===================================
LOAD PROFILE ADDRESSES
=================================== */

window.loadProfileAddresses =
function(){

const container =

document.getElementById(
"profileAddresses"
);

if(!container) return;

const addresses =

JSON.parse(

localStorage.getItem(
"addresses"
)

|| "[]"

);

if(addresses.length===0){

container.innerHTML =

`

<div class="addressCard">

<p>No Address Found</p>

</div>

`;

return;

}

let html = "";

addresses.forEach(address=>{

html += `

<div class="addressCard">

<h4>

${address.type || "Address"}

</h4>

<p>

${address.address || ""}

</p>

${
address.isDefault

?

'<div class="defaultBadge">Default Address</div>'

:

''

}

</div>

`;

});

container.innerHTML = html;

};

/* ===================================
MANAGE ADDRESS
=================================== */

document.addEventListener(

"DOMContentLoaded",

()=>{

const btn =

document.querySelector(
".addAddressBtn"
);

if(btn){

btn.onclick = ()=>{

window.location.href =
"addresses.html";

};

}

loadProfileAddresses();

}

);

</script>
