<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

onAuthStateChanged(

auth,

(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

/* NAME */

document.getElementById(
"profileName"
).innerHTML =

user.displayName ||

"QuickPress User";

/* EMAIL */

document.getElementById(
"profileEmail"
).innerHTML =

user.email ||

"";

/* PHONE */

document.getElementById(
"profilePhone"
).innerHTML =

user.phoneNumber ||

"Not Available";

/* AVATAR */

const avatar =

document.getElementById(
"profileAvatar"
);

if(user.photoURL){

avatar.innerHTML =

`<img src="${user.photoURL}">`;

}else{

avatar.innerHTML =

(user.displayName || "U")
.charAt(0)
.toUpperCase();

}

});

</script>

);

<script>

"notifications"
)

function(){

localStorage.getItem(
"darkMode"

=== "true";

darkModeToggle.addEventListener(

"change",

function(){

"darkMode",

this.checked

);

alert(
"Dark Mode Ready. Theme integration later."

}

<script type="module">

import { auth }
from "./firebase.js";

import {
signOut
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
CART BADGE
=================================== */

function updateNavbarCartCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

}

updateNavbarCartCount();

/* ===================================
LOGOUT
=================================== */

window.logoutUser =
async function(){

const ok = confirm(
"Logout from QuickPress?"
);

if(!ok) return;

try{

await signOut(auth);

localStorage.removeItem(
"checkoutDraft"
);

localStorage.removeItem(
"pendingOrder"
);

window.location.href =
"login.html";

}
catch(error){

console.error(error);

alert(
"Logout failed"
);

}

};

/* ===================================
DELETE ACCOUNT
=================================== */

window.deleteAccount =
function(){

alert(

"Delete Account API pending.\nConnect Firebase account deletion later."

);

};

/* ===================================
SYNC
=================================== */

window.addEventListener(

"storage",

()=>{

updateNavbarCartCount();

}

);

</script>
