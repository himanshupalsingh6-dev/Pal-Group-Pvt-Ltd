<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
padding-bottom:100px;
}

/* HERO */

.profileHero{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:24px;

border-bottom-left-radius:34px;
border-bottom-right-radius:34px;

}

.profileHero h1{

font-size:30px;
font-weight:900;

}

.profileHero p{

margin-top:6px;

font-size:13px;
font-weight:700;

color:#374151;

}

/* PROFILE CARD */

.profileSection{

padding:16px;

}

.profileCard{

background:#fff;

border-radius:30px;

padding:24px;

text-align:center;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.profileImage{

width:110px;
height:110px;

border-radius:50%;

margin:auto;

background:#F3F4F6;

display:flex;
align-items:center;
justify-content:center;

font-size:50px;

}

.userName{

margin-top:16px;

font-size:24px;

font-weight:900;

}

.userPhone{

margin-top:6px;

font-size:14px;

color:#6B7280;

}

.userEmail{

margin-top:4px;

font-size:13px;

color:#6B7280;

}

.referralBox{

margin-top:18px;

background:#F9FAFB;

padding:14px;

border-radius:18px;

}

.referralLabel{

font-size:12px;

color:#6B7280;

}

.referralCode{

margin-top:6px;

font-size:18px;

font-weight:900;

color:#16A34A;

}

/* SHORTCUTS */

.shortcutGrid{

padding:16px;

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

}

.shortcutCard{

background:#fff;

padding:20px;

border-radius:24px;

text-align:center;

cursor:pointer;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.shortcutCard i{

font-size:30px;

color:#16A34A;

}

.shortcutCard h4{

margin-top:12px;

font-size:15px;

font-weight:900;

}

</style>

</head>

<body>

<div class="profileHero">

<h1>
My Profile
</h1>

<p>
Manage your QuickPress account
</p>

</div>

<div class="profileSection">

<div class="profileCard">

<div
class="profileImage"
id="profileImage">

👤

</div>

<div
class="userName"
id="userName">

Himanshu

</div>

<div
class="userPhone"
id="userPhone">

+91 9999999999

</div>

<div
class="userEmail"
id="userEmail">

user@email.com

</div>

<div class="referralBox">

<div class="referralLabel">

Referral Code

</div>

<div
class="referralCode"
id="referralCode">

QP123ABC

</div>

</div>

</div>

</div>

<div class="shortcutGrid">

<div
class="shortcutCard"
onclick="location.href='orders.html'">

<i class="fa-solid fa-box"></i>

<h4>
My Orders
</h4>

</div>

<div
class="shortcutCard"
onclick="location.href='wallet.html'">

<i class="fa-solid fa-wallet"></i>

<h4>
Wallet
</h4>

</div>

<div
class="shortcutCard"
onclick="location.href='addresses.html'">

<i class="fa-solid fa-location-dot"></i>

<h4>
Addresses
</h4>

</div>

<div
class="shortcutCard"
onclick="location.href='notifications.html'">

<i class="fa-solid fa-bell"></i>

<h4>
Notifications
</h4>

</div>

</div>
<!-- =========================================
ACCOUNT SETTINGS
========================================= -->

<div class="profileSection">

<div class="profileCard">

<div class="sectionTitle">

Account Settings

</div>

<div class="settingsList">

<div
class="settingItem"
onclick="editProfile()">

<div>
✏️ Edit Profile
</div>

<i class="fa-solid fa-chevron-right"></i>

</div>

<div
class="settingItem"
onclick="location.href='addresses.html'">

<div>
📍 Saved Addresses
</div>

<i class="fa-solid fa-chevron-right"></i>

</div>

<div
class="settingItem"
onclick="location.href='notifications.html'">

<div>
🔔 Notifications
</div>

<i class="fa-solid fa-chevron-right"></i>

</div>

<div
class="settingItem"
onclick="openWhatsapp()">

<div>
💬 WhatsApp Support
</div>

<i class="fa-solid fa-chevron-right"></i>

</div>

<div
class="settingItem"
onclick="shareReferral()">

<div>
🎁 Share Referral Code
</div>

<i class="fa-solid fa-chevron-right"></i>

</div>

</div>

</div>

</div>

<!-- =========================================
ACCOUNT ACTIONS
========================================= -->

<div class="profileSection">

<button
class="logoutBtn"
onclick="logoutUser()">

Logout

</button>

<button
class="deleteBtn"
onclick="deleteAccountRequest()">

Delete Account Request

</button>

</div>

<!-- =========================================
BOTTOM NAVIGATION
========================================= -->

<div class="bottomNav">

<button
class="navItem"
onclick="location.href='index.html'">

🏠
<span>Home</span>

</button>

<button
class="navItem"
onclick="location.href='orders.html'">

📦
<span>Orders</span>

</button>

<button
class="navItem"
onclick="location.href='wallet.html'">

💰
<span>Wallet</span>

</button>

<button
class="navItem activeNav">

👤
<span>Profile</span>

</button>

</div>

<style>

.sectionTitle{

font-size:18px;

font-weight:900;

margin-bottom:16px;

}

.settingsList{

display:flex;

flex-direction:column;

gap:10px;

}

.settingItem{

height:58px;

background:#F9FAFB;

border-radius:16px;

padding:0 16px;

display:flex;

justify-content:space-between;

align-items:center;

font-size:14px;

font-weight:800;

cursor:pointer;

}

.logoutBtn{

width:100%;

height:54px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-size:14px;

font-weight:900;

cursor:pointer;

margin-bottom:12px;

}

.deleteBtn{

width:100%;

height:54px;

border:none;

border-radius:18px;

background:#DC2626;

color:#fff;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.bottomNav{

position:fixed;

left:0;
right:0;
bottom:0;

height:76px;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

box-shadow:
0 -8px 20px rgba(0,0,0,.08);

z-index:999;

}

.navItem{

flex:1;

height:100%;

border:none;

background:none;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:4px;

font-size:11px;

font-weight:700;

cursor:pointer;

color:#6B7280;

}

.activeNav{

color:#16A34A;

}

</style>

<script type="module">

import { db, auth }
from "./firebase.js";

import {
doc,
getDoc,
setDoc,
addDoc,
collection,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

import {
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* =========================================
LOGIN CHECK
========================================= */

let currentUser = null;

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.href =
"login.html";

return;

}

currentUser = user;

/* =========================================
LOAD PROFILE
========================================= */

const userRef =

doc(
db,
"users",
user.uid
);

const userSnap =
await getDoc(
userRef
);

/* ========================================= */

if(userSnap.exists()){

const data =
userSnap.data();

document.getElementById(
"userName"
)

.innerHTML =

data.name
||
"QuickPress User";

document.getElementById(
"userPhone"
)

.innerHTML =

data.phone
||
"Not Added";

document.getElementById(
"userEmail"
)

.innerHTML =

user.email
||
"";

if(data.photo){

document.getElementById(
"profileImage"
)

innerHTML =

`
<img
src="${data.photo}"
style="
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
">
`;

}

}

/* =========================================
REFERRAL
========================================= */

document.getElementById(
"referralCode"
)

.innerHTML =

"QP"

+

user.uid
.slice(0,6)
.toUpperCase();

}

);

/* =========================================
EDIT PROFILE
========================================= */

window.editProfile =
()=>{

alert(
"Edit Profile Page Connect Later"
);

};

/* =========================================
WHATSAPP
========================================= */

window.openWhatsapp =
()=>{

window.open(

"https://wa.me/919997874502",

"_blank"

);

};

/* =========================================
SHARE REFERRAL
========================================= */

window.shareReferral =
()=>{

const code =

document.getElementById(
"referralCode"
)
.innerText;

navigator.share({

title:
"QuickPress",

text:
`Use my referral code ${code}`,

url:
window.location.origin

});

};

/* =========================================
LOGOUT
========================================= */

window.logoutUser =
async()=>{

await signOut(auth);

localStorage.clear();

window.location.href =
"login.html";

};

/* =========================================
DELETE ACCOUNT
========================================= */

window.deleteAccountRequest =
async()=>{

const confirmDelete =
confirm(
"Submit delete account request?"
);

if(!confirmDelete)
return;

await addDoc(

collection(
db,
"deleteRequests"
),

{

uid:
currentUser.uid,

email:
currentUser.email,

status:
"Pending",

createdAt:
serverTimestamp()

}

);

alert(
"Request Submitted"
);

};

</script>

</body>
</html>
