<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Cart</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#F6F7FB;
padding-bottom:120px;
}

.header{

background:
linear-gradient(
135deg,
#FFD633,
#FFE98A
);

padding:22px;

border-bottom-left-radius:30px;
border-bottom-right-radius:30px;

}

.header h1{

font-size:30px;
font-weight:900;

}

.cartContainer{
padding:16px;
}

.cartCard{

background:#fff;

padding:18px;

border-radius:24px;

margin-bottom:14px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.serviceName{

font-size:16px;

font-weight:900;

}

.category{

margin-top:6px;

font-size:12px;

font-weight:700;

color:#6B7280;

}

.price{

margin-top:10px;

font-size:20px;

font-weight:900;

}

.qtyRow{

margin-top:14px;

display:flex;

justify-content:space-between;

align-items:center;

}

.qtyBox{

display:flex;
align-items:center;
gap:10px;

}

.qtyBtn{

width:34px;
height:34px;

border:none;

border-radius:10px;

background:#16A34A;

color:#fff;

font-size:18px;

font-weight:900;

cursor:pointer;

}

.removeBtn{

height:36px;

padding:0 14px;

border:none;

border-radius:12px;

background:#DC2626;

color:#fff;

font-size:12px;

font-weight:800;

cursor:pointer;

}

/* BILL */

.billCard{

background:#fff;

padding:20px;

border-radius:24px;

margin:16px;

box-shadow:
0 8px 24px rgba(0,0,0,.05);

}

.billRow{

display:flex;

justify-content:space-between;

padding:10px 0;

}

.totalRow{

font-weight:900;

font-size:18px;

border-top:1px solid #E5E7EB;

padding-top:15px;

margin-top:10px;

}

/* CHECKOUT */

.checkoutBar{

position:fixed;

left:0;
right:0;
bottom:0;

background:#fff;

padding:15px;

box-shadow:
0 -8px 20px rgba(0,0,0,.08);

}

.checkoutBtn{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:16px;

font-weight:900;

cursor:pointer;

}

.emptyCart{

padding:80px 20px;

text-align:center;

color:#6B7280;

}

</style>

</head>

<body>

<div class="header">

<h1>
My Cart
</h1>

</div>

<div
id="cartContainer"
class="cartContainer">

</div>

<div class="billCard">

<div class="billRow">

<span>
Services Total
</span>

<span id="servicesTotal">

₹0

</span>

</div>

<div class="billRow">

<span>
Delivery Charges
</span>

<span>

₹20

</span>

</div>

<div class="billRow">

<span>
Platform Fee
</span>

<span>

₹5

</span>

</div>

<div class="billRow totalRow">

<span>
Grand Total
</span>

<span id="grandTotal">

₹0

</span>

</div>

</div>

<div class="checkoutBar">

<button
class="checkoutBtn"
onclick="goCheckout()">

Proceed To Checkout

</button>

</div>

<script>

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

function renderCart(){

const container =

document.getElementById(
"cartContainer"
);

container.innerHTML = "";

if(cart.length===0){

container.innerHTML=

`

<div class="emptyCart">

<h2>
🛒 Cart Empty
</h2>

<p style="margin-top:10px;">

Add services to continue

</p>

</div>

`;

document.getElementById(
"servicesTotal"
).innerHTML="₹0";

document.getElementById(
"grandTotal"
).innerHTML="₹0";

return;

}

let total = 0;

cart.forEach((item,index)=>{

const itemTotal =
item.price * item.qty;

total += itemTotal;

container.innerHTML +=

`

<div class="cartCard">

<div class="serviceName">

${item.serviceName}

</div>

<div class="category">

${item.category}

</div>

<div class="price">

₹${itemTotal}

</div>

<div class="qtyRow">

<div class="qtyBox">

<button
class="qtyBtn"
onclick="decreaseQty(${index})">

-

</button>

<span>

${item.qty}

</span>

<button
class="qtyBtn"
onclick="increaseQty(${index})">

+

</button>

</div>

<button
class="removeBtn"
onclick="removeItem(${index})">

Remove

</button>

</div>

</div>

`;

});

document.getElementById(
"servicesTotal"
)

.innerHTML =
`₹${total}`;

document.getElementById(
"grandTotal"
)

.innerHTML =
`₹${total+20+5}`;

}

/* QTY */

function increaseQty(index){

cart[index].qty++;

saveCart();

}

function decreaseQty(index){

if(cart[index].qty>1){

cart[index].qty--;

saveCart();

}

}

/* REMOVE */

function removeItem(index){

cart.splice(index,1);

saveCart();

}

/* SAVE */

function saveCart(){

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

renderCart();

}

/* CHECKOUT */

function goCheckout(){

if(cart.length===0){

alert(
"Cart Empty"
);

return;

}

window.location.href =
"checkout.html";

}

renderCart();

</script>

</body>
</html>
