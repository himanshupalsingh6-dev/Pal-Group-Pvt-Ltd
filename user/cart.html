<script>

/* ===================================
ITEM COUNT
=================================== */

function updateItemCount(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

document.getElementById(
"itemCount"
).innerHTML =

total + " Items";

/* EMPTY CART */

if(cart.length===0){

document.getElementById(
"emptyCart"
).style.display =
"block";

}else{

document.getElementById(
"emptyCart"
).style.display =
"none";

}

}

updateItemCount();

</script>

<script>

/* ===================================
RENDER CART ITEMS
=================================== */

function renderCartItems(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

const container =

document.getElementById(
"cartContainer"
);

if(!container) return;

container.innerHTML = "";

/* EMPTY */

if(cart.length===0){

return;

}

/* ===================================
ITEMS
=================================== */

cart.forEach((item,index)=>{

const total =

(item.price || 0)

*

(item.qty || 1);

container.innerHTML +=

`

<div class="cartItem">

<div class="categoryTag">

👔

${item.categoryName || "Ironing"}

</div>

<div class="subCategory">

${item.subcategoryName || "Shirt"}

</div>

<div class="serviceTitle">

${item.serviceName}

</div>

<div class="servicePrice">

₹${item.price}

per item

</div>

<div class="itemBottom">

<div class="qtyBox">

<button
class="qtyBtn"

onclick="decreaseQty(

${index}

)">

-

</button>

<div
class="qtyValue">

${item.qty}

</div>

<button
class="qtyBtn"

onclick="increaseQty(

${index}

)">

+

</button>

</div>

<div
class="itemTotal">

₹${total}

</div>

<button
class="removeBtn"

onclick="removeItem(

${index}

)">

Remove

</button>

</div>

</div>

`;

});

}

/* ===================================
INITIAL LOAD
=================================== */

renderCartItems();

</script>
<script>

/* ===================================
INCREASE QTY
=================================== */

window.increaseQty =
function(index){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

cart[index].qty++;

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

refreshCart();

};

/* ===================================
DECREASE QTY
=================================== */

window.decreaseQty =
function(index){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

if(cart[index].qty > 1){

cart[index].qty--;

}else{

cart.splice(index,1);

}

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

refreshCart();

};

/* ===================================
REMOVE ITEM
=================================== */

window.removeItem =
function(index){

let cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

cart.splice(index,1);

localStorage.setItem(

"cart",

JSON.stringify(cart)

);

refreshCart();

};

/* ===================================
REFRESH CART
=================================== */

window.refreshCart =
function(){

renderCartItems();

updateItemCount();

updateSummary();

/* NAVBAR BADGE */

if(window.updateNavbarCartCount){

updateNavbarCartCount();

}

};

/* ===================================
SUBTOTAL
=================================== */

window.getSubtotal =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let subtotal = 0;

cart.forEach(item=>{

subtotal +=

(item.price || 0)

*

(item.qty || 1);

});

return subtotal;

};

/* ===================================
DELIVERY CHARGE
=================================== */

window.getDeliveryCharge =
function(){

const subtotal =

getSubtotal();

/* FREE DELIVERY */

if(subtotal >= 499){

return 0;

}

return 20;

};

/* ===================================
GRAND TOTAL
=================================== */

window.getGrandTotal =
function(){

return (

getSubtotal()

+

getDeliveryCharge()

);

};

/* ===================================
AUTO REFRESH
=================================== */

window.addEventListener(

"storage",

()=>{

refreshCart();

}

);

</script>

<script>

/* ===================================
UPDATE SUMMARY
=================================== */

window.updateSummary =
function(){

const subtotal =

getSubtotal();

const delivery =

getDeliveryCharge();

const grandTotal =

getGrandTotal();

/* FREE DELIVERY SAVING */

let saving = 0;

if(subtotal >= 499){

saving = 20;

}

/* UPDATE UI */

document.getElementById(
"subtotalAmount"
).innerHTML =

"₹" + subtotal;

document.getElementById(
"deliveryAmount"
).innerHTML =

delivery === 0

? "FREE"

: "₹" + delivery;

document.getElementById(
"savingAmount"
).innerHTML =

"₹" + saving;

document.getElementById(
"grandTotalAmount"
).innerHTML =

"₹" + grandTotal;

};

/* ===================================
CHECKOUT
=================================== */

window.goCheckout =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

if(cart.length===0){

alert(
"Your cart is empty"
);

return;

}

window.location.href =
"checkout.html";

};

/* ===================================
INITIAL LOAD
=================================== */

setTimeout(()=>{

if(window.updateSummary){

updateSummary();

}

},100);

</script>

<script>

/* ===================================
EMPTY CART VISIBILITY
=================================== */

window.checkEmptyCart =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

const emptyCart =

document.getElementById(
"emptyCart"
);

const cartContainer =

document.getElementById(
"cartContainer"
);

const summarySection =

document.getElementById(
"summarySection"
);

if(cart.length===0){

if(emptyCart){

emptyCart.style.display =
"block";

}

if(cartContainer){

cartContainer.style.display =
"none";

}

if(summarySection){

summarySection.style.display =
"none";

}

}else{

if(emptyCart){

emptyCart.style.display =
"none";

}

if(cartContainer){

cartContainer.style.display =
"block";

}

if(summarySection){

summarySection.style.display =
"block";

}

}

};

/* ===================================
CREATE ORDER DRAFT
=================================== */

window.createOrderDraft =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

if(cart.length===0){

return null;

}

const orderDraft = {

orderId:

"QP" +

Date.now(),

city:

localStorage.getItem(
"userCity"
)

|| "Kasganj",

items:cart,

subtotal:

getSubtotal(),

delivery:

getDeliveryCharge(),

grandTotal:

getGrandTotal(),

status:

"Pending",

paymentStatus:

"Pending",

createdAt:

Date.now()

};

return orderDraft;

};

/* ===================================
SAVE CHECKOUT DRAFT
=================================== */

window.saveCheckoutDraft =
function(){

const orderDraft =

createOrderDraft();

if(!orderDraft){

return false;

}

localStorage.setItem(

"checkoutDraft",

JSON.stringify(
orderDraft
)

);

return true;

};

/* ===================================
CHECKOUT REDIRECT
=================================== */

window.goCheckout =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

if(cart.length===0){

alert(
"Your cart is empty"
);

return;

}

saveCheckoutDraft();

window.location.href =
"checkout.html";

};

/* ===================================

{

 ],

=================================== */

/* ===================================

=================================== */

setTimeout(()=>{

checkEmptyCart();

},100);

</script>

<script type="module">

import { auth }
from "./firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===================================
AUTH
=================================== */

let currentUser = null;

onAuthStateChanged(

auth,

(user)=>{

currentUser = user;

}

);

/* ===================================
PROFILE
=================================== */

window.openProfile =
function(){

if(currentUser){

window.location.href =
"profile.html";

}else{

window.location.href =
"login.html";

}

};

/* ===================================
ORDERS
=================================== */

window.openOrders =
function(){

if(currentUser){

window.location.href =
"orders.html";

}else{

window.location.href =
"login.html";

}

};

/* ===================================
NAVBAR CART COUNT
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(
localStorage.getItem(
"cart"
)
)

|| [];

let total = 0;

cart.forEach(item=>{

total += item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge)
return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateNavbarCartCount();

/* ===================================
SYNC COUNTS
=================================== */

window.addEventListener(

"storage",

()=>{

updateNavbarCartCount();

updateItemCount();

checkEmptyCart();

}

);

/* ===================================
PAGE LOAD
=================================== */

window.addEventListener(

"load",

()=>{

updateItemCount();

renderCartItems();

updateSummary();

checkEmptyCart();

updateNavbarCartCount();

}

);

console.log(
"QuickPress Cart V2 Ready"
);

</script>
