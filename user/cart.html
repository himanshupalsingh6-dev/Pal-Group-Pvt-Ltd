</style><script>

/* ===================================
LOAD CART
=================================== */

function loadCart(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

const container =

document.getElementById(
"cartContainer"
);

const emptyCart =

document.getElementById(
"emptyCart"
);

if(cart.length===0){

container.innerHTML="";

emptyCart.style.display=
"block";

updateSummary([]);

return;

}

emptyCart.style.display=
"none";

let html="";

cart.forEach(item=>{

html += `

<div class="cartCard">

<div class="cartImage">

<i class="fa-solid fa-shirt"></i>

</div>

<div class="cartContent">

<div class="cartName">

${item.serviceName}

</div>

<div class="cartCategory">

${item.category}

</div>

<div class="cartPrice">

₹${item.price}

</div>

<div class="qtyWrap">

<button
class="qtyBtn"

onclick="decreaseQty(
'${item.serviceId}'
)">

-

</button>

<div class="qtyValue">

${item.qty}

</div>

<button
class="qtyBtn"

onclick="increaseQty(
'${item.serviceId}'
)">

+

</button>

</div>

<button
class="removeBtn"

onclick="removeCartItem(
'${item.serviceId}'
)">

Remove

</button>

</div>

</div>

`;

});

container.innerHTML = html;

updateSummary(cart);

}

/* ===================================
SUMMARY
=================================== */

function updateSummary(cart){

let subtotal = 0;

cart.forEach(item=>{

subtotal +=

item.price *
item.qty;

});

const delivery =

subtotal >= 299
? 0
: 49;

const tax =

Math.round(
subtotal * 0.05
);

const total =

subtotal +
delivery +
tax;

document.getElementById(
"subtotalAmount"
).innerHTML =
"₹"+subtotal;

document.getElementById(
"deliveryAmount"
).innerHTML =
"₹"+delivery;

document.getElementById(
"taxAmount"
).innerHTML =
"₹"+tax;

document.getElementById(
"grandTotal"
).innerHTML =
"₹"+total;

document.getElementById(
"checkoutAmount"
).innerHTML =
"₹"+total;

}

/* ===================================
START
=================================== */

loadCart();

</script><script>

/* ===================================
INCREASE QTY
=================================== */

window.increaseQty =
function(serviceId){

let cart =

JSON.parse(
localStorage.getItem("cart")
)

|| [];

const item =

cart.find(

item=>

item.serviceId===serviceId

);

if(item){

item.qty++;

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

loadCart();

if(window.updateNavbarCartCount){

updateNavbarCartCount();

}

};

/* ===================================
DECREASE QTY
=================================== */

window.decreaseQty =
function(serviceId){

let cart =

JSON.parse(
localStorage.getItem("cart")
)

|| [];

const item =

cart.find(

item=>

item.serviceId===serviceId

);

if(!item) return;

item.qty--;

if(item.qty <= 0){

cart = cart.filter(

x=>

x.serviceId!==serviceId

);

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

loadCart();

if(window.updateNavbarCartCount){

updateNavbarCartCount();

}

};

/* ===================================
REMOVE ITEM
=================================== */

window.removeCartItem =
function(serviceId){

let cart =

JSON.parse(
localStorage.getItem("cart")
)

|| [];

cart =

cart.filter(

item=>

item.serviceId!==serviceId

);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

showToast(
"Item Removed"
);

loadCart();

if(window.updateNavbarCartCount){

updateNavbarCartCount();

}

};

/* ===================================
CLEAR CART
=================================== */

window.clearCart =
function(){

localStorage.removeItem(
"cart"
);

loadCart();

showToast(
"Cart Cleared"
);

if(window.updateNavbarCartCount){

updateNavbarCartCount();

}

};

</script><!-- ===================================

=================================== -->

class="globalToast"

<style>

.globalToast{

translateX(-50%);

.globalToast.show{

}

</style>

<script>

let currentDiscount = 0;

/* ===================================
TOAST
=================================== */

window.showToast =
function(message){

const toast =

document.getElementById(
"globalToast"
);

document.getElementById(
"toastMessage"
)

.innerHTML =
message;

toast.classList.add(
"show"
);

setTimeout(()=>{

toast.classList.remove(
"show"
);

},2000);

};

/* ===================================
COUPON
=================================== */

window.applyCouponCode =
function(){

const code =

document.getElementById(
"couponCode"
)

.value
.trim()
.toUpperCase();

if(code==="WELCOME50"){

currentDiscount = 50;

showToast(
"50% Coupon Applied"
);

}

else if(
code==="QUICK20"
){

currentDiscount = 20;

showToast(
"20% Coupon Applied"
);

}

else{

currentDiscount = 0;

showToast(
"Invalid Coupon"
);

}

loadCart();

};

</script><script>

/* ===================================
CREATE ORDER
=================================== */

window.createOrderData =
function(){

const cart =

JSON.parse(
localStorage.getItem("cart")
)

|| [];

let subtotal = 0;

cart.forEach(item=>{

subtotal +=

item.price *
item.qty;

});

const deliveryFee =

subtotal >= 299

? 0

: 49;

const tax =

Math.round(
subtotal * 0.05
);

let discount = 0;

if(currentDiscount){

discount =

Math.round(

subtotal *

(currentDiscount/100)

);

}

const total =

subtotal +
deliveryFee +
tax -
discount;

return{

orderId:

"QP" +

Date.now(),

items:cart,

subtotal,

deliveryFee,

tax,

discount,

total,

status:"Pending",

createdAt:
Date.now()

};

};

/* ===================================
CHECKOUT
=================================== */

window.goCheckout =
function(){

const cart =

JSON.parse(
localStorage.getItem("cart")
)

|| [];

if(cart.length===0){

showToast(
"Cart Empty"
);

return;

}

const order =

createOrderData();

localStorage.setItem(

"checkoutData",

JSON.stringify(order)

);

window.location.href =

"checkout.html";

};

console.log(
"QuickPress Checkout Ready"
);

<script>

/* ===================================
PROFILE
=================================== */

window.openProfile =
function(){

window.location.href =
"profile.html";

};

/* ===================================
CART BADGE
=================================== */

window.updateNavbarCartCount =
function(){

const cart =

JSON.parse(

localStorage.getItem(
"cart"
)

|| "[]"

);

let total = 0;

cart.forEach(item=>{

total +=

item.qty || 1;

});

const badge =

document.getElementById(
"navCartBadge"
);

if(!badge) return;

badge.innerHTML = total;

badge.style.display =

total > 0

? "flex"

: "none";

};

updateNavbarCartCount();

/* ===================================
FIX SUMMARY WITH COUPON
=================================== */

const oldUpdateSummary =
window.updateSummary;

window.updateSummary =
function(cart){

let subtotal = 0;

cart.forEach(item=>{

subtotal +=

item.price *
item.qty;

});

const delivery =

subtotal >= 299

? 0

: 49;

const tax =

Math.round(
subtotal * 0.05
);

let discount = 0;

if(window.currentDiscount){

discount =

Math.round(

subtotal *

(window.currentDiscount/100)

);

}

const total =

subtotal +
delivery +
tax -
discount;

document.getElementById(
"subtotalAmount"
).innerHTML =
"₹"+subtotal;

document.getElementById(
"deliveryAmount"
).innerHTML =
"₹"+delivery;

document.getElementById(
"taxAmount"
).innerHTML =
"₹"+tax;

document.getElementById(
"grandTotal"
).innerHTML =
"₹"+total;

document.getElementById(
"checkoutAmount"
).innerHTML =
"₹"+total;

};

/* ===================================
APP READY
=================================== */

document.addEventListener(

"DOMContentLoaded",

()=>{

updateNavbarCartCount();

loadCart();

}

);

console.log(
"QuickPress Cart Ready"
);

</script>
