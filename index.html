<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#0F172A;
--gray:#64748B;

}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

background:#FFFFFF;

overflow:hidden;

position:relative;

}

/* ===========================
BACKGROUND FLOATING CIRCLES
=========================== */

.bgCircle{

position:absolute;

border-radius:50%;

background:
rgba(22,163,74,.08);

animation:
floatBg 8s infinite ease-in-out;

}

.c1{

width:180px;
height:180px;

top:-50px;
left:-50px;

}

.c2{

width:140px;
height:140px;

right:-30px;
top:120px;

}

.c3{

width:220px;
height:220px;

bottom:-80px;
left:30%;

}

@keyframes floatBg{

0%{

transform:
translateY(0);

}

50%{

transform:
translateY(-20px);

}

100%{

transform:
translateY(0);

}

}

/* ===========================
LOGO AREA
=========================== */

.logoWrap{

text-align:center;

z-index:2;

}

.laundryAnimation{

position:relative;

width:140px;

height:140px;

margin:auto;

}

.basket{

position:absolute;

bottom:0;

left:50%;

transform:translateX(-50%);

font-size:72px;

animation:
basketFloat 3s infinite ease-in-out;

}

@keyframes basketFloat{

0%{

transform:
translateX(-50%)
translateY(0);

}

50%{

transform:
translateX(-50%)
translateY(-10px);

}

100%{

transform:
translateX(-50%)
translateY(0);

}

}

/* ===========================
STEAM EFFECT
=========================== */

.steam{

position:absolute;

bottom:65px;

width:12px;

height:40px;

background:
rgba(22,163,74,.25);

border-radius:50px;

filter:blur(6px);

animation:
steamMove 3s infinite;

}

.steam1{

left:40px;

animation-delay:0s;

}

.steam2{

left:65px;

animation-delay:.5s;

}

.steam3{

left:90px;

animation-delay:1s;

}

@keyframes steamMove{

0%{

opacity:0;

transform:
translateY(0)
scale(.8);

}

50%{

opacity:1;

}

100%{

opacity:0;

transform:
translateY(-50px)
scale(1.3);

}

}

/* ===========================
TEXT
=========================== */

.logoWrap h1{

margin-top:18px;

font-size:36px;

font-weight:900;

color:#0F172A;

}

.logoWrap p{

margin-top:8px;

font-size:14px;

color:#64748B;

font-weight:600;

}

/* ===========================
LOADER
=========================== */

.loader{

width:46px;

height:46px;

margin-top:36px;

border:4px solid #E5E7EB;

border-top:4px solid #16A34A;

border-radius:50%;

animation:
spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:
rotate(360deg);

}

}

.loadingText{

margin-top:18px;

font-size:13px;

font-weight:700;

color:#64748B;

letter-spacing:.4px;

}

.version{

position:absolute;

bottom:24px;

font-size:12px;

color:#94A3B8;

font-weight:600;

}

</style>

</head>

<body>

<!-- Floating Background -->

<div class="bgCircle c1"></div>
<div class="bgCircle c2"></div>
<div class="bgCircle c3"></div>

<!-- Logo Area -->

<div class="logoWrap">

<div class="laundryAnimation">

<div class="basket">

🧺

</div>

<div class="steam steam1"></div>
<div class="steam steam2"></div>
<div class="steam steam3"></div>

</div>

<h1>

QuickPress

</h1>

<p>

Premium Laundry Marketplace

</p>

</div>

<!-- Loader -->

<div class="loader"></div>

<div class="loadingText">

Preparing Your Laundry Experience...

</div>

<div class="version">

Version 1.0.0

</div>

<!-- Firebase Auth Redirect -->

<script type="module">

import { auth }
from "./firebase.js";

import {

onAuthStateChanged

}
from

"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

setTimeout(()=>{

onAuthStateChanged(

auth,

(user)=>{

if(user){

window.location.replace(
"index.html"
);

}else{

window.location.replace(
"login.html"
);

}

}

);

},2500);

</script>

</body>

</html>
