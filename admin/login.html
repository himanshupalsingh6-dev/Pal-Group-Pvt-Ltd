<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Admin Login

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{

--primary:#16A34A;
--dark:#111827;
--gray:#6B7280;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#F5F7FB;

height:100vh;

display:flex;

justify-content:center;
align-items:center;

}

/* ===========================
MOBILE BLOCK
=========================== */

.mobileBlock{

display:none;

position:fixed;

inset:0;

background:#111827;

color:#fff;

z-index:999999;

justify-content:center;
align-items:center;

text-align:center;

padding:40px;

}

.mobileBlock h1{

font-size:34px;

margin-bottom:15px;

}

/* ===========================
LOGIN CARD
=========================== */

.loginCard{

width:450px;

background:#fff;

padding:40px;

border-radius:24px;

box-shadow:
0 15px 35px rgba(0,0,0,.08);

}

.logo{

text-align:center;

font-size:34px;

font-weight:900;

margin-bottom:8px;

}

.logo span{

color:var(--primary);

}

.subtitle{

text-align:center;

color:var(--gray);

margin-bottom:30px;

font-size:14px;

}

.formGroup{

margin-bottom:18px;

}

.formGroup label{

display:block;

margin-bottom:8px;

font-size:13px;

font-weight:800;

}

.formGroup input{

width:100%;

height:54px;

border:none;

outline:none;

background:#F3F4F6;

border-radius:14px;

padding:0 16px;

font-size:14px;

}

</style>

</head>

<body>

<div
class="mobileBlock"
id="mobileBlock">

<div>

<h1>

⚠ Desktop Only

</h1>

<p>

QuickPress Admin can only be accessed from Desktop or Laptop.

</p>

</div>

</div>

<div class="loginCard">

<div class="logo">

Quick<span>Press</span>

</div>

<div class="subtitle">

Admin Control Panel

</div>

<div class="formGroup">

<label>

Admin Email

</label>

<input
type="email"
id="email"
placeholder="admin@quickpress.com">

</div>

<div class="formGroup">

<label>

Password

</label>

<input
type="password"
id="password"
placeholder="Enter Password">

</div>

<!-- ===========================
OPTIONS
=========================== -->

<div class="optionRow">

<label class="rememberMe">

<input
type="checkbox"
id="rememberMe">

<span>

Remember Me

</span>

</label>

<a
href="#"
class="forgotLink">

Forgot Password?

</a>

</div>

<!-- ===========================
LOGIN BUTTON
=========================== -->

<button
class="loginBtn"
id="loginBtn">

Login to Admin Panel

</button>

<!-- ===========================
FOOTER
=========================== -->

<div class="loginFooter">

QuickPress Admin System v1.0

</div>

</div>

<style>

/* ===========================
OPTIONS
=========================== */

.optionRow{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:22px;

}

.rememberMe{

display:flex;

align-items:center;

gap:8px;

font-size:13px;

font-weight:700;

color:#374151;

cursor:pointer;

}

.rememberMe input{

width:16px;
height:16px;

cursor:pointer;

}

.forgotLink{

font-size:13px;

font-weight:700;

text-decoration:none;

color:#16A34A;

}

/* ===========================
LOGIN BUTTON
=========================== */

.loginBtn{

width:100%;

height:56px;

border:none;

border-radius:16px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

transition:.2s;

}

.loginBtn:hover{

transform:
translateY(-1px);

}

.loginBtn:disabled{

opacity:.6;

cursor:not-allowed;

}

/* ===========================
FOOTER
=========================== */

.loginFooter{

margin-top:24px;

text-align:center;

font-size:12px;

color:#9CA3AF;

}

</style>

<script>

/* ===========================
MOBILE BLOCK
=========================== */

function checkDevice(){

if(window.innerWidth < 1024){

document.getElementById(
"mobileBlock"
).style.display = "flex";

}else{

document.getElementById(
"mobileBlock"
).style.display = "none";

}

}

checkDevice();

window.addEventListener(
"resize",
checkDevice
);

</script>

<script type="module">

import { auth, db }
from "../js/firebase.js";

import {
signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {
doc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

/* ===========================
LOGIN
=========================== */

document
.getElementById(
"loginBtn"
)

.addEventListener(

"click",

async()=>{

try{

const btn =

document.getElementById(
"loginBtn"
);

const email =

document.getElementById(
"email"
).value.trim();

const password =

document.getElementById(
"password"
).value;

if(!email || !password){

alert(
"Please enter email and password"
);

return;

}

btn.disabled = true;

btn.innerHTML =
"Checking Access...";

/* ===========================
FIREBASE LOGIN
=========================== */

const result =

await signInWithEmailAndPassword(

auth,

email,

password

);

const user =
result.user;

/* ===========================
USER DOCUMENT
=========================== */

const userDoc =

await getDoc(

doc(
db,
"users",
user.uid
)

);

if(!userDoc.exists()){

await auth.signOut();

alert(
"Account record not found"
);

return;

}

const userData =
userDoc.data();

/* ===========================
ROLE CHECK
=========================== */

const role =

userData.role || "customer";

if(

role !== "admin" &&
role !== "super_admin"

){

await auth.signOut();

alert(
"Access Denied ❌"
);

window.location.href =
"access-denied.html";

return;

}

/* ===========================
SESSION SAVE
=========================== */

localStorage.setItem(

"adminLoggedIn",

"true"

);

localStorage.setItem(

"adminRole",

role

);

localStorage.setItem(

"adminUid",

user.uid

);

localStorage.setItem(

"lastActivity",

Date.now()

);

/* ===========================
REMEMBER ME
=========================== */

if(

document.getElementById(
"rememberMe"
).checked

){

localStorage.setItem(

"adminRemember",

email

);

}

/* ===========================
SUCCESS
=========================== */

btn.innerHTML =
"Login Successful";

setTimeout(()=>{

window.location.href =
"dashboard.html";

},800);

}
catch(error){

console.error(error);

alert(
"Invalid Email or Password"
);

document.getElementById(
"loginBtn"
).disabled = false;

document.getElementById(
"loginBtn"
).innerHTML =

"Login to Admin Panel";

}

});

</script>

<script type="module">

import { auth }
from "../js/firebase.js";

import {
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

/* ===========================
AUTO FILL EMAIL
=========================== */

const savedEmail =

localStorage.getItem(
"adminRemember"
);

if(savedEmail){

document.getElementById(
"email"
).value = savedEmail;

document.getElementById(
"rememberMe"
).checked = true;

}

/* ===========================
AUTO LOGIN
=========================== */

onAuthStateChanged(

auth,

(user)=>{

if(!user) return;

const adminLogin =

localStorage.getItem(
"adminLoggedIn"
);

if(adminLogin === "true"){

window.location.href =
"dashboard.html";

}

}

);

/* ===========================
SESSION CHECK
=========================== */

function checkSession(){

const lastActivity =

localStorage.getItem(
"lastActivity"
);

if(!lastActivity) return;

const now =
Date.now();

const diff =

now - Number(lastActivity);

/* 30 MINUTES */

const sessionLimit =

30 * 60 * 1000;

if(diff > sessionLimit){

localStorage.removeItem(
"adminLoggedIn"
);

localStorage.removeItem(
"adminRole"
);

localStorage.removeItem(
"adminUid"
);

alert(
"Session Expired. Please login again."
);

window.location.reload();

}

}

setInterval(
checkSession,
60000
);

/* ===========================
ACTIVITY TRACKING
=========================== */

function updateActivity(){

localStorage.setItem(

"lastActivity",

Date.now()

);

}

document.addEventListener(
"click",
updateActivity
);

document.addEventListener(
"keydown",
updateActivity
);

document.addEventListener(
"mousemove",
updateActivity
);

</script>

</body>
</html>
