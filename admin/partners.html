<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Partners
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>

<style>

/* =====================================================
GLOBAL
===================================================== */

body{
background:#F4F4F5;
font-family:Arial,sans-serif;
}

/* =====================================================
TOP
===================================================== */

.pageTop{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:24px;

}

.pageTitle{

font-size:42px;
font-weight:900;

}

.topButtons{

display:flex;
gap:12px;

}

.topBtn{

height:48px;

padding:0 18px;

border:none;

border-radius:14px;

background:#111827;

color:#fff;

font-size:14px;
font-weight:900;

cursor:pointer;

}

/* =====================================================
SUMMARY
===================================================== */

.summaryGrid{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:18px;

margin-bottom:24px;

}

.summaryCard{

background:#fff;

padding:22px;

border-radius:22px;

border:1px solid #E5E7EB;

}

.cardTitle{

font-size:14px;
font-weight:800;
color:#6B7280;

margin-bottom:10px;

}

.cardValue{

font-size:38px;
font-weight:900;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:14px;

margin-bottom:22px;

}

.filterInput{

height:52px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:0 16px;

font-size:14px;
font-weight:800;

background:#fff;

outline:none;

}

/* =====================================================
GRID
===================================================== */

.mainGrid{

display:grid;

grid-template-columns:
420px 1fr;

gap:20px;

}

/* =====================================================
FORM
===================================================== */

.formBox{

background:#fff;

border-radius:22px;

padding:24px;

border:1px solid #E5E7EB;

height:max-content;

}

/* =====================================================
TITLE
===================================================== */

.sectionTitle{

font-size:28px;
font-weight:900;

margin-bottom:20px;

}

/* =====================================================
INPUT
===================================================== */

.inputGroup{

margin-bottom:16px;

}

.label{

font-size:14px;
font-weight:800;

margin-bottom:8px;

display:block;

}

.input{

width:100%;
height:52px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:0 16px;

font-size:14px;
font-weight:800;

outline:none;

background:#fff;

}

/* =====================================================
TABLE
===================================================== */

.tableBox{

background:#fff;

border-radius:22px;

padding:24px;

border:1px solid #E5E7EB;

overflow:auto;

}

.tableHeader{

display:grid;

grid-template-columns:
120px 180px 140px 140px 180px 140px 220px;

padding:16px;

background:#F9FAFB;

border-radius:14px;

font-size:13px;
font-weight:900;

margin-bottom:10px;

}

.tableRow{

display:grid;

grid-template-columns:
120px 180px 140px 140px 180px 140px 220px;

padding:18px 16px;

align-items:center;

border-bottom:1px solid #F3F4F6;

font-size:14px;
font-weight:800;

}

/* =====================================================
STATUS
===================================================== */

.status{

padding:8px 12px;

border-radius:10px;

font-size:12px;
font-weight:900;

width:max-content;

color:#fff;

}

.active{
background:#10B981;
}

.inactive{
background:#6B7280;
}

.suspended{
background:#EF4444;
}

.pending{
background:#F59E0B;
}

/* =====================================================
BUTTONS
===================================================== */

.actions{

display:flex;
gap:8px;
flex-wrap:wrap;

}

.actionBtn{

height:36px;

padding:0 12px;

border:none;

border-radius:10px;

font-size:12px;
font-weight:900;

cursor:pointer;

}

.viewBtn{
background:#111827;
color:#fff;
}

.editBtn{
background:#2563EB;
color:#fff;
}

.walletBtn{
background:#10B981;
color:#fff;
}

.suspendBtn{
background:#EF4444;
color:#fff;
}

/* =====================================================
MAP
===================================================== */

#map{

height:240px;

border-radius:18px;

margin-top:20px;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1500px){

.summaryGrid{

grid-template-columns:
repeat(2,1fr);

}

.mainGrid{

grid-template-columns:1fr;

}

}

@media(max-width:900px){

.filters{

grid-template-columns:
1fr 1fr;

}

}

@media(max-width:700px){

.summaryGrid{

grid-template-columns:1fr;

}

.filters{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div id="layoutContainer"></div>

<div class="main">

<!-- =====================================================
TOP
===================================================== -->

<div class="pageTop">

<div class="pageTitle">
Partner Management
</div>

<div class="topButtons">

<button class="topBtn">
Export Report
</button>

<button class="topBtn">
Settlement Report
</button>

<button class="topBtn">
Partner Analytics
</button>

</div>

</div>

<!-- =====================================================
SUMMARY
===================================================== -->

<div class="summaryGrid">

<div class="summaryCard">

<div class="cardTitle">
Total Partners
</div>

<div
class="cardValue"
id="totalPartners">

0

</div>

</div>

<div class="summaryCard">

<div class="cardTitle">
Active Partners
</div>

<div
class="cardValue"
id="activePartners">

0

</div>

</div>

<div class="summaryCard">

<div class="cardTitle">
Pending KYC
</div>

<div
class="cardValue"
id="pendingKyc">

0

</div>

</div>

<div class="summaryCard">

<div class="cardTitle">
Monthly Revenue
</div>

<div
class="cardValue"
id="monthlyRevenue">

₹0

</div>

</div>

</div>

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filters">

<input
type="text"
placeholder="Search Partner"
class="filterInput"
id="searchInput">

<select
class="filterInput"
id="cityFilter">

<option value="">
All Cities
</option>

</select>

<select
class="filterInput"
id="serviceFilter">

<option value="">
All Services
</option>

<option>
Laundry
</option>

<option>
Ironing
</option>

<option>
Dry Cleaning
</option>

</select>

<select
class="filterInput"
id="statusFilter">

<option value="">
All Status
</option>

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

<option value="suspended">
Suspended
</option>

<option value="pending">
Pending
</option>

</select>

<button
class="topBtn"
onclick="generatePassword()">

Generate Password

</button>

</div>

<!-- =====================================================
GRID
===================================================== -->

<div class="mainGrid">

<!-- =====================================================
FORM
===================================================== -->

<div class="formBox">

<div class="sectionTitle">
Add Partner
</div>

<div class="inputGroup">

<label class="label">
Full Name
</label>

<input
type="text"
class="input"
id="partnerName">

</div>

<div class="inputGroup">

<label class="label">
Mobile Number
</label>

<input
type="text"
class="input"
id="partnerPhone">

</div>

<div class="inputGroup">

<label class="label">
Email
</label>

<input
type="email"
class="input"
id="partnerEmail">

</div>

<div class="inputGroup">

<label class="label">
Password
</label>

<input
type="text"
class="input"
id="partnerPassword">

</div>

<div class="inputGroup">

<label class="label">
Shop Name
</label>

<input
type="text"
class="input"
id="shopName">

</div>

<div class="inputGroup">

<label class="label">
City
</label>

<input
type="text"
class="input"
id="partnerCity">

</div>

<div class="inputGroup">

<label class="label">
Area
</label>

<input
type="text"
class="input"
id="partnerArea">

</div>

<div class="inputGroup">

<label class="label">
Service Category
</label>

<select
class="input"
id="partnerService">

<option>
Laundry
</option>

<option>
Ironing
</option>

<option>
Dry Cleaning
</option>

</select>

</div>

<div class="inputGroup">

<label class="label">
Commission %
</label>

<input
type="number"
class="input"
id="partnerCommission">

</div>

<div class="inputGroup">

<label class="label">
Status
</label>

<select
class="input"
id="partnerStatus">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

<option value="suspended">
Suspended
</option>

<option value="pending">
Verification Pending
</option>

</select>

</div>

<button
class="topBtn"
style="width:100%;"
onclick="addPartner()">

+ Add Partner

</button>

<div id="map"></div>

</div>

<!-- =====================================================
TABLE
===================================================== -->

<div class="tableBox">

<div class="sectionTitle">
All Partners
</div>

<div class="tableHeader">

<div>
Partner ID
</div>

<div>
Shop Name
</div>

<div>
Owner
</div>

<div>
City
</div>

<div>
Services
</div>

<div>
Status
</div>

<div>
Actions
</div>

</div>

<div id="partnersContainer">

</div>

</div>

</div>

</div>

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/partners.js">
</script>

</body>
</html>
