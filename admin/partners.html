<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Partners
</title>

<link rel="stylesheet"
href="layout.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

width:calc(100% - 290px);

min-height:100vh;

background:#F4F7FB;

overflow-x:hidden;

}

.content{

padding:28px;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

flex-wrap:wrap;

margin-bottom:24px;

}

.pageTitle{

font-size:58px;

font-weight:900;

letter-spacing:-2px;

}

.addBtn{

height:56px;

padding:0 24px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-weight:900;

cursor:pointer;

}

/* =====================================================
SEARCH
===================================================== */

.searchWrap{

display:flex;

gap:14px;

flex-wrap:wrap;

margin-bottom:24px;

}

.searchInput,
.selectInput{

height:56px;

border:none;

outline:none;

padding:0 20px;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-size:14px;

font-weight:700;

}

.searchInput{

width:320px;

}

/* =====================================================
FORM
===================================================== */

.formCard{

background:#fff;

border-radius:32px;

padding:28px;

margin-bottom:28px;

border:1px solid #E5E7EB;

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:18px;

}

.inputBox{

display:flex;

flex-direction:column;

gap:10px;

}

.inputBox label{

font-size:13px;

font-weight:900;

}

.input{

height:56px;

border:none;

outline:none;

background:#F9FAFB;

border:1px solid #E5E7EB;

border-radius:18px;

padding:0 18px;

font-size:14px;

font-weight:700;

}

textarea.input{

height:120px;

padding-top:18px;

resize:none;

}

.saveBtn{

height:56px;

border:none;

background:#16A34A;

color:#fff;

font-weight:900;

border-radius:18px;

cursor:pointer;

}

/* =====================================================
GRID
===================================================== */

.partnersGrid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:24px;

}

/* =====================================================
CARD
===================================================== */

.partnerCard{

background:#fff;

border-radius:32px;

overflow:hidden;

border:1px solid #E5E7EB;

}

.partnerTop{

padding:24px;

display:flex;

align-items:center;

gap:18px;

border-bottom:1px solid #F3F4F6;

}

.partnerImage{

width:90px;

height:90px;

border-radius:24px;

object-fit:cover;

}

.partnerInfo h2{

font-size:24px;

font-weight:900;

margin-bottom:6px;

}

.partnerInfo p{

font-size:14px;

font-weight:700;

color:#6B7280;

}

.partnerBody{

padding:22px;

}

.infoGrid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-bottom:20px;

}

.infoBox{

background:#F9FAFB;

padding:14px;

border-radius:18px;

}

.infoBox h5{

font-size:12px;

font-weight:900;

color:#6B7280;

margin-bottom:8px;

}

.infoBox h4{

font-size:18px;

font-weight:900;

}

.status{

padding:10px 14px;

border-radius:999px;

font-size:12px;

font-weight:900;

display:inline-block;

}

.active{
background:#DCFCE7;
color:#15803D;
}

.inactive{
background:#FEE2E2;
color:#DC2626;
}

.cardActions{

display:flex;

gap:12px;

}

.editBtn,
.deleteBtn{

flex:1;

height:52px;

border:none;

border-radius:16px;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.editBtn{

background:#111827;

color:#fff;

}

.deleteBtn{

background:#FEE2E2;

color:#DC2626;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1200px){

.partnersGrid{
grid-template-columns:repeat(2,1fr);
}

.formCard{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:800px){

.main{
margin-left:0;
width:100%;
}

.content{
padding:16px;
}

.pageTitle{
font-size:40px;
}

.partnersGrid{
grid-template-columns:1fr;
}

.formCard{
grid-template-columns:1fr;
}

.searchInput{
width:100%;
}

}

</style>

</head>

<body>

<div class="adminLayout">

<div id="layoutContainer"></div>

<div class="main">

<div class="content">

<div class="pageHeader">

<div class="pageTitle">
Partners
</div>

<button class="addBtn">

<i class="fa-solid fa-plus"></i>

Add Partner

</button>

</div>

<div class="searchWrap">

<input
type="text"
id="searchInput"
class="searchInput"
placeholder="Search partner">

<select
id="cityFilter"
class="selectInput">

<option value="All">
All Cities
</option>

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

</select>

</div>

<div class="formCard">

<div class="inputBox">

<label>
Partner Name
</label>

<input
type="text"
id="partnerName"
class="input"
placeholder="Laundry Hub">

</div>

<div class="inputBox">

<label>
Phone
</label>

<input
type="text"
id="partnerPhone"
class="input"
placeholder="9876543210">

</div>

<div class="inputBox">

<label>
City
</label>

<select
id="partnerCity"
class="input">

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

</select>

</div>

<div class="inputBox">

<label>
Shop Address
</label>

<input
type="text"
id="partnerAddress"
class="input"
placeholder="Main Market">

</div>

<div class="inputBox">

<label>
Partner Image URL
</label>

<input
type="text"
id="partnerImage"
class="input"
placeholder="https://">

</div>

<div class="inputBox">

<label>
Status
</label>

<select
id="partnerStatus"
class="input">

<option value="Active">
Active
</option>

<option value="Inactive">
Inactive
</option>

</select>

</div>

<div class="inputBox">

<label>
Commission %
</label>

<input
type="number"
id="partnerCommission"
class="input"
placeholder="20">

</div>

<div class="inputBox">

<label>
Wallet Balance
</label>

<input
type="number"
id="partnerWallet"
class="input"
placeholder="5000">

</div>

<div class="inputBox">

<label>
Rating
</label>

<input
type="number"
id="partnerRating"
class="input"
placeholder="4.9">

</div>

<div class="inputBox"
style="grid-column:1/-1;">

<label>
Description
</label>

<textarea
id="partnerDesc"
class="input"
placeholder="Premium laundry partner"></textarea>

</div>

<button
id="savePartnerBtn"
class="saveBtn">

Save Partner

</button>

</div>

<div
class="partnersGrid"
id="partnersGrid">

</div>

</div>

</div>

</div>

<script type="module"
src="js/layout.js">
</script>

<script type="module"
src="js/partners.js">
</script>

</body>
</html>
