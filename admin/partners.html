<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Partners
</title>

<!-- =====================================================
CSS
===================================================== -->

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
GLOBAL
===================================================== */

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{

background:#F4F7FB;
overflow-x:hidden;

}

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;
padding:24px;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:20px;

}

.pageTitle{

font-size:54px;
font-weight:900;
color:#111827;

}

/* =====================================================
TOP GRID
===================================================== */

.topGrid{

display:grid;
grid-template-columns:
repeat(4,1fr);

gap:20px;
margin-bottom:30px;

}

/* =====================================================
CARD
===================================================== */

.topCard{

background:#fff;
padding:24px;
border-radius:30px;
border:1px solid #E5E7EB;

}

.topCard h5{

font-size:13px;
font-weight:900;
color:#6B7280;
margin-bottom:10px;

}

.topCard h2{

font-size:42px;
font-weight:900;
margin-bottom:8px;

}

.topCard p{

font-size:13px;
font-weight:700;
color:#6B7280;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:flex;
gap:16px;
margin-bottom:24px;
flex-wrap:wrap;

}

.searchBox{

flex:1;
min-width:260px;
position:relative;

}

.searchInput{

width:100%;
height:60px;
border:none;
outline:none;
background:#fff;
border-radius:22px;
padding:0 20px 0 55px;
font-size:14px;
font-weight:800;
border:1px solid #E5E7EB;

}

.searchIcon{

position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
color:#6B7280;

}

.filterSelect{

height:60px;
border:none;
outline:none;
padding:0 18px;
border-radius:20px;
background:#fff;
font-weight:800;
border:1px solid #E5E7EB;

}

/* =====================================================
TABLE
===================================================== */

.tableCard{

background:#fff;
border-radius:32px;
padding:24px;
border:1px solid #E5E7EB;
overflow:auto;

}

.tableTitle{

font-size:30px;
font-weight:900;
margin-bottom:24px;

}

table{

width:100%;
border-collapse:collapse;

}

th{

text-align:left;
padding:18px;
font-size:13px;
font-weight:900;
color:#6B7280;
border-bottom:1px solid #E5E7EB;

}

td{

padding:18px;
font-size:14px;
font-weight:800;
border-bottom:1px solid #F3F4F6;

}

/* =====================================================
PARTNER
===================================================== */

.partnerBox{

display:flex;
align-items:center;
gap:14px;

}

.partnerImage{

width:55px;
height:55px;
border-radius:18px;
object-fit:cover;

}

.partnerInfo h4{

font-size:16px;
font-weight:900;
margin-bottom:6px;

}

.partnerInfo p{

font-size:12px;
font-weight:700;
color:#6B7280;

}

/* =====================================================
STATUS
===================================================== */

.status{

padding:10px 14px;
border-radius:999px;
font-size:12px;
font-weight:900;
display:inline-flex;
align-items:center;
gap:8px;

}

.active{

background:#DCFCE7;
color:#15803D;

}

.offline{

background:#F3F4F6;
color:#6B7280;

}

/* =====================================================
BUTTONS
===================================================== */

.actionButtons{

display:flex;
gap:10px;
flex-wrap:wrap;

}

.actionBtn{

height:42px;
padding:0 16px;
border:none;
border-radius:14px;
font-size:12px;
font-weight:900;
cursor:pointer;

}

.viewBtn{

background:#111827;
color:#fff;

}

.walletBtn{

background:#DBEAFE;
color:#1D4ED8;

}

.disableBtn{

background:#FEE2E2;
color:#DC2626;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1200px){

.topGrid{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:900px){

.main{

margin-left:0;
padding:16px;

}

.pageTitle{

font-size:38px;

}

.topGrid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<!-- =====================================================
LAYOUT
===================================================== -->

<div id="layoutContainer"></div>

<!-- =====================================================
MAIN
===================================================== -->

<div class="main">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Partner Management
</div>

</div>

<!-- =====================================================
TOP CARDS
===================================================== -->

<div class="topGrid">

<div class="topCard">

<h5>
Total Partners
</h5>

<h2 id="totalPartners">
0
</h2>

<p>
All registered partners
</p>

</div>

<div class="topCard">

<h5>
Online Partners
</h5>

<h2 id="onlinePartners">
0
</h2>

<p>
Realtime active partners
</p>

</div>

<div class="topCard">

<h5>
Total Revenue
</h5>

<h2 id="totalRevenue">
₹0
</h2>

<p>
Partner earnings
</p>

</div>

<div class="topCard">

<h5>
Active Orders
</h5>

<h2 id="activeOrders">
0
</h2>

<p>
Live running orders
</p>

</div>

</div>

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filters">

<div class="searchBox">

<i class="fa-solid fa-search searchIcon"></i>

<input
type="text"
class="searchInput"
id="searchInput"
placeholder="Search partners...">

</div>

<select
class="filterSelect"
id="cityFilter">

<option value="">
All Cities
</option>

</select>

<select
class="filterSelect"
id="statusFilter">

<option value="">
All Status
</option>

<option value="active">
Active
</option>

<option value="offline">
Offline
</option>

</select>

</div>

<!-- =====================================================
TABLE
===================================================== -->

<div class="tableCard">

<div class="tableTitle">
All Partners
</div>

<table>

<thead>

<tr>

<th>
Partner
</th>

<th>
City
</th>

<th>
Revenue
</th>

<th>
Orders
</th>

<th>
Wallet
</th>

<th>
Status
</th>

<th>
Actions
</th>

</tr>

</thead>

<tbody id="partnersTable">

</tbody>

</table>

</div>

</div>

<!-- =====================================================
SCRIPTS
===================================================== -->

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/partners.js">
</script>

</body>
</html>s
