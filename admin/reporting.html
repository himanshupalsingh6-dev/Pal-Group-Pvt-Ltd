<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Reports
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script
src="https://cdn.jsdelivr.net/npm/chart.js">
</script>

<style>

/* =====================================================
GLOBAL
===================================================== */

body{
background:#F4F4F5;
font-family:Arial,sans-serif;
}

/* =====================================================
TOP BAR
===================================================== */

.reportTop{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:22px;

}

/* =====================================================
TABS
===================================================== */

.tabs{

display:flex;
gap:24px;

}

.tab{

font-size:32px;
font-weight:900;

cursor:pointer;

color:#9CA3AF;

}

.tab.active{

color:#2563EB;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:flex;
gap:12px;

}

.filterBtn{

height:46px;

padding:0 18px;

border:none;

background:#fff;

border-radius:12px;

font-size:14px;
font-weight:800;

border:1px solid #E5E7EB;

}

/* =====================================================
OVERVIEW
===================================================== */

.overview{

background:#fff;

border-radius:20px;

padding:20px;

border:1px solid #E5E7EB;

margin-bottom:20px;

}

/* =====================================================
ROW
===================================================== */

.reportRow{

display:grid;

grid-template-columns:
1fr 250px 120px;

padding:18px 0;

border-bottom:1px solid #F3F4F6;

align-items:center;

}

/* =====================================================
LABEL
===================================================== */

.reportLabel{

font-size:18px;
font-weight:800;

}

/* =====================================================
VALUE
===================================================== */

.reportValue{

font-size:20px;
font-weight:900;

text-align:right;

}

/* =====================================================
GRID
===================================================== */

.chartGrid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}

/* =====================================================
CARD
===================================================== */

.chartCard{

background:#fff;

border-radius:22px;

padding:20px;

border:1px solid #E5E7EB;

}

/* =====================================================
TITLE
===================================================== */

.cardTitle{

font-size:24px;
font-weight:900;

margin-bottom:20px;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1000px){

.chartGrid{

grid-template-columns:1fr;

}

.reportTop{

flex-direction:column;
align-items:flex-start;
gap:20px;

}

}

</style>

</head>

<body>

<div id="layoutContainer"></div>

<div class="main">

<!-- =====================================================
TOP
===================================================== -->

<div class="reportTop">

<div class="tabs">

<div class="tab active">
Live Tracking
</div>

<div class="tab">
Business Reports
</div>

</div>

<div class="filters">

<button class="filterBtn">

<i class="fa-solid fa-download"></i>

Generate Report

</button>

<button class="filterBtn">

All Outlets

<i class="fa-solid fa-angle-down"></i>

</button>

</div>

</div>

<!-- =====================================================
SALES OVERVIEW
===================================================== -->

<div class="overview">

<div class="cardTitle">
Sales Overview
</div>

<div class="reportRow">

<div class="reportLabel">
Sales
</div>

<canvas id="salesMini"></canvas>

<div
class="reportValue"
id="salesValue">

₹0

</div>

</div>

<div class="reportRow">

<div class="reportLabel">
Delivered Orders
</div>

<canvas id="ordersMini"></canvas>

<div
class="reportValue"
id="deliveredValue">

0

</div>

</div>

<div class="reportRow">

<div class="reportLabel">
AOV
</div>

<canvas id="aovMini"></canvas>

<div
class="reportValue"
id="aovValue">

₹0

</div>

</div>

</div>

<!-- =====================================================
CUSTOMER EXPERIENCE
===================================================== -->

<div class="overview">

<div class="cardTitle">
Customer Experience
</div>

<div class="reportRow">

<div class="reportLabel">
Ratings
</div>

<canvas id="ratingMini"></canvas>

<div
class="reportValue">

4.8★

</div>

</div>

<div class="reportRow">

<div class="reportLabel">
Rejected Orders
</div>

<canvas id="rejectMini"></canvas>

<div
class="reportValue"
id="rejectValue">

0%

</div>

</div>

<div class="reportRow">

<div class="reportLabel">
Delayed Orders
</div>

<canvas id="delayMini"></canvas>

<div
class="reportValue">

0%

</div>

</div>

<div class="reportRow">

<div class="reportLabel">
Poor Rated Orders
</div>

<canvas id="poorMini"></canvas>

<div
class="reportValue">

0%

</div>

</div>

<div class="reportRow">

<div class="reportLabel">
Total Complaints
</div>

<canvas id="complaintMini"></canvas>

<div
class="reportValue"
id="complaintValue">

0

</div>

</div>

</div>

<!-- =====================================================
CHARTS
===================================================== -->

<div class="chartGrid">

<div class="chartCard">

<div class="cardTitle">
Total Sales & Ads
</div>

<canvas id="salesChart"></canvas>

</div>

<div class="chartCard">

<div class="cardTitle">
Orders From Ads
</div>

<canvas id="adsChart"></canvas>

</div>

<div class="chartCard">

<div class="cardTitle">
Impressions
</div>

<canvas id="impressionChart"></canvas>

</div>

<div class="chartCard">

<div class="cardTitle">
Ads CTR
</div>

<canvas id="ctrChart"></canvas>

</div>

</div>

</div>

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/reporting.js">
</script>

</body>
</html>
