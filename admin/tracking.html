<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Live Tracking
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>

<style>

/* =====================================================
GLOBAL
===================================================== */

body{
background:#F4F4F5;
font-family:Arial,sans-serif;
overflow:hidden;
}

/* =====================================================
TOPBAR
===================================================== */

.trackingTop{

height:80px;

background:#fff;

border-bottom:1px solid #E5E7EB;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 24px;

}

.pageTitle{

font-size:34px;
font-weight:900;

}

.topActions{

display:flex;
gap:12px;

}

.actionBtn{

height:46px;

padding:0 18px;

border:none;

border-radius:14px;

background:#111827;

color:#fff;

font-size:14px;
font-weight:900;

cursor:pointer;

}

/* =====================================================
LAYOUT
===================================================== */

.trackingLayout{

display:grid;

grid-template-columns:
420px 1fr;

height:calc(100vh - 80px);

}

/* =====================================================
SIDEBAR
===================================================== */

.sidebar{

background:#fff;

border-right:1px solid #E5E7EB;

overflow-y:auto;

padding:20px;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:grid;

gap:14px;

margin-bottom:20px;

}

.filterInput{

height:52px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:0 16px;

font-size:14px;
font-weight:800;

outline:none;

background:#fff;

}

/* =====================================================
SUMMARY
===================================================== */

.summaryGrid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:14px;

margin-bottom:20px;

}

.summaryCard{

background:#F9FAFB;

padding:18px;

border-radius:18px;

}

.summaryTitle{

font-size:13px;
font-weight:800;
color:#6B7280;

margin-bottom:10px;

}

.summaryValue{

font-size:30px;
font-weight:900;

}

/* =====================================================
RIDER CARD
===================================================== */

.riderCard{

background:#fff;

border:1px solid #E5E7EB;

border-radius:20px;

padding:18px;

margin-bottom:16px;

cursor:pointer;

transition:.3s;

}

.riderCard:hover{

transform:translateY(-2px);

}

.riderTop{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:14px;

}

.riderInfo{

display:flex;
gap:14px;
align-items:center;

}

.riderImage{

width:58px;
height:58px;

border-radius:18px;

object-fit:cover;

}

.riderName{

font-size:16px;
font-weight:900;

margin-bottom:6px;

}

.riderArea{

font-size:13px;
font-weight:800;
color:#6B7280;

}

/* =====================================================
STATUS
===================================================== */

.status{

padding:8px 12px;

border-radius:10px;

font-size:12px;
font-weight:900;

color:#fff;

}

.online{
background:#10B981;
}

.pickup{
background:#2563EB;
}

.delivery{
background:#F59E0B;
}

.offline{
background:#EF4444;
}

/* =====================================================
DETAILS
===================================================== */

.riderStats{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

margin-top:16px;

}

.statBox{

background:#F9FAFB;

padding:12px;

border-radius:14px;

}

.statLabel{

font-size:12px;
font-weight:800;
color:#6B7280;

margin-bottom:6px;

}

.statValue{

font-size:16px;
font-weight:900;

}

/* =====================================================
MAP
===================================================== */

#map{

width:100%;
height:100%;

}

/* =====================================================
POPUP
===================================================== */

.popupTitle{

font-size:18px;
font-weight:900;

margin-bottom:12px;

}

.popupRow{

margin-bottom:10px;

font-size:14px;
font-weight:800;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1000px){

.trackingLayout{

grid-template-columns:1fr;

}

.sidebar{

height:450px;

}

}

</style>

</head>

<body>

<div class="trackingTop">

<div class="pageTitle">
Live Rider Tracking
</div>

<div class="topActions">

<button
class="actionBtn"
onclick="trackAllRiders()">

📍 Track All Riders

</button>

<button
class="actionBtn"
onclick="refreshTracking()">

🔄 Refresh

</button>

<button
class="actionBtn"
onclick="findNearestRider()">

🎯 Find Nearest

</button>

<button
class="actionBtn">

🚨 Emergency

</button>

</div>

</div>

<div class="trackingLayout">

<!-- =====================================================
SIDEBAR
===================================================== -->

<div class="sidebar">

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filters">

<input
type="text"
placeholder="Search Rider"
class="filterInput"
id="searchInput">

<select
class="filterInput"
id="cityFilter">

<option value="">
All Cities
</option>

</select>

<select
class="filterInput"
id="statusFilter">

<option value="">
All Status
</option>

<option value="online">
Online
</option>

<option value="pickup">
Pickup
</option>

<option value="delivery">
Delivery
</option>

<option value="offline">
Offline
</option>

</select>

<select
class="filterInput"
id="areaFilter">

<option value="">
All Areas
</option>

</select>

</div>

<!-- =====================================================
SUMMARY
===================================================== -->

<div class="summaryGrid">

<div class="summaryCard">

<div class="summaryTitle">
Online Riders
</div>

<div
class="summaryValue"
id="onlineRiders">

0

</div>

</div>

<div class="summaryCard">

<div class="summaryTitle">
Active Orders
</div>

<div
class="summaryValue"
id="activeOrders">

0

</div>

</div>

<div class="summaryCard">

<div class="summaryTitle">
Busy Riders
</div>

<div
class="summaryValue"
id="busyRiders">

0

</div>

</div>

<div class="summaryCard">

<div class="summaryTitle">
Avg ETA
</div>

<div
class="summaryValue">

4m

</div>

</div>

</div>

<!-- =====================================================
RIDER LIST
===================================================== -->

<div id="ridersContainer">

</div>

</div>

<!-- =====================================================
MAP
===================================================== -->

<div id="map"></div>

</div>

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/live-tracking.js">
</script>

</body>
</html>
