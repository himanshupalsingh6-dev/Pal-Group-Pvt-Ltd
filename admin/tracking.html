<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Live Tracking Admin
</title>

<link
rel="stylesheet"
href="layout.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

width:calc(100% - 290px);

min-height:100vh;

background:#F4F7FB;

overflow:hidden;

}

.content{

padding:24px;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

margin-bottom:24px;

flex-wrap:wrap;

}

.pageTitle{

font-size:58px;

font-weight:900;

letter-spacing:-2px;

}

/* =====================================================
TOP STATS
===================================================== */

.statsGrid{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

margin-bottom:24px;

}

.statCard{

background:#fff;

padding:24px;

border-radius:30px;

border:1px solid #E5E7EB;

}

.statCard h5{

font-size:13px;

font-weight:900;

color:#6B7280;

margin-bottom:12px;

}

.statCard h2{

font-size:38px;

font-weight:900;

}

/* =====================================================
MAP
===================================================== */

.mapWrap{

position:relative;

width:100%;

height:75vh;

border-radius:32px;

overflow:hidden;

border:1px solid #E5E7EB;

}

#map{

width:100%;

height:100%;

z-index:1;

}

/* =====================================================
LIVE PANEL
===================================================== */

.livePanel{

position:absolute;

top:20px;

right:20px;

width:380px;

max-height:90%;

overflow-y:auto;

background:#fff;

border-radius:30px;

padding:20px;

z-index:999;

box-shadow:
0 10px 40px rgba(0,0,0,.08);

}

/* =====================================================
LIVE HEADER
===================================================== */

.liveHeader{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.liveHeader h2{

font-size:24px;

font-weight:900;

}

.liveDot{

width:14px;

height:14px;

border-radius:50%;

background:#16A34A;

animation:pulse 1s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.5);
opacity:.5;
}

100%{
transform:scale(1);
opacity:1;
}

}

/* =====================================================
RIDER CARD
===================================================== */

.riderCard{

background:#F9FAFB;

border-radius:24px;

padding:18px;

margin-bottom:16px;

border:1px solid #E5E7EB;

}

.riderTop{

display:flex;

align-items:center;

justify-content:space-between;

gap:12px;

margin-bottom:14px;

}

.riderLeft{

display:flex;

align-items:center;

gap:14px;

}

.riderImage{

width:60px;

height:60px;

border-radius:50%;

object-fit:cover;

}

.riderInfo h3{

font-size:18px;

font-weight:900;

margin-bottom:4px;

}

.riderInfo p{

font-size:13px;

font-weight:700;

color:#6B7280;

}

.status{

padding:8px 14px;

border-radius:999px;

font-size:12px;

font-weight:900;

background:#DCFCE7;

color:#15803D;

}

.riderBottom{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}

.infoBox{

background:#fff;

padding:14px;

border-radius:18px;

}

.infoBox h5{

font-size:11px;

font-weight:900;

color:#6B7280;

margin-bottom:8px;

}

.infoBox h4{

font-size:16px;

font-weight:900;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1200px){

.statsGrid{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:900px){

.main{

margin-left:0;

width:100%;

}

.content{

padding:16px;

}

.pageTitle{

font-size:40px;

}

.statsGrid{

grid-template-columns:1fr;

}

.mapWrap{

height:85vh;

}

.livePanel{

position:relative;

top:auto;

right:auto;

width:100%;

margin-top:20px;

max-height:none;

}

}

</style>

</head>

<body>

<div class="adminLayout">

<div id="layoutContainer"></div>

<div class="main">

<div class="content">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Live Tracking
</div>

</div>

<!-- =====================================================
STATS
===================================================== -->

<div class="statsGrid">

<div class="statCard">

<h5>
Online Riders
</h5>

<h2 id="onlineRiders">
0
</h2>

</div>

<div class="statCard">

<h5>
Active Deliveries
</h5>

<h2 id="activeOrders">
0
</h2>

</div>

<div class="statCard">

<h5>
Delivered Today
</h5>

<h2 id="deliveredOrders">
0
</h2>

</div>

<div class="statCard">

<h5>
Average ETA
</h5>

<h2 id="avgEta">
12m
</h2>

</div>

</div>

<!-- =====================================================
MAP
===================================================== -->

<div class="mapWrap">

<div id="map"></div>

<!-- =====================================================
LIVE PANEL
===================================================== -->

<div class="livePanel">

<div class="liveHeader">

<h2>
Live Riders
</h2>

<div class="liveDot"></div>

</div>

<div id="ridersList"></div>

</div>

</div>

</div>

</div>

</div>

<!-- =====================================================
LEAFLET
===================================================== -->

<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>

<!-- =====================================================
JS
===================================================== -->

<script type="module"
src="js/layout.js">
</script>

<script type="module"
src="js/tracking.js">
</script>

</body>
</html>
