<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Services
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script
src="https://cdn.jsdelivr.net/npm/chart.js">
</script>

<style>

/* ======================================================
GLOBAL
====================================================== */

body{
background:#F4F4F5;
font-family:Arial,sans-serif;
}

/* ======================================================
TOP
====================================================== */

.topBar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:24px;

}

.pageTitle{

font-size:42px;
font-weight:900;

}

/* ======================================================
BUTTONS
====================================================== */

.topActions{

display:flex;
gap:12px;

}

.actionBtn{

height:48px;

padding:0 20px;

border:none;

border-radius:14px;

background:#111827;

color:#fff;

font-size:14px;
font-weight:900;

cursor:pointer;

}

/* ======================================================
GRID
====================================================== */

.mainGrid{

display:grid;

grid-template-columns:
420px 1fr;

gap:20px;

}

/* ======================================================
FORM
====================================================== */

.formBox{

background:#fff;

border-radius:22px;

padding:24px;

border:1px solid #E5E7EB;

height:max-content;

}

/* ======================================================
TITLE
====================================================== */

.sectionTitle{

font-size:28px;
font-weight:900;

margin-bottom:22px;

}

/* ======================================================
INPUT
====================================================== */

.inputGroup{

margin-bottom:18px;

}

.label{

font-size:14px;
font-weight:800;

margin-bottom:10px;

display:block;

}

.input{

width:100%;
height:52px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:0 16px;

font-size:14px;
font-weight:800;

outline:none;

background:#fff;

}

.textarea{

width:100%;

height:110px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:16px;

font-size:14px;
font-weight:800;

outline:none;

resize:none;

}

/* ======================================================
SERVICE LIST
====================================================== */

.servicesBox{

background:#fff;

border-radius:22px;

padding:24px;

border:1px solid #E5E7EB;

}

/* ======================================================
FILTERS
====================================================== */

.filters{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:14px;

margin-bottom:20px;

}

/* ======================================================
TABLE
====================================================== */

.table{

width:100%;

overflow:auto;

}

/* ======================================================
HEADER
====================================================== */

.tableHeader{

display:grid;

grid-template-columns:
120px 220px 180px 160px 140px 140px 240px;

padding:16px;

background:#F9FAFB;

border-radius:16px;

font-size:13px;
font-weight:900;

margin-bottom:12px;

}

/* ======================================================
ROW
====================================================== */

.tableRow{

display:grid;

grid-template-columns:
120px 220px 180px 160px 140px 140px 240px;

padding:18px 16px;

align-items:center;

border-bottom:1px solid #F3F4F6;

font-size:14px;
font-weight:800;

}

/* ======================================================
ICON
====================================================== */

.serviceIcon{

width:58px;
height:58px;

border-radius:18px;

background:#EEF2FF;

display:flex;
align-items:center;
justify-content:center;

font-size:26px;

color:#2563EB;

}

/* ======================================================
STATUS
====================================================== */

.status{

padding:8px 14px;

border-radius:10px;

width:max-content;

font-size:12px;
font-weight:900;

color:#fff;

}

.active{
background:#10B981;
}

.inactive{
background:#EF4444;
}

.closed{
background:#F59E0B;
}

/* ======================================================
ACTION
====================================================== */

.rowActions{

display:flex;
gap:10px;

}

.rowBtn{

height:38px;

padding:0 16px;

border:none;

border-radius:10px;

font-size:12px;
font-weight:900;

cursor:pointer;

}

.editBtn{

background:#111827;
color:#fff;

}

.deleteBtn{

background:#FEE2E2;
color:#DC2626;

}

/* ======================================================
ANALYTICS
====================================================== */

.analyticsGrid{

display:grid;

grid-template-columns:
1fr 1fr 1fr;

gap:20px;

margin-top:22px;

}

.analyticsCard{

background:#fff;

border-radius:22px;

padding:24px;

border:1px solid #E5E7EB;

}

.analyticsTitle{

font-size:15px;
font-weight:800;
color:#6B7280;

margin-bottom:14px;

}

.analyticsValue{

font-size:40px;
font-weight:900;

}

/* ======================================================
RESPONSIVE
====================================================== */

@media(max-width:1400px){

.mainGrid{

grid-template-columns:1fr;

}

}

@media(max-width:900px){

.filters{

grid-template-columns:
1fr 1fr;

}

.analyticsGrid{

grid-template-columns:1fr;

}

}

@media(max-width:700px){

.filters{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div id="layoutContainer"></div>

<div class="main">

<!-- ======================================================
TOP
====================================================== -->

<div class="topBar">

<div class="pageTitle">
Services Management
</div>

<div class="topActions">

<button class="actionBtn">
Bulk Price Update
</button>

<button class="actionBtn">
Export Services
</button>

</div>

</div>

<!-- ======================================================
ANALYTICS
====================================================== -->

<div class="analyticsGrid">

<div class="analyticsCard">

<div class="analyticsTitle">
Total Services
</div>

<div
class="analyticsValue"
id="totalServices">

0

</div>

</div>

<div class="analyticsCard">

<div class="analyticsTitle">
Most Ordered Service
</div>

<div
class="analyticsValue"
id="topService">

Laundry

</div>

</div>

<div class="analyticsCard">

<div class="analyticsTitle">
Top Revenue City
</div>

<div
class="analyticsValue"
id="topCity">

Kasganj

</div>

</div>

</div>

<!-- ======================================================
GRID
====================================================== -->

<div class="mainGrid">

<!-- ======================================================
FORM
====================================================== -->

<div class="formBox">

<div class="sectionTitle">
Add Service
</div>

<div class="inputGroup">

<label class="label">
Service Name
</label>

<input
type="text"
class="input"
id="serviceName"
placeholder="Shirt Wash">

</div>

<div class="inputGroup">

<label class="label">
Category
</label>

<select
class="input"
id="serviceCategory">

<option>
Laundry
</option>

<option>
Ironing
</option>

<option>
Dry Cleaning
</option>

<option>
Steam Press
</option>

<option>
Shoe Cleaning
</option>

<option>
Blanket Wash
</option>

<option>
Premium Wash
</option>

</select>

</div>

<div class="inputGroup">

<label class="label">
Description
</label>

<textarea
class="textarea"
id="serviceDescription"
placeholder="Write service details..."></textarea>

</div>

<div class="inputGroup">

<label class="label">
Service Icon
</label>

<select
class="input"
id="serviceIcon">

<option value="fa-shirt">
👕 Shirt
</option>

<option value="fa-socks">
🧦 Socks
</option>

<option value="fa-user-tie">
🧥 Coat
</option>

<option value="fa-ring">
👗 Saree
</option>

</select>

</div>

<div class="inputGroup">

<label class="label">
City
</label>

<input
type="text"
class="input"
id="serviceCity"
placeholder="Kasganj">

</div>

<div class="inputGroup">

<label class="label">
Area
</label>

<input
type="text"
class="input"
id="serviceArea"
placeholder="Main City">

</div>

<div class="inputGroup">

<label class="label">
Price
</label>

<input
type="number"
class="input"
id="servicePrice"
placeholder="20">

</div>

<div class="inputGroup">

<label class="label">
Delivery Charge
</label>

<input
type="number"
class="input"
id="deliveryCharge"
placeholder="10">

</div>

<div class="inputGroup">

<label class="label">
Minimum Order
</label>

<input
type="number"
class="input"
id="minimumOrder"
placeholder="100">

</div>

<div class="inputGroup">

<label class="label">
Urgent Charge
</label>

<input
type="number"
class="input"
id="urgentCharge"
placeholder="30">

</div>

<div class="inputGroup">

<label class="label">
Status
</label>

<select
class="input"
id="serviceStatus">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

<option value="closed">
Temporarily Closed
</option>

</select>

</div>

<button
class="actionBtn"
style="width:100%;"
onclick="addService()">

Add Service

</button>

</div>

<!-- ======================================================
SERVICES
====================================================== -->

<div class="servicesBox">

<div class="sectionTitle">
All Services
</div>

<!-- ======================================================
FILTERS
====================================================== -->

<div class="filters">

<input
type="text"
class="input"
placeholder="Search Service"
id="searchInput">

<select
class="input"
id="categoryFilter">

<option value="">
All Categories
</option>

<option>
Laundry
</option>

<option>
Ironing
</option>

<option>
Dry Cleaning
</option>

</select>

<select
class="input"
id="cityFilter">

<option value="">
All Cities
</option>

</select>

<select
class="input"
id="statusFilter">

<option value="">
All Status
</option>

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

<option value="closed">
Closed
</option>

</select>

</div>

<!-- ======================================================
TABLE
====================================================== -->

<div class="table">

<div class="tableHeader">

<div>
Icon
</div>

<div>
Service
</div>

<div>
Category
</div>

<div>
City
</div>

<div>
Price
</div>

<div>
Status
</div>

<div>
Actions
</div>

</div>

<div id="servicesContainer">

</div>

</div>

</div>

</div>

</div>

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/services.js">
</script>

</body>
</html>
