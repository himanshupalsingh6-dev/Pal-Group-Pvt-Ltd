<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Services
</title>

<link rel="stylesheet"
href="layout.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

width:calc(100% - 290px);

background:#F4F7FB;

min-height:100vh;

overflow-x:hidden;

}

.content{

padding:28px;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

flex-wrap:wrap;

margin-bottom:24px;

}

.pageTitle{

font-size:58px;

font-weight:900;

letter-spacing:-2px;

}

/* =====================================================
TOP BUTTONS
===================================================== */

.topActions{

display:flex;

gap:14px;

flex-wrap:wrap;

}

.actionMainBtn{

height:56px;

padding:0 24px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-weight:900;

cursor:pointer;

}

/* =====================================================
SEARCH
===================================================== */

.searchWrap{

display:flex;

gap:14px;

flex-wrap:wrap;

margin-bottom:24px;

}

.searchInput{

height:56px;

width:320px;

border:none;

outline:none;

padding:0 20px;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-size:14px;

font-weight:700;

}

.selectInput{

height:56px;

padding:0 18px;

border:none;

outline:none;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-size:14px;

font-weight:800;

}

/* =====================================================
FORM
===================================================== */

.formCard{

background:#fff;

border-radius:32px;

padding:28px;

margin-bottom:28px;

border:1px solid #E5E7EB;

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:18px;

}

.inputBox{

display:flex;

flex-direction:column;

gap:10px;

}

.inputBox label{

font-size:13px;

font-weight:900;

}

.input{

height:56px;

border:none;

outline:none;

background:#F9FAFB;

border:1px solid #E5E7EB;

border-radius:18px;

padding:0 18px;

font-size:14px;

font-weight:700;

}

textarea.input{

height:120px;

padding-top:18px;

resize:none;

}

.saveBtn{

height:56px;

border:none;

background:#16A34A;

color:#fff;

font-weight:900;

border-radius:18px;

cursor:pointer;

}

/* =====================================================
GRID
===================================================== */

.servicesGrid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:24px;

}

/* =====================================================
CARD
===================================================== */

.serviceCard{

background:#fff;

border-radius:32px;

overflow:hidden;

border:1px solid #E5E7EB;

transition:.2s;

}

.serviceCard:hover{

transform:translateY(-4px);

}

.serviceIconWrap{

height:230px;

background:#F9FAFB;

display:flex;

align-items:center;

justify-content:center;

position:relative;

}

.serviceIcon{

width:100px;

height:100px;

object-fit:contain;

}

.categoryTag{

position:absolute;

top:18px;

right:18px;

background:#111827;

color:#fff;

padding:10px 14px;

border-radius:999px;

font-size:12px;

font-weight:900;

}

.serviceBody{

padding:22px;

}

.serviceTop{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:14px;

}

.serviceName{

font-size:24px;

font-weight:900;

}

.cityTag{

padding:10px 14px;

border-radius:999px;

background:#EEF2FF;

color:#4338CA;

font-size:12px;

font-weight:900;

}

.serviceDesc{

font-size:14px;

font-weight:600;

line-height:1.6;

color:#6B7280;

margin-bottom:18px;

}

.serviceInfo{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-bottom:20px;

}

.infoBox{

background:#F9FAFB;

padding:14px;

border-radius:18px;

}

.infoBox h5{

font-size:12px;

font-weight:900;

color:#6B7280;

margin-bottom:8px;

}

.infoBox h4{

font-size:18px;

font-weight:900;

}

.cardActions{

display:flex;

gap:12px;

}

.editBtn,
.deleteBtn{

flex:1;

height:52px;

border:none;

border-radius:16px;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.editBtn{

background:#111827;

color:#fff;

}

.deleteBtn{

background:#FEE2E2;

color:#DC2626;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1300px){

.servicesGrid{
grid-template-columns:repeat(2,1fr);
}

.formCard{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:800px){

.main{
margin-left:0;
width:100%;
}

.content{
padding:16px;
}

.pageTitle{
font-size:40px;
}

.servicesGrid{
grid-template-columns:1fr;
}

.formCard{
grid-template-columns:1fr;
}

.searchInput{
width:100%;
}

}

</style>

</head>

<body>

<div class="adminLayout">

<div id="layoutContainer"></div>

<div class="main">

<div class="content">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Services
</div>

<div class="topActions">

<button class="actionMainBtn">

<i class="fa-solid fa-layer-group"></i>

Categories

</button>

<button class="actionMainBtn">

<i class="fa-solid fa-plus"></i>

Add Service

</button>

</div>

</div>

<!-- =====================================================
SEARCH
===================================================== -->

<div class="searchWrap">

<input
type="text"
id="searchInput"
class="searchInput"
placeholder="Search service">

<select
id="cityFilter"
class="selectInput">

<option value="All">
All Cities
</option>

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

<option value="Lucknow">
Lucknow
</option>

</select>

<select
id="categoryFilter"
class="selectInput">

<option value="All">
All Categories
</option>

<option value="Laundry">
Laundry
</option>

<option value="Dry Clean">
Dry Clean
</option>

<option value="Steam Iron">
Steam Iron
</option>

<option value="Shoe Cleaning">
Shoe Cleaning
</option>

</select>

</div>

<!-- =====================================================
FORM
===================================================== -->

<div class="formCard">

<div class="inputBox">

<label>
Service Name
</label>

<input
type="text"
id="serviceName"
class="input"
placeholder="Premium Laundry">

</div>

<div class="inputBox">

<label>
Category
</label>

<select
id="serviceCategory"
class="input">

<option value="Laundry">
Laundry
</option>

<option value="Dry Clean">
Dry Clean
</option>

<option value="Steam Iron">
Steam Iron
</option>

<option value="Shoe Cleaning">
Shoe Cleaning
</option>

</select>

</div>

<div class="inputBox">

<label>
City
</label>

<select
id="serviceCity"
class="input">

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

<option value="Lucknow">
Lucknow
</option>

</select>

</div>

<div class="inputBox">

<label>
Price
</label>

<input
type="number"
id="servicePrice"
class="input"
placeholder="99">

</div>

<div class="inputBox">

<label>
Old Price
</label>

<input
type="number"
id="serviceOldPrice"
class="input"
placeholder="149">

</div>

<div class="inputBox">

<label>
Delivery Time
</label>

<input
type="text"
id="serviceTime"
class="input"
placeholder="30 mins">

</div>

<div class="inputBox">

<label>
Rating
</label>

<input
type="number"
id="serviceRating"
class="input"
placeholder="4.9">

</div>

<div class="inputBox">

<label>
Icon URL
</label>

<input
type="text"
id="serviceIcon"
class="input"
placeholder="https://">

</div>

<div class="inputBox"
style="grid-column:1/-1;">

<label>
Banner Image URL
</label>

<input
type="text"
id="serviceImage"
class="input"
placeholder="https://">

</div>

<div class="inputBox"
style="grid-column:1/-1;">

<label>
Description
</label>

<textarea
id="serviceDesc"
class="input"
placeholder="Premium laundry service"></textarea>

</div>

<button
id="saveServiceBtn"
class="saveBtn">

Save Service

</button>

</div>

<!-- =====================================================
GRID
===================================================== -->

<div
class="servicesGrid"
id="servicesGrid">

</div>

</div>

</div>

</div>

<script type="module"
src="js/layout.js">
</script>

<script type="module"
src="js/services.js">
</script>

</body>
</html>
