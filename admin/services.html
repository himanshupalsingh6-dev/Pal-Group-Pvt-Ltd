<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Services
</title>

<link rel="stylesheet"
href="layout.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
PAGE
===================================================== */

.main{

margin-left:290px;

width:calc(100% - 290px);

min-height:100vh;

background:#F4F7FB;

}

.content{

padding:28px;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:24px;

gap:20px;

flex-wrap:wrap;

}

.pageTitle{

font-size:56px;

font-weight:900;

letter-spacing:-2px;

}

/* =====================================================
BUTTON
===================================================== */

.addBtn{

height:56px;

padding:0 26px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-weight:900;

font-size:15px;

cursor:pointer;

}

/* =====================================================
FORM
===================================================== */

.formCard{

background:#fff;

padding:26px;

border-radius:32px;

margin-bottom:24px;

border:1px solid #E5E7EB;

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:18px;

}

.inputBox{

display:flex;

flex-direction:column;

gap:10px;

}

.inputBox label{

font-size:13px;

font-weight:900;

}

.input{

height:56px;

border:none;

outline:none;

background:#F9FAFB;

border:1px solid #E5E7EB;

border-radius:18px;

padding:0 18px;

font-size:14px;

font-weight:700;

}

textarea.input{

height:120px;

padding-top:16px;

resize:none;

}

.saveBtn{

height:56px;

border:none;

border-radius:18px;

background:#16A34A;

color:#fff;

font-size:15px;

font-weight:900;

cursor:pointer;

margin-top:auto;

}

/* =====================================================
GRID
===================================================== */

.servicesGrid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:22px;

}

/* =====================================================
CARD
===================================================== */

.serviceCard{

background:#fff;

border-radius:30px;

overflow:hidden;

border:1px solid #E5E7EB;

}

.serviceImage{

width:100%;

height:220px;

object-fit:cover;

background:#F3F4F6;

}

.serviceBody{

padding:22px;

}

.serviceTitle{

font-size:24px;

font-weight:900;

margin-bottom:10px;

}

.serviceDesc{

font-size:14px;

font-weight:600;

line-height:1.6;

color:#6B7280;

margin-bottom:18px;

}

.priceWrap{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:18px;

}

.price{

font-size:30px;

font-weight:900;

}

.city{

padding:10px 14px;

border-radius:999px;

background:#EEF2FF;

font-size:12px;

font-weight:900;

color:#4338CA;

}

.cardActions{

display:flex;

gap:10px;

}

.actionBtn{

flex:1;

height:52px;

border:none;

border-radius:16px;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.editBtn{

background:#111827;

color:#fff;

}

.deleteBtn{

background:#FEE2E2;

color:#DC2626;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1200px){

.servicesGrid{
grid-template-columns:repeat(2,1fr);
}

.formCard{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:800px){

.main{
margin-left:0;
width:100%;
}

.content{
padding:16px;
}

.pageTitle{
font-size:38px;
}

.servicesGrid{
grid-template-columns:1fr;
}

.formCard{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="adminLayout">

<div id="layoutContainer"></div>

<div class="main">

<div class="content">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Services
</div>

<button class="addBtn">

<i class="fa-solid fa-plus"></i>

Add Service

</button>

</div>

<!-- =====================================================
FORM
===================================================== -->

<div class="formCard">

<div class="inputBox">

<label>
Service Name
</label>

<input
type="text"
id="serviceName"
class="input"
placeholder="Premium Laundry">

</div>

<div class="inputBox">

<label>
Price
</label>

<input
type="number"
id="servicePrice"
class="input"
placeholder="99">

</div>

<div class="inputBox">

<label>
City
</label>

<select
id="serviceCity"
class="input">

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

<option value="Lucknow">
Lucknow
</option>

</select>

</div>

<div class="inputBox">

<label>
Image URL
</label>

<input
type="text"
id="serviceImage"
class="input"
placeholder="https://">

</div>

<div class="inputBox">

<label>
Category
</label>

<select
id="serviceCategory"
class="input">

<option value="Laundry">
Laundry
</option>

<option value="Dry Clean">
Dry Clean
</option>

<option value="Steam Iron">
Steam Iron
</option>

<option value="Shoe Cleaning">
Shoe Cleaning
</option>

</select>

</div>

<div class="inputBox">

<label>
Delivery Time
</label>

<input
type="text"
id="serviceTime"
class="input"
placeholder="30 mins">

</div>

<div class="inputBox"
style="grid-column:1/-1;">

<label>
Description
</label>

<textarea
id="serviceDesc"
class="input"
placeholder="Premium laundry service..."></textarea>

</div>

<button
id="saveServiceBtn"
class="saveBtn">

Save Service

</button>

</div>

<!-- =====================================================
GRID
===================================================== -->

<div class="servicesGrid"
id="servicesGrid">

</div>

</div>

</div>

</div>

<script type="module"
src="layout.js">
</script>

<script type="module"
src="services.js">
</script>

</body>
</html>
