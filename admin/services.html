<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuickPress Services</title>

<link rel="stylesheet" href="services.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

</head>

<body>

<div class="mainWrapper">

    <!-- TOPBAR -->

    <header class="topbar">

        <div class="pageTitle">

            <i class="fas fa-box"></i>
            <h1>Services Management</h1>

        </div>

        <button
        id="openServiceModal"
        class="primaryBtn">

            + Add Service

        </button>

    </header>

    <!-- STATS -->

    <section class="statsGrid">

        <div class="statCard">

            <div class="statValue"
            id="totalServices">

            0

            </div>

            <div class="statLabel">

            Total Services

            </div>

        </div>

        <div class="statCard">

            <div class="statValue"
            id="activeServices">

            0

            </div>

            <div class="statLabel">

            Active Services

            </div>

        </div>

        <div class="statCard">

            <div class="statValue"
            id="totalOrders">

            0

            </div>

            <div class="statLabel">

            Orders

            </div>

        </div>

        <div class="statCard">

            <div class="statValue"
            id="totalRevenue">

            ₹0

            </div>

            <div class="statLabel">

            Revenue

            </div>

        </div>

    </section>

    <!-- SERVICES TABLE -->

    <section class="card">

        <div class="sectionHeader">

            <h2>Services</h2>

        </div>

        <table>

            <thead>

                <tr>

                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody
            id="servicesTable">

            </tbody>

        </table>

    </section>

    <!-- CITY PRICING -->

    <section class="card">

        <div class="sectionHeader">

            <h2>

            City Wise Pricing

            </h2>

            <button
            id="openPricingModal"
            class="secondaryBtn">

            + Add Pricing

            </button>

        </div>

        <table>

            <thead>

                <tr>

                    <th>City</th>
                    <th>Service</th>
                    <th>Normal Price</th>
                    <th>Express Price</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody
            id="pricingTable">

            </tbody>

        </table>

    </section>

    <!-- REVENUE -->

    <section class="card">

        <div class="sectionHeader">

            <h2>

            Revenue Tracking

            </h2>

        </div>

        <div class="revenueGrid">

            <div class="revenueBox">

                <h3>

                Total Revenue

                </h3>

                <p
                id="revenueValue">

                ₹0

                </p>

            </div>

            <div class="revenueBox">

                <h3>

                Total Orders

                </h3>

                <p
                id="ordersValue">

                0

                </p>

            </div>

            <div class="revenueBox">

                <h3>

                Top Service

                </h3>

                <p
                id="topService">

                -

                </p>

            </div>

        </div>

    </section>

    <!-- SERVICE MODAL -->

    <div
    class="modal"
    id="serviceModal">

        <div class="modalContent">

            <h2>

            Add Service

            </h2>

            <input
            id="serviceName"
            placeholder="Service Name">

            <input
            id="serviceCategory"
            placeholder="Category">

            <input
            id="servicePrice"
            type="number"
            placeholder="Price">

            <input
            id="serviceImage"
            placeholder="Image URL">

            <button
            id="saveServiceBtn"
            class="primaryBtn">

            Save Service

            </button>

        </div>

    </div>

    <!-- PRICING MODAL -->

    <div
    class="modal"
    id="pricingModal">

        <div class="modalContent">

            <h2>

            City Pricing

            </h2>

            <input
            id="pricingCity"
            placeholder="City">

            <select
            id="pricingService">

            </select>

            <input
            id="normalPrice"
            type="number"
            placeholder="Normal Price">

            <input
            id="expressPrice"
            type="number"
            placeholder="Express Price">

            <button
            id="savePricingBtn"
            class="primaryBtn">

            Save Pricing

            </button>

        </div>

    </div>

</div>

<script
type="module"
src="services.js">

</script>

</body>
</html>
