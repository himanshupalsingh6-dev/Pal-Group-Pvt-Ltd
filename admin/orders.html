<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Orders
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script
src="https://cdn.jsdelivr.net/npm/chart.js">
</script>

<style>

/* =====================================================
GLOBAL
===================================================== */

body{
background:#F4F4F5;
font-family:Arial,sans-serif;
}

/* =====================================================
TOP STATS
===================================================== */

.topStats{

display:grid;

grid-template-columns:
repeat(7,1fr);

gap:14px;

margin-bottom:20px;

}

/* =====================================================
CARD
===================================================== */

.statCard{

background:#fff;

border-radius:18px;

padding:18px;

border:1px solid #E5E7EB;

cursor:pointer;

transition:.2s;

}

.statCard:hover{

transform:translateY(-3px);

}

.statTitle{

font-size:13px;
font-weight:800;
color:#6B7280;

margin-bottom:10px;

}

.statValue{

font-size:34px;
font-weight:900;
color:#111827;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:grid;

grid-template-columns:
repeat(6,1fr);

gap:14px;

margin-bottom:20px;

}

.filterInput{

height:50px;

border:1px solid #E5E7EB;

border-radius:12px;

padding:0 16px;

background:#fff;

font-size:14px;
font-weight:800;

outline:none;

}

/* =====================================================
TABLE
===================================================== */

.tableBox{

background:#fff;

border-radius:18px;

border:1px solid #E5E7EB;

overflow:hidden;

}

/* =====================================================
HEADER
===================================================== */

.tableHeader{

display:grid;

grid-template-columns:
120px 220px 200px 140px 120px 160px 180px 240px;

padding:18px;

background:#F9FAFB;

font-size:13px;
font-weight:900;

border-bottom:1px solid #E5E7EB;

}

/* =====================================================
ROW
===================================================== */

.orderRow{

display:grid;

grid-template-columns:
120px 220px 200px 140px 120px 160px 180px 240px;

padding:18px;

align-items:center;

border-bottom:1px solid #F3F4F6;

font-size:14px;
font-weight:800;

}

/* =====================================================
STATUS
===================================================== */

.status{

padding:8px 12px;

border-radius:8px;

display:inline-flex;

width:max-content;

font-size:12px;
font-weight:900;

color:#fff;

}

.pending{
background:#F59E0B;
}

.assigned{
background:#3B82F6;
}

.picked{
background:#8B5CF6;
}

.delivery{
background:#EC4899;
}

.completed{
background:#10B981;
}

.cancelled{
background:#EF4444;
}

/* =====================================================
BUTTONS
===================================================== */

.actions{

display:flex;
gap:10px;
flex-wrap:wrap;

}

.actionBtn{

height:38px;

padding:0 16px;

border:none;

border-radius:10px;

font-size:12px;
font-weight:900;

cursor:pointer;

}

.viewBtn{

background:#111827;
color:#fff;

}

.assignBtn{

background:#2563EB;
color:#fff;

}

.trackBtn{

background:#10B981;
color:#fff;

}

/* =====================================================
MODAL
===================================================== */

.modal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.4);

display:none;
align-items:center;
justify-content:center;

z-index:99999;

}

.modalBox{

width:700px;
max-width:95%;

background:#fff;

border-radius:24px;

padding:24px;

max-height:90vh;

overflow-y:auto;

}

.modalTitle{

font-size:32px;
font-weight:900;

margin-bottom:20px;

}

.detailRow{

display:flex;
justify-content:space-between;

padding:14px 0;

border-bottom:1px solid #F3F4F6;

font-size:15px;
font-weight:800;

}

/* =====================================================
RIDER CARD
===================================================== */

.riderCard{

padding:16px;

border:1px solid #E5E7EB;

border-radius:16px;

margin-bottom:14px;

display:flex;
justify-content:space-between;
align-items:center;

}

.assignNowBtn{

height:42px;

padding:0 18px;

border:none;

background:#111827;

color:#fff;

border-radius:10px;

font-weight:900;

cursor:pointer;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1600px){

.topStats{

grid-template-columns:
repeat(4,1fr);

}

.filters{

grid-template-columns:
repeat(3,1fr);

}

}

@media(max-width:1100px){

.topStats{

grid-template-columns:
repeat(2,1fr);

}

.filters{

grid-template-columns:
repeat(2,1fr);

}

.tableBox{

overflow:auto;

}

}

@media(max-width:700px){

.topStats{

grid-template-columns:1fr;

}

.filters{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div id="layoutContainer"></div>

<div class="main">

<!-- =====================================================
TOP STATS
===================================================== -->

<div class="topStats">

<div class="statCard">

<div class="statTitle">
Total Orders
</div>

<div
class="statValue"
id="totalOrders">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">
Pending Orders
</div>

<div
class="statValue"
id="pendingOrders">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">
Assigned Orders
</div>

<div
class="statValue"
id="assignedOrders">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">
Delivered Orders
</div>

<div
class="statValue"
id="deliveredOrders">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">
Cancelled Orders
</div>

<div
class="statValue"
id="cancelledOrders">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">
COD Collection
</div>

<div
class="statValue"
id="codCollection">

₹0

</div>

</div>

<div class="statCard">

<div class="statTitle">
Active Riders
</div>

<div
class="statValue"
id="activeRiders">

0

</div>

</div>

</div>

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filters">

<input
type="text"
placeholder="Search Order ID"
class="filterInput"
id="searchInput">

<select
class="filterInput"
id="statusFilter">

<option value="">
All Status
</option>

<option value="pending">
Pending
</option>

<option value="assigned">
Assigned
</option>

<option value="picked">
Picked
</option>

<option value="delivery">
Out For Delivery
</option>

<option value="completed">
Delivered
</option>

<option value="cancelled">
Cancelled
</option>

</select>

<select
class="filterInput"
id="areaFilter">

<option value="">
All Areas
</option>

</select>

<select
class="filterInput"
id="paymentFilter">

<option value="">
Payment Type
</option>

<option value="cod">
COD
</option>

<option value="online">
Online
</option>

</select>

<input
type="date"
class="filterInput"
id="dateFilter">

<button
class="filterInput"
onclick="autoAssignOrders()">

AI Auto Assign

</button>

</div>

<!-- =====================================================
TABLE
===================================================== -->

<div class="tableBox">

<div class="tableHeader">

<div>
Order ID
</div>

<div>
Customer
</div>

<div>
Address
</div>

<div>
Area
</div>

<div>
Amount
</div>

<div>
Status
</div>

<div>
Assigned Rider
</div>

<div>
Actions
</div>

</div>

<div id="ordersContainer">

</div>

</div>

</div>

<!-- =====================================================
VIEW MODAL
===================================================== -->

<div
class="modal"
id="viewModal">

<div class="modalBox">

<div class="modalTitle">
Order Details
</div>

<div id="orderDetails">

</div>

</div>

</div>

<!-- =====================================================
ASSIGN MODAL
===================================================== -->

<div
class="modal"
id="assignModal">

<div class="modalBox">

<div class="modalTitle">
Assign Rider
</div>

<div id="ridersList">

</div>

</div>

</div>

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/orders.js">
</script>

</body>
</html>
