<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Orders
</title>

<link rel="stylesheet"
href="layout.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

width:calc(100% - 290px);

min-height:100vh;

background:#F4F7FB;

overflow-x:hidden;

}

.content{

padding:28px;

width:100%;

box-sizing:border-box;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

flex-wrap:wrap;

margin-bottom:24px;

}

.pageTitle{

font-size:60px;

font-weight:900;

letter-spacing:-2px;

}

/* =====================================================
SEARCH
===================================================== */

.searchWrap{

display:flex;

gap:14px;

flex-wrap:wrap;

margin-bottom:24px;

}

.searchInput{

height:56px;

width:320px;

border:none;

outline:none;

padding:0 20px;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-size:14px;

font-weight:700;

}

.selectInput{

height:56px;

padding:0 18px;

border:none;

outline:none;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-size:14px;

font-weight:800;

}

/* =====================================================
FILTERS
===================================================== */

.filterWrap{

display:flex;

gap:14px;

flex-wrap:wrap;

margin-bottom:24px;

}

.filterBtn{

height:54px;

padding:0 22px;

border:none;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-weight:900;

cursor:pointer;

transition:.2s;

}

.filterBtn.active{

background:#111827;

color:#fff;

}

/* =====================================================
CARD
===================================================== */

.ordersCard{

background:#fff;

border-radius:32px;

overflow:hidden;

border:1px solid #E5E7EB;

width:100%;

}

/* =====================================================
TOP
===================================================== */

.ordersTop{

padding:24px;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #F3F4F6;

}

.ordersTop h3{

font-size:34px;

font-weight:900;

}

/* =====================================================
EXPORT
===================================================== */

.exportBtn{

height:54px;

padding:0 24px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-weight:900;

cursor:pointer;

}

/* =====================================================
TABLE
===================================================== */

.tableWrap{

overflow-x:auto;

width:100%;

}

table{

width:100%;

min-width:1600px;

border-collapse:collapse;

}

th{

padding:22px;

text-align:left;

font-size:13px;

font-weight:900;

color:#6B7280;

border-bottom:1px solid #F3F4F6;

white-space:nowrap;

}

td{

padding:22px;

font-size:14px;

font-weight:700;

border-bottom:1px solid #F3F4F6;

vertical-align:top;

white-space:nowrap;

}

/* =====================================================
CUSTOMER
===================================================== */

.customer{

display:flex;

flex-direction:column;

gap:4px;

}

.customer span{

font-size:12px;

color:#6B7280;

}

/* =====================================================
STATUS
===================================================== */

.status{

padding:10px 14px;

border-radius:999px;

font-size:12px;

font-weight:900;

display:inline-block;

}

.pending{
background:#FEF3C7;
color:#B45309;
}

.processing{
background:#EDE9FE;
color:#7C3AED;
}

.delivered{
background:#DCFCE7;
color:#15803D;
}

.cancelled{
background:#FEE2E2;
color:#DC2626;
}

/* =====================================================
TRACKING
===================================================== */

.trackBox{

display:flex;

align-items:center;

gap:8px;

padding:10px 14px;

background:#EEF2FF;

border-radius:14px;

font-size:12px;

font-weight:800;

color:#4338CA;

}

/* =====================================================
ACTION
===================================================== */

.actionWrap{

display:flex;

gap:8px;

}

.actionBtn{

width:42px;

height:42px;

border:none;

border-radius:14px;

color:#fff;

cursor:pointer;

font-size:14px;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:900px){

.main{

margin-left:0;

width:100%;

}

.content{

padding:16px;

}

.pageTitle{

font-size:38px;

}

.searchInput{

width:100%;

}

.ordersTop{

flex-direction:column;

align-items:flex-start;

gap:16px;

}

}

</style>

</head>

<body>

<div class="adminLayout">

<div id="layoutContainer"></div>

<div class="main">

<div class="content">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Orders
</div>

<button
class="exportBtn"
id="exportBtn">

<i class="fa-solid fa-download"></i>

Export CSV

</button>

</div>

<!-- =====================================================
SEARCH
===================================================== -->

<div class="searchWrap">

<input
type="text"
id="searchInput"
class="searchInput"
placeholder="Search customer / mobile / order">

<select
id="cityFilter"
class="selectInput">

<option value="All">
All Cities
</option>

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

<option value="Lucknow">
Lucknow
</option>

</select>

</div>

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filterWrap">

<button
class="filterBtn active"
data-filter="All">

All Orders

</button>

<button
class="filterBtn"
data-filter="Pending">

Pending

</button>

<button
class="filterBtn"
data-filter="Preparing">

Preparing

</button>

<button
class="filterBtn"
data-filter="Delivered">

Delivered

</button>

<button
class="filterBtn"
data-filter="Cancelled">

Cancelled

</button>

</div>

<!-- =====================================================
TABLE CARD
===================================================== -->

<div class="ordersCard">

<div class="ordersTop">

<h3>
Realtime Orders
</h3>

</div>

<div class="tableWrap">

<table>

<thead>

<tr>

<th>ID</th>
<th>Customer</th>
<th>Items</th>
<th>Address</th>
<th>City</th>
<th>Amount</th>
<th>Payment</th>
<th>Status</th>
<th>Tracking</th>
<th>Time</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

<script type="module"
src="js/layout.js">
</script>

<script type="module"
src="js/orders.js">
</script>

</body>
</html>
