<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Admin Login
</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{
--primary:#F4B400;
--secondary:#16A34A;
--dark:#111827;
--gray:#6B7280;
--bg:#F8FAFC;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#F8FAFC,
#EEF2FF
);

padding:20px;

}

.loginCard{

width:100%;
max-width:450px;

background:white;

border-radius:32px;

padding:40px;

box-shadow:
0 20px 50px rgba(0,0,0,.08);

}

.logo{

text-align:center;

margin-bottom:30px;

}

.logoBox{

width:90px;
height:90px;

margin:auto;

border-radius:24px;

background:
linear-gradient(
135deg,
#F4B400,
#F59E0B
);

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

font-weight:900;

color:white;

}

.logo h1{

margin-top:18px;

font-size:30px;

font-weight:900;

color:#111827;

}

.logo p{

margin-top:8px;

font-size:14px;

color:#6B7280;

}

.formGroup{

margin-bottom:18px;

}

.formGroup label{

display:block;

margin-bottom:8px;

font-size:13px;

font-weight:800;

color:#111827;

}

.inputField{

width:100%;

height:56px;

border:1px solid #E5E7EB;

border-radius:16px;

padding:0 16px;

font-size:14px;

outline:none;

}

.inputField:focus{

border-color:#16A34A;

}

.loginBtn{

width:100%;

height:58px;

border:none;

border-radius:16px;

background:#16A34A;

color:white;

font-size:16px;

font-weight:900;

cursor:pointer;

margin-top:10px;

transition:.3s;

}

.loginBtn:hover{

transform:translateY(-2px);

}

.loader{

display:none;

text-align:center;

margin-top:15px;

font-size:13px;

font-weight:700;

color:#6B7280;

}

.errorBox{

display:none;

margin-top:15px;

padding:12px;

border-radius:12px;

background:#FEE2E2;

color:#DC2626;

font-size:13px;

font-weight:700;

}

.loginInfo{

margin-top:20px;

padding:14px;

border-radius:14px;

background:#F9FAFB;

font-size:13px;

line-height:1.8;

color:#6B7280;

}

</style>

</head>

<body>

<div class="loginCard">

<div class="logo">

<div class="logoBox">

QP

</div>

<h1>

QuickPress Admin

</h1>

<p>

Super Admin Panel

</p>

</div>

<div class="formGroup">

<label>

Email Address

</label>

<input
type="email"
id="email"
class="inputField"
placeholder="Enter Admin Email">

</div>

<div class="formGroup">

<label>

Password

</label>

<input
type="password"
id="password"
class="inputField"
placeholder="Enter Password">

</div>

<button
class="loginBtn"
onclick="adminLogin()">

Login To Dashboard

</button>

<div
id="loader"
class="loader">

Verifying Admin Access...

</div>

<div
id="errorBox"
class="errorBox">

Invalid Credentials

</div>

<div class="loginInfo">

<b>Demo Login</b><br>

Email:
himanshupalsingh6@gmail.com

<br>

Password:
4502

</div>

</div>

<script>

/* ==========================================
ADMIN LOGIN
========================================== */

window.adminLogin =
async function(){

const email =

document.getElementById(
"email"
).value.trim();

const password =

document.getElementById(
"password"
).value;

const loader =

document.getElementById(
"loader"
);

const errorBox =

document.getElementById(
"errorBox"
);

errorBox.style.display =
"none";

loader.style.display =
"block";

const ADMIN_EMAIL =
"himanshupalsingh6@gmail.com";

const ADMIN_PASSWORD =
"4502";

setTimeout(()=>{

if(

email === ADMIN_EMAIL

&&

password === ADMIN_PASSWORD

){

localStorage.setItem(
"adminLogin",
"true"
);

localStorage.setItem(
"adminRole",
"super_admin"
);

localStorage.setItem(
"adminName",
"Himanshu Pal"
);

window.location.href =
"dashboard.html";

}else{

loader.style.display =
"none";

errorBox.innerText =
"Invalid Email Or Password";

errorBox.style.display =
"block";

}

},1000);

};

/* ==========================================
AUTO LOGIN
========================================== */

if(

localStorage.getItem(
"adminLogin"
)

===

"true"

){

window.location.href =
"dashboard.html";

}

/* ==========================================
ENTER KEY LOGIN
========================================== */

document.addEventListener(

"keydown",

(event)=>{

if(event.key==="Enter"){

adminLogin();

}

}

);

</script>

</body>
</html>
