<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

QuickPress Admin Login

</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--primary:#F4B400;
--secondary:#16A34A;
--dark:#111827;
--gray:#6B7280;
--bg:#F8FAFC;

}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
135deg,
#F8FAFC,
#EEF2FF
);

padding:20px;

}

.loginCard{

width:100%;

max-width:450px;

background:white;

border-radius:32px;

padding:40px;

box-shadow:
0 20px 50px rgba(0,0,0,.08);

}

.logo{

text-align:center;

margin-bottom:30px;

}

.logoBox{

width:80px;
height:80px;

margin:auto;

border-radius:24px;

background:

linear-gradient(
135deg,
#F4B400,
#F59E0B
);

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

font-weight:900;

color:white;

}

.logo h1{

margin-top:16px;

font-size:28px;

font-weight:900;

color:#111827;

}

.logo p{

margin-top:8px;

font-size:14px;

color:#6B7280;

}

.formGroup{

margin-bottom:18px;

}

.formGroup label{

display:block;

margin-bottom:8px;

font-size:13px;

font-weight:800;

}

.inputField{

width:100%;

height:56px;

border:1px solid #E5E7EB;

border-radius:16px;

padding:0 16px;

font-size:14px;

outline:none;

}

.loginBtn{

width:100%;

height:58px;

border:none;

border-radius:16px;

background:#16A34A;

color:white;

font-size:16px;

font-weight:900;

cursor:pointer;

margin-top:10px;

}

.errorBox{

display:none;

margin-top:15px;

padding:12px;

border-radius:12px;

background:#FEE2E2;

color:#DC2626;

font-size:13px;

font-weight:700;

}

.loader{

display:none;

text-align:center;

margin-top:15px;

font-size:13px;

font-weight:700;

color:#6B7280;

}

</style>

</head>

<body>

<div class="loginCard">

<div class="logo">

<div class="logoBox">

QP

</div>

<h1>

QuickPress Admin

</h1>

<p>

Super Admin Panel Login

</p>

</div>

<div class="formGroup">

<label>

Email

</label>

<input
type="email"
id="email"
class="inputField"
placeholder="admin@quickpress.com">

</div>

<div class="formGroup">

<label>

Password

</label>

<input
type="password"
id="password"
class="inputField"
placeholder="Enter Password">

</div>

<button
class="loginBtn"
onclick="adminLogin()">

Login

</button>

<div
id="loader"
class="loader">

Verifying Admin Access...

</div>

<div
id="errorBox"
class="errorBox">

Invalid Admin Credentials

</div><script type="module">

import { auth, db }
from "../js/firebase.js";

import {

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

import {

doc,
getDoc

}

from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.adminLogin = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

/* TEST ADMIN LOGIN */

if(
email === "himanshupalsingh6@gmail.com"
&&
password === "4502"
){

localStorage.setItem(
"adminLogin",
"true"
);

window.location.href =
"dashboard.html";

return;

}

document.getElementById(
"errorBox"
).innerText =
"Invalid Email or Password";

document.getElementById(
"errorBox"
).style.display =
"block";

};
window.location.href =
"dashboard.html";

}catch(error){

console.error(error);

loader.style.display =
"none";

errorBox.innerText =
"Invalid Email or Password";

errorBox.style.display =
"block";

}

};

/* AUTO LOGIN */

auth.onAuthStateChanged(

async(user)=>{

if(!user)
return;

const adminDoc =

await getDoc(

doc(
db,
"admins",
user.uid
)

);

if(adminDoc.exists()){

window.location.href =
"dashboard.html";

}

}

);

</script>

</div>

</body>
</html>
