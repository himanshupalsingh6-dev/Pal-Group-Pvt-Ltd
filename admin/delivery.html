<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Riders
</title>

<link rel="stylesheet"
href="layout.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
MAIN
===================================================== */

.main{

margin-left:290px;

width:calc(100% - 290px);

background:#F4F7FB;

min-height:100vh;

overflow-x:hidden;

}

.content{

padding:28px;

}

/* =====================================================
HEADER
===================================================== */

.pageHeader{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

flex-wrap:wrap;

margin-bottom:24px;

}

.pageTitle{

font-size:58px;

font-weight:900;

letter-spacing:-2px;

}

.addBtn{

height:56px;

padding:0 24px;

border:none;

border-radius:18px;

background:#111827;

color:#fff;

font-weight:900;

cursor:pointer;

}

/* =====================================================
SEARCH
===================================================== */

.searchWrap{

display:flex;

gap:14px;

flex-wrap:wrap;

margin-bottom:24px;

}

.searchInput,
.selectInput{

height:56px;

border:none;

outline:none;

padding:0 20px;

border-radius:18px;

background:#fff;

border:1px solid #E5E7EB;

font-size:14px;

font-weight:700;

}

.searchInput{

width:320px;

}

/* =====================================================
FORM
===================================================== */

.formCard{

background:#fff;

border-radius:32px;

padding:28px;

margin-bottom:28px;

border:1px solid #E5E7EB;

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:18px;

}

.inputBox{

display:flex;

flex-direction:column;

gap:10px;

}

.inputBox label{

font-size:13px;

font-weight:900;

}

.input{

height:56px;

border:none;

outline:none;

background:#F9FAFB;

border:1px solid #E5E7EB;

border-radius:18px;

padding:0 18px;

font-size:14px;

font-weight:700;

}

.saveBtn{

height:56px;

border:none;

background:#16A34A;

color:#fff;

font-weight:900;

border-radius:18px;

cursor:pointer;

}

/* =====================================================
GRID
===================================================== */

.ridersGrid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:24px;

}

/* =====================================================
CARD
===================================================== */

.riderCard{

background:#fff;

border-radius:32px;

overflow:hidden;

border:1px solid #E5E7EB;

}

.riderTop{

padding:24px;

display:flex;

align-items:center;

gap:18px;

border-bottom:1px solid #F3F4F6;

}

.riderImage{

width:90px;

height:90px;

border-radius:50%;

object-fit:cover;

}

.riderInfo h2{

font-size:24px;

font-weight:900;

margin-bottom:6px;

}

.riderInfo p{

font-size:14px;

font-weight:700;

color:#6B7280;

}

.riderBody{

padding:22px;

}

.infoGrid{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

margin-bottom:20px;

}

.infoBox{

background:#F9FAFB;

padding:14px;

border-radius:18px;

}

.infoBox h5{

font-size:12px;

font-weight:900;

color:#6B7280;

margin-bottom:8px;

}

.infoBox h4{

font-size:18px;

font-weight:900;

}

.status{

padding:10px 14px;

border-radius:999px;

font-size:12px;

font-weight:900;

display:inline-block;

}

.online{
background:#DCFCE7;
color:#15803D;
}

.offline{
background:#FEE2E2;
color:#DC2626;
}

.cardActions{

display:flex;

gap:12px;

}

.editBtn,
.deleteBtn{

flex:1;

height:52px;

border:none;

border-radius:16px;

font-size:14px;

font-weight:900;

cursor:pointer;

}

.editBtn{

background:#111827;

color:#fff;

}

.deleteBtn{

background:#FEE2E2;

color:#DC2626;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1200px){

.ridersGrid{
grid-template-columns:repeat(2,1fr);
}

.formCard{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:800px){

.main{
margin-left:0;
width:100%;
}

.content{
padding:16px;
}

.pageTitle{
font-size:40px;
}

.ridersGrid{
grid-template-columns:1fr;
}

.formCard{
grid-template-columns:1fr;
}

.searchInput{
width:100%;
}

}

</style>

</head>

<body>

<div class="adminLayout">

<div id="layoutContainer"></div>

<div class="main">

<div class="content">

<!-- =====================================================
HEADER
===================================================== -->

<div class="pageHeader">

<div class="pageTitle">
Riders
</div>

<button class="addBtn">

<i class="fa-solid fa-plus"></i>

Add Rider

</button>

</div>

<!-- =====================================================
SEARCH
===================================================== -->

<div class="searchWrap">

<input
type="text"
id="searchInput"
class="searchInput"
placeholder="Search rider">

<select
id="cityFilter"
class="selectInput">

<option value="All">
All Cities
</option>

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

</select>

</div>

<!-- =====================================================
FORM
===================================================== -->

<div class="formCard">

<div class="inputBox">

<label>
Rider Name
</label>

<input
type="text"
id="riderName"
class="input"
placeholder="Rahul Kumar">

</div>

<div class="inputBox">

<label>
Mobile Number
</label>

<input
type="text"
id="riderPhone"
class="input"
placeholder="9876543210">

</div>

<div class="inputBox">

<label>
City
</label>

<select
id="riderCity"
class="input">

<option value="Kasganj">
Kasganj
</option>

<option value="Delhi">
Delhi
</option>

<option value="Noida">
Noida
</option>

</select>

</div>

<div class="inputBox">

<label>
Vehicle Number
</label>

<input
type="text"
id="vehicleNumber"
class="input"
placeholder="UP87AB1234">

</div>

<div class="inputBox">

<label>
Profile Image URL
</label>

<input
type="text"
id="riderImage"
class="input"
placeholder="https://">

</div>

<div class="inputBox">

<label>
Status
</label>

<select
id="riderStatus"
class="input">

<option value="Online">
Online
</option>

<option value="Offline">
Offline
</option>

</select>

</div>

<button
id="saveRiderBtn"
class="saveBtn">

Save Rider

</button>

</div>

<!-- =====================================================
GRID
===================================================== -->

<div
class="ridersGrid"
id="ridersGrid">

</div>

</div>

</div>

</div>

<script type="module"
src="js/layout.js">
</script>

<script type="module"
src="js/riders.js">
</script>

</body>
</html>
