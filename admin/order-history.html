<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Order History
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =====================================================
GLOBAL
===================================================== */

body{
background:#F4F4F5;
font-family:Arial,sans-serif;
}

/* =====================================================
MAIN
===================================================== */

.main{

display:grid;

grid-template-columns:
500px 1fr;

gap:14px;

height:calc(100vh - 100px);

}

/* =====================================================
LEFT
===================================================== */

.leftPanel{

background:#fff;

border-radius:14px;

border:1px solid #E5E7EB;

overflow:hidden;

display:flex;
flex-direction:column;

}

/* =====================================================
SEARCH
===================================================== */

.searchArea{

padding:14px;

border-bottom:1px solid #E5E7EB;

display:flex;
gap:12px;

}

.searchInput{

flex:1;

height:48px;

border:1px solid #E5E7EB;

border-radius:10px;

padding:0 16px;

font-size:15px;
font-weight:800;

outline:none;

}

/* =====================================================
ORDER LIST
===================================================== */

.orderList{

overflow-y:auto;

height:100%;

}

/* =====================================================
ORDER CARD
===================================================== */

.orderCard{

padding:18px;

border-bottom:1px solid #F3F4F6;

cursor:pointer;

transition:.2s;

}

.orderCard:hover{

background:#F9FAFB;

}

.orderCard.active{

background:#EEF2FF;

}

/* =====================================================
TOP
===================================================== */

.orderTop{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:14px;

}

/* =====================================================
STATUS
===================================================== */

.status{

padding:8px 12px;

border-radius:8px;

font-size:12px;
font-weight:900;

color:#fff;

}

.pending{
background:#F59E0B;
}

.completed{
background:#10B981;
}

.cancelled{
background:#EF4444;
}

/* =====================================================
ORDER ID
===================================================== */

.orderId{

font-size:15px;
font-weight:900;

margin-bottom:10px;

}

/* =====================================================
ORDER ITEMS
===================================================== */

.orderItems{

font-size:13px;
font-weight:700;
color:#6B7280;

margin-bottom:10px;

}

/* =====================================================
PRICE
===================================================== */

.orderPrice{

font-size:18px;
font-weight:900;

}

/* =====================================================
RIGHT
===================================================== */

.rightPanel{

background:#fff;

border-radius:14px;

border:1px solid #E5E7EB;

padding:24px;

overflow-y:auto;

}

/* =====================================================
DETAIL TOP
===================================================== */

.detailTop{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:20px;

}

/* =====================================================
TITLE
===================================================== */

.detailTitle{

font-size:30px;
font-weight:900;

}

/* =====================================================
TIMELINE
===================================================== */

.timeline{

margin:30px 0;

display:flex;
justify-content:space-between;
align-items:center;

position:relative;

}

.timeline::before{

content:"";

position:absolute;

top:18px;
left:40px;
right:40px;

height:4px;

background:#E5E7EB;

z-index:1;

}

/* =====================================================
STEP
===================================================== */

.step{

position:relative;

z-index:2;

display:flex;
flex-direction:column;
align-items:center;

gap:10px;

}

.stepCircle{

width:40px;
height:40px;

border-radius:50%;

background:#10B981;

display:flex;
align-items:center;
justify-content:center;

color:#fff;

font-size:16px;

}

.stepText{

font-size:13px;
font-weight:800;

}

/* =====================================================
DETAIL BOX
===================================================== */

.detailBox{

padding:18px;

border:1px solid #E5E7EB;

border-radius:14px;

margin-bottom:18px;

}

/* =====================================================
ITEM
===================================================== */

.detailItem{

display:flex;
justify-content:space-between;

padding:12px 0;

border-bottom:1px solid #F3F4F6;

font-size:15px;
font-weight:800;

}

/* =====================================================
BUTTONS
===================================================== */

.actionButtons{

display:flex;
gap:14px;

margin-top:24px;

}

.actionBtn{

height:50px;

padding:0 24px;

border:none;

border-radius:12px;

font-size:14px;
font-weight:900;

cursor:pointer;

}

.acceptBtn{

background:#111827;
color:#fff;

}

.rejectBtn{

background:#FEE2E2;
color:#DC2626;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1100px){

.main{

grid-template-columns:1fr;

height:auto;

}

}

</style>

</head>

<body>

<div id="layoutContainer"></div>

<div class="main">

<!-- =====================================================
LEFT
===================================================== -->

<div class="leftPanel">

<div class="searchArea">

<input
type="text"
placeholder="Search Order ID"
class="searchInput"
id="searchInput">

</div>

<div
class="orderList"
id="orderList">

</div>

</div>

<!-- =====================================================
RIGHT
===================================================== -->

<div class="rightPanel">

<div class="detailTop">

<div class="detailTitle">
Order Details
</div>

<div
id="detailStatus"
class="status pending">

Pending

</div>

</div>

<div id="detailContent">

Select Order

</div>

</div>

</div>

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/order-history.js">
</script>

</body>
</html>
