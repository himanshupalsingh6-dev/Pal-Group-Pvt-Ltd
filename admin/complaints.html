<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
QuickPress Complaints
</title>

<link
rel="stylesheet"
href="./layout.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script
src="https://cdn.jsdelivr.net/npm/chart.js">
</script>

<style>

/* =====================================================
GLOBAL
===================================================== */

body{
background:#F4F4F5;
font-family:Arial,sans-serif;
}

/* =====================================================
TOP
===================================================== */

.pageTop{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:24px;

}

.pageTitle{

font-size:42px;
font-weight:900;

}

.topButtons{

display:flex;
gap:12px;

}

.topBtn{

height:48px;

padding:0 18px;

border:none;

border-radius:14px;

background:#111827;

color:#fff;

font-size:14px;
font-weight:900;

cursor:pointer;

}

/* =====================================================
SUMMARY
===================================================== */

.summaryGrid{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:18px;

margin-bottom:24px;

}

.summaryCard{

background:#fff;

padding:22px;

border-radius:22px;

border:1px solid #E5E7EB;

}

.cardTitle{

font-size:14px;
font-weight:800;
color:#6B7280;

margin-bottom:10px;

}

.cardValue{

font-size:38px;
font-weight:900;

}

/* =====================================================
FILTERS
===================================================== */

.filters{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:14px;

margin-bottom:22px;

}

.filterInput{

height:52px;

border:1px solid #E5E7EB;

border-radius:14px;

padding:0 16px;

font-size:14px;
font-weight:800;

background:#fff;

outline:none;

}

/* =====================================================
MAIN GRID
===================================================== */

.mainGrid{

display:grid;

grid-template-columns:
2fr 1fr;

gap:20px;

}

/* =====================================================
BOX
===================================================== */

.box{

background:#fff;

border-radius:22px;

padding:24px;

border:1px solid #E5E7EB;

overflow:auto;

}

/* =====================================================
TITLE
===================================================== */

.sectionTitle{

font-size:28px;
font-weight:900;

margin-bottom:20px;

}

/* =====================================================
TABLE
===================================================== */

.tableHeader{

display:grid;

grid-template-columns:
140px 180px 140px 140px 120px 140px 180px 240px;

padding:16px;

background:#F9FAFB;

border-radius:14px;

font-size:13px;
font-weight:900;

margin-bottom:12px;

}

.tableRow{

display:grid;

grid-template-columns:
140px 180px 140px 140px 120px 140px 180px 240px;

padding:18px 16px;

align-items:center;

border-bottom:1px solid #F3F4F6;

font-size:14px;
font-weight:800;

}

/* =====================================================
STATUS
===================================================== */

.status{

padding:8px 12px;

border-radius:10px;

font-size:12px;
font-weight:900;

width:max-content;

color:#fff;

}

.pending{
background:#F59E0B;
}

.progress{
background:#2563EB;
}

.resolved{
background:#10B981;
}

.closed{
background:#6B7280;
}

.high{
background:#EF4444;
}

.medium{
background:#F59E0B;
}

.low{
background:#10B981;
}

/* =====================================================
ACTION
===================================================== */

.actions{

display:flex;
gap:8px;
flex-wrap:wrap;

}

.actionBtn{

height:36px;

padding:0 12px;

border:none;

border-radius:10px;

font-size:12px;
font-weight:900;

cursor:pointer;

}

.viewBtn{
background:#111827;
color:#fff;
}

.resolveBtn{
background:#10B981;
color:#fff;
}

.refundBtn{
background:#2563EB;
color:#fff;
}

/* =====================================================
DETAILS
===================================================== */

.detailRow{

padding:14px 0;

border-bottom:1px solid #F3F4F6;

font-size:14px;
font-weight:800;

}

.chatBox{

height:280px;

overflow-y:auto;

border:1px solid #E5E7EB;

border-radius:14px;

padding:14px;

margin-top:16px;

}

.chatMessage{

padding:12px;

background:#F3F4F6;

border-radius:12px;

margin-bottom:10px;

font-size:13px;
font-weight:700;

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:1600px){

.summaryGrid{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:1200px){

.mainGrid{

grid-template-columns:1fr;

}

.filters{

grid-template-columns:
repeat(2,1fr);

}

}

@media(max-width:700px){

.summaryGrid{

grid-template-columns:1fr;

}

.filters{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div id="layoutContainer"></div>

<div class="main">

<!-- =====================================================
TOP
===================================================== -->

<div class="pageTop">

<div class="pageTitle">
Complaints & Support
</div>

<div class="topButtons">

<button class="topBtn">
Export PDF
</button>

<button class="topBtn">
Export Excel
</button>

<button class="topBtn">
Complaint Reports
</button>

</div>

</div>

<!-- =====================================================
SUMMARY
===================================================== -->

<div class="summaryGrid">

<div class="summaryCard">

<div class="cardTitle">
Total Complaints
</div>

<div
class="cardValue"
id="totalComplaints">

0

</div>

</div>

<div class="summaryCard">

<div class="cardTitle">
Pending Complaints
</div>

<div
class="cardValue"
id="pendingComplaints">

0

</div>

</div>

<div class="summaryCard">

<div class="cardTitle">
Resolved Complaints
</div>

<div
class="cardValue"
id="resolvedComplaints">

0

</div>

</div>

<div class="summaryCard">

<div class="cardTitle">
Refund Requests
</div>

<div
class="cardValue"
id="refundRequests">

0

</div>

</div>

</div>

<!-- =====================================================
FILTERS
===================================================== -->

<div class="filters">

<input
type="text"
placeholder="Search Complaint"
class="filterInput"
id="searchInput">

<select
class="filterInput"
id="statusFilter">

<option value="">
All Status
</option>

<option value="pending">
Pending
</option>

<option value="progress">
In Progress
</option>

<option value="resolved">
Resolved
</option>

<option value="closed">
Closed
</option>

</select>

<select
class="filterInput"
id="priorityFilter">

<option value="">
All Priority
</option>

<option value="high">
High
</option>

<option value="medium">
Medium
</option>

<option value="low">
Low
</option>

</select>

<select
class="filterInput"
id="typeFilter">

<option value="">
Complaint Type
</option>

<option value="Delivery">
Delivery
</option>

<option value="Refund">
Refund
</option>

<option value="Payment">
Payment
</option>

<option value="Quality">
Quality
</option>

</select>

<select
class="filterInput"
id="cityFilter">

<option value="">
City Wise
</option>

</select>

</div>

<!-- =====================================================
GRID
===================================================== -->

<div class="mainGrid">

<!-- =====================================================
TABLE
===================================================== -->

<div class="box">

<div class="sectionTitle">
All Complaints
</div>

<div class="tableHeader">

<div>
Complaint ID
</div>

<div>
User
</div>

<div>
Type
</div>

<div>
Order ID
</div>

<div>
Priority
</div>

<div>
Status
</div>

<div>
Assigned To
</div>

<div>
Actions
</div>

</div>

<div id="complaintsContainer">

</div>

</div>

<!-- =====================================================
DETAILS
===================================================== -->

<div class="box">

<div class="sectionTitle">
Complaint Details
</div>

<div id="detailsContainer">

Select Complaint

</div>

</div>

</div>

</div>

<script type="module"
src="./js/auth.js">
</script>

<script type="module"
src="./js/layout.js">
</script>

<script type="module"
src="./js/complaints.js">
</script>

</body>
</html>
