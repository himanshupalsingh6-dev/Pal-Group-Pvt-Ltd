<!-- ==========================
TOP BAR
========================== -->

<header class="topbar">

    <!-- LEFT -->

    <div class="topbarLeft">

        <h1
        id="pageTitle">

            Dashboard

        </h1>

    </div>

    <!-- CENTER -->

    <div class="topbarSearch">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
        type="text"
        placeholder="Search orders, customers, riders...">

    </div>

    <!-- RIGHT -->

    <div class="topbarRight">

        <!-- Notification -->

        <button class="iconBtn">

            <i class="fa-solid fa-bell"></i>

            <span class="notificationBadge">

                5

            </span>

        </button>

        <!-- Messages -->

        <button class="iconBtn">

            <i class="fa-solid fa-envelope"></i>

            <span class="notificationBadge">

                2

            </span>

        </button>

        <!-- Profile -->

        <div class="profileDropdown">

            <div
            class="profileInfo">

                <div
                class="profileAvatar">

                    H

                </div>

                <div>

                    <div
                    class="profileName">

                        Himanshu

                    </div>

                    <div
                    class="profileRole">

                        Super Admin

                    </div>

                </div>

            </div>

        </div>

    </div>

</header>
